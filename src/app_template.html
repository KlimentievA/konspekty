<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Конспекты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4f7;--card:#ffffff;--card2:#eceef3;--text:#15171c;--muted:#6b7280;--line:#e3e5ea;
  --accL:52%;--accC:0.16;--mark:#ffe58a;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(20,24,40,.06);
  --hf:Manrope,Inter,system-ui,sans-serif;--fs:16px;--nav-h:60px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#1a1d24;--card2:#242831;--text:#eceef2;--muted:#8b919e;--line:#2a2e38;
  --accL:78%;--accC:0.14;--mark:#6b5a10;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#1a1d24;--card2:#242831;--text:#eceef2;--muted:#8b919e;--line:#2a2e38;
  --accL:78%;--accC:0.14;--mark:#6b5a10;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
:root[data-size="1"]{--fs:17.5px}:root[data-size="2"]{--fs:19px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
h1,h2,h3,.ttl{font-family:var(--hf);letter-spacing:-.02em}
[hidden]{display:none!important}
.sub{--acc:oklch(var(--accL) var(--accC) var(--h))}

/* каркас */
#main{padding:calc(12px + var(--sat)) 16px calc(var(--nav-h) + var(--sab) + 24px);max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab);display:flex;height:calc(var(--nav-h) + var(--sab))}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-height:44px}
nav a svg{width:24px;height:24px}
nav a.on{color:var(--text)}
nav a.on svg{stroke-width:2.4}
@media(min-width:900px){
  nav{top:0;bottom:0;right:auto;width:104px;flex-direction:column;justify-content:center;gap:6px;border-top:0;border-right:1px solid var(--line);padding-bottom:0;height:auto}
  nav a{flex:0 0 auto;padding:12px 0;border-radius:14px;margin:0 10px;font-size:11.5px;white-space:nowrap}
  nav a.on{background:var(--card2)}
  #main{margin-left:104px;padding:28px 40px 60px;max-width:880px}
  #main .hs,#main .tabs{margin-left:-40px;margin-right:-40px;padding-left:40px;padding-right:40px}
  #main .tw{margin-left:-16px;margin-right:-16px}
  body{font-size:16px}
}
@media(min-width:1150px){#main{margin:0 auto}}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px;min-height:44px}
.top h1{font-size:30px;font-weight:800;line-height:1.1}
.acts{display:flex;gap:6px;flex-shrink:0}
.ib{width:42px;height:42px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow)}
.ib svg{width:20px;height:20px}
.ib.aa{font-family:var(--hf);font-weight:800;font-size:15px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* карточки */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.sec{margin:22px 0 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in oklab,var(--acc) 18%,transparent);color:var(--acc);white-space:nowrap}
.muted{color:var(--muted)}
.sm{font-size:13px}
.field{width:100%;height:46px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:0 14px 0 42px;font:inherit;font-size:16px;color:var(--text);outline:0}
.field::placeholder{color:var(--muted)}
.srch{position:relative;margin-bottom:6px}
.srch svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--muted);pointer-events:none}

/* ближайшие пары */
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .card{flex:0 0 240px;scroll-snap-align:start;border-left:4px solid var(--acc,var(--muted));padding:12px 14px}
.hs .when{font-size:12px;font-weight:600;color:var(--acc,var(--muted));text-transform:uppercase;letter-spacing:.04em}
.hs .nm{font-family:var(--hf);font-weight:700;font-size:15px;line-height:1.25;margin:4px 0 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* предметы и конспекты */
.subj{margin-bottom:12px;padding:12px 16px 6px}
.subj h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.subj h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);flex-shrink:0}
.nl a{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-height:48px}
.nl a:first-child{border-top:0;margin-top:4px}
.nl .d{flex:0 0 52px;font-size:12px;font-weight:600;color:var(--acc);padding-top:2px}
.nl .t{flex:1;font-weight:500;line-height:1.3}
.nl .s{font-size:13px;color:var(--muted);line-height:1.3;margin-top:1px}
.cont{display:flex;align-items:center;gap:12px;margin-bottom:6px;border-left:4px solid var(--acc)}
.cont .ttl{font-weight:700;font-size:15px}
.chev{margin-left:auto;color:var(--muted);flex-shrink:0;width:18px;height:18px}

/* конспект */
.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding-right:8px;font-weight:500;color:var(--muted)}
.back svg{width:20px;height:20px}
.nh h1{font-size:26px;font-weight:800;line-height:1.15;margin:8px 0 6px;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 16px;padding:2px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{flex:0 0 auto;height:40px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:500;display:block;line-height:40px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs .on{background:var(--acc,var(--text));color:var(--bg);font-weight:600}
.pn{display:flex;gap:10px;margin-top:20px}
.pn a{flex:1;min-width:0;min-height:52px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--muted)}
.pn a b{color:var(--text);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.pn a.nx{text-align:right}
.pn a.off{visibility:hidden}

/* markdown */
.md{font-size:var(--fs);line-height:1.6;overflow-wrap:anywhere}
.md>*+*{margin-top:.75em}.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.25;margin-top:1.4em}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.08em}.md h4{font-size:1em}
.md ul,.md ol{padding-left:1.4em}
.md li+li{margin-top:.25em}
.md blockquote{border-left:3px solid var(--acc,var(--line));padding-left:12px;color:var(--muted)}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--card2);padding:1px 5px;border-radius:6px}
.md pre{background:var(--card2);padding:12px;border-radius:12px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--line)}
.md a{color:var(--acc,inherit);font-weight:500}
.md img{max-width:100%;border-radius:12px}
.tw{overflow-x:auto;margin:.75em -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;font-size:.9em;min-width:100%;width:max-content;max-width:900px}
.md th,.md td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);min-width:90px}
.md th{font-weight:600;background:var(--card2)}
.md th:first-child,.md td:first-child{border-radius:0}
.md tr:last-child td{border-bottom:0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* расписание */
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.wk .ttl{font-weight:700;font-size:17px;text-align:center}
.wk .sm{text-align:center}
.day{margin-bottom:14px}
.day h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.day h3.today{color:var(--text)}
.day h3 .tg{font-size:11px;font-weight:600;background:var(--text);color:var(--bg);padding:1px 8px;border-radius:999px}
.ls .l{border-top:1px solid var(--line)}
.ls .l:first-child{border-top:0}
.ls summary{list-style:none;display:flex;gap:12px;padding:11px 16px;cursor:pointer;min-height:56px;align-items:flex-start}
.ls summary::-webkit-details-marker{display:none}
.ls .tm{flex:0 0 46px;font-size:12px;line-height:1.35;color:var(--muted);padding-top:2px}
.ls .tm b{display:block;color:var(--text);font-size:14px;font-weight:600}
.ls .nm{font-weight:500;line-height:1.3}
.ls .mt{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ls .k{color:var(--acc,var(--muted));font-weight:600}
.ls .dt{padding:0 16px 14px 74px;font-size:13px;line-height:1.5;color:var(--muted)}
.ls .dt b{color:var(--text);font-weight:500}
.ls .dt a{color:var(--acc,var(--text))}
.empty{text-align:center;padding:30px 0;color:var(--muted)}

/* билеты */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.seg a{flex:1;height:38px;display:flex;align-items:center;justify-content:center;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg a.on{background:var(--acc,var(--text));color:var(--bg)}
.tk,.ls,.ab{padding:0;overflow:hidden}
.tk .q{border-top:1px solid var(--line)}
.tk .q:first-of-type{border-top:0}
.tk summary{list-style:none;display:flex;gap:10px;padding:10px 14px;cursor:pointer;min-height:44px;line-height:1.35;font-size:14px}
.tk summary::-webkit-details-marker{display:none}
.tk .n{flex:0 0 28px;color:var(--acc);font-weight:700;font-family:var(--hf)}
.tk .a{padding:0 14px 14px 52px;font-size:calc(var(--fs) - 1px)}
.tk .a .tw{margin-left:-52px;padding-left:52px}
.tk .sub-h{padding:10px 14px 6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--card2)}
.note{font-size:13px;color:var(--muted);margin:4px 2px 12px}

/* о предметах */
.ab{margin-bottom:10px}
.ab summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-family:var(--hf);font-weight:700;font-size:17px;min-height:52px}
.ab summary::-webkit-details-marker{display:none}
.ab summary::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);flex-shrink:0}
.ab summary .chev{transition:transform .15s}
.ab[open] summary .chev{transform:rotate(180deg)}
.ab .md{padding:0 16px 16px}

/* поиск */
.res{display:block;margin-bottom:10px}
.res .h{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:13px}
.res .t{font-weight:600;font-family:var(--hf);font-size:15px;line-height:1.3}
.res .sn{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav"></nav>
<!--DATA-->
<!--MARKED-->
<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
const $=(s,r=document)=>r.querySelector(s),main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
marked.use({breaks:true,gfm:true});
const md=s=>{const t=document.createElement('div');t.innerHTML=marked.parse(s||'');t.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tw';tb.replaceWith(w);w.append(tb)});return t.innerHTML};
const I={
 book:'<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
 tick:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
 info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5M12 8h.01"/></svg>',
 sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
 l:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',r:'<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
 chevr:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
 srch:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'};

/* тема и шрифт */
const root=document.documentElement;
const applyTheme=t=>{root.dataset.theme=t;$('meta[name=theme-color]').content=t==='dark'?'#0f1115':'#f3f4f7'};
applyTheme(ls.get('theme')||'dark');
root.dataset.size=ls.get('size')||'0';
const acts=()=>`<div class="acts"><button class="ib aa" data-size title="Размер шрифта">Aa</button><button class="ib" data-theme title="Тема">${root.dataset.theme==='dark'?I.sun:I.moon}</button></div>`;
main.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-theme')){const t=root.dataset.theme==='dark'?'light':'dark';applyTheme(t);ls.set('theme',t);b.innerHTML=t==='dark'?I.sun:I.moon}
  if(b.hasAttribute('data-size')){const s=(+root.dataset.size+1)%3;root.dataset.size=s;ls.set('size',s)}
});

/* данные */
const subs=D.subjects,byId={},noteSub={};
subs.forEach(s=>{byId[s.id]=s;s.notes.forEach(n=>noteSub[n.id]=s)});
let sched=D.schedule;
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'],DOW=['вс','пн','вт','ср','чт','пт','сб'],DOWF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dm=d=>`${d.getDate()} ${MON[d.getMonth()]}`;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const relDay=d=>{const t=today0(),k=Math.round((d-t)/864e5);return k===0?'сегодня':k===1?'завтра':`${DOW[d.getDay()]}, ${dm(d)}`};
const accStyle=s=>s?`class="sub" style="--h:${byId[s]?byId[s].hue:0}"`:'';
const subjName=l=>l.s&&byId[l.s]?byId[l.s].name:l.n;

/* навигация */
const NAV=[['','Конспекты',I.book],['schedule','Расписание',I.cal],['tickets','Билеты',I.tick],['about','О предметах',I.info]];
const nav=$('#nav');nav.innerHTML=NAV.map(([h,t,i])=>`<a href="#${h}" data-h="${h}">${i}<span>${t}</span></a>`).join('');
const setNav=k=>nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.h===k));

/* главная */
const upcoming=()=>{const now=new Date(),t=iso(today0()),hm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  return sched.filter(l=>l.d>t||(l.d===t&&l.e>=hm)).sort((a,b)=>(a.d+a.b).localeCompare(b.d+b.b)).slice(0,4)};
function home(){
  setNav('');
  const up=upcoming(),last=ls.get('last'),ln=last&&noteSub[last]&&noteSub[last].notes.find(n=>n.id===last);
  let h=`<div class="top"><h1>Конспекты</h1>${acts()}</div>
  <div class="srch">${I.srch}<input class="field" id="q" type="search" placeholder="Поиск по конспектам и билетам" autocomplete="off"></div>
  <div id="sres" hidden></div><div id="hbody">`;
  if(ln)h+=`<a href="#${ln.id}" class="card cont sub" style="--h:${noteSub[last].hue}"><div><div class="sm muted">Продолжить</div><div class="ttl">${esc(ln.title)}</div><div class="sm muted">${esc(noteSub[last].name)}</div></div>${I.chevr}</a>`;
  if(up.length){h+=`<div class="sec">Ближайшие пары</div><div class="hs">`+up.map(l=>{const d=pd(l.d);return `<a href="#schedule" class="card ${l.s?'sub':''}" style="--h:${l.s&&byId[l.s]?byId[l.s].hue:0}"><div class="when">${relDay(d)}</div><div class="nm">${esc(subjName(l))}</div><div class="sm muted">${esc(l.b)}–${esc(l.e)} · ${esc(l.k)}${l.r?' · ауд. '+esc(l.r):''}</div></a>`}).join('')+'</div>'}
  h+=`<div class="sec">Предметы</div>`;
  subs.filter(s=>s.notes.length).forEach(s=>{h+=`<div class="card subj sub" style="--h:${s.hue}"><h2>${esc(s.name)}</h2><div class="nl">`+s.notes.map(n=>`<a href="#${n.id}"><span class="d">${esc(n.date)||'&nbsp;'}</span><span class="t">${esc(n.title)}${n.short&&!n.title.includes(n.short)?`<div class="s">${esc(n.short)}</div>`:''}</span>${I.chevr}</a>`).join('')+'</div></div>'});
  main.innerHTML=h+'</div>';
  const q=$('#q');q.addEventListener('input',()=>search(q.value));
}

/* поиск */
const plain=s=>s.replace(/[*#`>|_]+/g,' ').replace(/\s+/g,' ');const idx=[];subs.forEach(s=>s.notes.forEach(n=>idx.push({t:n.title,sub:s,h:'#'+n.id,x:plain(n.title+'\n'+n.md).toLowerCase(),raw:plain(n.title+'\n'+n.md),kind:'Конспект'})));
Object.entries(D.tickets).forEach(([k,qs])=>qs.forEach(([n,q,a])=>idx.push({t:`${n}. ${q}`,sub:byId[k],h:`#tickets-${k}-${n}`,x:plain(q+'\n'+a).toLowerCase(),raw:plain(q+'\n'+a),kind:'Билет'})));
const hl=(s,q)=>esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
function search(v){
  const q=v.trim().toLowerCase(),r=$('#sres'),b=$('#hbody');
  if(q.length<2){r.hidden=true;b.hidden=false;return}
  const out=[];for(const it of idx){const p=it.x.indexOf(q);if(p<0)continue;const a=Math.max(0,p-70),z=Math.min(it.raw.length,p+q.length+90);out.push({it,sn:(a?'…':'')+it.raw.slice(a,z).replace(/\s+/g,' ')+(z<it.raw.length?'…':'')});if(out.length>=40)break}
  b.hidden=true;r.hidden=false;
  r.innerHTML=out.length?`<div class="sec">Найдено: ${out.length}</div>`+out.map(({it,sn})=>`<a href="${it.h}" class="card res sub" style="--h:${it.sub.hue}"><div class="h"><span class="pill">${esc(it.sub.name)}</span><span class="muted">${it.kind}</span></div><div class="t">${hl(it.t,q)}</div><div class="sn">${hl(sn,q)}</div></a>`).join(''):'<div class="empty">Ничего не нашлось</div>';
}

/* конспект */
function note(id){
  setNav('');const s=noteSub[id],i=s.notes.findIndex(n=>n.id===id),n=s.notes[i],pv=s.notes[i-1],nx=s.notes[i+1];
  ls.set('last',id);
  main.innerHTML=`<div class="sub" style="--h:${s.hue}"><div class="top"><a class="back" href="#">${I.back}Конспекты</a>${acts()}</div>
  <div class="nh"><span class="pill">${esc(s.name)}</span><h1>${esc(n.title)}</h1><div class="sm muted">${esc(n.date)}</div></div>
  <div class="tabs">${s.notes.map(x=>`<a href="#${x.id}" class="${x.id===id?'on':''}">${esc(x.title)}</a>`).join('')}</div>
  <div class="card md">${md(n.md)}</div>
  <div class="pn"><a class="card ${pv?'':'off'}" href="#${pv?pv.id:''}">Назад<b>${pv?esc(pv.title):''}</b></a><a class="card nx ${nx?'':'off'}" href="#${nx?nx.id:''}">Дальше<b>${nx?esc(nx.title):''}</b></a></div></div>`;
  const tb=$('.tabs'),on=$('.tabs .on');tb.scrollLeft=on.offsetLeft-tb.clientWidth/2+on.offsetWidth/2;
}

/* расписание */
let wk=0;
const monday=d=>{const m=new Date(d);m.setDate(m.getDate()-((m.getDay()+6)%7));return m};
function schedule(){
  setNav('schedule');
  const m=monday(today0());m.setDate(m.getDate()+wk*7);const e=new Date(m);e.setDate(e.getDate()+6);const ti=iso(today0());
  const days=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);const k=iso(d),ls=sched.filter(l=>l.d===k).sort((a,b)=>a.b.localeCompare(b.b));if(ls.length)days.push([d,k,ls])}
  main.innerHTML=`<div class="top"><h1>Расписание</h1>${acts()}</div>
  <div class="wk"><button class="ib" id="wp">${I.l}</button><div><div class="ttl">${wk===0?'Текущая неделя':wk===1?'Следующая неделя':wk===-1?'Прошлая неделя':dm(m)+' – '+dm(e)}</div><div class="sm muted">${wk===0||Math.abs(wk)===1?dm(m)+' – '+dm(e):''}</div></div><button class="ib" id="wn">${I.r}</button></div>`+
  (days.length?days.map(([d,k,ls])=>`<div class="day"><h3 class="${k===ti?'today':''}">${DOWF[d.getDay()]}, ${dm(d)}${k===ti?'<span class="tg">сегодня</span>':''}</h3><div class="card ls">`+ls.map(l=>`<details class="l ${l.s?'sub':''}" style="--h:${l.s&&byId[l.s]?byId[l.s].hue:0}"><summary><div class="tm"><b>${esc(l.b)}</b>${esc(l.e)}</div><div><div class="nm">${esc(l.n)}</div><div class="mt"><span class="k">${esc(l.k)}</span>${l.r?`<span>ауд. ${esc(l.r)}</span>`:''}</div></div></summary><div class="dt">${l.t?`<b>${esc(l.t)}</b>${l.q?`, ${esc(l.q)}`:''}<br>`:''}${l.m?`<a href="mailto:${esc(l.m)}">${esc(l.m)}</a><br>`:''}${l.bd?esc(l.bd):''}</div></details>`).join('')+'</div></div>').join(''):'<div class="empty">На этой неделе пар нет</div>');
  $('#wp').onclick=()=>{wk--;schedule()};$('#wn').onclick=()=>{wk++;schedule()};
}

/* билеты */
const TK=[['const','Конституционное'],['crim','Уголовное'],['civil','Гражданское']];
function tickets(k,n){
  setNav('tickets');if(!D.tickets[k])k='const';const s=byId[k];
  const item=([i,q])=>`<details class="q" id="t${i}"><summary><span class="n">${i}</span><span>${esc(q)}</span></summary><div class="a md"></div></details>`;
  const qs=D.tickets[k];let list;
  if(k==='civil')list=`<div class="sub-h">1–2 модуль</div>`+qs.filter(x=>x[0]<=86).map(item).join('')+`<div class="sub-h">3–4 модуль</div>`+qs.filter(x=>x[0]>86).map(item).join('');
  else list=qs.map(item).join('');
  main.innerHTML=`<div class="top"><h1>Билеты</h1>${acts()}</div><div class="sub" style="--h:${s.hue}">
  <div class="seg">${TK.map(([id,t])=>`<a href="#tickets-${id}" class="${id===k?'on':''}">${t}</a>`).join('')}</div>
  <div class="note">${esc(s.name)} · ${qs.length} вопросов прошлых лет${k==='civil'?'. Сборника ответов не было, ответы составлены по ГК РФ':''}</div>
  <div class="card tk">${list}</div></div>`;
  main.querySelectorAll('.tk details').forEach(d=>d.addEventListener('toggle',()=>{const a=$('.a',d);if(d.open&&!a.dataset.r){const i=+d.id.slice(1);a.innerHTML=md(qs.find(x=>x[0]===i)[2]);a.dataset.r=1}}));
  if(n){const d=$('#t'+n);if(d){d.open=true;requestAnimationFrame(()=>d.scrollIntoView({block:'start'}))}}
}

/* о предметах */
function about(){
  setNav('about');
  main.innerHTML=`<div class="top"><h1>О предметах</h1>${acts()}</div>`+subs.filter(s=>s.about).map(s=>`<details class="card ab sub" style="--h:${s.hue}"><summary>${esc(s.name)}${I.chev}</summary><div class="md"></div></details>`).join('');
  main.querySelectorAll('.ab').forEach((d,i)=>{const s=subs.filter(s=>s.about)[i];d.addEventListener('toggle',()=>{const a=$('.md',d);if(d.open&&!a.dataset.r){a.innerHTML=md(s.about);a.dataset.r=1}})});
}

/* роутер */
let prev='';
function route(){
  const h=decodeURIComponent(location.hash.slice(1)),top=h.split('-')[0]!==prev.split('-')[0];
  if(h==='')home();
  else if(h==='schedule')schedule();
  else if(h.startsWith('tickets')){const p=h.split('-');tickets(p[1]||'const',p[2])}
  else if(h==='about')about();
  else if(noteSub[h])note(h);
  else home();
  if(top||noteSub[h])window.scrollTo(0,0);
  prev=h;
}
addEventListener('hashchange',route);
fetch('schedule.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(Array.isArray(j)&&j.length)sched=j}).catch(()=>{}).finally(route);
})();
</script>
</body>
</html>
