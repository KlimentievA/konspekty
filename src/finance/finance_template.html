<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1E8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#171611" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Финансы">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Финансы</title>
<!--ZOOM-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://iss.moex.com" crossorigin><link rel="preconnect" href="https://api.coingecko.com" crossorigin><link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400..700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400..700&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
<style>
:root{
  --bg:#F4F1E8;--rail:#ECE8DB;--surface:#FBF9F3;--fg:#25221C;--muted:#665F52;--faint:#857E6E;
  --line:#D9D3C2;--line2:#E5E0D2;--accent:#1F6B57;--accent2:#A93D28;--mark:#F5DC94;--up:#1E7B45;--down:#B3261E;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171611;--rail:#1D1C16;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;
  --line:#33312A;--line2:#292820;--accent:#5FC2A3;--accent2:#E8886B;--mark:#5B4A17;--up:#4CC17E;--down:#F07167;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171611;--rail:#1D1C16;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;
  --line:#33312A;--line2:#292820;--accent:#5FC2A3;--accent2:#E8886B;--mark:#5B4A17;--up:#4CC17E;--down:#F07167;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--mark)}

/* шапка */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:4px;max-width:1180px;margin:0 auto;padding:6px 8px 0 var(--gut);min-height:52px}
.home{display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;border-radius:10px;color:var(--muted);text-decoration:none}
.home:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.home svg,.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand{margin-right:auto;font:600 21px/1 var(--serif);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--accent);font-weight:600}
.zm{display:flex;align-items:center;margin-right:4px;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.zm button{height:32px;padding:0 9px;font:600 13px/1 var(--sans);color:var(--muted)}
.zm button:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.zm .szv{min-width:44px;padding:0 4px;font-weight:500;font-size:12px;border-inline:1px solid var(--line2)}
@media (max-width:420px){.zm .szv{display:none}.zm button{padding:0 8px}}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.ibtn:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.sw{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:4px var(--gut) 0}
.sw a{position:relative;padding:10px 12px 12px;text-decoration:none;color:var(--muted);font:600 15px/1 var(--sans)}
.sw a.on{color:var(--fg)}
.sw a.out{margin-left:auto;color:var(--accent2);white-space:nowrap}
@media (max-width:520px){.sw{gap:0;padding-left:8px;padding-right:8px}.sw a{padding:10px 8px 12px;font-size:14px}}
.sw{overflow-x:auto;scrollbar-width:none}.sw::-webkit-scrollbar{display:none}.sw a{flex:none}
.sw a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.search{display:none;align-items:center;gap:8px;max-width:1180px;margin:4px auto 8px;padding:0 var(--gut)}
.search.on{display:flex}
.search input{flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:400 16px var(--sans);outline:0}
.search input:focus{border-color:var(--faint)}

main{max-width:1180px;margin:0 auto;padding:0 var(--gut) 96px;min-width:0}
.sub{display:flex;gap:8px;overflow-x:auto;margin:16px calc(var(--gut)*-1) 0;padding:0 var(--gut) 4px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);font:500 14px/1.2 var(--sans);white-space:nowrap;background:none;min-height:40px;display:inline-flex;align-items:center}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip:hover:not(.on){color:var(--fg);border-color:var(--faint)}

/* обучение: оглавление */
.hero{padding:34px 0 8px}
.hero h1{margin:0;font:600 clamp(32px,6vw,52px)/1.05 var(--serif);letter-spacing:-.02em}
.hero p{margin:12px 0 0;max-width:60ch;font:400 17px/1.55 var(--serif);color:var(--muted)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-top:26px}
.ch{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;min-width:0}
.ch:hover{border-color:var(--faint)}
.ch .n{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:600 14px/1 var(--mono)}
.ch b{display:block;font:600 17px/1.3 var(--serif)}
.ch i{display:block;margin-top:3px;font:400 13.5px/1.4 var(--sans);font-style:normal;color:var(--muted)}

/* глава */
.doc{display:grid;grid-template-columns:minmax(0,1fr);gap:0 56px;padding-top:28px}
.art{min-width:0;max-width:760px;width:100%;margin:0 auto}
.eyebrow{margin:0 0 10px;font:500 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:var(--accent);text-decoration:none}
.art h1{margin:0 0 22px;font:600 clamp(28px,5vw,40px)/1.15 var(--serif);letter-spacing:-.015em;text-wrap:balance}
.toc{margin:0 0 26px;border-block:1px solid var(--line)}
.toc summary{list-style:none;padding:12px 0;cursor:pointer;font:500 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toc summary::-webkit-details-marker{display:none}
.toc a{display:block;padding:6px 0;text-decoration:none;color:var(--muted);font:400 14.5px/1.4 var(--sans)}
.toc a:hover{color:var(--fg)}
.toc nav{padding-bottom:10px}
.side{display:none}
.prose{font:400 17px/1.7 var(--sans);overflow-wrap:break-word}
.prose>:first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose h2{margin:2.2em 0 .7em;padding-top:1.1em;border-top:1px solid var(--line);font:600 24px/1.25 var(--serif);scroll-margin-top:120px}
.prose h3{margin:1.8em 0 .6em;font:600 19px/1.35 var(--serif);scroll-margin-top:120px}
.prose h4{margin:1.5em 0 .5em;font:600 17px/1.35 var(--sans)}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose li{margin:.4em 0}
.prose li::marker{color:var(--accent)}
.prose strong{font-weight:650}
.prose a{color:var(--accent);text-underline-offset:3px}
.prose blockquote{margin:1.3em 0;padding:12px 16px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.prose blockquote p:last-child{margin:0}
.prose code{font:.86em var(--mono);padding:.1em .35em;border-radius:5px;background:var(--rail)}
.f{margin:1.1em 0 1.3em;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);font:500 14.5px/1.75 var(--mono);white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.prose table,.dt{width:100%;border-collapse:collapse;font:400 14.5px/1.45 var(--sans);font-variant-numeric:tabular-nums}
.prose th,.prose td,.dt th,.dt td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
.prose th,.dt th{font:600 11.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--rail);border-bottom:1px solid var(--line)}
.prose td{min-width:6em}
.prose tr:last-child td,.dt tr:last-child td{border-bottom:0}
details.qa{border-bottom:1px solid var(--line)}
details.qa:first-of-type{border-top:1px solid var(--line)}
details.qa>summary{list-style:none;display:flex;gap:12px;padding:13px 0;cursor:pointer;font:500 16px/1.45 var(--sans)}
details.qa>summary::-webkit-details-marker{display:none}
details.qa>summary span{flex:none;min-width:2em;color:var(--faint);font:500 13px/1.6 var(--mono)}
details.qa[open]>summary{color:var(--accent)}
details.qa>div{padding:0 0 14px calc(2em + 12px);color:var(--fg)}
details.qa+h3{margin-top:2em}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:5px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;min-width:0}
.pager a:hover{border-color:var(--faint);background:var(--surface)}
.pager .nx{grid-column:2;text-align:right}
.pager small{font:500 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.pager b{font:600 16px/1.3 var(--serif)}
.tt{border-bottom:1.5px dotted color-mix(in srgb,var(--accent) 70%,transparent);cursor:help;text-decoration:none}
.tt:hover,.tt.on{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:3px}
#tip{position:fixed;z-index:90;max-width:min(340px,calc(100vw - 24px));padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);box-shadow:0 10px 30px rgba(0,0,0,.18);font:400 14.5px/1.5 var(--sans);pointer-events:auto}
#tip b{display:block;margin-bottom:4px;font:600 14.5px/1.35 var(--sans);color:var(--accent)}
#tip a{display:inline-block;margin-top:6px;font:500 12.5px var(--sans);color:var(--muted)}
#prog{display:none}
#totop{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--fg);font:600 18px/1 var(--sans);box-shadow:0 4px 16px rgba(0,0,0,.15)}
.resume{display:inline-flex;flex-direction:column;gap:3px;margin-top:20px;padding:13px 18px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;background:var(--surface);text-decoration:none;max-width:100%}
.resume small{font:500 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.resume b{font:600 17px/1.3 var(--serif)}
.track{margin-top:34px}
.track h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 4px;font:600 22px/1.2 var(--serif)}
.track h2 span{font:400 14px/1.3 var(--sans);color:var(--muted)}
.track .chs{margin-top:12px}
.ch em{display:block;margin-top:6px;font:500 12px/1.2 var(--sans);font-style:normal;color:var(--faint)}
.ch.cur{border-color:var(--accent)}
.art .meta{margin:-12px 0 20px;font:400 13.5px/1.4 var(--sans);color:var(--faint)}
.try{display:block;margin:28px 0 0;padding:14px 16px;border:1px solid var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--accent);font:600 15px/1.3 var(--sans);text-decoration:none}
.try:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.gfilter{width:100%;height:46px;margin:0 0 14px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:400 16px var(--sans);outline:0}
.gfilter:focus{border-color:var(--faint)}
.pchead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pchead h2{margin:0;flex:1 1 auto}
@media (max-width:560px){.pchead h2{flex-basis:100%}.pchead .chip{min-height:34px;padding:4px 11px}}
.pchart{position:relative;margin-top:10px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.pchart svg{display:block}
.pcs .gl{stroke:var(--line2);stroke-width:1}
.pcs .yl,.pcs .xl{font:500 11.5px var(--sans);fill:var(--faint)}
.pcs .xl{text-anchor:middle}
.pcs .pl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.pcs .pd{fill:var(--accent)}
.pcs .cx{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.pcs .hd{fill:var(--bg);stroke:var(--accent);stroke-width:2.5}
.pcs .yb{fill:var(--fg)}
.pcs .yt{font:600 11.5px var(--sans);fill:var(--bg)}
.pcs .sel.pos{fill:color-mix(in srgb,var(--up) 16%,transparent)}
.pcs .sel.neg{fill:color-mix(in srgb,var(--down) 16%,transparent)}
.pcs .sl{stroke:var(--muted);stroke-width:1}
.pctip{position:absolute;top:2px;width:140px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:400 12.5px/1.35 var(--sans);color:var(--muted);pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.pctip b{display:block;font:600 15px/1.3 var(--sans);color:var(--fg)}
.pcinfo{margin-top:8px;font:400 14px/1.6 var(--sans);font-variant-numeric:tabular-nums}
.pcinfo .mut{color:var(--faint);font-size:12.5px}
.pcinfo .chip{min-height:30px;padding:4px 12px;margin-left:6px;font-size:12.5px}
.pcs .mk{fill:var(--accent2);stroke:var(--surface);stroke-width:2;cursor:pointer}
.pcs .mk2.u{stroke:var(--up)}.pcs .mk2.d{stroke:var(--down)}.pcs .mk2.u.hn{fill:var(--up)}.pcs .mk2.d.hn{fill:var(--down)}
.pcn{margin:6px 0;font:400 14.5px/1.45 var(--sans)}.pcn a{font-weight:600;color:var(--fg);text-decoration:none}.pcn a:hover{text-decoration:underline}.pcn p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.pcs .mk2{fill:var(--surface);stroke:var(--accent2);stroke-width:2;cursor:pointer}
.pcs .mk.on,.pcs .mk2.on{stroke:var(--fg)}
.pcs .mkl{stroke:var(--accent2);stroke-width:1;stroke-dasharray:2 3;opacity:.45}
.pctip.wide{width:230px}.pctip em{display:block;margin-top:4px;font-style:normal;font-weight:500;color:var(--accent2);line-height:1.35}
.pcev{padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:10px;background:color-mix(in srgb,var(--accent2) 6%,transparent)}
.pcev p{margin:4px 0 6px;color:var(--muted)}.pcev a{color:var(--accent);font-weight:600}
.nw{padding:10px 0;border-top:1px solid var(--line2)}.nday{margin:18px 0 2px;font:600 12px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.nday+.nw{border-top:0}
.nw .nm{display:flex;gap:10px;font:500 12px/1.3 var(--sans);color:var(--faint)}.nw .ns{color:var(--accent);font-weight:600}
.nw .nt{display:block;margin-top:3px;font:500 15.5px/1.4 var(--sans);text-decoration:none;color:var(--fg)}.nw .nt:hover{text-decoration:underline;text-underline-offset:3px}
.ntags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip.sm{min-height:26px;padding:2px 10px;font-size:12px}
.ev2{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line2)}
.ev2 .ed2{flex:none;width:96px;font:600 13px/1.4 var(--sans);color:var(--muted)}.ev2 .ed2 .chip{margin-top:6px}
.ev2 .et2{flex:1;min-width:0;font:400 14.5px/1.5 var(--sans)}.ev2 .et2 b{font-weight:600}.ev2 .et2 p{margin:3px 0 4px;color:var(--muted)}
.ev2 .src{font:500 12.5px var(--sans);color:var(--accent);text-decoration:none}.ev2 .src:hover{text-decoration:underline}
@media (max-width:520px){.ev2{flex-direction:column;gap:4px}.ev2 .ed2{width:auto;display:flex;align-items:center;gap:8px}.ev2 .ed2 .chip{margin:0}}
.ntop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 8px}
.nw.big{padding:14px 16px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column}
.nw.big .nt{margin-top:6px;font:600 17px/1.32 var(--serif);letter-spacing:-.005em}.nw.big .nx{font-size:14px;-webkit-line-clamp:3}
.nw.hero{grid-column:1/-1;padding:18px 20px 16px;border-left:4px solid var(--accent2)}.nw.hero .nt{font-size:clamp(20px,4.6vw,25px);line-height:1.25}.nw.hero .nx{max-width:none;font-size:15px;-webkit-line-clamp:4;margin-top:6px}
.nw.mini{display:flex;gap:10px;align-items:baseline;padding:7px 0}.nw.mini .tm{flex:none;width:3.1em;font:500 12px/1.4 var(--mono);color:var(--faint)}
.nw.mini .nt{display:inline;margin:0;font:400 14px/1.45 var(--sans);color:var(--muted)}.nw.mini .nt:hover{color:var(--fg)}.nw.mini .ns2{font:400 12px var(--sans);color:var(--faint)}
@media (max-width:640px){.ntop{grid-template-columns:1fr}.nw.big .nt{font-size:16.5px}}
.nw .nx{margin:3px 0 0;font:400 13.5px/1.45 var(--sans);color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.reader{max-width:760px}
.reader .back{display:inline-block;margin-bottom:14px;font:500 14px var(--sans);color:var(--accent);text-decoration:none}
.reader h1{margin:6px 0 12px;font:600 clamp(24px,4.6vw,32px)/1.25 var(--serif);text-wrap:balance}
.reader .gist{margin:16px 0;padding:14px 18px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface)}
.reader .gist h3{margin:0 0 6px;font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reader .gist p.gp{margin:.55em 0;font:400 16.5px/1.65 var(--sans)}.reader .gist p.gp:first-of-type{margin-top:0}.reader .orig{margin:6px 0 0;font:400 13.5px/1.4 var(--sans);color:var(--faint)}.trb.hot{color:var(--accent2);border-color:color-mix(in srgb,var(--accent2) 45%,var(--line))}.trb.srcn{color:var(--accent)}
.trb{font:500 11px/1 var(--sans);color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 6px}
.reader .gist ul{margin:0;padding-left:1.2em}.reader .gist li{margin:.45em 0;font:400 16.5px/1.6 var(--sans)}.reader .gist li::marker{color:var(--accent)}

function svgLine(pts,opt){
  var W=460,H=230,L=44,R=16,T=20,B=28,xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]});
  var x0=opt.x0!=null?opt.x0:Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=opt.y0!=null?opt.y0:Math.floor(Math.min.apply(0,ys)-1),y1=Math.ceil(Math.max.apply(0,ys)+1);
  function X(v){return L+(v-x0)/(x1-x0)*(W-L-R)}function Y(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B)}
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label)+'">';
  for(var g=0;g<=4;g++){var v=y0+(y1-y0)*g/4;h+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" opacity=".6"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+nf(v,v%1?1:0)+(opt.u!=null?opt.u:'%')+'</text>'}
  var d='';pts.forEach(function(p,i){var x=X(p[0]),y=Y(p[1]);if(opt.step&&i)d+='H'+x+'V'+y;else d+=(i?'L':'M')+x+','+y});
  h+='<path class="ln" d="'+d+'"/>';
  pts.forEach(function(p,i){if(opt.dots)h+='<circle class="pt" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.2"/>';var lb=opt.xl(p,i);if(lb)h+='<text x="'+X(p[0])+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>';if(opt.vl&&opt.vl(p,i))h+='<text class="lb" x="'+X(p[0])+'" y="'+(Y(p[1])-8)+'" text-anchor="'+(i===pts.length-1?'end':i===0?'start':'middle')+'">'+nf(p[1],2)+'</text>'});
  return h+'</svg>';
}

var BC={fv:1000,c:12,m:2,n:5,p:92,name:''};
function bondCalc(){
  var fv=+String(BC.fv).replace(',','.'),c=+String(BC.c).replace(',','.')/100,m=Math.max(1,Math.round(+BC.m)),n=+String(BC.n).replace(',','.'),p=+String(BC.p).replace(',','.')/100*fv;
  if(!(fv>0&&c>=0&&n>0&&p>0))return '<p class="note">Заполни поля.</p>';
  var N=Math.max(1,Math.round(n*m)),cp=fv*c/m;
  function price(r){var s=0;for(var t=1;t<=N;t++)s+=cp/Math.pow(1+r,t);return s+fv/Math.pow(1+r,N)}
  var lo=-0.99,hi=5;for(var i=0;i<200;i++){var mid=(lo+hi)/2;if(price(mid)>p)lo=mid;else hi=mid}
  var r=(lo+hi)/2,ytm=Math.pow(1+r,m)-1,nom=r*m;
  var dm=0;for(var t=1;t<=N;t++)dm+=t/m*cp/Math.pow(1+r,t);dm+=N/m*fv/Math.pow(1+r,N);dm/=p;
  var md=dm/(1+r),dp=(price(Math.pow(1+ytm+0.01,1/m)-1)/p-1)*100;
  var g=kbdAt(dm);
  return '<div class="tiles" style="margin-top:12px">'+
    tile('Доходность к погашению',nf(ytm*100,2)+'%','эффективная годовая · номинальная '+nf(nom*100,2)+'%')+
    tile('Текущая доходность',nf(c*fv/p*100,2)+'%','купон / цена')+
    tile('Дюрация Маколея',nf(dm,2)+' лет','модифицированная '+nf(md,2))+
    tile('Если ставки +1 п.п.',nf(dp,2)+'%','изменение цены')+
    (g!=null?tile('Спред к КБД',(ytm*100-g>0?'+':'')+nf((ytm*100-g)*100,0)+' б.п.','КБД на '+nf(dm,1)+' г.: '+nf(g,2)+'%'):'')+
    '</div>'+(BC.name?'<p class="note">Выпуск: '+esc(BC.name)+' (срок округлён до целого числа купонных периодов, НКД не учтён).</p>':'<p class="note">Срок округляется до целого числа купонных периодов; НКД не учитывается.</p>');
}

/* ---------------- калькуляторы ---------------- */
function num(v){if(v==null)return NaN;return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))}
function irrOf(cf){
  function npv(r){var s=0;for(var t=0;t<cf.length;t++)s+=cf[t]/Math.pow(1+r,t);return s}
  var lo=-0.99,hi=10,flo=npv(lo),fhi=npv(hi);if(flo*fhi>0)return null;
  for(var i=0;i<200;i++){var m=(lo+hi)/2,fm=npv(m);if(flo*fm<=0){hi=m;fhi=fm}else{lo=m;flo=fm}}return (lo+hi)/2;
}
function p1(x){return nf(x*100,1)+'%'}
function p2(x){return nf(x*100,2)+'%'}
function money(x){return x==null||isNaN(x)?'—':nf(x,Math.abs(x)>=100?0:1)}
function mini(head,rows){return '<div class="tablewrap"><table class="dt"><thead><tr>'+head.map(function(h,i){return '<th class="'+(i?'num':'')+'">'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td class="'+(i?'num':'')+'">'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
var CALCS=[
 {id:'npv',t:'NPV, IRR, окупаемость',s:'Денежные потоки проекта → NPV, IRR, payback, PI',
  f:[['r','Ставка дисконтирования, %',15],['cf','Потоки по годам (год 0 первым), через пробел или ;','-1000; 300; 400; 500; 300',1],['mid','Середина года (0 — нет, 1 — да)',0]],
  c:function(v){
    var r=num(v.r)/100,cf=String(v.cf).split(/[;\s]+/).map(num).filter(function(x){return !isNaN(x)}),mid=num(v.mid)===1;
    if(cf.length<2||isNaN(r))return '<p class="note">Введи ставку и хотя бы два потока.</p>';
    var pv=cf.map(function(c,t){return t===0?c:c/Math.pow(1+r,mid?t-0.5:t)}),npv=pv.reduce(function(a,b){return a+b},0);
    var irr=irrOf(cf),acc=0,dacc=0,pb=null,dpb=null,rows=[];
    cf.forEach(function(c,t){var a0=acc,d0=dacc;acc+=c;dacc+=pv[t];
      if(pb==null&&t>0&&a0<0&&acc>=0)pb=t-1+(-a0)/c;if(dpb==null&&t>0&&d0<0&&dacc>=0)dpb=t-1+(-d0)/pv[t];
      rows.push([t,money(c),nf(t===0?1:1/Math.pow(1+r,mid?t-0.5:t),3),money(pv[t]),money(dacc)])});
    var inv=-cf[0],pi=inv>0?(npv+inv)/inv:null;
    return '<div class="tiles">'+tile('NPV','<span class="'+(npv>=0?'up':'down')+'">'+money(npv)+'</span>',npv>=0?'проект создаёт стоимость':'проект разрушает стоимость')+
      tile('IRR',irr==null?'—':p1(irr),irr==null?'не найдена (проверь знаки потоков)':(irr>r?'выше ставки → принимаем':'ниже ставки'))+
      tile('Простой payback',pb==null?'не окупается':nf(pb,1)+' г.','по номинальным потокам')+
      tile('Дисконтированный payback',dpb==null?'не окупается':nf(dpb,1)+' г.','по приведённым потокам')+
      (pi!=null?tile('PI',nf(pi,2),'PV притоков / инвестиции'):'')+'</div>'+
      mini(['Год','Поток','Коэф. дисконта','PV','Накопл. PV'],rows)+
      '<p class="note">IRR считается по номинальным датам (как ВСД в Excel). Формулы — в главе «Деньги во времени».</p>';
  }},
 {id:'wacc',t:'WACC и стоимость капитала',s:'CAPM, пересчёт беты (Хамада), WACC, перевод ставки в рубли',
  f:[['rf','Безрисковая ставка Rf, %',16.6],['beta','Бета аналога (с долгом)',1.1],['de0','D/E аналога',0.4],['de','Целевой D/E нашей компании',0.5],['erp','Премия за риск ERP, %',7],['add','Доп. премии (страна, размер), %',0],['kd','Стоимость долга до налога, %',18],['t','Налог на прибыль, %',25],['iu','Перевод: инфляция в валюте ставки, % (пусто — не нужно)',''],['ir','Перевод: инфляция в рублях, %','']],
  c:function(v){
    var rf=num(v.rf)/100,b=num(v.beta),de0=num(v.de0),de=num(v.de),erp=num(v.erp)/100,add=(num(v.add)||0)/100,kd=num(v.kd)/100,t=num(v.t)/100;
    if([rf,b,de0,de,erp,kd,t].some(isNaN))return '<p class="note">Заполни поля.</p>';
    var bu=b/(1+(1-t)*de0),bl=bu*(1+(1-t)*de),ke=rf+bl*erp+add,kda=kd*(1-t),wd=de/(1+de),we=1-wd,w=we*ke+wd*kda;
    var h='<div class="tiles">'+tile('Бета без долга βU',nf(bu,2),'βL / [1 + (1−t)·D/E аналога]')+tile('Бета с нашим долгом βL',nf(bl,2),'βU × [1 + (1−t)·D/E]')+
      tile('Ke (CAPM)',p2(ke),'Rf + β × ERP + премии')+tile('Kd после налога',p2(kda),'Kd × (1 − t)')+
      tile('Веса',nf(we*100,0)+'% / '+nf(wd*100,0)+'%','капитал / долг')+tile('WACC','<b>'+p2(w)+'</b>','E/V·Ke + D/V·Kd·(1−t)')+'</div>';
    var iu=num(v.iu)/100,ir=num(v.ir)/100;
    if(!isNaN(iu)&&!isNaN(ir)){var k2=(1+w)*(1+ir)/(1+iu)-1,ke2=(1+ke)*(1+ir)/(1+iu)-1;h+='<div class="tiles" style="margin-top:10px">'+tile('WACC в рублях',p2(k2),'(1+WACC)×(1+π₽)/(1+π$) − 1')+tile('Ke в рублях',p2(ke2),'тот же пересчёт для Ke')+'</div>'}
    return h+'<p class="note">Ориентиры (октябрь 2026): ОФЗ 10 лет 16,6%, UST 10 лет 5,2%, ERP США 3,7% (Дамодаран). Подробно — глава «Стоимость капитала».</p>';
  }},
 {id:'dcf',t:'DCF-модель',s:'Прогноз на 5 лет → FCFF → EV → цена акции, чувствительность WACC × g',
  f:[['rev','Выручка в году 0',1000],['g1','Рост выручки в 1-й год, %',15],['g5','Рост выручки в 5-й год, %',6],['m','EBITDA-маржа, %',30],['da','Амортизация, % выручки',6],['cx','CAPEX, % выручки',8],['nwc','Оборотный капитал, % выручки',10],['t','Налог, %',25],['w','WACC, %',18],['g','Рост в бесконечности g, %',5],['nd','Чистый долг',500],['sh','Число акций',100],['mid','Середина года (0/1)',1]],
  c:function(v){
    var R0=num(v.rev),g1=num(v.g1)/100,g5=num(v.g5)/100,m=num(v.m)/100,da=num(v.da)/100,cx=num(v.cx)/100,nw=num(v.nwc)/100,t=num(v.t)/100,w=num(v.w)/100,g=num(v.g)/100,nd=num(v.nd)||0,sh=num(v.sh),mid=num(v.mid)===1;
    if([R0,g1,g5,m,da,cx,nw,t,w,g,sh].some(isNaN))return '<p class="note">Заполни поля.</p>';
    function run(w,g){
      if(w<=g)return null;var R=R0,N0=R0*nw,rows=[],sum=0,last=0,eb1=0;
      for(var y=1;y<=5;y++){var gr=g1+(g5-g1)*(y-1)/4;R=R*(1+gr);var eb=R*m,d=R*da,ebit=eb-d,nop=ebit*(1-t),c=R*cx,N=R*nw,dn=N-N0;N0=N;var f=nop+d-c-dn,df=1/Math.pow(1+w,mid?y-0.5:y);sum+=f*df;last=f;if(y===1)eb1=eb;
        rows.push({y:y,gr:gr,R:R,eb:eb,ebit:ebit,nop:nop,d:d,c:c,dn:dn,f:f,df:df,pv:f*df})}
      var tv=last*(1+g)/(w-g),ptv=tv/Math.pow(1+w,mid?4.5:5),ev=sum+ptv;
      return {rows:rows,sum:sum,tv:tv,ptv:ptv,ev:ev,eq:ev-nd,px:(ev-nd)/sh,eb1:eb1,ebl:rows[4].eb};
    }
    var b=run(w,g);if(!b)return '<p class="note">WACC должен быть больше g.</p>';
    var h='<div class="tiles">'+tile('EV',money(b.ev),'сумма PV потоков + PV терминальной')+tile('Стоимость капитала',money(b.eq),'EV − чистый долг')+tile('Цена акции','<b>'+nf(b.px,2)+'</b>','капитал / акции')+
      tile('Доля терминальной',nf(b.ptv/b.ev*100,0)+'%',b.ptv/b.ev>0.85?'слишком много: проверь g и горизонт':b.ptv/b.ev<0.6?'ниже обычных 60–80%':'обычно 60–80%')+tile('EV / EBITDA год 1',nf(b.ev/b.eb1,1)+'×','сверь с аналогами')+tile('Выход: TV / EBITDA год 5',nf(b.tv/b.ebl,1)+'×','подразумеваемый мультипликатор')+'</div>';
    h+=mini(['Год','Рост','Выручка','EBITDA','EBIT','NOPAT','+ D&A','− CAPEX','− ΔNWC','FCFF','Коэф.','PV'],b.rows.map(function(r){return [r.y,p1(r.gr),money(r.R),money(r.eb),money(r.ebit),money(r.nop),money(r.d),money(r.c),money(r.dn),'<b>'+money(r.f)+'</b>',nf(r.df,3),money(r.pv)]}));
    var ws=[-0.02,-0.01,0,0.01,0.02],gs=[-0.01,-0.005,0,0.005,0.01];
    h+='<h3 style="margin:18px 0 6px;font:600 16px var(--sans)">Цена акции: WACC (строки) × g (столбцы)</h3>'+mini(['WACC \\ g'].concat(gs.map(function(d){return p1(g+d)})),ws.map(function(dw){return ['<b>'+p1(w+dw)+'</b>'].concat(gs.map(function(dg){var x=run(w+dw,g+dg);var s=x?nf(x.px,1):'—';return (dw===0&&dg===0)?'<b>'+s+'</b>':s}))}));
    return h+'<p class="note">Рост выручки плавно меняется от года 1 к году 5. Оборотный капитал — % выручки, в поток идёт его изменение. Терминальная стоимость — по Гордону от FCFF 5-го года. Логика — глава «DCF».</p>';
  }},
 {id:'lbo',t:'LBO: доходность фонда',s:'Покупка в долг → погашение → выход → IRR и MoM',
  f:[['e','EBITDA при покупке',100],['em','Мультипликатор входа EV/EBITDA',8],['dp','Доля долга в цене, %',60],['ir','Ставка по долгу, %',14],['gr','Рост EBITDA в год, %',6],['cv','Конверсия EBITDA в поток до процентов, %',50],['t','Налог, %',25],['n','Лет до выхода',5],['xm','Мультипликатор выхода',8]],
  c:function(v){
    var e=num(v.e),em=num(v.em),dp=num(v.dp)/100,ir=num(v.ir)/100,gr=num(v.gr)/100,cv=num(v.cv)/100,t=num(v.t)/100,n=Math.round(num(v.n)),xm=num(v.xm);
    if([e,em,dp,ir,gr,cv,t,n,xm].some(isNaN)||n<1||n>15)return '<p class="note">Заполни поля (срок 1–15 лет).</p>';
    var ev=e*em,D=ev*dp,E0=ev-D,eb=e,rows=[],cash=0;
    for(var y=1;y<=n;y++){eb*=1+gr;var it=D*ir,fcf=eb*cv-it*(1-t),pay=Math.min(D,Math.max(fcf,0));D-=pay;if(fcf>pay)cash+=fcf-pay;if(fcf<0)D-=fcf;rows.push([y,money(eb),money(it),money(fcf),money(pay),money(D)])}
    var xev=eb*xm,eq=xev-D+cash,mom=eq/E0,irr=Math.pow(Math.max(mom,0),1/n)-1;
    var gE=(eb-e)*em,gM=(xm-em)*eb,gD=(ev*dp-D)+cash;
    return '<div class="tiles">'+tile('Цена входа (EV)',money(ev),'долг '+money(ev*dp)+' · капитал фонда '+money(E0))+tile('EV на выходе',money(xev),'EBITDA '+money(eb)+' × '+nf(xm,1))+tile('Капитал на выходе',money(eq),'EV − долг + накопленный кэш')+
      tile('MoM','<b>'+nf(mom,2)+'×</b>','во сколько раз выросли деньги')+tile('IRR','<b>'+p1(irr)+'</b>',irr>=0.2?'типичная цель фондов 20–25%':'ниже типичной цели 20–25%')+'</div>'+
      '<div class="tiles" style="margin-top:10px">'+tile('Рост EBITDA дал',money(gE),'ΔEBITDA × мультипликатор входа')+tile('Рост мультипликатора дал',money(gM),'Δмультипликатор × EBITDA выхода')+tile('Погашение долга дало',money(gD),'снижение долга + кэш')+'</div>'+
      mini(['Год','EBITDA','Проценты','Поток после %','Погашение','Долг на конец'],rows)+'<p class="note">Упрощение: весь свободный поток идёт на погашение долга, комиссии не учтены. Логика — глава «M&A и LBO».</p>';
  }},
 {id:'acc',t:'Accretion / Dilution',s:'Как покупка изменит прибыль на акцию покупателя',
  f:[['ni','Чистая прибыль покупателя',200],['sh','Акций покупателя',100],['px','Цена акции покупателя',30],['tni','Чистая прибыль цели',30],['pp','Цена покупки капитала цели',360],['st','Оплата акциями, %',100],['kd','Ставка нового долга, %',14],['t','Налог, %',25],['syn','Синергии до налога',0]],
  c:function(v){
    var ni=num(v.ni),sh=num(v.sh),px=num(v.px),tni=num(v.tni),pp=num(v.pp),st=num(v.st)/100,kd=num(v.kd)/100,t=num(v.t)/100,syn=num(v.syn)||0;
    if([ni,sh,px,tni,pp,st,kd,t].some(isNaN)||sh<=0||px<=0)return '<p class="note">Заполни поля.</p>';
    var ns=pp*st/px,debt=pp*(1-st),int=debt*kd*(1-t),pni=ni+tni+syn*(1-t)-int,e0=ni/sh,e1=pni/(sh+ns),ch=e1/e0-1;
    var be=((e0*(sh+ns))-(ni+tni-int))/(1-t);
    return '<div class="tiles">'+tile('EPS до',nf(e0,3),'P/E покупателя '+nf(px/e0,1)+'×')+tile('EPS после',nf(e1,3),'новых акций '+money(ns)+' · новый долг '+money(debt))+
      tile('Изменение EPS','<span class="'+(ch>=0?'up':'down')+'">'+(ch>=0?'+':'')+p1(ch)+'</span>',ch>=0?'accretive (рост)':'dilutive (размытие)')+
      tile('Уплаченный P/E цели',nf(pp/tni,1)+'×','сравни с P/E покупателя')+tile('Синергии для безубыточности',be>0?money(be):'не нужны','до налога, чтобы EPS не упал')+'</div>'+
      '<p class="note">Правило: при оплате акциями сделка увеличивает EPS, если P/E покупателя выше уплаченного P/E цели; при оплате долгом — если доходность прибыли цели (1/P/E) выше ставки долга после налога. Рост EPS ≠ создание стоимости.</p>';
  }}
];
var CV={};
function calcVals(c){if(!CV[c.id]){var s=null;try{s=JSON.parse(localStorage.getItem('calc:'+c.id)||'null')}catch(e){}CV[c.id]=s||{};c.f.forEach(function(f){if(CV[c.id][f[0]]===undefined)CV[c.id][f[0]]=f[2]})}return CV[c.id]}
var calcCur='npv';
function renderCalc(id){
  var c=CALCS.filter(function(x){return x.id===id})[0]||CALCS[0];calcCur=c.id;var v=calcVals(c);
  var h='<nav class="sub">'+CALCS.map(function(x){return '<a class="chip'+(x.id===c.id?' on':'')+'" href="#calc/'+x.id+'">'+esc(x.t)+'</a>'}).join('')+'</nav>'+
    '<div class="sect"><h2>'+esc(c.t)+'</h2><p class="note" style="margin-top:0">'+esc(c.s)+'</p><div class="box calc"><div class="bf cf">'+
    c.f.map(function(f){return '<label class="'+(f[3]?'wide':'')+'">'+esc(f[1])+'<input data-cv="'+f[0]+'" inputmode="'+(f[3]?'text':'decimal')+'" value="'+esc(v[f[0]])+'"></label>'}).join('')+
    '</div><button type="button" class="chip" data-creset style="margin-top:8px">Сбросить</button><div id="c-out" style="margin-top:14px">'+c.c(v)+'</div></div></div>';
  view.innerHTML=h;
}
view.addEventListener('input',function(e){var k=e.target.getAttribute('data-cv');if(!k)return;var c=CALCS.filter(function(x){return x.id===calcCur})[0];CV[c.id][k]=e.target.value;try{localStorage.setItem('calc:'+c.id,JSON.stringify(CV[c.id]))}catch(err){}var o=document.getElementById('c-out');if(o)o.innerHTML=c.c(CV[c.id])});
view.addEventListener('click',function(e){if(!e.target.closest('[data-creset]'))return;var c=CALCS.filter(function(x){return x.id===calcCur})[0];CV[c.id]=null;try{localStorage.removeItem('calc:'+c.id)}catch(err){}renderCalc(c.id)});

/* ---------------- роутинг ---------------- */
var state='',LASTCARD='';
function route(){
  var h=decodeURIComponent(location.hash.slice(1)),p=h.split('/');
  var sec=p[0]==='markets'?'markets':p[0]==='calc'?'calc':'learn';
  document.querySelectorAll('#sw a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===sec)});
  state=sec;
  var bk=document.getElementById('b-back'),inCh=sec==='learn'&&CH.some(function(x){return x.id===p[1]});
  bk.setAttribute('href',sec==='markets'?(p[1]==='idx'?'#markets':p[1]&&p[1]!=='summary'?(p[2]?'#markets/'+p[1]:'#markets'):'#learn'):sec==='calc'?'#learn':(inCh?'#learn':'artem.html'));bk.setAttribute('aria-label',(sec==='learn'&&!inCh)?'Все разделы':'Назад');
  if(sec==='markets'){
    cur=SUBS.some(function(s){return s[0]===p[1]})?p[1]:'summary';store('fin:sub',cur);
    CARD.tic=(cur==='ru'&&p[2])?p[2].toUpperCase():null;ASSET={kind:null,id:null};var ck=p[2]?p[1]+'/'+p[2]:'';if(ck&&ck!==LASTCARD&&!/^(ev-|[0-9a-f]{10}$)/.test(p[2]))CARD.range='1m';if(ck&&p[1]!=='news')LASTCARD=ck;if(p[2]&&(p[1]==='us'||p[1]==='crypto'||p[1]==='idx')){if(p[1]==='idx')cur='summary';openAsset(p[1]==='crypto'?'cr':p[1],p[2].toUpperCase())}NEWSID=(cur==='news'&&p[2])?p[2]:null;if(cur==='news'&&!TEXTS)setTimeout(function(){try{if(navigator.connection&&navigator.connection.saveData)return}catch(e){}if(state==='markets'&&cur==='news')loadTexts()},2500);if(CARD.tic){PC.d=null;NLIM=12;Promise.all([loadCandles(CARD.tic,CARD.range),loadDivs(CARD.tic),loadNews(),loadEN(enFile('ru',CARD.tic))]).then(function(){drawMarkets(true)})}
    drawMarkets(true);refresh();startTimer();document.title='Рынки · Финансы';
  }else if(sec==='calc'){
    clearInterval(timer);renderCalc(p[1]);document.title='Калькуляторы · Финансы';
  }else{
    clearInterval(timer);
    var c=CH.filter(function(x){return x.id===p[1]})[0];
    if(c){renderChapter(c);document.title=c.title+' · Финансы';store('fin:last',c.id)}else{renderLearn();document.title='Финансы'}
  }
}
function enter(){view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter')}
window.addEventListener('hashchange',function(){window.scrollTo(0,0);route();enter();if(!Q)return;});
route();
})();
</script>
