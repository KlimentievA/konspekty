 моменте цена достигала 597 руб. Источник не называет причину; ранее компания отчиталась о росте чистой прибыли за полугодие на 69%.","move":"+2,2%","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/10/07/1235073-aktsii-gazprom-nefti"}]},"terms":[{"p":["NPV"],"t":"NPV — чистая приведённая стоимость","d":"Сумма всех будущих потоков, приведённых к сегодняшнему дню, минус инвестиции. NPV > 0 — проект создаёт стоимость. Excel: =ЧПС(r;потоки)+инвестиция."},{"p":["IRR"],"t":"IRR — внутренняя норма доходности","d":"Ставка, при которой NPV = 0. Проект выгоден, если IRR > WACC. Excel: =ВСД(потоки)."},{"p":["WACC"],"t":"WACC — средневзвешенная стоимость капитала","d":"E/(D+E)×Ke + D/(D+E)×Kd×(1−t). Ставка, по которой дисконтируют FCFF. Для российских компаний сейчас обычно 17–22%."},{"p":["EBITDA"],"t":"EBITDA","d":"Прибыль до процентов, налогов и амортизации = EBIT + D&A. Прокси операционного денежного потока; база для EV/EBITDA и ND/EBITDA. Не применяется к банкам."},{"p":["EBIT"],"t":"EBIT","d":"Операционная прибыль до процентов и налогов: выручка − себестоимость − операционные расходы − амортизация."},{"p":["EV"],"t":"EV — стоимость бизнеса (Enterprise Value)","d":"Капитализация + долг − кэш + доли меньшинства (+ префы, аренда) − ассоциированные. Сколько стоит весь бизнес для всех инвесторов."},{"p":["DCF"],"t":"DCF — дисконтированные денежные потоки","d":"Оценка компании как суммы будущих свободных потоков, приведённых по WACC, плюс терминальная стоимость."},{"p":["CAPM"],"t":"CAPM — модель ценообразования активов","d":"Ke = Rf + β × ERP. Стоимость собственного капитала через безрисковую ставку, бету и премию за риск рынка."},{"p":["EVA"],"t":"EVA — экономическая добавленная стоимость","d":"(ROIC − WACC) × инвестированный капитал. Положительная EVA — компания зарабатывает больше, чем стоит её капитал. Не применяется к банкам."},{"p":["CAPEX"],"t":"CAPEX — капитальные затраты","d":"Деньги на покупку и строительство основных средств (оборудование, здания). Вычитаются в FCF."},{"p":["LBO"],"t":"LBO — выкуп с плечом","d":"Покупка компании фондом в основном на заёмные деньги; долг гасится потоками самой компании. Цель фонда — IRR 20–25%."},{"p":["M&A"],"t":"M&A — слияния и поглощения","d":"Сделки по покупке, продаже и объединению компаний. Банк консультирует продавца (sell-side) или покупателя (buy-side)."},{"p":["P/E"],"t":"P/E — цена / прибыль","d":"Капитализация / чистая прибыль. Сколько лет прибыли платит рынок. РФ ~7× (медиана), S&P 500 ~26×."},{"p":["ROE"],"t":"ROE — рентабельность капитала","d":"Чистая прибыль / собственный капитал. Если ROE > Ke, компания (особенно банк) должна торговаться выше балансовой стоимости (P/B > 1)."},{"p":["ERP"],"t":"ERP — премия за риск акций","d":"Сколько акции дают сверх безрисковой ставки. США 3,7% (Дамодаран, сент. 2026); в рублях брокеры закладывают 5–8%."},{"p":["чист(?:ый|ого|ому|ым) долг[а-яёА-ЯЁa-zA-Z]*"],"t":"Чистый долг (Net Debt)","d":"Долг минус денежные средства. Показывает, сколько компания должна «на самом деле». Отрицательный чистый долг означает, что денег больше, чем долга."},{"p":["оборотн(?:ый|ого|ому|ым) капитал[а-яёА-ЯЁa-zA-Z]*"],"t":"Оборотный капитал (NWC)","d":"Запасы + дебиторка − кредиторка. Деньги, «замороженные» в операционной деятельности. Рост оборотного капитала уменьшает свободный денежный поток."},{"p":["дебиторк[а-яёА-ЯЁa-zA-Z]*","дебиторск[а-яёА-ЯЁa-zA-Z]* задолженност[а-яёА-ЯЁa-zA-Z]*"],"t":"Дебиторская задолженность","d":"Деньги, которые покупатели должны компании за уже отгруженный товар."},{"p":["кредиторк[а-яёА-ЯЁa-zA-Z]*","кредиторск[а-яёА-ЯЁa-zA-Z]* задолженност[а-яёА-ЯЁa-zA-Z]*"],"t":"Кредиторская задолженность","d":"Деньги, которые компания должна поставщикам. Бесплатный источник финансирования."},{"p":["амортизаци[а-яёА-ЯЁa-zA-Z]*"],"t":"Амортизация (D&A)","d":"Неденежный расход: стоимость оборудования и нематериальных активов распределяется на срок их службы. Уменьшает прибыль и налог, но не деньги."},{"p":["выручк[а-яёА-ЯЁa-zA-Z]*"],"t":"Выручка (Revenue)","d":"Все продажи компании за период, без НДС. Верхняя строка отчёта о прибылях и убытках."},{"p":["себестоимост[а-яёА-ЯЁa-zA-Z]*"],"t":"Себестоимость (COGS)","d":"Прямые затраты на производство проданного товара: сырьё, зарплата производственных рабочих, энергия."},{"p":["чист(?:ая|ой|ую) прибыл[а-яёА-ЯЁa-zA-Z]*"],"t":"Чистая прибыль (Net Income)","d":"Прибыль после всех расходов, процентов и налогов. Принадлежит акционерам: из неё платят дивиденды."},{"p":["(?<!тонкой )(?<!Тонкой )капитализаци[а-яёА-ЯЁa-zA-Z]*"],"t":"Рыночная капитализация","d":"Цена акции × число акций. Сколько рынок сейчас платит за весь акционерный капитал компании (Equity Value)."},{"p":["дисконтировани[а-яёА-ЯЁa-zA-Z]*","дисконтир[а-яёА-ЯЁa-zA-Z]+"],"t":"Дисконтирование","d":"Пересчёт будущих денег в сегодняшние: делим на (1 + r)^t. Чем дальше поток и выше ставка, тем меньше он стоит сегодня."},{"p":["ставк[а-яёА-ЯЁa-zA-Z]* дисконтирования"],"t":"Ставка дисконтирования","d":"Доходность, которую требует инвестор за риск. Для всей компании это WACC, для акционеров — Ke."},{"p":["терминальн[а-яёА-ЯЁa-zA-Z]* стоимост[а-яёА-ЯЁa-zA-Z]*","постпрогнозн[а-яёА-ЯЁa-zA-Z]* стоимост[а-яёА-ЯЁa-zA-Z]*"],"t":"Терминальная стоимость (TV)","d":"Стоимость всех потоков после прогнозного периода. Обычно считается по формуле Гордона FCF×(1+g)/(WACC−g) или через мультипликатор выхода. Часто это 60–80% стоимости в DCF."},{"p":["модел[а-яёА-ЯЁa-zA-Z]* Гордона","формул[а-яёА-ЯЁa-zA-Z]* Гордона"],"t":"Модель Гордона","d":"Стоимость бесконечного потока, растущего с темпом g: C₁ / (r − g). Работает только при r > g."},{"p":["бет(?:а|ы|у|ой)(?![а-я])"],"t":"Бета (β)","d":"Насколько акция колеблется вместе с рынком. β = 1 — как рынок, β = 1,5 — в полтора раза сильнее, β < 1 — спокойнее."},{"p":["премия за риск","премии за риск"],"t":"Премия за риск (ERP)","d":"Дополнительная доходность, которую акции дают сверх безрисковой ставки. США ≈ 3,7% (Дамодаран, сентябрь 2026)."},{"p":["безрисков[а-яёА-ЯЁa-zA-Z]* ставк[а-яёА-ЯЁa-zA-Z]*"],"t":"Безрисковая ставка (Rf)","d":"Доходность госбумаг в той же валюте и на тот же срок. В РФ — ОФЗ 10 лет (≈16,6% в октябре 2026), в США — UST 10 лет (≈5,2%)."},{"p":["стоимост[а-яёА-ЯЁa-zA-Z]* собственного капитала"],"t":"Стоимость собственного капитала (Ke)","d":"Доходность, которую требуют акционеры. Обычно считается по CAPM: Rf + β × ERP."},{"p":["стоимост[а-яёА-ЯЁa-zA-Z]* долга"],"t":"Стоимость долга (Kd)","d":"Ставка, по которой компания занимает. В WACC берётся после налога: Kd × (1 − t), потому что проценты уменьшают налог."},{"p":["налогов[а-яёА-ЯЁa-zA-Z]* щит[а-яёА-ЯЁa-zA-Z]*"],"t":"Налоговый щит","d":"Экономия на налоге из-за процентов по долгу: проценты × ставка налога. Делает долг дешевле капитала."},{"p":["мультипликатор[а-яёА-ЯЁa-zA-Z]*"],"t":"Мультипликатор","d":"Отношение стоимости к финансовому показателю (P/E, EV/EBITDA). Показывает, сколько рынок платит за рубль прибыли, EBITDA или выручки."},{"p":["премия за контроль","премии за контроль","премию за контроль"],"t":"Премия за контроль","d":"Наценка к рыночной цене при покупке контрольного пакета: право управлять компанией и получать синергии. Обычно 20–40%."},{"p":["синерги[а-яёА-ЯЁa-zA-Z]*"],"t":"Синергии","d":"Дополнительная стоимость от объединения компаний: экономия затрат или рост выручки, которых не было бы по отдельности."},{"p":["гудвил[а-яёА-ЯЁa-zA-Z]*"],"t":"Гудвил (Goodwill)","d":"Переплата при покупке компании сверх справедливой стоимости её чистых активов. Не амортизируется, но проверяется на обесценение."},{"p":["дол(?:я|и|ю) меньшинства","доли меньшинства","неконтролирующ[а-яёА-ЯЁa-zA-Z]* дол[а-яёА-ЯЁa-zA-Z]*"],"t":"Доли меньшинства (NCI)","d":"Часть дочерних компаний, которая принадлежит другим акционерам. Вычитается при переходе от EV к стоимости акций."},{"p":["дюраци[а-яёА-ЯЁa-zA-Z]*"],"t":"Дюрация","d":"Средневзвешенный срок получения денег по облигации (в годах). Модифицированная дюрация показывает, на сколько % упадёт цена при росте ставок <script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('fdata').textContent);
var CH=D.chapters,S=D.static;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var view=$('#view');

/* тема */
var root=document.documentElement;
function applyTheme(t){if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme')}
applyTheme(store('theme')||'');
$('#b-theme').onclick=function(){
  var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  var t=dark?'light':'dark';applyTheme(t);store('theme',t);
};

/* числа */
function nf(x,d){if(x==null||isNaN(x))return '—';return Number(x).toLocaleString('ru-RU',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function auto(x){if(x==null||isNaN(x))return '—';var a=Math.abs(x);return nf(x,a>=1000?0:a>=10?2:a>=1?2:a>=0.01?4:6)}
function pct(x,d){if(x==null||isNaN(x))return '<span>—</span>';var c=x>0?'up':x<0?'down':'';return '<span class="'+c+'">'+(x>0?'+':'')+nf(x,d==null?2:d)+'%</span>'}
function mult(x){return x==null?'—':nf(x,x>=100?0:x>=10?1:2)+'×'}
function bigUsd(x){if(x==null)return '—';if(x>=1e12)return nf(x/1e12,2)+' трлн $';if(x>=1e9)return nf(x/1e9,1)+' млрд $';return nf(x/1e6,0)+' млн $'}
function hm(d){return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}

/* markdown */
var heads=[];
marked.use({gfm:true,breaks:false,renderer:{
  code:function(code,lang){if(lang==='f')return '<div class="f">'+esc(code)+'</div>\n';return '<pre><code>'+esc(code)+'</code></pre>\n'},
  table:function(h,b){return '<div class="tablewrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>\n'},
  heading:function(text,level,raw){if(level===1)return '';if(level===2){var id='h'+heads.length;heads.push({id:id,t:raw});return '<h2 id="'+id+'">'+text+'</h2>\n'}return '<h'+level+'>'+text+'</h'+level+'>\n'},
  link:function(href,title,text){return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+text+'</a>'}
}});
CH.forEach(function(c,i){c.i=i;c.plain=c.md.replace(/<[^>]+>/g,' ').replace(/[#*|`>_-]{1,}/g,' ').replace(/\s+/g,' ');c.low=c.plain.toLowerCase()});

/* ---------------- обучение ---------------- */
var TRACKS=[
 ['Шаг 1. Основы','Без этого дальше не понять ничего',['ib','otchetnost','npv-irr','koeffitsienty']],
 ['Шаг 2. Оценка компаний','Ядро работы аналитика',['wacc','dcf','multiplikatory','metody','sektory','kpi']],
 ['Шаг 3. Сделки и рынки','Как это применяют в банке',['ma-lbo','struktura-kapitala','rynki-kapitala','makro','rossiya']],
 ['Шаг 4. Практика и собеседование','Кейсы, задачи, подготовка к стажировке',['stazhirovka','keysy','sobesedovanie','praktikum','excel','project-black','karera']],
 ['Справка','Возвращайся по необходимости',['glossariy','istochniki']]];
(function(){var order=[];TRACKS.forEach(function(tr){tr[2].forEach(function(id){var c=CH.filter(function(x){return x.id===id})[0];if(c&&order.indexOf(c)<0)order.push(c)})});
  CH.forEach(function(c){if(order.indexOf(c)<0)order.push(c)});CH=order;CH.forEach(function(c,i){c.i=i;c.min=Math.max(2,Math.round(c.plain.split(' ').length/170))})})();
var CALC_LINK={'npv-irr':['npv','Посчитать NPV и IRR'],'wacc':['wacc','Посчитать WACC'],'dcf':['dcf','Собрать свой DCF'],'ma-lbo':['lbo','Посчитать LBO'],'struktura-kapitala':['wacc','Поиграть со структурой капитала'],'rynki-kapitala':['npv','Калькулятор потоков'],'praktikum':['npv','Проверить ответы в калькуляторах']};
function renderLearn(){
  var last=CH.filter(function(x){return x.id===store('fin:last')})[0];
  var h='<section class="hero"><h1>Справочник по корпоративным финансам</h1><p>Иди по шагам сверху вниз: каждая глава опирается на предыдущие. Подчёркнутые пунктиром термины объясняются при наведении или нажатии.</p>'+
    (last?'<a class="resume" href="#learn/'+last.id+'"><small>Продолжить</small><b>'+esc(last.title)+'</b></a>':'<a class="resume" href="#learn/ib"><small>Начать отсюда</small><b>'+esc(CH[0].title)+'</b></a>')+'</section>';
  TRACKS.forEach(function(tr){
    h+='<section class="track"><h2>'+esc(tr[0])+'<span>'+esc(tr[1])+'</span></h2><div class="chs">';
    tr[2].forEach(function(id){var c=CH.filter(function(x){return x.id===id})[0];if(!c)return;
      h+='<a class="ch'+(last&&last.id===c.id?' cur':'')+'" href="#learn/'+c.id+'"><span class="n">'+(c.i+1)+'</span><span><b>'+esc(c.title)+'</b><i>'+esc(c.short)+'</i><em>'+c.min+' мин чтения'+(CALC_LINK[c.id]?' · есть калькулятор':'')+'</em></span></a>'});
    h+='</div></section>';
  });
  view.innerHTML=h;
}
function renderChapter(c){
  heads=[];var body=marked.parse(c.md);
  var toc=heads.map(function(x){return '<a href="#" data-to="'+x.id+'">'+esc(x.t)+'</a>'}).join('');
  var pv=CH[c.i-1],nx=CH[c.i+1];
  view.innerHTML='<div class="doc"><article class="art"><p class="eyebrow"><a href="#learn">Обучение</a> · '+(c.i+1)+' из '+CH.length+'</p><h1>'+esc(c.title)+'</h1><p class="meta">'+c.min+' мин чтения'+(c.id!=='glossariy'?' · термины с пунктиром — наведи или нажми':'')+'</p>'+
    (heads.length>2?'<details class="toc"><summary>Содержание</summary><nav>'+toc+'</nav></details>':'')+
    (c.id==='glossariy'?'<input class="gfilter" type="search" placeholder="Найти термин: EBITDA, спред, оферта…" aria-label="Фильтр глоссария">':'')+'<div class="prose">'+body+'</div>'+(CALC_LINK[c.id]?'<a class="try" href="#calc/'+CALC_LINK[c.id][0]+'">'+esc(CALC_LINK[c.id][1])+' в калькуляторе →</a>':'')+'<nav class="pager">'+
    (pv?'<a href="#learn/'+pv.id+'"><small>← Назад</small><b>'+esc(pv.title)+'</b></a>':'')+
    (nx?'<a class="nx" href="#learn/'+nx.id+'"><small>Дальше →</small><b>'+esc(nx.title)+'</b></a>':'')+
    '</nav></article>'+(heads.length>2?'<aside class="side"><p class="h">Содержание</p>'+toc+'</aside>':'')+'</div>';
  if(c.id!=='glossariy'&&c.id!=='istochniki')applyTerms(view.querySelector('.prose'));
  var qs=view.querySelectorAll('details.qa');
  if(qs.length>5&&(c.id==='sobesedovanie'||c.id==='stazhirovka'||c.id==='praktikum')){
    var bar=document.createElement('div');bar.className='rq';bar.innerHTML='<button type="button" class="chip on" data-rq>Случайный вопрос</button><span>Подумай над ответом вслух, потом открой и сверься.</span>';
    var pr=view.querySelector('.prose');pr.insertBefore(bar,pr.firstChild.nextSibling);
  }
  if(Q){hl(view.querySelector('.prose'),Q)}
}
view.addEventListener('input',function(e){if(!e.target.classList.contains('gfilter'))return;var q=e.target.value.trim().toLowerCase();view.querySelectorAll('.prose tbody tr').forEach(function(tr){tr.hidden=q&&tr.textContent.toLowerCase().indexOf(q)<0})});
view.addEventListener('click',function(e){
  if(e.target.closest('[data-rq]')){var qs=[].slice.call(view.querySelectorAll('details.qa'));qs.forEach(function(d){d.open=false;d.classList.remove('rqon')});var q=qs[Math.floor(Math.random()*qs.length)];q.classList.add('rqon');q.scrollIntoView({behavior:'smooth',block:'center'});return}
  var a=e.target.closest('[data-to]');if(!a)return;e.preventDefault();
  var el=document.getElementById(a.getAttribute('data-to'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  var d=a.closest('details.toc');if(d)d.open=false;
});


/* ---------------- подсказки к терминам ---------------- */
var TT=D.terms||[],ttRe=null;
(function(){var parts=TT.map(function(x){return '('+x.p.join('|')+')'});
  try{ttRe=new RegExp('(?<![A-Za-zА-Яа-яЁё0-9])(?:'+parts.join('|')+')(?![A-Za-zА-Яа-яЁё0-9])','gi')}catch(e){ttRe=null}})();
var SKIP='a,code,.f,.tt,h1,h2,h3,h4,summary,th,mark';
function applyTerms(prose){
  if(!ttRe)return;var used={};
  Array.prototype.slice.call(prose.children).forEach(function(ch){
    if(ch.tagName==='H2'){used={};return}
    if(/^H[1-4]$/.test(ch.tagName))return;
    var w=document.createTreeWalker(ch,NodeFilter.SHOW_TEXT),n,list=[];
    while(n=w.nextNode()){if(n.parentNode.closest&&n.parentNode.closest(SKIP))continue;list.push(n)}
    list.forEach(function(node){
      var s=node.nodeValue,m,last=0,frag=null;ttRe.lastIndex=0;
      while(m=ttRe.exec(s)){
        var gi=-1;for(var i=1;i<m.length;i++)if(m[i]!==undefined){gi=i-1;break}
        if(gi<0||used[gi])continue;used[gi]=1;
        frag=frag||document.createDocumentFragment();
        frag.appendChild(document.createTextNode(s.slice(last,m.index)));
        var a=document.createElement('span');a.className='tt';a.setAttribute('data-tt',gi);a.setAttribute('tabindex','0');a.textContent=m[0];frag.appendChild(a);
        last=m.index+m[0].length;
      }
      if(frag){frag.appendChild(document.createTextNode(s.slice(last)));node.parentNode.replaceChild(frag,node)}
    });
  });
}

function svgLine(pts,opt){
  var W=460,H=230,L=44,R=16,T=20,B=28,xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]});
  var x0=opt.x0!=null?opt.x0:Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=opt.y0!=null?opt.y0:Math.floor(Math.min.apply(0,ys)-1),y1=Math.ceil(Math.max.apply(0,ys)+1);
  function X(v){return L+(v-x0)/(x1-x0)*(W-L-R)}function Y(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B)}
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label)+'">';
  for(var g=0;g<=4;g++){var v=y0+(y1-y0)*g/4;h+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" opacity=".6"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+nf(v,v%1?1:0)+(opt.u!=null?opt.u:'%')+'</text>'}
  var d='';pts.forEach(function(p,i){var x=X(p[0]),y=Y(p[1]);if(opt.step&&i)d+='H'+x+'V'+y;else d+=(i?'L':'M')+x+','+y});
  h+='<path class="ln" d="'+d+'"/>';
  pts.forEach(function(p,i){if(opt.dots)h+='<circle class="pt" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.2"/>';var lb=opt.xl(p,i);if(lb)h+='<text x="'+X(p[0])+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>';if(opt.vl&&opt.vl(p,i))h+='<text class="lb" x="'+X(p[0])+'" y="'+(Y(p[1])-8)+'" text-anchor="'+(i===pts.length-1?'end':i===0?'start':'middle')+'">'+nf(p[1],2)+'</text>'});
  return h+'</svg>';
}

var BC={fv:1000,c:12,m:2,n:5,p:92,name:''};
function bondCalc(){
  var fv=+String(BC.fv).replace(',','.'),c=+String(BC.c).replace(',','.')/100,m=Math.max(1,Math.round(+BC.m)),n=+String(BC.n).replace(',','.'),p=+String(BC.p).replace(',','.')/100*fv;
  if(!(fv>0&&c>=0&&n>0&&p>0))return '<p class="note">Заполни поля.</p>';
  var N=Math.max(1,Math.round(n*m)),cp=fv*c/m;
  function price(r){var s=0;for(var t=1;t<=N;t++)s+=cp/Math.pow(1+r,t);return s+fv/Math.pow(1+r,N)}
  var lo=-0.99,hi=5;for(var i=0;i<200;i++){var mid=(lo+hi)/2;if(price(mid)>p)lo=mid;else hi=mid}
  var r=(lo+hi)/2,ytm=Math.pow(1+r,m)-1,nom=r*m;
  var dm=0;for(var t=1;t<=N;t++)dm+=t/m*cp/Math.pow(1+r,t);dm+=N/m*fv/Math.pow(1+r,N);dm/=p;
  var md=dm/(1+r),dp=(price(Math.pow(1+ytm+0.01,1/m)-1)/p-1)*100;
  var g=kbdAt(dm);
  return '<div class="tiles" style="margin-top:12px">'+
    tile('Доходность к погашению',nf(ytm*100,2)+'%','эффективная годовая · номинальная '+nf(nom*100,2)+'%')+
    tile('Текущая доходность',nf(c*fv/p*100,2)+'%','купон / цена')+
    tile('Дюрация Маколея',nf(dm,2)+' лет','модифицированная '+nf(md,2))+
    tile('Если ставки +1 п.п.',nf(dp,2)+'%','изменение цены')+
    (g!=null?tile('Спред к КБД',(ytm*100-g>0?'+':'')+nf((ytm*100-g)*100,0)+' б.п.','КБД на '+nf(dm,1)+' г.: '+nf(g,2)+'%'):'')+
    '</div>'+(BC.name?'<p class="note">Выпуск: '+esc(BC.name)+' (срок округлён до целого числа купонных периодов, НКД не учтён).</p>':'<p class="note">Срок округляется до целого числа купонных периодов; НКД не учитывается.</p>');
}

    if([R0,g1,g5,m,da,cx,nw,t,w,g,sh].some(isNaN))return '<p class="note">Заполни поля.</p>';
    function run(w,g){
      if(w<=g)return null;var R=R0,N0=R0*nw,rows=[],sum=0,last=0,eb1=0;
      for(var y=1;y<=5;y++){var gr=g1+(g5-g1)*(y-1)/4;R=R*(1+gr);var eb=R*m,d=R*da,ebit=eb-d,nop=ebit*(1-t),c=R*cx,N=R*nw,dn=N-N0;N0=N;var f=nop+d-c-dn,df=1/Math.pow(1+w,mid?y-0.5:y);sum+=f*df;last=f;if(y===1)eb1=eb;
        rows.push({y:y,gr:gr,R:R,eb:eb,ebit:ebit,nop:nop,d:d,c:c,dn:dn,f:f,df:df,pv:f*df})}
      var tv=last*(1+g)/(w-g),ptv=tv/Math.pow(1+w,mid?4.5:5),ev=sum+ptv;
      return {rows:rows,sum:sum,tv:tv,ptv:ptv,ev:ev,eq:ev-nd,px:(ev-nd)/sh,eb1:eb1,ebl:rows[4].eb};
    }
    var b=run(w,g);if(!b)return '<p class="note">WACC должен быть больше g.</p>';
    var h='<div class="tiles">'+tile('EV',money(b.ev),'сумма PV потоков + PV терминальной')+tile('Стоимость капитала',money(b.eq),'EV − чистый долг')+tile('Цена акции','<b>'+nf(b.px,2)+'</b>','капитал / акции')+
      tile('Доля терминальной',nf(b.ptv/b.ev*100,0)+'%',b.ptv/b.ev>0.85?'слишком много: проверь g и горизонт':b.ptv/b.ev<0.6?'ниже обычных 60–80%':'обычно 60–80%')+tile('EV / EBITDA год 1',nf(b.ev/b.eb1,1)+'×','сверь с аналогами')+tile('Выход: TV / EBITDA год 5',nf(b.tv/b.ebl,1)+'×','подразумеваемый мультипликатор')+'</div>';
    h+=mini(['Год','Рост','Выручка','EBITDA','EBIT','NOPAT','+ D&A','− CAPEX','− ΔNWC','FCFF','Коэф.','PV'],b.rows.map(function(r){return [r.y,p1(r.gr),money(r.R),money(r.eb),money(r.ebit),money(r.nop),money(r.d),money(r.c),money(r.dn),'<b>'+money(r.f)+'</b>',nf(r.df,3),money(r.pv)]}));
    var ws=[-0.02,-0.01,0,0.01,0.02],gs=[-0.01,-0.005,0,0.005,0.01];
    h+='<h3 style="margin:18px 0 6px;font:600 16px var(--sans)">Цена акции: WACC (строки) × g (столбцы)</h3>'+mini(['WACC \\ g'].concat(gs.map(function(d){return p1(g+d)})),ws.map(function(dw){return ['<b>'+p1(w+dw)+'</b>'].concat(gs.map(function(dg){var x=run(w+dw,g+dg);var s=x?nf(x.px,1):'—';return (dw===0&&dg===0)?'<b>'+s+'</b>':s}))}));
    return h+'<p class="note">Рост выручки плавно меняется от года 1 к году 5. Оборотный капитал — % выручки, в поток идёт его изменение. Терминальная стоимость — по Гордону от FCFF 5-го года. Логика — глава «DCF».</p>';
  }},
 {id:'lbo',t:'LBO: доходность фонда',s:'Покупка в долг → погашение → выход → IRR и MoM',
  f:[['e','EBITDA при покупке',100],['em','Мультипликатор входа EV/EBITDA',8],['dp','Доля долга в цене, %',60],['ir','Ставка по долгу, %',14],['gr','Рост EBITDA в год, %',6],['cv','Конверсия EBITDA в поток до процентов, %',50],['t','Налог, %',25],['n','Лет до выхода',5],['xm','Мультипликатор выхода',8]],
  c:function(v){
    var e=num(v.e),em=num(v.em),dp=num(v.dp)/100,ir=num(v.ir)/100,gr=num(v.gr)/100,cv=num(v.cv)/100,t=num(v.t)/100,n=Math.round(num(v.n)),xm=num(v.xm);
    if([e,em,dp,ir,gr,cv,t,n,xm].some(isNaN)||n<1||n>15)return '<p class="note">Заполни поля (срок 1–15 лет).</p>';
    var ev=e*em,D=ev*dp,E0=ev-D,eb=e,rows=[],cash=0;
    for(var y=1;y<=n;y++){eb*=1+gr;var it=D*ir,fcf=eb*cv-it*(1-t),pay=Math.min(D,Math.max(fcf,0));D-=pay;if(fcf>pay)cash+=fcf-pay;if(fcf<0)D-=fcf;rows.push([y,money(eb),money(it),money(fcf),money(pay),money(D)])}
    var xev=eb*xm,eq=xev-D+cash,mom=eq/E0,irr=Math.pow(Math.max(mom,0),1/n)-1;
    var gE=(eb-e)*em,gM=(xm-em)*eb,gD=(ev*dp-D)+cash;
    return '<div class="tiles">'+tile('Цена входа (EV)',money(ev),'долг '+money(ev*dp)+' · капитал фонда '+money(E0))+tile('EV на выходе',money(xev),'EBITDA '+money(eb)+' × '+nf(xm,1))+tile('Капитал на выходе',money(eq),'EV − долг + накопленный кэш')+
      tile('MoM','<b>'+nf(mom,2)+'×</b>','во сколько раз выросли деньги')+tile('IRR','<b>'+p1(irr)+'</b>',irr>=0.2?'типичная цель фондов 20–25%':'ниже типичной цели 20–25%')+'</div>'+
      '<div class="tiles" style="margin-top:10px">'+tile('Рост EBITDA дал',money(gE),'ΔEBITDA × мультипликатор входа')+tile('Рост мультипликатора дал',money(gM),'Δмультипликатор × EBITDA выхода')+tile('Погашение долга дало',money(gD),'снижение долга + кэш')+'</div>'+
      mini(['Год','EBITDA','Проценты','Поток после %','Погашение','Долг на конец'],rows)+'<p class="note">Упрощение: весь свободный поток идёт на погашение долга, комиссии не учтены. Логика — глава «M&A и LBO».</p>';
  }},
 {id:'acc',t:'Accretion / Dilution',s:'Как покупка изменит прибыль на акцию покупателя',
  f:[['ni','Чистая прибыль покупателя',200],['sh','Акций покупателя',100],['px','Цена акции покупателя',30],['tni','Чистая прибыль цели',30],['pp','Цена покупки капитала цели',360],['st','Оплата акциями, %',100],['kd','Ставка нового долга, %',14],['t','Налог, %',25],['syn','Синергии до налога',0]],
  c:function(v){
    var ni=num(v.ni),sh=num(v.sh),px=num(v.px),tni=num(v.tni),pp=num(v.pp),st=num(v.st)/100,kd=num(v.kd)/100,t=num(v.t)/100,syn=num(v.syn)||0;
    if([ni,sh,px,tni,pp,st,kd,t].some(isNaN)||sh<=0||px<=0)return '<p class="note">Заполни поля.</p>';
    var ns=pp*st/px,debt=pp*(1-st),int=debt*kd*(1-t),pni=ni+tni+syn*(1-t)-int,e0=ni/sh,e1=pni/(sh+ns),ch=e1/e0-1;
    var be=((e0*(sh+ns))-(ni+tni-int))/(1-t);
    return '<div class="tiles">'+tile('EPS до',nf(e0,3),'P/E покупателя '+nf(px/e0,1)+'×')+tile('EPS после',nf(e1,3),'новых акций '+money(ns)+' · новый долг '+money(debt))+
      tile('Изменение EPS','<span class="'+(ch>=0?'up':'down')+'">'+(ch>=0?'+':'')+p1(ch)+'</span>',ch>=0?'accretive (рост)':'dilutive (размытие)')+
      tile('Уплаченный P/E цели',nf(pp/tni,1)+'×','сравни с P/E покупателя')+tile('Синергии для безубыточности',be>0?money(be):'не нужны','до налога, чтобы EPS не упал')+'</div>'+
      '<p class="note">Правило: при оплате акциями сделка увеличивает EPS, если P/E покупателя выше уплаченного P/E цели; при оплате долгом — если доходность прибыли цели (1/P/E) выше ставки долга после налога. Рост EPS ≠ создание стоимости.</p>';
  }}
];
var CV={};
function calcVals(c){if(!CV[c.id]){var s=null;try{s=JSON.parse(localStorage.getItem('calc:'+c.id)||'null')}catch(e){}CV[c.id]=s||{};c.f.forEach(function(f){if(CV[c.id][f[0]]===undefined)CV[c.id][f[0]]=f[2]})}return CV[c.id]}
var calcCur='npv';
function renderCalc(id){
  var c=CALCS.filter(function(x){return x.id===id})[0]||CALCS[0];calcCur=c.id;var v=calcVals(c);
  var h='<nav class="sub">'+CALCS.map(function(x){return '<a class="chip'+(x.id===c.id?' on':'')+'" href="#calc/'+x.id+'">'+esc(x.t)+'</a>'}).join('')+'</nav>'+
    '<div class="sect"><h2>'+esc(c.t)+'</h2><p class="note" style="margin-top:0">'+esc(c.s)+'</p><div class="box calc"><div class="bf cf">'+
    c.f.map(function(f){return '<label class="'+(f[3]?'wide':'')+'">'+esc(f[1])+'<input data-cv="'+f[0]+'" inputmode="'+(f[3]?'text':'decimal')+'" value="'+esc(v[f[0]])+'"></label>'}).join('')+
    '</div><button type="button" class="chip" data-creset style="margin-top:8px">Сбросить</button><div id="c-out" style="margin-top:14px">'+c.c(v)+'</div></div></div>';
  view.innerHTML=h;
}
view.addEventListener('input',function(e){var k=e.target.getAttribute('data-cv');if(!k)return;var c=CALCS.filter(function(x){return x.id===calcCur})[0];CV[c.id][k]=e.target.value;try{localStorage.setItem('calc:'+c.id,JSON.stringify(CV[c.id]))}catch(err){}var o=document.getElementById('c-out');if(o)o.innerHTML=c.c(CV[c.id])});
view.addEventListener('click',function(e){if(!e.target.closest('[data-creset]'))return;var c=CALCS.filter(function(x){return x.id===calcCur})[0];CV[c.id]=null;try{localStorage.removeItem('calc:'+c.id)}catch(err){}renderCalc(c.id)});

/* ---------------- роутинг ---------------- */
var state='',LASTCARD='';
function route(){
  var h=decodeURIComponent(location.hash.slice(1)),p=h.split('/');
  var sec=p[0]==='markets'?'markets':p[0]==='calc'?'calc':'learn';
  document.querySelectorAll('#sw a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===sec)});
  state=sec;
  var bk=document.getElementById('b-back'),inCh=sec==='learn'&&CH.some(function(x){return x.id===p[1]});
  bk.setAttribute('href',sec==='markets'?(p[1]==='idx'?'#markets':p[1]&&p[1]!=='summary'?(p[2]?'#markets/'+p[1]:'#markets'):'#learn'):sec==='calc'?'#learn':(inCh?'#learn':'./'));bk.setAttribute('aria-label',(sec==='learn'&&!inCh)?'Все разделы':'Назад');
  if(sec==='markets'){
    cur=SUBS.some(function(s){return s[0]===p[1]})?p[1]:'summary';store('fin:sub',cur);
    CARD.tic=(cur==='ru'&&p[2])?p[2].toUpperCase():null;ASSET={kind:null,id:null};var ck=p[2]?p[1]+'/'+p[2]:'';if(ck&&ck!==LASTCARD&&!/^(ev-|[0-9a-f]{10}$)/.test(p[2]))CARD.range='1m';if(ck&&p[1]!=='news')LASTCARD=ck;if(p[2]&&(p[1]==='us'||p[1]==='crypto'||p[1]==='idx')){if(p[1]==='idx')cur='summary';openAsset(p[1]==='crypto'?'cr':p[1],p[2].toUpperCase())}NEWSID=(cur==='news'&&p[2])?p[2]:null;if(CARD.tic){PC.d=null;NLIM=12;Promise.all([loadCandles(CARD.tic,CARD.range),loadDivs(CARD.tic),loadNews(),loadEN(enFile('ru',CARD.tic))]).then(function(){drawMarkets(true)})}
    drawMarkets(true);refresh();startTimer();document.title='Рынки · Финансы';
  }else if(sec==='calc'){
    clearInterval(timer);renderCalc(p[1]);document.title='Калькуляторы · Финансы';
  }else{
    clearInterval(timer);
    var c=CH.filter(function(x){return x.id===p[1]})[0];
    if(c){renderChapter(c);document.title=c.title+' · Финансы';store('fin:last',c.id)}else{renderLearn();document.title='Финансы'}
  }
}
window.addEventListener('hashchange',function(){window.scrollTo(0,0);route();if(!Q)return;});
route();
})();
