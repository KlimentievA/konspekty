<script type="application/json" id="fdata">{"chapters":[{"id":"ib","title":"Инвестбанкинг: как всё устроено","short":"Что делает IB, роли, продукты, с чего начать","md":"> **Суть.** Инвестбанк помогает компаниям привлекать деньги (акции, облигации, кредиты) и совершать сделки (покупка, продажа, слияние). Почти всё, что делает аналитик, сводится к одному вопросу: **сколько стоит компания и почему**.\n\n## Направления (продукты)\n\n| Направление | Что делает | Главные инструменты аналитика |\n|---|---|---|\n| **M&A** (слияния и поглощения) | Продажа/покупка компаний, слияния, защита от поглощения | DCF, мультипликаторы, сделки-аналоги, accretion/dilution, синергии |\n| **ECM** (рынок акций) | IPO, SPO (вторичное размещение), ABB (ускоренный букбилдинг) | Мультипликаторы, дисконт к IPO, книга заявок |\n| **DCM** (долговой рынок) | Облигации, еврооблигации, секьюритизация | Кредитные метрики (ND/EBITDA, ICR), спред к ОФЗ/UST, рейтинги |\n| **LevFin** (финансирование с плечом) | Кредиты под LBO, high-yield облигации | Модель LBO, ковенанты, debt capacity |\n| **Restructuring** | Реструктуризация долга проблемных компаний | Ликвидационная стоимость, waterfall кредиторов |\n| **Coverage** (отраслевые группы) | Отношения с клиентами в секторе: нефтегаз, металлы, TMT, FIG | Отраслевые мультипликаторы и KPI |\n\nРядом с IB работают: **Sales & Trading** (торговля бумагами), **Equity Research** (аналитика акций, целевые цены), **Private Equity** (фонды, покупающие компании), **Corporate Finance** внутри компаний и **Big4 Valuation / TS** (оценка и due diligence в консалтинге).\n\n## Роли и что от тебя ждут\n\n| Уровень | Чем занят |\n|---|---|\n| **Analyst** (1–3 года) | Модели в Excel, презентации (питчбуки), сбор данных, мультипликаторы |\n| **Associate** | Проверяет модели аналитиков, ведёт рабочие потоки сделки |\n| **VP / Director** | Управляет сделкой, общается с клиентом |\n| **MD** (Managing Director) | Приводит клиентов и мандаты, отвечает за выручку |\n\nТехнический минимум аналитика:\n1. Читать **три формы отчётности** и понимать их связь.\n2. Строить **DCF** (FCFF → WACC → terminal value → EV → equity value).\n3. Делать **таблицу мультипликаторов** (comps) и подбирать сопоставимые компании.\n4. Понимать **LBO** на уровне «откуда IRR фонда».\n5. Знать, **какой метод к какому сектору подходит** (банки не оценивают по EV/EBITDA!).\n6. Быстро считать в уме: проценты, сложные проценты, правило 72.\n\n## Типичная сделка M&A (продажа компании, sell-side)\n\n1. **Мандат**: банк подписывает договор с продавцом (engagement letter), фиксируется комиссия (retainer + success fee, обычно 1–3% от сделки).\n2. **Подготовка**: финансовая модель, **тизер** (1–2 страницы без названия компании), **CIM / Information Memorandum** (подробный меморандум), список покупателей (long list → short list).\n3. **NDA**: покупатели подписывают соглашение о конфиденциальности и получают CIM.\n4. **NBO** (Non-Binding Offer): необязывающие предложения с ценой-диапазоном.\n5. **Due diligence**: покупатели проверяют компанию в **VDR** (виртуальной комнате данных): финансы, налоги, юристы, техника.\n6. **BO** (Binding Offer) + переговоры по **SPA** (договору купли-продажи).\n7. **Signing → Closing**: подписание, согласования (ФАС, правкомиссия по иностранным инвестициям), закрытие и оплата.\n\n> **Buy-side** (на стороне покупателя): то же самое наоборот. Ищем цель, оцениваем, считаем синергии и влияние на EPS покупателя, готовим предложение.\n\n## С чего начать учить (порядок)\n\n1. **Бухучёт и отчётность**: без этого ничего не понятно.\n2. **Временная стоимость денег**: NPV, IRR, дисконтирование.\n3. **Стоимость капитала**: CAPM, WACC.\n4. **DCF**: собрать всё вместе.\n5. **Мультипликаторы**: быстрая проверка DCF рынком.\n6. **Отраслевая специфика**: банки, нефть, IT и т.д.\n7. **M&A и LBO**.\n8. Вопросы с собеседований: прогоняй их вслух.\n"},{"id":"otchetnost","title":"Отчётность: P&L, баланс, cash flow","short":"Три формы, EBITDA, EBIT, FCF, оборотный капитал","md":"> **Суть.** У компании три отчёта: **P&L** (прибыль за период), **баланс** (что есть на дату) и **cash flow** (куда реально ушли деньги). Прибыль и деньги — разные вещи: можно быть прибыльным и обанкротиться.\n\n## 1. Отчёт о прибылях и убытках (P&L, Income Statement, ОПиУ)\n\n| Строка | Англ. | Что это |\n|---|---|---|\n| Выручка | Revenue, Sales | Продажи без НДС |\n| − Себестоимость | COGS | Прямые затраты на продукт |\n| **= Валовая прибыль** | **Gross Profit** | |\n| − Коммерческие и управленческие | SG&A, OPEX | Офис, зарплаты, маркетинг |\n| **= EBITDA** | Earnings Before Interest, Taxes, Depreciation & Amortization | Операционная прибыль «до амортизации» |\n| − Амортизация | D&A | Износ ОС (D) и НМА (A) |\n| **= EBIT** (≈ операционная прибыль) | Operating Income | |\n| − Проценты (нетто) | Net Interest Expense | Плата за долг |\n| **= EBT** (прибыль до налога) | Pre-tax Income | |\n| − Налог на прибыль | Income Tax | В РФ 25% с 2025 года |\n| **= Чистая прибыль** | **Net Income** | Достаётся акционерам |\n\n```f\nEBITDA = EBIT + D&A\nEBIT   = Выручка − Себестоимость − OPEX − D&A\nЧистая прибыль = (EBIT − Проценты) × (1 − t)\nEPS = Чистая прибыль / Число акций\n```\n\n### EBITDA, EBIT: зачем столько?\n\n- **EBITDA** — прокси операционного денежного потока. Не зависит от структуры капитала (до процентов), налогов и амортизационной политики. Поэтому её удобно сравнивать между компаниями → **EV/EBITDA**, **Net debt/EBITDA**.\n- **EBIT** учитывает износ активов. Для капиталоёмких отраслей (металлургия, нефть, телеком) честнее EBITDA: оборудование реально придётся менять.\n- **Adjusted EBITDA** — EBITDA, очищенная от разовых статей (обесценения, штрафы, продажа активов). Менеджмент любит «добавлять» лишнее: всегда проверяй корректировки.\n- **OIBDA** — то же, что EBITDA, но считается от операционной прибыли (без прочих доходов/расходов).\n- **EBITDAR** — EBITDA до аренды (Rent). Для авиакомпаний, ритейла.\n\n> **Ловушка МСФО (IFRS) 16.** С 2019 года аренда отражается как актив + обязательство, а платёж разбивается на амортизацию и процент. Итог: **EBITDA растёт**, а **долг тоже растёт** (появляются арендные обязательства). Сравнивая компании, следи, чтобы EBITDA и долг были посчитаны одинаково (оба с арендой или оба без).\n\n> **Почему EBITDA не подходит банкам.** У банка проценты — это и есть выручка и себестоимость (процентный доход и процентный расход). Убрав проценты, ты уберёшь сам бизнес. Поэтому для банков EBITDA, EV и EV/EBITDA бессмысленны.\n\n### Маржи\n\n```f\nВаловая маржа   = Валовая прибыль / Выручка\nEBITDA-маржа    = EBITDA / Выручка\nEBIT-маржа      = EBIT / Выручка\nЧистая маржа    = Чистая прибыль / Выручка\n```\n\n## 2. Баланс (Balance Sheet)\n\n```f\nАктивы = Обязательства + Собственный капитал\n```\n\n| Активы | Пассивы |\n|---|---|\n| **Внеоборотные**: ОС (PP&E), НМА, гудвил, финвложения, право пользования (аренда) | **Собственный капитал**: уставный, нераспределённая прибыль, доли меньшинства (NCI) |\n| **Оборотные**: запасы, дебиторка (AR), денежные средства | **Долгосрочные**: кредиты, облигации, аренда |\n| | **Краткосрочные**: кредиторка (AP), краткосрочный долг |\n\n- **Гудвил** = цена покупки − справедливая стоимость чистых активов купленной компании. Не амортизируется (МСФО), но тестируется на обесценение.\n- **Доли меньшинства (NCI, minority interest)**: часть дочек, которая принадлежит не нам. Важна в мосте EV → Equity.\n\n## 3. Отчёт о движении денежных средств (Cash Flow Statement)\n\n| Раздел | Что внутри |\n|---|---|\n| **CFO** операционный | Чистая прибыль + амортизация ± изменение оборотного капитала ± неденежные статьи |\n| **CFI** инвестиционный | − CAPEX, покупка/продажа компаний и активов |\n| **CFF** финансовый | ± долг, − дивиденды, − байбэк, + эмиссия |\n\n```f\nИзменение денег = CFO + CFI + CFF\n```\n\n### Как три отчёта связаны (классический вопрос!)\n\n*«Амортизация выросла на 10. Что произойдёт с тремя отчётами?» (налог 25%)*\n- **P&L**: EBIT −10 → налог −2,5 → чистая прибыль **−7,5**.\n- **Cash flow**: прибыль −7,5, но амортизация (неденежная) +10 → CFO **+2,5** (налоговая экономия).\n- **Баланс**: ОС −10, деньги +2,5 → активы −7,5; нераспределённая прибыль −7,5 → пассивы −7,5. Сходится.\n\n## 4. Оборотный капитал (Working Capital)\n\n```f\nNWC = Запасы + Дебиторка − Кредиторка        (операционный, без денег и долга)\nΔNWC > 0  →  деньги «заморожены», FCF меньше\n```\n\nЧерез оборачиваемость (как в твоей домашке):\n```f\nДебиторка  = Выручка × DSO / 365      (DSO — дни оборота дебиторки)\nЗапасы     = Себестоимость × DIO / 365\nКредиторка = Себестоимость × DPO / 365\nЦикл денежных средств (CCC) = DSO + DIO − DPO\n```\n\n## 5. Свободный денежный поток (FCF)\n\n```f\nFCFF (для всех инвесторов) = EBIT × (1 − t) + D&A − CAPEX − ΔNWC\nFCFE (для акционеров)      = FCFF − Проценты × (1 − t) + Чистое привлечение долга\n                           = Чистая прибыль + D&A − CAPEX − ΔNWC + Чистый долг привлечённый\n```\n\n- **FCFF** дисконтируют по **WACC** → получаешь **EV** (стоимость бизнеса).\n- **FCFE** дисконтируют по **Ke** (стоимости собственного капитала) → сразу **Equity Value**.\n- **NOPAT** = EBIT × (1 − t) — операционная прибыль после налога, «как будто долга нет».\n\n## 6. МСФО, РСБУ, US GAAP\n\n| | МСФО (IFRS) | РСБУ | US GAAP |\n|---|---|---|---|\n| Где | РФ (публичные компании), Европа, большинство стран | Обязательна в РФ для всех юрлиц, база для налогов | США |\n| Уровень | Консолидированная группа | Отдельное юрлицо | Консолидированная группа |\n| Для оценки | **Основной источник** | Дивиденды часто считаются от РСБУ/МСФО по див. политике; полезна для дочек | Основной для американских компаний |\n\n> **Практика.** Для оценки бери **консолидированную МСФО**. РСБУ материнской компании может сильно отличаться (например, сюда приходят дивиденды от дочек).\n"},{"id":"npv-irr","title":"Деньги во времени: NPV, IRR, окупаемость","short":"Дисконтирование, аннуитеты, NPV, IRR, payback","md":"> **Суть.** Рубль сегодня дороже рубля завтра: его можно положить под процент, а инфляция и риск съедают будущие деньги. Поэтому будущие потоки **дисконтируют**: приводят к сегодняшнему дню по ставке r.\n\n## Базовые формулы\n\n```f\nFV = PV × (1 + r)^n                 — будущая стоимость\nPV = FV / (1 + r)^n                 — приведённая (текущая) стоимость\nDF = 1 / (1 + r)^t                  — коэффициент дисконтирования\n```\n\n**Пример.** 1 000 ₽ через 3 года при r = 15%: PV = 1 000 / 1,15³ = 1 000 / 1,521 = **657 ₽**.\n\n### Аннуитет и перпетуитет\n\n```f\nАннуитет (C каждый год, n лет):   PV = C × [1 − (1 + r)^−n] / r\nПерпетуитет (вечно, без роста):   PV = C / r\nПерпетуитет с ростом g (Гордон):  PV = C₁ / (r − g)       (только если r > g!)\n```\n\nВажно: в формуле Гордона в числителе стоит поток **следующего** года: C₁ = C₀ × (1 + g).\n\n### Номинальные и реальные ставки (Фишер)\n\n```f\n(1 + r_ном) = (1 + r_реал) × (1 + π)\nr_реал ≈ r_ном − π                   (для небольших значений)\n```\n\nПравило: **номинальные потоки дисконтируй по номинальной ставке, реальные по реальной**. Смешивать нельзя.\n\n### Правило 72\n\nДеньги удваиваются примерно за **72 / (ставка в %)** лет. При 12% это ~6 лет, при 16% ~4,5 года.\n\n## Критерии инвестиционных решений\n\n### NPV — чистая приведённая стоимость\n\n```f\nNPV = Σ CFₜ / (1 + r)^t  − I₀        (t = 1…n)\n```\n\n- **NPV > 0** → проект создаёт стоимость (принимаем).\n- **NPV < 0** → разрушает стоимость.\n- NPV показывает, **на сколько рублей сегодня** проект делает компанию дороже.\n- NPV **аддитивен**: NPV(A + B) = NPV(A) + NPV(B). Поэтому это главный критерий.\n\n### IRR — внутренняя норма доходности\n\nСтавка, при которой NPV = 0:\n```f\n0 = Σ CFₜ / (1 + IRR)^t  − I₀\n```\n\n- **IRR > WACC** → проект выгоден.\n- Считается подбором (в Excel `ВСД` / `IRR`, для неравных дат `ЧИСТВНДОХ` / `XIRR`).\n\n**Недостатки IRR (любят спрашивать):**\n1. **Несколько IRR**, если знак потоков меняется больше одного раза (например, затраты на рекультивацию в конце проекта в горной добыче).\n2. **Масштаб**: IRR 50% на 1 млн хуже, чем IRR 20% на 1 млрд. При выборе из взаимоисключающих проектов смотри на NPV.\n3. **Предположение о реинвестировании** промежуточных потоков по ставке IRR (нереалистично при высоких IRR). Решение — **MIRR**:\n```f\nMIRR = (FV положительных потоков по ставке реинвестирования / PV затрат по ставке финансирования)^(1/n) − 1\n```\n\n### Срок окупаемости (Payback)\n\n- **Простой**: через сколько лет накопленный поток станет ≥ 0.\n- **Дисконтированный**: то же, но по дисконтированным потокам (всегда дольше простого).\n```f\nPayback = (последний год с отрицательной накопленной суммой) + |накопленная сумма в этом году| / поток следующего года\n```\nМинус: игнорирует всё, что после окупаемости.\n\n### PI — индекс прибыльности\n\n```f\nPI = PV будущих потоков / I₀          (PI > 1 ⇔ NPV > 0)\n```\nПолезен при **ограниченном бюджете** (capital rationing): ранжируй проекты по PI.\n\n## Mid-year convention (дисконтирование середины года)\n\nПотоки приходят **в течение года**, а не 31 декабря. Поэтому период дисконтирования берут **t − 0,5**: 0,5; 1,5; 2,5… Это повышает стоимость примерно на (1 + r)^0,5. В твоей домашке по «Project Black» это использовалось именно так.\n\n## Пример расчёта (на пальцах)\n\nИнвестиция 1 000, потоки 300 / 400 / 500 / 300, ставка 12%.\n\n| Год | Поток | DF = 1/1,12^t | PV |\n|---|---|---|---|\n| 0 | −1 000 | 1,000 | −1 000 |\n| 1 | 300 | 0,893 | 268 |\n| 2 | 400 | 0,797 | 319 |\n| 3 | 500 | 0,712 | 356 |\n| 4 | 300 | 0,636 | 191 |\n| | | **NPV** | **+133** |\n\nIRR ≈ 18,0% (> 12% → принимаем). Простой payback: после 2-го года накоплено −300, в 3-й год +500 → **2,6 года**.\n"},{"id":"wacc","title":"Стоимость капитала: CAPM и WACC","short":"Rf, бета, ERP, Ke, Kd, WACC, перевод ставки в другую валюту","md":"> **Суть.** Ставка дисконтирования — это **доходность, которую требуют инвесторы** за риск вложиться именно в эту компанию. Акционеры требуют **Ke**, кредиторы **Kd**. Средневзвешенное значение — **WACC**.\n\n## CAPM: стоимость собственного капитала\n\n```f\nKe = Rf + β × ERP  (+ CRP + премия за размер + специфический риск)\n```\n\n| Элемент | Что это | Где брать |\n|---|---|---|\n| **Rf** безрисковая ставка | Доходность госбумаг в **той же валюте**, что и потоки, срок ≈ горизонт оценки | РФ: КБД ОФЗ 10 лет (cbr.ru). США: UST 10Y (FRED: DGS10) |\n| **β** бета | Чувствительность акции к рынку. β = 1 как рынок, β > 1 рискованнее | Регрессия доходностей акции к индексу (2–5 лет), или средняя бета аналогов |\n| **ERP** премия за риск рынка | Сколько рынок акций платит сверх Rf | Дамодаран (implied ERP), исследования брокеров |\n| **CRP** страновая премия | Доп. риск страны (если ERP взята по зрелому рынку, например США) | Дамодаран: Country Risk Premium |\n| **Size premium** | Небольшие компании рискованнее | Kroll (ранее Duff & Phelps), обычно 1–5% |\n\n```f\nβ = Cov(Rакции, Rрынка) / Var(Rрынка)\n```\n\n### Ориентиры на октябрь 2026\n\n| Показатель | Значение | Дата и источник |\n|---|---|---|\n| ОФЗ 10 лет (КБД) | **16,64%** | 12.10.2026, ЦБ РФ |\n| ОФЗ 1 год (КБД) | 13,69% | 12.10.2026, ЦБ РФ |\n| Ключевая ставка | **14,00%** | решение 11.09.2026; следующее 23.10.2026 |\n| UST 10Y | **5,22%** | 08.10.2026, FRED |\n| Implied ERP США (Дамодаран) | **3,70%** | 30.09.2026 |\n| Стоимость акционерного капитала рынка РФ (БКС) | ~23% (безриск 14%) | стратегия на IV кв. 2026 |\n\n> Кривая ОФЗ сейчас **растущая** (1 год 13,7% → 10 лет 16,6%): рынок закладывает инфляционные и бюджетные риски на длинном горизонте.\n\n## Бета: рычаговая и безрычаговая (Hamada)\n\nБета аналога содержит **его** долговую нагрузку. Чтобы применить её к нашей компании, нужно «снять» долг аналога и «надеть» наш:\n\n```f\nβU (unlevered, бета активов) = βL / [1 + (1 − t) × D/E]\nβL (levered, наша)           = βU × [1 + (1 − t) × D/E_наша]\n```\n\nПорядок: взять βL нескольких аналогов → посчитать их βU → медиана → перевести в βL по **целевой** структуре капитала компании.\n\n## Стоимость долга\n\n```f\nKd до налога  = Rf + кредитный спред       (или YTM облигаций компании, или ставка по кредитам)\nKd после налога = Kd × (1 − t)              (проценты уменьшают налог: «налоговый щит»)\n```\nВ РФ ставка налога на прибыль **25%** (с 2025 г.). Есть ограничения на вычет процентов (правила тонкой капитализации, контролируемая задолженность).\n\n## WACC\n\n```f\nWACC = E/(D+E) × Ke + D/(D+E) × Kd × (1 − t)\n```\n\n- **D и E по рыночной стоимости**, а не по балансу (E = капитализация).\n- Лучше брать **целевую** структуру капитала (среднюю по отрасли или долгосрочную), а не текущую.\n- Если в модели есть привилегированные акции, у них своя доля и ставка.\n\n### Пример (условная российская компания, в рублях)\n\nДопущения для примера: Rf = 16,6%, βL = 1,0, ERP = 7%, Kd = 18%, t = 25%, D/(D+E) = 30%.\n\n```f\nKe   = 16,6% + 1,0 × 7% = 23,6%\nKd×(1−t) = 18% × 0,75 = 13,5%\nWACC = 0,7 × 23,6% + 0,3 × 13,5% = 16,5% + 4,05% ≈ 20,6%\n```\n\n## Перевод ставки из валюты в валюту\n\nCAPM часто считают в долларах (американская ERP, бета к S&P). Если потоки в рублях, ставку надо перевести через **паритет инфляций**:\n\n```f\nK_RUB = (1 + K_USD) × (1 + π_RUB) / (1 + π_USD) − 1\n```\n\nПример: K_USD = 12%, π_RUB = 6%, π_USD = 2,5% → K_RUB = 1,12 × 1,06 / 1,025 − 1 = **15,8%**. В домашке «Project Black» Ke пересчитывался именно так.\n\n## Почему WACC не подходит банкам\n\nУ банка долг (депозиты, облигации) — это **сырьё**, а не способ финансирования. Отделить «операционный» поток от «финансового» нельзя. Поэтому банки оценивают **через собственный капитал**: дисконтируют дивиденды или FCFE по **Ke**, а не FCFF по WACC.\n\n## Частые ошибки\n\n1. Rf в рублях + ERP и бета в долларах без перевода.\n2. Балансовые веса вместо рыночных.\n3. Забыли (1 − t) у долга.\n4. Бета аналогов без пересчёта на нашу долговую нагрузку.\n5. WACC ≤ g в терминальной стоимости: формула Гордона взрывается.\n"},{"id":"dcf","title":"DCF: оценка по дисконтированным потокам","short":"Прогноз FCFF, терминальная стоимость, мост EV → Equity","md":"> **Суть.** Компания стоит столько, сколько денег она принесёт в будущем, приведённых к сегодняшнему дню. DCF — **внутренняя (фундаментальная)** оценка: она не зависит от того, что рынок думает сегодня.\n\n## Шаги DCF\n\n1. **Прогноз** выручки, маржи, CAPEX, оборотного капитала на 5–10 лет (пока бизнес не выйдет на «стабильное» состояние).\n2. **FCFF** по годам:\n```f\nFCFF = EBIT × (1 − t) + D&A − CAPEX − ΔNWC\n```\n3. **WACC** (см. раздел «Стоимость капитала»).\n4. **Терминальная стоимость (TV)**: стоимость всех потоков после прогнозного периода.\n5. **Дисконтирование** потоков и TV → **Enterprise Value (EV)**.\n6. **Мост EV → Equity Value** → стоимость на акцию.\n7. **Чувствительность**: WACC × g, цена сырья, курс.\n\n## Терминальная стоимость\n\n### Метод Гордона (perpetuity growth)\n\n```f\nTV_n = FCFF_(n+1) / (WACC − g) = FCFF_n × (1 + g) / (WACC − g)\nPV(TV) = TV_n / (1 + WACC)^n\n```\n\n- **g** — долгосрочный рост, **не выше номинального роста ВВП** (для РФ в рублях ориентир ~ целевая инфляция 4% + реальный рост 1–2%; для США в долларах 2–3%).\n- TV обычно даёт **60–80% стоимости**. Если больше 85% — прогноз слишком короткий или g завышен.\n\n### Метод мультипликатора выхода (exit multiple)\n\n```f\nTV_n = EBITDA_n × (EV/EBITDA)\n```\nПлюс: опирается на рынок. Минус: превращает DCF в наполовину сравнительную оценку. Хорошая практика — **посчитать обоими** и проверить: какой g «зашит» в мультипликаторе, и наоборот.\n\n```f\nПодразумеваемый g = (TV × WACC − FCFF_n) / (TV + FCFF_n)\n```\n\n### Для добывающих компаний\n\nРудник/месторождение **конечно**: TV не нужен. Модель строят до конца отработки запасов (life of mine), в конце ставят затраты на закрытие и рекультивацию. Так устроен твой «Project Black».\n\n## Мост EV → Equity Value\n\n```f\nEquity Value = EV\n             − Чистый долг (долг − денежные средства)\n             − Арендные обязательства (если EBITDA посчитана до аренды, по МСФО 16)\n             − Привилегированные акции\n             − Доли меньшинства (NCI)\n             − Пенсионные обязательства, резервы под рекультивацию (долгоподобные)\n             + Ассоциированные компании и финвложения (не попавшие в EBITDA)\nЦена акции = Equity Value / Число акций (разводнённое: + опционы, конвертируемые)\n```\n\n**Почему NCI вычитаем?** EBITDA консолидирована на 100% дочек, хотя нам принадлежит меньше. Убираем чужую долю.\n**Почему ассоциированные прибавляем?** Их прибыль не попадает в EBITDA (учитывается одной строкой ниже), значит, их стоимость не сидит в EV.\n\n## Пример\n\nПрогноз FCFF (млрд ₽): 10 / 12 / 13 / 14 / 15. WACC = 18%, g = 5%, чистый долг 20 млрд, 1 млрд акций.\n\n| Год | FCFF | DF при 18% | PV |\n|---|---|---|---|\n| 1 | 10 | 0,847 | 8,5 |\n| 2 | 12 | 0,718 | 8,6 |\n| 3 | 13 | 0,609 | 7,9 |\n| 4 | 14 | 0,516 | 7,2 |\n| 5 | 15 | 0,437 | 6,6 |\n| | | **Сумма PV** | **38,8** |\n\n```f\nTV₅ = 15 × 1,05 / (0,18 − 0,05) = 121,2\nPV(TV) = 121,2 × 0,437 = 53,0\nEV = 38,8 + 53,0 ≈ 91,7 млрд ₽\nEquity = 91,7 − 20 = 71,7 млрд ₽  →  71,7 ₽ на акцию\nДоля TV в EV = 58%\n```\n\n## Таблица чувствительности\n\nВсегда показывают сетку **WACC × g** (или WACC × exit multiple). В Excel: «Анализ “что если” → Таблица данных» (как в домашке; там расчёт таблиц включается клавишей **F9**).\n\n## Чек-лист проверки DCF\n\n- Рост выручки и маржи реалистичны по сравнению с историей и отраслью?\n- CAPEX в стабильном году ≥ амортизации (иначе компания «проедает» активы)?\n- В терминальном году рост g согласован с реинвестициями: **g = ROIC × доля реинвестирования**.\n- Ставка и потоки в одной валюте, обе номинальные (или обе реальные).\n- Налоговые убытки прошлых лет (в РФ убыток прошлых лет уменьшает базу не более чем на 50% в год; срок действия ограничения продлевается законом, проверяй ст. 283 НК РФ).\n- Сверка с мультипликаторами: какой EV/EBITDA получился? Не безумный ли?\n\n## Варианты DCF\n\n| Метод | Поток | Ставка | Результат | Когда |\n|---|---|---|---|---|\n| **FCFF / WACC** | До долга | WACC | EV | Стандарт для нефинансовых компаний |\n| **FCFE / Ke** | После долга | Ke | Equity | Банки, страховые, компании с меняющимся долгом |\n| **DDM** | Дивиденды | Ke | Equity | Банки, стабильные дивидендные компании |\n| **APV** | FCFF без долга + PV налогового щита | Ku (без долга) + Kd | EV | LBO, меняющийся долг |\n"},{"id":"multiplikatory","title":"Сравнительная оценка: мультипликаторы","short":"P/E, EV/EBITDA, P/B, EV/Sales, comps, сделки-аналоги","md":"> **Суть.** Похожие компании должны стоить похоже. Берём, сколько рынок платит за рубль прибыли (EBITDA, выручки, капитала) у аналогов, и применяем к нашей компании. Это **относительная** оценка: она быстрая и рыночная, но если весь рынок переоценён, переоценена будет и наша компания.\n\n## EV и Equity Value\n\n```f\nEquity Value (капитализация) = Цена акции × Число акций\nEV = Equity Value + Долг − Денежные средства + Префы + Доли меньшинства (+ аренда) − Ассоциированные\n```\n\n**Главное правило согласованности:**\n- Показатель **до процентов** (выручка, EBITDA, EBIT) относится ко **всем** инвесторам → делим **EV**.\n- Показатель **после процентов** (чистая прибыль, балансовый капитал, дивиденды) относится к **акционерам** → делим **Equity Value**.\n- **P/EBITDA** или **EV/Чистая прибыль** — ошибка!\n\n## Основные мультипликаторы\n\n| Мультипликатор | Формула | Когда использовать | Минусы |\n|---|---|---|---|\n| **P/E** | Капитализация / Чистая прибыль (= Цена / EPS) | Стабильно прибыльные компании, банки | Зависит от долга, разовых статей; бессмыслен при убытке |\n| **EV/EBITDA** | EV / EBITDA | Главный для нефинансовых компаний | Игнорирует CAPEX; не для банков |\n| **EV/EBIT** | EV / EBIT | Капиталоёмкие отрасли | Зависит от амортизационной политики |\n| **EV/Sales** (EV/Revenue) | EV / Выручка | Убыточные растущие компании, SaaS, стартапы | Не видит маржу |\n| **P/B** (P/BV) | Капитализация / Собственный капитал | **Банки, страховые**, холдинги | Бессмыслен при отрицательном капитале |\n| **P/S** | Капитализация / Выручка | Ритейл, e-commerce | Смешивает акционеров и долг |\n| **P/FCF** | Капитализация / FCFE | Зрелые компании | Волатилен из-за CAPEX |\n| **PEG** | (P/E) / Рост EPS в % | Растущие компании | Зависит от прогноза роста |\n| **Div. yield** | DPS / Цена | Дивидендные истории (РФ!) | Не учитывает рост |\n| **EV/EBITDAR** | (EV + аренда×8 или по МСФО 16) / EBITDAR | Авиакомпании, ритейл | |\n\n**Отраслевые (натуральные):** EV/запасы (нефть: EV/boe), EV/добыча, EV/абонент (телеком), EV/МВт (энергетика), EV/тонна мощности (металлургия, цемент), P/FFO и P/NAV (REIT, девелопмент), EV/DAU/MAU (интернет), EV/ARR (SaaS).\n\n## LTM, NTM, календаризация\n\n- **LTM / TTM** (Last/Trailing Twelve Months): последние 12 месяцев = последний год + текущий YTD − прошлый YTD.\n```f\nLTM = FY₂₀₂₅ + 1П₂₀₂₆ − 1П₂₀₂₅\n```\n- **NTM / Forward**: прогноз на следующие 12 месяцев (консенсус аналитиков).\n- **Календаризация**: если у компаний разные финансовые годы (Apple заканчивает год в сентябре), приводим к одному периоду.\n\n## Как сделать comps (таблицу аналогов)\n\n1. **Подобрать аналоги**: та же отрасль, бизнес-модель, география, размер, рост, маржа. 5–10 компаний.\n2. **Собрать данные**: цена, число акций (разводнённое), долг, кэш, NCI, LTM и прогнозные показатели.\n3. **Почистить** от разовых статей.\n4. Посчитать мультипликаторы → **медиана и квартили** (среднее искажают выбросы).\n5. Применить к нашей компании → **диапазон** стоимости, а не одна точка.\n6. Объяснить, почему наша компания должна стоить выше или ниже медианы (рост, маржа, риск).\n\n### Пример\n\nEBITDA нашей компании 50 млрд ₽, чистый долг 80 млрд, 2 млрд акций. Медиана EV/EBITDA аналогов **4,5×** (диапазон 4,0–5,0×).\n```f\nEV = 50 × 4,5 = 225 млрд ₽\nEquity = 225 − 80 = 145 млрд ₽  →  72,5 ₽ на акцию\nДиапазон: EV 200–250 → Equity 120–170 → 60–85 ₽\n```\n\n## Сделки-аналоги (precedent transactions)\n\nТо же, но мультипликаторы берут **по прошлым сделкам M&A** в отрасли. Они обычно **выше рыночных**, потому что включают **премию за контроль** (обычно 20–40% к рыночной цене) и синергии. Минусы: мало сделок, старые данные, другая рыночная конъюнктура.\n\n## Почему мультипликаторы различаются\n\nИз модели Гордона:\n```f\nP/E (вперёд) = Доля выплат / (Ke − g)\nEV/EBITDA растёт при: ↑ росте g, ↑ ROIC, ↓ WACC, ↓ доле CAPEX\nP/B = (ROE − g) / (Ke − g)        → банк с ROE > Ke торгуется P/B > 1\n```\n\nЭто объясняет, почему у американских IT P/E 30–40×, а у российских компаний 3–8×: в РФ **Ke ~23%** (ставки высокие, страновой риск, санкции, ограниченный доступ иностранцев), а в США безриск ~5% и ERP ~3,7%.\n\n## Ориентиры по рынкам (октябрь 2026)\n\n| Рынок | P/E | Комментарий |\n|---|---|---|\n| Россия, медиана 127 компаний | **7,0×** | fin-vista, 13.10.2026; EV/EBITDA нефинансовых 5,2× |\n| Россия, индекс IMOEX (оценка БКС) | ~3,8–4,3× | БКС: среднее с 2023 года 4,3× |\n| S&P 500, trailing | **26,6×** | multpl, 12.10.2026 (историческое среднее 16,2×) |\n| S&P 500, forward | **19,1×** | FactSet, 09.10.2026 |\n| Shiller CAPE S&P 500 | **41,9×** | 09.10.2026; рекорд 44,2× в декабре 1999 |\n\nПодробные таблицы по компаниям и секторам: вкладка **«Рынки»**.\n\n## Ловушки\n\n- **Отрицательный капитал** (X5, МТС, HeadHunter в РФ из-за дивидендов/байбэков; Mastercard P/B 93×) → P/B неинформативен.\n- **Низкий P/E ≠ дешево.** У Газпрома P/E ~1,7× при нулевых дивидендах и долге 6 трлн ₽: акционеры не получают прибыль.\n- **Высокий P/E ≠ дорого.** Если прибыль временно упала (Лукойл: P/E за 2025 год 44× из-за провала годовой прибыли, а по LTM уже ~9,5×).\n- **Разные стандарты** (МСФО и US GAAP), разные определения EBITDA.\n- Мультипликатор Berkshire Hathaway скачет: по US GAAP переоценка портфеля акций проходит через прибыль.\n"},{"id":"metody","title":"Другие методы оценки","short":"DDM, EVA, RI, NAV, SOTP, затратный, реальные опционы","md":"> **Суть.** Три большие группы подходов: **доходный** (DCF, DDM, EVA, RI: стоимость из будущих доходов), **сравнительный** (мультипликаторы, сделки) и **затратный** (сколько стоят активы). В российской оценочной практике (ФСО) эти три подхода называются так же.\n\n## Модель дисконтирования дивидендов (DDM)\n\n```f\nP₀ = Σ DPSₜ / (1 + Ke)^t\nМодель Гордона:  P₀ = DPS₁ / (Ke − g)\ng = ROE × (1 − Payout)       — устойчивый рост за счёт реинвестиций\n```\n\n**Где применять:** банки, страховые, коммунальные компании, стабильные дивидендные истории (в РФ: Сбер, МТС, Транснефть, генерация).\n**Пример:** Сбер, дивиденд за 2025 год 37,64 ₽. Если Ke = 22%, g = 6%: P = 37,64 × 1,06 / (0,22 − 0,06) ≈ **249 ₽** (иллюстрация, а не рекомендация; при цене около 287 ₽ рынок закладывает меньший Ke или больший g).\n\nМногостадийная DDM: высокий рост несколько лет → стабильный рост (Гордон в конце).\n\n## EVA (Economic Value Added, экономическая добавленная стоимость)\n\nМетодика Stern Stewart. Компания создаёт стоимость, только если зарабатывает **больше**, чем стоит её капитал.\n\n```f\nEVA = NOPAT − WACC × Инвестированный капитал\n    = (ROIC − WACC) × Инвестированный капитал\nNOPAT = EBIT × (1 − t)\nИнвестированный капитал (IC) = Собств. капитал + Чистый долг   (= NWC + Основные средства + НМА)\nROIC = NOPAT / IC\n```\n\n**MVA (Market Value Added)**, рыночная добавленная стоимость:\n```f\nMVA = Рыночная стоимость капитала − Инвестированный капитал = Σ PV(будущих EVA)\nСтоимость компании = IC₀ + Σ EVAₜ / (1 + WACC)^t\n```\nКорректно сделанная EVA-оценка **даёт тот же результат, что DCF**: это просто другая раскладка тех же денег.\n\n**Зачем:** оценка эффективности менеджмента и подразделений, бонусы привязывают к EVA.\n\n**Почему EVA не подходит банкам:** у банка нельзя разумно определить «инвестированный капитал» и WACC: долг является операционным ресурсом. Для банков используют аналог: **RI (residual income) на собственный капитал** или **RAROC**.\n\n## Модель остаточной прибыли (Residual Income, RI, модель Эдвардса–Белла–Ольсона)\n\nАналог EVA, но на уровне **акционеров**:\n```f\nRIₜ = Чистая прибыльₜ − Ke × Собств. капиталₜ₋₁ = (ROE − Ke) × BVₜ₋₁\nEquity Value = BV₀ + Σ RIₜ / (1 + Ke)^t\n```\n**Где:** **банки и страховые** (балансовая стоимость у них близка к рыночной, большая часть стоимости в капитале), компании без дивидендов.\n\n## NAV (Net Asset Value, стоимость чистых активов)\n\n```f\nNAV = Рыночная стоимость активов − Обязательства\n```\n**Где:** недвижимость и REIT (активы переоценены по рынку), инвестиционные холдинги (АФК «Система»), фонды, добыча (NAV = сумма DCF по каждому месторождению или руднику), ликвидация.\nХолдинги часто торгуются с **дисконтом к NAV** (20–50%): двойные издержки, корпоративное управление, неликвидность.\n\n## SOTP (Sum of the Parts, оценка по частям)\n\nКаждый сегмент оцениваем своим методом и мультипликатором, затем складываем:\n```f\nEV = Σ EVсегмента − Корпоративные расходы (капитализированные) ;  Equity = EV − Чистый долг ...\n```\n**Где:** конгломераты (Яндекс: поиск, такси, e-com, финтех), холдинги, нефтяники (добыча + переработка).\n\n## Затратный подход\n\n- **Балансовая стоимость** (book value).\n- **Скорректированные чистые активы**: переоценка каждого актива по рынку.\n- **Стоимость замещения**: сколько стоит построить такой же бизнес с нуля. Отсюда **Q Тобина** = рыночная стоимость / стоимость замещения.\n- **Ликвидационная стоимость**: активы при быстрой продаже минус обязательства. Нижняя граница стоимости, нужна при банкротстве и реструктуризации.\n\n## Реальные опционы\n\nПраво (но не обязанность) расширить проект, отложить его или закрыть. Оценка через модель Блэка–Шоулза или биномиальное дерево. **Где:** биотех (этапы клинических испытаний), разведка месторождений, R&D, стартапы.\n\n## Стартапы и венчур\n\nУ стартапа нет прибыли и истории, поэтому DCF с одной ставкой не работает:\n- **Метод венчурного капитала (VC method):**\n```f\nPost-money = Exit value / (Целевой мультипликатор возврата, например 10×)\nPre-money  = Post-money − Инвестиции\nДоля инвестора = Инвестиции / Post-money\n```\n- Мультипликаторы раундов (EV/ARR, EV/GMV), метод Беркуса, scorecard, First Chicago (взвешенные сценарии).\n\n## Сводка подходов: «футбольное поле» (football field)\n\nВ питчбуке результаты всех методов показывают горизонтальными полосами диапазонов (DCF, comps, сделки, 52-недельный диапазон цены, целевые цены аналитиков). Пересечение полос — разумный диапазон цены.\n"},{"id":"sektory","title":"Какой метод к какому сектору","short":"Банки, страховые, нефтегаз, IT, ритейл, REIT, стартапы","md":"> **Суть.** Метод выбирают по тому, **где у бизнеса создаются деньги** и **что такое долг** для этого бизнеса. Главная граница проходит между **финансовыми** компаниями (банки, страховые) и **всеми остальными**.\n\n## Матрица применимости\n\n✅ основной · ➖ вспомогательный · ❌ не применяется\n\n| Сектор | DCF (FCFF/WACC) | FCFE / DDM | EV/EBITDA | P/E | P/B | EVA | NAV | Специфические |\n|---|---|---|---|---|---|---|---|---|\n| **Банки** | ❌ | ✅ DDM, RI | ❌ | ✅ | ✅ | ❌ (RI вместо) | ➖ | P/B vs ROE, ROE − Ke, CET1/Н1 |\n| **Страховые** | ❌ | ✅ | ❌ | ✅ | ✅ | ❌ | ➖ | P/EV (embedded value), combined ratio |\n| **Брокеры, биржи** | ➖ | ✅ | ➖ | ✅ | ➖ | ➖ | ❌ | P/E, ДД (Мосбиржа, СПБ) |\n| **Нефтегаз** | ✅ | ➖ | ✅ | ✅ | ➖ | ✅ | ✅ (по запасам) | EV/boe запасов, EV/добыча, цены нефти и Urals-дисконт |\n| **Металлы, добыча** | ✅ (life of mine) | ➖ | ✅ | ➖ | ➖ | ✅ | ✅ | P/NAV, EV/т мощностей, цена сырья |\n| **Энергетика, сети** | ✅ | ✅ DDM | ✅ | ✅ | ✅ (RAB) | ✅ | ➖ | RAB (регулируемая база), EV/МВт |\n| **Телеком** | ✅ | ✅ | ✅ | ✅ | ❌ | ✅ | ❌ | EV/абонент, ARPU, CAPEX/выручка |\n| **IT, интернет** | ✅ | ➖ | ✅ | ✅ | ❌ | ➖ | ❌ | EV/Sales, PEG, правило 40, LTV/CAC |\n| **SaaS / рост** | ✅ (долгий прогноз) | ❌ | ➖ | ➖ | ❌ | ❌ | ❌ | EV/ARR, EV/NTM Sales, NRR |\n| **Ритейл** | ✅ | ➖ | ✅ (до/после МСФО 16!) | ✅ | ❌ | ✅ | ❌ | LFL продажи, EV/EBITDAR, P/S |\n| **Девелопмент, REIT** | ➖ | ✅ (AFFO) | ➖ | ➖ | ✅ | ❌ | ✅ | P/FFO, P/NAV, cap rate |\n| **Холдинги, конгломераты** | ➖ | ➖ | ➖ | ➖ | ✅ | ❌ | ✅ | SOTP, дисконт к NAV |\n| **Биотех, фарма в R&D** | ✅ rNPV | ❌ | ❌ | ❌ | ❌ | ❌ | ➖ | rNPV (взвешивание по вероятности фаз), реальные опционы |\n| **Стартапы** | ❌/➖ | ❌ | ❌ | ❌ | ❌ | ❌ | ❌ | VC method, раунды, EV/GMV |\n| **Циклические** (сталь, химия) | ✅ по циклу | ➖ | ✅ на нормализованной EBITDA | ➖ | ✅ на дне цикла | ✅ | ➖ | Нормализация середины цикла |\n\n## Почему банки «особенные» (самое частое на собесе)\n\n1. **Долг = сырьё.** Депозиты и облигации банк превращает в кредиты. Поэтому нельзя отделить операционную деятельность от финансирования → нет смысла в **EV**, **FCFF**, **WACC**.\n2. **Проценты = выручка.** Процентный доход и расход являются ядром бизнеса → **EBITDA** не имеет смысла.\n3. **Капитал регулируется.** Банк обязан держать норматив достаточности капитала (в РФ Н1.0, Н1.1, Н1.2; в мире CET1, Tier 1 по Базелю III). Свободный поток акционерам = прибыль минус то, что нужно оставить для роста капитала.\n4. **Баланс почти весь по рынку** (финансовые активы) → **P/B** информативен.\n5. **EVA не применяется** по той же причине, что и WACC: «инвестированный капитал» и «стоимость долга» для банка не определены. Вместо этого используют **residual income** на капитал (ROE − Ke).\n\n```f\nСправедливый P/B = (ROE − g) / (Ke − g)\nПример: ROE 24%, Ke 22%, g 6%  →  P/B = 18/16 ≈ 1,13×\n```\nСбер торгуется около **0,76× P/B** при ROE 24% (smart-lab, LTM, октябрь 2026). Значит, рынок закладывает **Ke выше** ~22% или ждёт снижения ROE.\n\n**Ключевые KPI банка:** NIM (чистая процентная маржа), CIR (cost-to-income), CoR (стоимость риска), NPL (доля проблемных кредитов), ROE, Н1/CET1, LDR (кредиты/депозиты).\n\n## Страховые компании\n\n- **Embedded Value (EV в страховании, не путать с enterprise value!)** = чистые активы + стоимость портфеля действующих полисов (VIF). Мультипликатор **P/EV**.\n- Для non-life (имущественное): **combined ratio** = (убытки + расходы) / премии. Меньше 100% → прибыль на андеррайтинге.\n- По МСФО 17 (с 2023) отчётность страховщиков сильно изменилась, есть **CSM** (contractual service margin, будущая прибыль по договорам).\n\n## Нефтегаз и добыча\n\n- Стоимость = запасы × цена × маржа. DCF по **каждому активу** (месторождение, рудник) с конечным сроком → **NAV**.\n- Чувствительность к **цене сырья** и **курсу** первична. В РФ важны дисконт Urals к Brent, НДПИ, демпфер, экспортные пошлины.\n- Мультипликаторы: EV/EBITDA, EV/запасы (2P, boe), EV/добыча (баррель в сутки).\n\n## IT и интернет\n\n- Быстро растущие компании могут быть убыточны → **EV/Sales**, EV/Gross Profit.\n- SaaS: **ARR**, NRR (удержание выручки), **правило 40** (рост % + FCF-маржа % ≥ 40), LTV/CAC ≥ 3.\n- DCF с длинным прогнозом (10+ лет), пока рост не замедлится.\n\n## Девелопмент и REIT\n\n- **FFO** = чистая прибыль + амортизация недвижимости − прибыль от продажи объектов. AFFO = FFO − поддерживающий CAPEX.\n- **Cap rate** = NOI / Стоимость объекта → стоимость = NOI / cap rate.\n- Девелоперы в РФ (ПИК, Самолёт, ЛСР, Эталон): NAV проектов, P/B, важны проектное финансирование и эскроу-счета.\n\n## Циклические компании\n\nНе применяй мультипликатор к пиковой или провальной прибыли. Используй **нормализованную** EBITDA (среднюю за цикл). На **пике цикла P/E выглядит низким** (прибыль огромная), на **дне высоким**.\n"},{"id":"koeffitsienty","title":"Финансовые коэффициенты","short":"ROE, ROIC, DuPont, долговая нагрузка, ликвидность","md":"> **Суть.** Коэффициенты помогают быстро понять, **насколько бизнес прибылен, устойчив и эффективен**, и сравнить его с аналогами.\n\n## Рентабельность\n\n| Показатель | Формула | Смысл |\n|---|---|---|\n| **ROE** | Чистая прибыль / Средний собств. капитал | Доходность акционеров |\n| **ROA** | Чистая прибыль / Средние активы | Эффективность всех активов (для банков норма 1–3%) |\n| **ROIC** | NOPAT / Инвестированный капитал | Доходность бизнеса на весь вложенный капитал. **ROIC > WACC → создаётся стоимость** |\n| **ROCE** | EBIT / (Активы − Краткоср. обязательства) | Похоже на ROIC, до налога |\n\n### Формула DuPont\n\n```f\nROE = Чистая маржа × Оборачиваемость активов × Финансовый рычаг\n    = (ЧП / Выручка) × (Выручка / Активы) × (Активы / Капитал)\n```\nПоказывает, **откуда** высокий ROE: от маржи (люкс), оборачиваемости (ритейл) или долга (банки).\n\n## Долговая нагрузка\n\n| Показатель | Формула | Ориентир |\n|---|---|---|\n| **Net Debt / EBITDA** | (Долг − Кэш) / EBITDA | < 1,5× комфортно; 2–3× умеренно; > 3,5× высоко (в РФ при ставках 14–20% критичнее) |\n| **Interest Coverage (ICR)** | EBIT / Процентные расходы (или EBITDA / %) | > 3–5× хорошо; < 1,5× тревожно |\n| **Debt / Equity** | Долг / Собственный капитал | Зависит от отрасли |\n| **Debt / Capital** | D / (D + E) | Для WACC |\n| **DSCR** | (EBITDA − налоги − CAPEX) / (Проценты + Погашения) | Проектное финансирование: > 1,2–1,3× |\n\n**Ковенанты** — условия в кредитных договорах и облигациях (например, ND/EBITDA ≤ 3,0×). Нарушение даёт кредитору право потребовать досрочное погашение.\n\n## Ликвидность\n\n```f\nТекущая ликвидность (Current ratio) = Оборотные активы / Краткосрочные обязательства     (~1,5–2)\nБыстрая ликвидность (Quick ratio)   = (Оборотные активы − Запасы) / Краткоср. обязательства  (~1)\nАбсолютная ликвидность              = Денежные средства / Краткоср. обязательства\n```\n\n## Оборачиваемость\n\n```f\nDSO (дни дебиторки)  = Дебиторка / Выручка × 365\nDIO (дни запасов)    = Запасы / Себестоимость × 365\nDPO (дни кредиторки) = Кредиторка / Себестоимость × 365\nCCC (денежный цикл)  = DSO + DIO − DPO\nОборачиваемость активов = Выручка / Активы\n```\nX5 и Магнит в РФ, Walmart в США работают с **отрицательным** оборотным капиталом: платят поставщикам позже, чем получают деньги от покупателей.\n\n## Для акционеров\n\n```f\nEPS = (Чистая прибыль − Дивиденды по префам) / Средневзв. число акций\nDPS = Дивиденды / Число акций\nPayout ratio = Дивиденды / Чистая прибыль\nДивидендная доходность = DPS / Цена\nTotal Shareholder Return (TSR) = (P₁ − P₀ + DPS) / P₀\n```\n\n## Банки\n\n| KPI | Формула | Ориентир |\n|---|---|---|\n| **NIM** | Чистый процентный доход / Средние процентные активы | 4–6% в РФ |\n| **CIR** | Операционные расходы / Операционные доходы | < 40% отлично |\n| **CoR** | Резервы за период / Средний кредитный портфель | 1–2% нормально |\n| **NPL** | Проблемные кредиты (90+ дней) / Портфель | |\n| **Н1.0 / CET1** | Капитал / Активы, взвешенные по риску | Регуляторные минимумы плюс надбавки |\n"},{"id":"ma-lbo","title":"M&A и LBO","short":"Премия, синергии, accretion/dilution, модель LBO","md":"> **Суть.** В M&A покупатель платит **рыночную цену + премию** и надеется вернуть её **синергиями**. В LBO фонд покупает компанию **в основном в долг**, гасит долг из потоков компании и продаёт её дороже. Доход фонда зависит от рычага.\n\n## Цена сделки\n\n```f\nЦена предложения = Рыночная цена × (1 + Премия за контроль)\nПремия = Цена предложения / Цена до объявления (обычно 1 день, 30 дней VWAP) − 1\nEV сделки = Equity по цене предложения + Чистый долг + NCI ...\n```\nТипичная премия за контроль составляет **20–40%**.\n\n## Синергии\n\n| Тип | Примеры | Вероятность |\n|---|---|---|\n| **Затратные (cost)** | Сокращение дублирующих офисов, закупки, IT | Выше, легче реализовать |\n| **Выручки (revenue)** | Кросс-продажи, новые рынки | Ниже, часто не достигаются |\n| **Финансовые** | Дешевле долг, налоговые убытки | Средняя |\n\n```f\nСтоимость синергий = PV(синергий после налога) − Затраты на интеграцию\nСделка создаёт стоимость для покупателя, если: Стоимость синергий > Уплаченная премия\n```\n\n## Accretion / Dilution (рост или размытие EPS)\n\nПокупатель смотрит, **вырастет ли его прибыль на акцию** после сделки.\n\n```f\nEPS после сделки = (ЧП покупателя + ЧП цели + Синергии×(1−t) − Проценты по новому долгу×(1−t) − Потерянный доход на кэш×(1−t)) / (Акции покупателя + Новые акции)\n```\n\n**Быстрые правила:**\n- **Оплата акциями**: сделка увеличивает EPS (accretive), если **P/E покупателя > P/E, уплаченного за цель**.\n- **Оплата деньгами/долгом**: accretive, если **доходность прибыли цели (1 / P/E уплаченного) > стоимости долга после налога**.\n\nПример: покупатель с P/E 15× покупает цель за 12× прибыли своими акциями → платит «дешёвой валютой» → **EPS растёт**. Но рост EPS ≠ создание стоимости: важно, окупаются ли премия и синергии.\n\n## Структура сделки\n\n- **Share deal** (покупка акций/долей) или **asset deal** (покупка активов).\n- **Locked box** (цена фиксируется по балансу на прошлую дату, утечка стоимости запрещена) или **completion accounts** (цена корректируется по закрытию на чистый долг и оборотный капитал).\n- **Earn-out**: часть цены зависит от будущих результатов.\n- **Защиты продавца/покупателя**: заверения (R&W), гарантии, MAC-оговорка, escrow.\n- В РФ: согласование **ФАС**; для иностранцев — **правкомиссия**; сделки с «недружественными» лицами требуют разрешения, при выходе иностранцев обязательный дисконт и «добровольный взнос» в бюджет.\n\n## LBO (Leveraged Buyout)\n\n**Логика:** фонд (PE) вносит 30–50% цены собственными деньгами, остальное — долг на компанию. Потоки компании гасят долг → доля фонда в EV растёт.\n\n### Три источника доходности\n1. **Рост EBITDA** (выручка, маржа).\n2. **Погашение долга** (deleveraging).\n3. **Рост мультипликатора** при выходе (multiple expansion): на него не рассчитывают в базовом сценарии.\n\n### Пример\n\nПокупка: EBITDA 100, мультипликатор 8× → **EV 800**. Долг 60% = 480, капитал фонда **320**.\nЧерез 5 лет: EBITDA 130, выход по тем же 8× → EV 1 040; долг погашен до 280.\n\n```f\nКапитал на выходе = 1 040 − 280 = 760\nMoM (MOIC) = 760 / 320 = 2,4×\nIRR = 2,375^(1/5) − 1 ≈ 18,9%\n```\n\n**Шпаргалка MoM → IRR за 5 лет:** 2× ≈ 15%, 2,5× ≈ 20%, 3× ≈ 25%. Целевой IRR фондов обычно **20–25%**.\n\n### Sources & Uses (источники и использование)\n\n| Uses (на что) | | Sources (откуда) | |\n|---|---|---|---|\n| Покупка капитала | 700 | Старший кредит (Term Loan A/B) | 350 |\n| Рефинансирование долга | 100 | Высокодоходные облигации / мезонин | 130 |\n| Комиссии | 20 | Капитал фонда (sponsor equity) | 340 |\n| **Итого** | **820** | **Итого** | **820** |\n\n### Хороший кандидат для LBO\nСтабильные денежные потоки, низкий CAPEX, мало долга сейчас, сильная рыночная позиция, понятные пути роста маржи, возможность выхода (продажа стратегу, IPO, другому фонду).\n\n### Долговые транши\n**Senior secured** (дешевле, обеспечен) → **second lien** → **mezzanine / high-yield** (дороже, может быть PIK, т.е. проценты капитализируются) → **equity**. При банкротстве платят сверху вниз (waterfall).\n"},{"id":"rynki-kapitala","title":"Рынки капитала: облигации, акции, деривативы, крипта","short":"YTM, дюрация, IPO, опционы, паритет ставок, криптоактивы","md":"## Облигации (DCM)\n\n```f\nЦена = Σ Купонₜ / (1 + YTM)^t + Номинал / (1 + YTM)^n\n```\n- **YTM** (доходность к погашению) — IRR облигации при покупке по текущей цене.\n- **Цена и доходность движутся в разные стороны**: ставки растут → облигации дешевеют.\n- **Текущая доходность** = Купон / Цена.\n- **Грязная цена** = чистая цена + **НКД** (накопленный купонный доход).\n\n**Пример.** 3 года, купон 10% раз в год, номинал 100, YTM 15%:\n```f\nЦена = 10/1,15 + 10/1,15² + 110/1,15³ = 88,58\n```\n\n### Дюрация и выпуклость\n\n```f\nДюрация Маколея  D = Σ t × PV(CFₜ) / Цена                 (средневзвешенный срок потоков, лет)\nМодиф. дюрация   MD = D / (1 + YTM)\nΔЦена / Цена ≈ −MD × Δy + ½ × Convexity × (Δy)²\n```\nДля примера выше: D = 2,72 года, MD = 2,36 → рост ставки на 1 п.п. снижает цену примерно на **2,4%**.\n\n### Спред и рейтинг\n- **Кредитный спред** = YTM корпоративной облигации − YTM госбумаги того же срока (G-spread к ОФЗ / UST).\n- Рейтинги: международные **S&P, Moody's, Fitch** (из РФ ушли в 2022); российские **АКРА, Эксперт РА, НКР, НРА**. Шкала: AAA … BBB− (инвестиционный уровень) / BB+ и ниже (спекулятивный, high yield).\n\n### Виды ОФЗ\n- **ОФЗ-ПД**: постоянный купон (классика, по ним строится КБД).\n- **ОФЗ-ПК**: плавающий купон (привязан к RUONIA), почти без процентного риска.\n- **ОФЗ-ИН**: номинал индексируется на инфляцию (защита от инфляции, аналог TIPS в США).\n\n## Акции (ECM)\n\n### IPO по шагам\n1. Выбор банков-организаторов (**букраннеры**, глобальные координаторы).\n2. Due diligence, проспект, оценка, **аналитические отчёты**.\n3. **Pre-marketing / pilot fishing**: встречи с якорными инвесторами.\n4. Объявление **ценового диапазона** → **роудшоу**.\n5. **Book-building** (сбор книги заявок) → цена размещения → аллокация.\n6. Начало торгов. **Стабилизация** (greenshoe: опцион на +15% акций для поддержки цены).\n7. **Lock-up**: запрет продавать акции акционерам до IPO (обычно 180 дней).\n\n- Обычно ставят **дисконт к IPO** 10–20% к справедливой стоимости, чтобы инвесторы заработали.\n- **Free float** — доля акций в свободном обращении. На Мосбирже от неё зависит уровень листинга и вес в индексе.\n- **SPO** — вторичное размещение уже публичной компании. **ABB** — ускоренный букбилдинг за 1–2 дня.\n- **Cash-in** (новые акции, деньги компании) vs **cash-out** (продают акционеры, деньги им).\n\n## Деривативы\n\n### Форвард / фьючерс\n\n```f\nF = S × (1 + r)^T                         (актив без доходов)\nF = S × (1 + r_внутр)^T / (1 + r_иностр)^T  (валюта: паритет процентных ставок)\n```\nПример: USD/RUB спот 84, ставка в рублях 14%, в долларах 4% → годовой форвард ≈ 84 × 1,14 / 1,04 ≈ **92,1**. Высокие рублёвые ставки = форвард выше спота (форвардные пункты).\n\n### Опционы\n\n| | Call (право купить) | Put (право продать) |\n|---|---|---|\n| Выплата покупателю | max(S − K, 0) | max(K − S, 0) |\n| Растёт стоимость при | ↑ S, ↑ σ, ↑ T, ↑ r | ↓ S, ↑ σ, ↑ T, ↓ r |\n\n**Паритет пут–колл:**\n```f\nC − P = S − K / (1 + r)^T\n```\n\n**Формула Блэка–Шоулза (европейский колл):**\n```f\nC = S × N(d₁) − K × e^(−rT) × N(d₂)\nd₁ = [ln(S/K) + (r + σ²/2) × T] / (σ × √T)\nd₂ = d₁ − σ × √T\n```\n\n**Греки:** Delta (∂C/∂S), Gamma (∂²C/∂S²), Vega (∂C/∂σ), Theta (∂C/∂t), Rho (∂C/∂r).\n\n**Свопы:** IRS (обмен фиксированной ставки на плавающую), валютные свопы (CCS), CDS (страховка от дефолта).\n\n## Валюта\n\n- **Паритет процентных ставок (покрытый)**: форвардный курс компенсирует разницу ставок (см. выше).\n- **Паритет покупательной способности (относительный)**: валюта страны с более высокой инфляцией обесценивается:\n```f\nКурс₁ = Курс₀ × (1 + π_RUB) / (1 + π_USD)\n```\n- Курсы ЦБ РФ на 13.10.2026: **USD 83,92 ₽**, **EUR 94,04 ₽**, **CNY 12,54 ₽**.\n\n## Криптоактивы\n\n| Понятие | Что это |\n|---|---|\n| **Bitcoin (BTC)** | Первая криптовалюта, эмиссия ограничена 21 млн монет, консенсус Proof-of-Work (майнинг), халвинг каждые ~4 года |\n| **Ethereum (ETH)** | Платформа смарт-контрактов, с 2022 года Proof-of-Stake (стейкинг) |\n| **Стейблкоины** (USDT, USDC) | Привязаны к доллару, обеспечены резервами эмитента |\n| **Market cap** | Цена × монеты в обращении. **FDV** = цена × максимальная эмиссия |\n| **Доминация BTC** | Доля BTC в капитализации всего крипторынка |\n| **DeFi** | Финансовые сервисы на смарт-контрактах (DEX, кредитование). **TVL** — заблокированные средства |\n| **Spot ETF на BTC/ETH** | Разрешены в США с 2024 года: биржевые фонды, держащие сами монеты |\n\n**Как оценивают:** у большинства токенов нет денежных потоков → нет DCF. Используют сетевые метрики (активные адреса, комиссии), **NVT** (капитализация / объём транзакций), **MVRV** (рыночная / «реализованная» капитализация), сравнение с золотом для BTC.\n\n**Риски:** волатильность (±50% за год — норма), регулирование, взломы бирж, депеги стейблкоинов.\n\n**Регулирование в РФ (2026):** закон «О цифровых валютах и цифровых правах» принят Госдумой в июле 2026, основные нормы действуют **с 1 сентября 2026**, переходный период для посредников до **1 июля 2027**. Неквалифицированные инвесторы: после теста, только самые ликвидные монеты, **до 300 тыс. ₽ в год** через одного посредника. Квалифицированные: после теста, без лимита (кроме анонимных монет). Сделки через брокеров, управляющих, биржи и обменники с лицензией. **Платить криптовалютой внутри России запрещено.**\n"},{"id":"rossiya","title":"Россия: ставки, налоги, специфика","short":"Ключевая ставка, ОФЗ, налоги 2026, особенности рынка","md":"## Ключевая ставка Банка России\n\n| С какой даты действует | Ставка |\n|---|---|\n| до 08.06.2025 | 21,00% |\n| 09.06.2025 | 20,00% |\n| 28.07.2025 | 18,00% |\n| 15.09.2025 | 17,00% |\n| 27.10.2025 | 16,50% |\n| 22.12.2025 | 16,00% |\n| 16.02.2026 | 15,50% |\n| 23.03.2026 | 15,00% |\n| 27.04.2026 | 14,50% |\n| 22.06.2026 | 14,25% |\n| **27.07.2026** | **14,00%** |\n\n- **11.09.2026** ставка сохранена на 14% (впервые за год без снижения). **Следующее заседание: 23.10.2026.**\n- Прогноз ЦБ: инфляция **6–7% в 2026 году**, возврат к цели **4% в 2027 году**.\n- Инфляция в сентябре 2026: **6,35% г/г** (Росстат). На 5 октября 7,1% из-за индексации тарифов ЖКХ с 1 октября.\n\n> **Почему это важно для оценки.** Ключевая ставка задаёт уровень всех ставок → Rf (ОФЗ) → Ke → WACC. Снижение ставки на 1 п.п. при прочих равных поднимает справедливую стоимость компаний; особенно сильно реагируют компании с большим долгом и длинной дюрацией (рост, девелоперы).\n\n## Кривая ОФЗ (КБД) на 12.10.2026\n\n| Срок | 1 год | 2 года | 3 года | 5 лет | 7 лет | 10 лет | 15 лет | 20 лет |\n|---|---|---|---|---|---|---|---|---|\n| Доходность | 13,69% | 15,20% | 15,93% | 16,45% | 16,57% | **16,64%** | 16,68% | 16,70% |\n\nИсточник: ЦБ РФ (cbr.ru/hd_base/zcyc_params).\n\n## Налоги для оценки (2026)\n\n| Налог | Ставка | Комментарий |\n|---|---|---|\n| **Налог на прибыль** | **25%** | С 01.01.2025 (было 20%). IT-компании — 5% |\n| **НДС** | **22%** | С 01.01.2026 (было 20%), льготная 10% сохранена. Федеральный закон № 425-ФЗ от 28.11.2025 |\n| НДС на УСН | Порог освобождения 20 млн ₽ (2025) → 15 млн (2026) → 10 млн (2027) | |\n| **НДФЛ** | 13% / 15% / 18% / 20% / 22% | Прогрессия с 2025: пороги 2,4 / 5 / 20 / 50 млн ₽ в год |\n| **Дивиденды физлицам** | 13% до 2,4 млн ₽, 15% сверх | |\n| Дивиденды между компаниями | 0% при владении ≥ 50% больше года, иначе 15% (с 2025) | Проверяй актуальную редакцию ст. 284 НК |\n| Страховые взносы | 30% в пределах базы, 15,1% сверх | IT: 15% / 7,6% |\n\n## Особенности российского рынка (с 2022 года)\n\n1. **Высокие ставки → низкие мультипликаторы.** Медиана P/E по рынку около **7×**, P/E индекса ниже 5× (оценки брокеров). Для сравнения, у S&P 500 около 26×.\n2. **Дивидендная культура.** Многие компании платят 50%+ прибыли (госкомпании по директиве обязаны 50% чистой прибыли по МСФО). ДД рынка: 7,2% за 2025 год, прогноз около 10% на 12 месяцев (БКС).\n3. **Доля частных инвесторов** на Мосбирже очень высокая (после ухода иностранцев), рынок эмоциональнее.\n4. **Санкции и ограничения:** заблокированные активы, запрет некоторых операций с «недружественными» нерезидентами, выход иностранцев с обязательным дисконтом.\n5. **Раскрытие отчётности** ограничено: многие компании публикуют сокращённую МСФО или не публикуют вовсе (Сургутнефтегаз не раскрывает МСФО).\n6. **Внутренние консолидации и редомициляция:** бывшие «иностранные» эмитенты (Яндекс, X5, Ozon, HeadHunter) переехали в российскую юрисдикцию, у многих после этого **отрицательный собственный капитал** из-за реорганизации и спецдивидендов.\n7. **Квалифицированный инвестор** — статус для доступа к сложным инструментам (иностранные бумаги, часть облигаций, криптовалюта без лимита).\n\n## Как в РФ строят ставку дисконтирования на практике\n\n- **Rf** — ОФЗ 10 лет (КБД) в рублях, сейчас около 16,6%.\n- **ERP** — брокеры и оценщики обычно закладывают **5–8%** в рублях (оценочно, единого стандарта нет).\n- Итоговая **Ke** крупных российских компаний в стратегиях брокеров около **20–25%** (БКС: 23% на IV кв. 2026).\n- Альтернатива — строить ставку в **долларах** (UST + ERP США + страновая премия России по Дамодарану) и пересчитывать в рубли через инфляции (см. «Стоимость капитала»).\n- Российская оценочная деятельность регулируется **ФЗ-135** и **Федеральными стандартами оценки (ФСО)**. Подходы: доходный, сравнительный, затратный.\n\n## Крупнейшие компании и индексы\n\n- **IMOEX** (индекс Мосбиржи, в рублях): **2 393,83** на 12.10.2026. **RTS** (в долларах): 898,65.\n- Крупнейшие по капитализации (октябрь 2026, smart-lab): Сбер (~6,5 трлн ₽), Лукойл (~4,1 трлн), Роснефть (~4,0 трлн), Новатэк (~3,3 трлн), Газпром нефть (~2,9 трлн), Газпром (~2,4 трлн).\n"},{"id":"sobesedovanie","title":"Вопросы с собеседований","short":"35 технических вопросов с ответами","md":"> Отвечай структурно: **короткий ответ → почему → пример**. Нажми на вопрос, чтобы увидеть ответ. Тренируйся вслух.\n\n### Отчётность\n\n<details class=\"qa\"><summary><span>1<\/span>Расскажи, как связаны три формы отчётности.<\/summary><div>\n\nЧистая прибыль из P&L — первая строка cash flow (CFO) и увеличивает нераспределённую прибыль в балансе. Cash flow показывает изменение денег, итог переходит в строку «денежные средства» баланса. CAPEX увеличивает ОС в балансе, амортизация уменьшает ОС и прибыль, но возвращается в CFO.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>2<\/span>Если бы ты мог взять только один отчёт, чтобы оценить компанию?<\/summary><div>\n\nCash flow: он показывает реальные деньги, его сложнее «нарисовать». Для понимания общей картины часто говорят «баланс + P&L», но классический ответ — cash flow.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>3<\/span>Амортизация выросла на 10 (налог 25%). Что с отчётами?<\/summary><div>\n\nP&L: чистая прибыль −7,5. CF: −7,5 + 10 = +2,5 денег. Баланс: ОС −10, деньги +2,5, капитал −7,5. Сходится.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>4<\/span>Компания купила оборудование за 100 в долг. Что происходит в момент покупки?<\/summary><div>\n\nP&L — ничего. CF: CAPEX −100 (CFI), долг +100 (CFF), деньги не изменились. Баланс: ОС +100, долг +100.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>5<\/span>Дебиторка выросла на 20. Как это влияет на деньги?<\/summary><div>\n\nДеньги −20: выручку признали, но оплату не получили. В CFO вычитаем рост дебиторки.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>6<\/span>Чем EBITDA отличается от операционного денежного потока?<\/summary><div>\n\nCFO учитывает изменение оборотного капитала, налоги и проценты (по МСФО проценты могут быть в CFO или CFF). EBITDA — до всего этого.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>7<\/span>Почему EBITDA критикуют?<\/summary><div>\n\nИгнорирует CAPEX, оборотный капитал, налоги; её легко «скорректировать». Баффет: «Неужели менеджмент думает, что зубная фея оплачивает CAPEX?»\n\n<\/div><\/details>\n\n\n### Оценка\n\n<details class=\"qa\"><summary><span>8<\/span>Какие основные методы оценки компании?<\/summary><div>\n\nDCF (внутренняя стоимость), мультипликаторы аналогов (trading comps), сделки-аналоги (precedent transactions). Дополнительно LBO-анализ (сколько может заплатить фонд), NAV/SOTP, DDM для банков.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>9<\/span>Какой метод даёт наибольшую стоимость?<\/summary><div>\n\nОбычно **сделки-аналоги** (премия за контроль и синергии). DCF может дать что угодно, он чувствителен к допущениям. Самая низкая — обычно LBO (ограничена требуемым IRR фонда).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>10<\/span>Пройди по шагам DCF.<\/summary><div>\n\nПрогноз FCFF на 5–10 лет → WACC → терминальная стоимость (Гордон или exit multiple) → дисконтирование → EV → минус чистый долг и т.д. → Equity Value → на акцию → чувствительность.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>11<\/span>Как посчитать FCFF из EBITDA?<\/summary><div>\n\nFCFF = EBITDA − Налог на EBIT − CAPEX − ΔNWC = EBIT×(1−t) + D&A − CAPEX − ΔNWC.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>12<\/span>Что больше влияет на DCF: ставка на 1 п.п. или рост выручки на 1 п.п.?<\/summary><div>\n\nКак правило, ставка (WACC): она влияет на все потоки и особенно на терминальную стоимость (знаменатель WACC − g).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>13<\/span>Почему терминальный рост не может быть выше роста экономики?<\/summary><div>\n\nИначе компания в бесконечности станет больше всей экономики.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>14<\/span>Как посчитать WACC?<\/summary><div>\n\nWACC = E/V × Ke + D/V × Kd × (1 − t), Ke по CAPM = Rf + β × ERP. Веса по рынку, лучше целевые.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>15<\/span>Что такое бета и как её пересчитать для частной компании?<\/summary><div>\n\nЧувствительность к рынку. Берём левериджные беты публичных аналогов → снимаем рычаг (βU = βL / [1 + (1 − t) D/E]) → медиана → надеваем рычаг целевой структуры компании.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>16<\/span>Почему Kd умножают на (1 − t), а Ke нет?<\/summary><div>\n\nПроценты уменьшают налогооблагаемую прибыль (налоговый щит). Дивиденды — нет.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>17<\/span>Что дороже: долг или собственный капитал? Почему тогда не финансироваться только долгом?<\/summary><div>\n\nКапитал дороже (акционеры несут больше риска). Но рост долга повышает риск банкротства, Ke и Kd, ограничивает гибкость (теорема Модильяни–Миллера с налогами и издержками банкротства → оптимальная структура).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>18<\/span>EV или Equity Value: чем отличаются? Что делить на что?<\/summary><div>\n\nEV — стоимость бизнеса для всех инвесторов, Equity — для акционеров. Выручку, EBITDA, EBIT делим на EV, прибыль и капитал — на Equity.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>19<\/span>Компания выпустила акций на 100 и положила деньги на счёт. Что с EV и Equity?<\/summary><div>\n\nEquity +100, кэш +100 → EV не изменился.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>20<\/span>Почему у двух одинаковых компаний может быть разный P/E, но одинаковый EV/EBITDA?<\/summary><div>\n\nРазная долговая нагрузка: проценты снижают прибыль, но не EBITDA.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>21<\/span>Как оценить банк? Почему не EV/EBITDA?<\/summary><div>\n\nP/B (с учётом ROE), P/E, DDM, residual income. Долг для банка операционный ресурс, проценты — выручка → EV и EBITDA бессмысленны.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>22<\/span>Можно ли применить EVA к банку?<\/summary><div>\n\nКлассическую EVA — нет: нельзя определить инвестированный капитал и WACC. Используют аналог: остаточную прибыль на собственный капитал (ROE − Ke) × капитал.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>23<\/span>Как оценить убыточный стартап?<\/summary><div>\n\nEV/Sales, EV/ARR, DCF с длинным прогнозом до выхода на прибыль, VC method, сравнение с раундами аналогов.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>24<\/span>Когда P/E отрицательный или очень большой, что делать?<\/summary><div>\n\nПерейти на EV/EBITDA или EV/Sales, использовать прогнозные (NTM) или нормализованные показатели.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>25<\/span>Что такое премия за контроль и почему она есть?<\/summary><div>\n\nПокупатель контрольного пакета получает право управлять потоками, назначать менеджмент, получать синергии. Обычно 20–40%.\n\n<\/div><\/details>\n\n\n### M&A и LBO\n\n<details class=\"qa\"><summary><span>26<\/span>Покупатель с P/E 20× покупает цель с P/E 15× за акции. Сделка accretive?<\/summary><div>\n\nДа (без учёта премии и синергий): покупатель платит более дорогими акциями за более дешёвую прибыль.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>27<\/span>Пройди по LBO-модели.<\/summary><div>\n\nЦена покупки и sources & uses → прогноз потоков → погашение долга → выход (EBITDA × мультипликатор) → капитал на выходе → IRR и MoM.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>28<\/span>Как поднять IRR в LBO?<\/summary><div>\n\nБольше долга, ниже цена входа, выше цена выхода, рост EBITDA, раньше выход, дивидендная рекапитализация.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>29<\/span>Что значит MoM 2× за 5 лет в IRR?<\/summary><div>\n\nОколо 15% (2^(1/5) − 1 = 14,9%).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>30<\/span>Что делает компанию хорошей целью для LBO?<\/summary><div>\n\nСтабильные потоки, низкий CAPEX, низкий текущий долг, сильная позиция на рынке, возможности роста маржи, понятный выход.\n\n<\/div><\/details>\n\n\n### Рынки и макро\n\n<details class=\"qa\"><summary><span>31<\/span>Ключевая ставка снизилась. Что с ОФЗ и акциями?<\/summary><div>\n\nДоходности падают → цены облигаций растут. Акции растут: ниже Rf → ниже Ke, плюс дешевле долг компаний.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>32<\/span>Что такое дюрация?<\/summary><div>\n\nСредневзвешенный срок получения потоков; модифицированная дюрация показывает, на сколько % изменится цена при изменении доходности на 1 п.п.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>33<\/span>Почему кривая доходности может быть инвертированной?<\/summary><div>\n\nРынок ждёт снижения ставок в будущем (часто перед рецессией или после жёсткого ужесточения политики). В РФ кривая была инвертирована при ставке 21% (2024–2025), сейчас растущая.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>34<\/span>Курс рубля ослаб. Кто выигрывает?<\/summary><div>\n\nЭкспортёры (нефть, газ, металлы, удобрения): выручка в валюте, затраты в рублях. Проигрывают импортёры и компании с валютным долгом.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>35<\/span>Дай мне идею для инвестиций.<\/summary><div>\n\nСтруктура: компания и тезис (1 предложение) → 2–3 драйвера → оценка (мультипликатор vs аналоги, DCF upside) → риски → катализатор. Обязательно знай текущие цифры (раздел «Рынки»).\n\n<\/div><\/details>\n\n"},{"id":"glossariy","title":"Глоссарий","short":"Термины и сокращения от A до Я","md":"| Термин | Расшифровка | Значение |\n|---|---|---|\n| **ABB** | Accelerated Bookbuilding | Быстрое (1–2 дня) размещение пакета акций среди институциональных инвесторов |\n| **Accretion / Dilution** | | Рост / снижение EPS покупателя после сделки |\n| **APV** | Adjusted Present Value | Стоимость без долга + PV налогового щита |\n| **ARPU** | Average Revenue Per User | Средняя выручка на пользователя (телеком, интернет) |\n| **ARR** | Annual Recurring Revenue | Годовая повторяющаяся выручка (SaaS) |\n| **Beta (β)** | | Чувствительность акции к рынку |\n| **Bookrunner** | | Банк, ведущий книгу заявок при размещении |\n| **CAGR** | Compound Annual Growth Rate | Среднегодовой темп роста: (Конец/Начало)^(1/n) − 1 |\n| **CAPEX** | Capital Expenditures | Капитальные затраты (покупка ОС) |\n| **CAPM** | Capital Asset Pricing Model | Модель: Ke = Rf + β × ERP |\n| **CET1** | Common Equity Tier 1 | Базовый капитал банка (Базель III) |\n| **CFO / CFI / CFF** | Cash Flow from Operating / Investing / Financing | Разделы отчёта о движении денег |\n| **CIM** | Confidential Information Memorandum | Подробный меморандум о продаваемой компании |\n| **CIR** | Cost-to-Income Ratio | Расходы / доходы банка |\n| **CoR** | Cost of Risk | Стоимость риска (резервы / кредиты) |\n| **CRP** | Country Risk Premium | Страновая премия за риск |\n| **D&A** | Depreciation & Amortization | Амортизация ОС и НМА |\n| **DCF** | Discounted Cash Flow | Оценка по дисконтированным денежным потокам |\n| **DCM** | Debt Capital Markets | Долговой рынок капитала |\n| **DDM** | Dividend Discount Model | Модель дисконтирования дивидендов |\n| **DPS** | Dividend Per Share | Дивиденд на акцию |\n| **DSO / DIO / DPO** | Days Sales / Inventory / Payables Outstanding | Дни оборота дебиторки / запасов / кредиторки |\n| **Due diligence (DD)** | | Комплексная проверка компании перед сделкой |\n| **EBIT** | Earnings Before Interest & Taxes | Операционная прибыль до процентов и налогов |\n| **EBITDA** | Earnings Before Interest, Taxes, D&A | Прибыль до процентов, налогов и амортизации |\n| **ECM** | Equity Capital Markets | Рынок акционерного капитала (IPO, SPO) |\n| **EPS** | Earnings Per Share | Прибыль на акцию |\n| **ERP** | Equity Risk Premium | Премия за риск вложений в акции |\n| **EV** | Enterprise Value | Стоимость бизнеса (капитал + чистый долг + …) |\n| **EVA** | Economic Value Added | (ROIC − WACC) × Инвестированный капитал |\n| **FCF / FCFF / FCFE** | Free Cash Flow (to Firm / to Equity) | Свободный денежный поток (всем инвесторам / акционерам) |\n| **FFO** | Funds From Operations | Денежная прибыль REIT |\n| **Free float** | | Доля акций в свободном обращении |\n| **Goodwill** | | Превышение цены покупки над справедливой стоимостью чистых активов |\n| **Greenshoe** | | Опцион организатора на доп. размещение (до 15%) для стабилизации цены |\n| **ICR** | Interest Coverage Ratio | Покрытие процентов (EBIT / проценты) |\n| **IFRS / МСФО** | International Financial Reporting Standards | Международные стандарты отчётности |\n| **IPO / SPO** | Initial / Secondary Public Offering | Первичное / вторичное публичное размещение |\n| **IRR** | Internal Rate of Return | Внутренняя норма доходности (ставка, при которой NPV = 0) |\n| **LBO** | Leveraged Buyout | Покупка компании преимущественно за счёт долга |\n| **Lock-up** | | Запрет продавать акции после IPO (обычно 180 дней) |\n| **LTM / TTM / NTM** | Last / Trailing / Next Twelve Months | Последние / следующие 12 месяцев |\n| **M&A** | Mergers & Acquisitions | Слияния и поглощения |\n| **MAC** | Material Adverse Change | Оговорка о существенном негативном изменении |\n| **MoM / MOIC** | Multiple of Money / Multiple on Invested Capital | Во сколько раз выросли вложения |\n| **MVA** | Market Value Added | Рыночная стоимость − инвестированный капитал |\n| **NAV** | Net Asset Value | Стоимость чистых активов |\n| **NBO / BO** | (Non-) Binding Offer | (Не)обязывающее предложение о покупке |\n| **NCI** | Non-Controlling Interest | Доли меньшинства |\n| **NDA** | Non-Disclosure Agreement | Соглашение о конфиденциальности |\n| **Net Debt** | | Чистый долг = Долг − Денежные средства |\n| **NIM** | Net Interest Margin | Чистая процентная маржа банка |\n| **NOPAT** | Net Operating Profit After Tax | EBIT × (1 − t) |\n| **NPL** | Non-Performing Loans | Проблемные кредиты |\n| **NPV** | Net Present Value | Чистая приведённая стоимость |\n| **NWC** | Net Working Capital | Чистый оборотный капитал |\n| **OPEX** | Operating Expenses | Операционные расходы |\n| **P/B, P/E, P/S** | Price to Book / Earnings / Sales | Мультипликаторы капитализации |\n| **Payback** | | Срок окупаемости |\n| **PE (Private Equity)** | | Фонды прямых инвестиций |\n| **PEG** | P/E to Growth | P/E, делённый на темп роста EPS |\n| **PI** | Profitability Index | PV потоков / инвестиции |\n| **PIK** | Payment-in-Kind | Проценты, которые капитализируются в долг вместо выплаты |\n| **RAB** | Regulatory Asset Base | Регулируемая база активов (сети, инфраструктура) |\n| **Rf** | Risk-free rate | Безрисковая ставка |\n| **RI** | Residual Income | Остаточная прибыль: ЧП − Ke × Капитал |\n| **ROA / ROE / ROIC / ROCE** | Return on Assets / Equity / Invested / Capital Employed | Показатели рентабельности |\n| **SG&A** | Selling, General & Administrative | Коммерческие и управленческие расходы |\n| **SOTP** | Sum of the Parts | Оценка по частям |\n| **SPA** | Share Purchase Agreement | Договор купли-продажи акций |\n| **Synergies** | | Синергии: доп. стоимость от объединения |\n| **Teaser** | | Короткое анонимное описание компании для покупателей |\n| **TV** | Terminal Value | Терминальная (постпрогнозная) стоимость |\n| **TSR** | Total Shareholder Return | Полная доходность акционера (рост цены + дивиденды) |\n| **VDR** | Virtual Data Room | Виртуальная комната данных для due diligence |\n| **WACC** | Weighted Average Cost of Capital | Средневзвешенная стоимость капитала |\n| **YTM** | Yield to Maturity | Доходность к погашению |\n| **КБД** | Кривая бескупонной доходности | Кривая доходности ОФЗ (ЦБ, Мосбиржа) |\n| **НКД** | Накопленный купонный доход | Часть купона, накопленная с последней выплаты |\n| **ОФЗ** | Облигации федерального займа | Гособлигации РФ |\n| **РСБУ** | Российские стандарты бухучёта | |\n| **ФСО** | Федеральные стандарты оценки | Стандарты оценочной деятельности РФ |\n| **Н1** | Норматив достаточности капитала | Требование ЦБ к капиталу банков |\n"},{"id":"istochniki","title":"Что читать и где брать данные","short":"Учебники, сайты, источники цифр этого справочника","md":"## Учебники (по приоритету)\n\n1. **Rosenbaum, Pearl — «Investment Banking: Valuation, LBOs, M&A, and IPOs»**. Практика IB: comps, сделки, DCF, LBO, M&A. Ближе всего к работе аналитика.\n2. **Koller, Goedhart, Wessels (McKinsey) — «Valuation: Measuring and Managing the Value of Companies»** (рус. «Стоимость компаний: оценка и управление»). Фундамент DCF, ROIC, EVA.\n3. **Асват Дамодаран — «Инвестиционная оценка» (Investment Valuation)** и «Damodaran on Valuation». Все методы, отраслевая специфика, банки, стартапы.\n4. **Брейли, Майерс, Аллен — «Принципы корпоративных финансов»** (Principles of Corporate Finance). Базовая теория: NPV, CAPM, структура капитала, опционы.\n5. **Халл — «Опционы, фьючерсы и другие производные финансовые инструменты»** (Hull). Деривативы.\n6. **Fabozzi — «Bond Markets, Analysis and Strategies»**. Облигации.\n\n## Сайты\n\n| Что | Где |\n|---|---|\n| Данные Дамодарана: ERP, беты и мультипликаторы по отраслям, CRP по странам | pages.stern.nyu.edu/~adamodar |\n| Ключевая ставка, КБД ОФЗ, курсы | cbr.ru |\n| Котировки и данные Мосбиржи | moex.com, iss.moex.com (API) |\n| Мультипликаторы российских компаний | smart-lab.ru/q/shares_fundamental, fin-vista.ru |\n| Раскрытие эмитентов РФ | e-disclosure.ru |\n| Отчётность американских компаний | sec.gov/edgar (10-K, 10-Q) |\n| Мультипликаторы США | stockanalysis.com, macrotrends.net, multpl.com |\n| Ставки США | fred.stlouisfed.org, federalreserve.gov |\n| Крипта | coingecko.com, coinmarketcap.com |\n| Обучающие гайды по IB | Wall Street Prep, Corporate Finance Institute, Breaking Into Wall Street (часть бесплатна) |\n\n## Источники цифр в справочнике (октябрь 2026)\n\n- Ключевая ставка и история решений: cbr.ru/hd_base/KeyRate, cbr.ru/press/keypr (решение 11.09.2026).\n- КБД ОФЗ на 12.10.2026: cbr.ru/hd_base/zcyc_params.\n- Инфляция 6,35% за сентябрь 2026: expert.ru (данные Росстата, 09.10.2026).\n- Курсы ЦБ на 13.10.2026: ppt.ru/currencies.\n- НДС 22% с 2026, порог УСН: ppt.ru (425-ФЗ от 28.11.2025).\n- Закон о цифровых валютах: expert.ru (21.07.2026), pnp.ru (26.01.2026).\n- Мультипликаторы РФ: smart-lab.ru/q/<тикер>/f/y/ (LTM, 12–13.10.2026), fin-vista.ru/market (13.10.2026), стратегия БКС на IV кв. 2026 (smart-lab.ru/blog/1353745.php), «Ведомости» 13.10.2026 (IMOEX).\n- Мультипликаторы США: stockanalysis.com/stocks/<тикер>/statistics (13.10.2026), multpl.com, FactSet Earnings Insight (09.10.2026).\n- ФРС: federalreserve.gov (решение 16.09.2026). UST: FRED DGS10/DGS2 (08.10.2026). CPI США: bls.gov (август 2026).\n- ERP США 3,70%: блог Дамодарана, октябрь 2026 (aswathdamodaran.blogspot.com).\n- Отраслевые мультипликаторы США: Дамодаран, январь 2026 (pedata.html, vebitda.html).\n\n> Цифры по рынкам быстро устаревают. Живые котировки во вкладке «Рынки» обновляются автоматически; таблицы мультипликаторов отмечены датой.\n"}],"static":{"ru":[["SBER","Сбербанк","Финансы",6489,3.47,null,0.76,"13,1%","ROE 24,0%",""],["LKOH","Лукойл","Нефтегаз",4144,9.51,2.93,1.17,"13,6%","−0,29",""],["ROSN","Роснефть","Нефтегаз",3970,16.0,1.64,0.43,"3,7%","н/д",""],["NVTK","Новатэк","Нефтегаз",3281,18.6,3.96,1.13,"7,7%","−0,05",""],["SIBN","Газпром нефть","Нефтегаз",2876,7.54,3.02,0.96,"11,6%","0,92",""],["GAZP","Газпром","Нефтегаз",2408,1.67,2.54,0.13,"0%","1,82","Нет дивидендов, долг 6,1 трлн"],["GMKN","Норникель","Металлы",1820,8.12,4.55,1.85,"1,6%","1,22",""],["TATN","Татнефть","Не
