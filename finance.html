<!doctype html><html lang="ru"><head><meta charset="utf-8">

<title>Финансы</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F1E8;--rail:#ECE8DB;--surface:#FBF9F3;--fg:#25221C;--muted:#665F52;--faint:#857E6E;
  --line:#D9D3C2;--line2:#E5E0D2;--accent:#1F6B57;--accent2:#A93D28;--mark:#F5DC94;--up:#1E7B45;--down:#B3261E;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171611;--rail:#1D1C16;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;
  --line:#33312A;--line2:#292820;--accent:#5FC2A3;--accent2:#E8886B;--mark:#5B4A17;--up:#4CC17E;--down:#F07167;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171611;--rail:#1D1C16;--surface:#22211A;--fg:#E8E4D8;--muted:#A39D8E;--faint:#7A7466;
  --line:#33312A;--line2:#292820;--accent:#5FC2A3;--accent2:#E8886B;--mark:#5B4A17;--up:#4CC17E;--down:#F07167;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--mark)}

/* шапка */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:4px;max-width:1180px;margin:0 auto;padding:6px 8px 0 var(--gut);min-height:52px}
.home{display:grid;place-items:center;width:40px;height:40px;margin-left:-10px;border-radius:10px;color:var(--muted);text-decoration:none}
.home:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.home svg,.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand{margin-right:auto;font:600 21px/1 var(--serif);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--accent);font-weight:600}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.ibtn:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.sw{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:4px var(--gut) 0}
.sw a{position:relative;padding:10px 12px 12px;text-decoration:none;color:var(--muted);font:600 15px/1 var(--sans)}
.sw a.on{color:var(--fg)}
.sw a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.search{display:none;align-items:center;gap:8px;max-width:1180px;margin:4px auto 8px;padding:0 var(--gut)}
.search.on{display:flex}
.search input{flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:400 16px var(--sans);outline:0}
.search input:focus{border-color:var(--faint)}

main{max-width:1180px;margin:0 auto;padding:0 var(--gut) 96px;min-width:0}
.sub{display:flex;gap:8px;overflow-x:auto;margin:16px calc(var(--gut)*-1) 0;padding:0 var(--gut) 4px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);font:500 14px/1.2 var(--sans);white-space:nowrap;background:none;min-height:40px;display:inline-flex;align-items:center}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip:hover:not(.on){color:var(--fg);border-color:var(--faint)}

/* обучение: оглавление */
.hero{padding:34px 0 8px}
.hero h1{margin:0;font:600 clamp(32px,6vw,52px)/1.05 var(--serif);letter-spacing:-.02em}
.hero p{margin:12px 0 0;max-width:60ch;font:400 17px/1.55 var(--serif);color:var(--muted)}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-top:26px}
.ch{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;min-width:0}
.ch:hover{border-color:var(--faint)}
.ch .n{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:600 14px/1 var(--mono)}
.ch b{display:block;font:600 17px/1.3 var(--serif)}
.ch i{display:block;margin-top:3px;font:400 13.5px/1.4 var(--sans);font-style:normal;color:var(--muted)}

/* глава */
.doc{display:grid;grid-template-columns:minmax(0,1fr);gap:0 56px;padding-top:28px}
.art{min-width:0;max-width:760px;width:100%;margin:0 auto}
.eyebrow{margin:0 0 10px;font:500 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:var(--accent);text-decoration:none}
.art h1{margin:0 0 22px;font:600 clamp(28px,5vw,40px)/1.15 var(--serif);letter-spacing:-.015em;text-wrap:balance}
.toc{margin:0 0 26px;border-block:1px solid var(--line)}
.toc summary{list-style:none;padding:12px 0;cursor:pointer;font:500 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toc summary::-webkit-details-marker{display:none}
.toc a{display:block;padding:6px 0;text-decoration:none;color:var(--muted);font:400 14.5px/1.4 var(--sans)}
.toc a:hover{color:var(--fg)}
.toc nav{padding-bottom:10px}
.side{display:none}
.prose{font:400 17px/1.7 var(--sans);overflow-wrap:break-word}
.prose>:first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose h2{margin:2.2em 0 .7em;padding-top:1.1em;border-top:1px solid var(--line);font:600 24px/1.25 var(--serif);scroll-margin-top:120px}
.prose h3{margin:1.8em 0 .6em;font:600 19px/1.35 var(--serif);scroll-margin-top:120px}
.prose h4{margin:1.5em 0 .5em;font:600 17px/1.35 var(--sans)}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose li{margin:.4em 0}
.prose li::marker{color:var(--accent)}
.prose strong{font-weight:650}
.prose a{color:var(--accent);text-underline-offset:3px}
.prose blockquote{margin:1.3em 0;padding:12px 16px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.prose blockquote p:last-child{margin:0}
.prose code{font:.86em var(--mono);padding:.1em .35em;border-radius:5px;background:var(--rail)}
.f{margin:1.1em 0 1.3em;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);font:500 14.5px/1.75 var(--mono);white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.prose table,.dt{width:100%;border-collapse:collapse;font:400 14.5px/1.45 var(--sans);font-variant-numeric:tabular-nums}
.prose th,.prose td,.dt th,.dt td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
.prose th,.dt th{font:600 11.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--rail);border-bottom:1px solid var(--line)}
.prose td{min-width:6em}
.prose tr:last-child td,.dt tr:last-child td{border-bottom:0}
details.qa{border-bottom:1px solid var(--line)}
details.qa:first-of-type{border-top:1px solid var(--line)}
details.qa>summary{list-style:none;display:flex;gap:12px;padding:13px 0;cursor:pointer;font:500 16px/1.45 var(--sans)}
details.qa>summary::-webkit-details-marker{display:none}
details.qa>summary span{flex:none;min-width:2em;color:var(--faint);font:500 13px/1.6 var(--mono)}
details.qa[open]>summary{color:var(--accent)}
details.qa>div{padding:0 0 14px calc(2em + 12px);color:var(--fg)}
details.qa+h3{margin-top:2em}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:5px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;min-width:0}
.pager a:hover{border-color:var(--faint);background:var(--surface)}
.pager .nx{grid-column:2;text-align:right}
.pager small{font:500 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.pager b{font:600 16px/1.3 var(--serif)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* рынки */
.stat{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:14px 0 4px;font:400 13px/1.4 var(--sans);color:var(--muted)}
.stat .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.stat.live .dot{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}
.stat.off .dot{background:var(--down)}
.stat button{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font:500 12.5px/1.2 var(--sans);color:var(--fg)}
.sect{margin-top:30px}
.sect h2{margin:0 0 10px;font:600 21px/1.25 var(--serif)}
.note{margin:6px 0 0;font:400 12.5px/1.45 var(--sans);color:var(--faint)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.tile{padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.tile .k{font:500 11.5px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{margin-top:6px;font:600 clamp(19px,5vw,23px)/1.15 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .s{margin-top:4px;font:400 12.5px/1.35 var(--sans);color:var(--faint)}
.tile .s .up,.tile .s .down{font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
.dt th{cursor:pointer;white-space:nowrap;user-select:none}
.dt th.num,.dt td.num{text-align:right}
.dt th.sorted::after{content:" ↓";color:var(--accent)}
.dt th.sorted.asc::after{content:" ↑"}
.dt td{white-space:nowrap}
.dt td.nm b{display:block;font-weight:600}
.dt td.nm i{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.dt td.nt{white-space:normal;min-width:12em;font-size:12.5px;color:var(--muted)}
.dt .sticky{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line2)}
.dt th.sticky{background:var(--rail)}
.dt tbody tr{background:var(--surface)}
.dt tbody tr:hover,.dt tbody tr:hover .sticky{background:color-mix(in srgb,var(--fg) 4%,var(--surface))}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font:500 12.5px var(--sans);fill:var(--muted)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.chart .pt{fill:var(--accent)}
.chart .lb{fill:var(--fg);font-weight:600}
.box{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.results{padding-top:24px;max-width:760px}
.hit{display:block;padding:16px 0;border-top:1px solid var(--line);text-decoration:none}
.hit:last-child{border-bottom:1px solid var(--line)}
.hit small{font:500 11.5px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hit b{display:block;margin:6px 0 4px;font:600 18px/1.3 var(--serif)}
.hit p{margin:0;font:400 14.5px/1.55 var(--sans);color:var(--muted)}
.empty{padding:30px 0;color:var(--muted)}

@media (min-width:900px){
  :root{--gut:40px}
  .grid2{grid-template-columns:1fr 1fr}
  .prose{font-size:17.5px}
}
@media (min-width:1200px){
  .doc{grid-template-columns:minmax(0,760px) 240px;justify-content:center}
  .doc .toc{display:none}
  .side{display:block;position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow-y:auto;font:400 13.5px/1.4 var(--sans)}
  .side .h{margin:0 0 8px;font:500 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .side a{display:block;padding:5px 0 5px 12px;border-left:1px solid var(--line);text-decoration:none;color:var(--muted)}
  .side a:hover{color:var(--fg)}
}
@media (max-width:560px){
  .pager{grid-template-columns:1fr}.pager .nx{grid-column:1}
  .prose{font-size:16.5px}.prose h2{font-size:22px}
  details.qa>div{padding-left:0}
  .f{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
}
