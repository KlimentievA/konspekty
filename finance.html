<\/span>Что такое G-spread и зачем он?<\/summary><div>\n\nДоходность облигации минус доходность ОФЗ на том же сроке. Показывает плату за кредитный риск эмитента.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>52<\/span>Почему акции растут на снижении ставки, даже если прибыль не меняется?<\/summary><div>\n\nПадает Rf → падает Ke и WACC → выше приведённая стоимость будущих потоков; плюс дешевле долг.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>53<\/span>Чем отличается EBITDA от OIBDA?<\/summary><div>\n\nOIBDA считается от операционной прибыли (без прочих доходов/расходов), EBITDA часто включает прочие статьи до процентов и налогов.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>54<\/span>Как IFRS 16 влияет на EV/EBITDA ритейлера?<\/summary><div>\n\nEBITDA растёт (аренда выводится из операционных расходов), а в EV надо добавить арендные обязательства. Сравнивать аналоги нужно в одной методике.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>55<\/span>Ты финдиректор: у компании лишние 10 млрд ₽. Что с ними делать?<\/summary><div>\n\nСравнить варианты: проекты с ROIC > WACC, M&A, погашение дорогого долга, дивиденды, байбэк. При ставках 14–16% погашение долга часто даёт «гарантированную доходность» на уровне ставки.\n\n<\/div><\/details>\n\n"},{"id":"excel","title":"Финансовая модель в Excel","short":"Структура модели, формулы, горячие клавиши, проверки","md":"> **Суть.** Финмодель — это Excel-файл, где из допущений (рост, цены, затраты) по формулам строятся три формы отчётности, потоки и оценка. Хорошая модель **прозрачная**: любой человек видит, откуда взялось каждое число, и может поменять допущение.\n\n## Структура (как в твоей домашке Project Black)\n\n| Лист | Что внутри |\n|---|---|\n| **Cover / Dashboard** | Итог: NPV, IRR, payback, графики, выбор сценария |\n| **Inputs (допущения)** | Все входные данные: цены, объёмы, инфляция, курсы, ставки, CAPEX. Сценарии (база / пессимист / оптимист) |\n| **Calc (расчёты)** | Выручка, затраты, амортизация, налоги, оборотный капитал, CAPEX по годам |\n| **Statements** | P&L, баланс, cash flow (в полной модели) |\n| **DCF / Results** | FCFF, дисконтирование, NPV, IRR, терминальная стоимость, мост к equity |\n| **Sensitivity** | Таблицы чувствительности (WACC × g, цена × объём) |\n| **Checks** | Проверки: баланс сходится, нет ошибок, суммы совпадают |\n\n## Правила хорошей модели\n\n1. **Цвет шрифта:** синий — ввод руками (допущения), чёрный — формулы, зелёный — ссылки на другие листы. Это стандарт банков.\n2. **Одно число вводится один раз** (на листе допущений), дальше только ссылки. Никаких «зашитых» чисел внутри формул (`=B5*1,2` — плохо; `=B5*(1+Рост)` — хорошо).\n3. **Одна формула на всю строку**: формулу пишут в первой ячейке и протягивают вправо. Если формула в строке меняется посреди — это источник ошибок.\n4. **Временная шкала** одна на всех листах: годы в одних и тех же столбцах.\n5. **Знаки**: договорись, что расходы отрицательные (или положительные) и держись этого.\n6. **Проверки**: Активы − Пассивы = 0 на каждый год; сумма по сегментам = итог.\n7. **Сценарии** через переключатель: одна ячейка с номером сценария и `ВЫБОР()` / `CHOOSE()` или `ИНДЕКС()`.\n8. **Без циклических ссылок** (или с явным переключателем). Цикл возникает, когда проценты зависят от среднего долга, а долг зависит от денег после процентов.\n\n## Главные формулы (русский Excel → английский)\n\n| Русский | Английский | Зачем |\n|---|---|---|\n| `ЧПС(ставка; потоки)` | `NPV` | PV потоков **с 1-го периода**. Инвестицию года 0 прибавляй отдельно: `=ЧПС(r;B2:F2)+A2` |\n| `ЧИСТНЗ(ставка; потоки; даты)` | `XNPV` | NPV для потоков с конкретными датами |\n| `ВСД(потоки)` | `IRR` | Внутренняя норма доходности |\n| `ЧИСТВНДОХ(потоки; даты)` | `XIRR` | IRR с датами (стандарт в PE) |\n| `МВСД(потоки; ставка фин.; ставка реинв.)` | `MIRR` | Модифицированная IRR |\n| `ПЛТ(ставка; кпер; пс)` | `PMT` | Аннуитетный платёж по кредиту |\n| `ВЫБОР(номер; в1; в2; в3)` | `CHOOSE` | Переключение сценариев |\n| `ИНДЕКС(диапазон; ПОИСКПОЗ(что; где; 0))` | `INDEX/MATCH` | Гибкий поиск (лучше ВПР) |\n| `ПРОСМОТРX` | `XLOOKUP` | Современная замена ВПР |\n| `СУММЕСЛИМН` | `SUMIFS` | Сумма по условиям |\n| `ЕСЛИОШИБКА(формула; 0)` | `IFERROR` | Убрать #ДЕЛ/0! (не прячь реальные ошибки!) |\n| `МИН / МАКС` | `MIN / MAX` | Погашение долга не больше остатка: `=МИН(Долг; Деньги)` |\n| `СМЕЩ` | `OFFSET` | Скользящие окна (например, амортизация по годам ввода) |\n\n**Дисконтирование середины года** вручную: `=Поток/(1+WACC)^(Год−0,5)`.\n\n## Таблица данных (чувствительность)\n\n«Данные → Анализ “что если” → Таблица данных». В строку и столбец ставишь значения двух допущений (например, WACC и g), в угол — ссылку на результат (NPV). Excel пересчитывает модель для каждой пары.\nЕсли автопересчёт таблиц выключен («Автоматически, кроме таблиц данных»), нажми **F9**.\n\n## Горячие клавиши (Windows)\n\n| Клавиши | Действие |\n|---|---|\n| **F2** | Редактировать ячейку |\n| **F4** | Переключить $ (абсолютная/относительная ссылка) |\n| **Ctrl + стрелка** | Прыжок к краю данных |\n| **Ctrl + Shift + стрелка** | Выделить до края |\n| **Ctrl + R / Ctrl + D** | Протянуть вправо / вниз |\n| **Ctrl + [** | Перейти к ячейкам, на которые ссылается формула |\n| **Alt + = ** | Автосумма |\n| **Ctrl + 1** | Формат ячеек |\n| **Ctrl + `** | Показать все формулы |\n| **F9** | Пересчитать |\n| **Alt → M → P / D** | Влияющие / зависимые ячейки (трассировка) |\n\nВ банках мышь почти не используют: скорость в Excel проверяют на тестах.\n\n## Как строится трёхформенная модель (порядок)\n\n1. Исторические данные (3–5 лет) из отчётности.\n2. Допущения: рост выручки, маржа, CAPEX % выручки, оборачиваемость, ставка налога, дивиденды.\n3. **P&L** до EBIT.\n4. **Вспомогательные графики**: ОС и амортизация (PP&E schedule), оборотный капитал, долг и проценты (debt schedule).\n5. P&L до чистой прибыли.\n6. **Cash flow**: из P&L и изменений баланса.\n7. **Баланс**: деньги берутся из cash flow → проверка Активы = Пассивы.\n8. DCF / оценка, чувствительность, дашборд.\n\n## Частые ошибки\n\n- Ссылка «съехала» при протягивании (забыли $).\n- Знак: CAPEX прибавили вместо вычитания.\n- Год 0 включён в `ЧПС` и продисконтирован лишний раз.\n- Проценты, налоги или инфляция в разных единицах (12 вместо 0,12).\n- Таблица данных показывает старые значения — не нажали F9.\n- Оборотный капитал считается от уровня, а в поток нужно **изменение**.\n"},{"id":"makro","title":"Макроэкономика для аналитика","short":"Ставки, инфляция, курс, нефть, бюджет — как это влияет на компании","md":"> **Суть.** Стоимость компаний зависит от макро через три канала: **ставки** (дисконт и стоимость долга), **курс** (выручка экспортёров и затраты импортёров) и **спрос** (рост экономики). Аналитик должен уметь за минуту объяснить, кого задевает изменение каждого из них.\n\n## Денежно-кредитная политика\n\n- **Ключевая ставка** ЦБ определяет стоимость денег в экономике. Через неё ЦБ борется с инфляцией (цель 4%).\n- **Трансмиссия:** ставка ↑ → ставки по кредитам и депозитам ↑ → люди больше сберегают, меньше берут кредиты → спрос и инфляция ↓. Эффект проявляется через 3–6 кварталов.\n- **Жёсткая политика** (высокая ставка) — плохо для акций, облигаций, девелоперов, закредитованных компаний; хорошо для вкладчиков и держателей коротких облигаций и флоатеров (ОФЗ-ПК).\n- **Смягчение** (снижение ставки) — растут цены длинных облигаций (ОФЗ-ПД), акции роста, девелоперы, ритейл.\n\n**Россия, октябрь 2026:** ставка 14% (снижалась с 21% с июня 2025 года), инфляция 6,35% г/г (сентябрь), прогноз ЦБ 6–7% на 2026 год. Реальная ставка ≈ 14% − 6,35% ≈ 7,6% — это жёсткие условия.\n**США:** ставка ФРС 3,75–4,00% (повышена 16.09.2026 впервые с 2023 года), CPI 3,4% г/г (август).\n\n## Инфляция\n\n- **ИПЦ (CPI)** — рост цен потребительской корзины. Базовая (core) — без волатильных компонентов (еда, энергия).\n- Для компаний: инфляция поднимает выручку (номинально), но и затраты. Выигрывают те, кто может переложить цены (pricing power): ритейл, сильные бренды, монополии.\n- В моделях: **номинальные потоки — по номинальной ставке**; инфляцию закладывай согласованно с курсом (паритет покупательной способности).\n\n## Валютный курс\n\n| Рубль ослаб | Кто выигрывает | Кто проигрывает |\n|---|---|---|\n| | Экспортёры: нефть и газ (Лукойл, Роснефть, Новатэк), металлурги (Норникель, НЛМК, Северсталь), удобрения (ФосАгро), золото (Полюс) | Импортёры, ритейл с импортом, авиакомпании (лизинг и запчасти в валюте), компании с валютным долгом |\n\nЧто влияет на рубль: цены на нефть и газ, объём экспорта и импорта (торговый баланс), ставка ЦБ (разница ставок), бюджетное правило (покупка/продажа валюты Минфином), санкции и ограничения на движение капитала.\n\n## Нефть и бюджет РФ\n\n- Доходы бюджета сильно зависят от нефти и газа (НДПИ, НДД, экспортные пошлины).\n- **Бюджетное правило:** нефтегазовые доходы сверх базовой цены нефти направляются в Фонд национального благосостояния (ФНБ) — Минфин покупает валюту/юани; при недоборе — продаёт.\n- **Дисконт Urals к Brent** — из-за санкций и потолка цен российская нефть продаётся дешевле эталона. Для нефтяников важна именно рублёвая цена Urals.\n- **Демпфер** — выплаты нефтяникам из бюджета, чтобы сдерживать цены на бензин внутри страны; влияет на прибыль НПЗ.\n\n## Рост экономики (ВВП)\n\n- ВВП = потребление + инвестиции + госрасходы + чистый экспорт.\n- Циклические сектора (металлы, стройка, авто, банки по кредитному риску) сильнее реагируют на рост и спад.\n- Защитные сектора (продукты, коммунальные, телеком, фарма) меньше зависят от цикла.\n\n## Облигации и кривая доходности\n\n- **Короткий конец** кривой следует за ключевой ставкой и ожиданиями её изменения.\n- **Длинный конец** = ожидания ставок + премия за срок (инфляционные и бюджетные риски).\n- **Инвертированная** кривая (короткие ставки выше длинных) — рынок ждёт снижения ставок; в США исторически предвещала рецессию.\n- Россия, 12.10.2026: 1 год 13,7%, 10 лет 16,6% — кривая растущая, рынок закладывает риски на длинном горизонте.\n\n## Связь макро → оценка (шпаргалка)\n\n| Изменение | Rf / WACC | Акции | Облигации | Рубль |\n|---|---|---|---|---|\n| ЦБ снижает ставку | ↓ | ↑ (особенно рост и долговые компании) | ↑ цены | Обычно ослабление |\n| Ускорение инфляции | ↑ | ↓ | ↓ | Ослабление |\n| Рост нефти | — | ↑ нефтяники, ↑ рынок РФ | — | Укрепление |\n| Санкции / ограничения | ↑ (риск-премия) | ↓ | ↓ | Ослабление |\n| Рост ставки ФРС | ↑ в долларах | ↓ рынки развивающихся стран | ↓ UST | Доллар укрепляется |\n\n## Где смотреть данные\n\n- Банк России (cbr.ru): ключевая ставка, мониторинг предприятий, инфляционные ожидания, «Резюме обсуждения ключевой ставки».\n- Росстат: инфляция (еженедельно по средам и ежемесячно), ВВП.\n- Минфин: бюджет, ФНБ, аукционы ОФЗ.\n- США: federalreserve.gov (решения FOMC, «точечный график»), bls.gov (CPI, занятость), FRED.\n"},{"id":"kpi","title":"Отраслевые KPI: что смотреть в каждом секторе","short":"Нефть, металлы, банки, ритейл, телеком, IT, девелоперы, энергетика, авиация","md":"> **Суть.** Кроме общей отчётности, у каждой отрасли есть свои **операционные показатели** (KPI), которые двигают выручку и прибыль. На собеседовании и в модели от тебя ждут знания именно их.\n\n## Нефть и газ\n\n| KPI | Что это |\n|---|---|\n| **Добыча** (тыс. барр./сут, млрд м³) | Объём; рост добычи = рост выручки |\n| **Запасы 1P / 2P / 3P** | Доказанные / + вероятные / + возможные. Отношение запасов к добыче (R/P) — на сколько лет хватит |\n| **Цена Urals / Brent, дисконт** | Главный драйвер выручки российских нефтяников |\n| **Lifting cost** | Себестоимость добычи барреля |\n| **Глубина переработки** | Доля светлых нефтепродуктов на НПЗ |\n| **НДПИ, НДД, демпфер** | Налоги и выплаты, определяющие маржу в РФ |\n| **EV/EBITDA, EV/запасы, EV/добыча** | Мультипликаторы |\n\n## Металлы и добыча\n\n- **Производство** (т, унции), **цены на металлы** (LME, золото в $/унцию), **cash cost / AISC** (полная себестоимость унции золота), **содержание металла в руде** (г/т), **срок жизни рудника** (life of mine).\n- Чувствительность прибыли к цене металла и курсу рубля.\n\n## Банки\n\n| KPI | Норма / смысл |\n|---|---|\n| **Кредитный портфель**, рост | Розница / корпоратив |\n| **NIM** (чистая процентная маржа) | Процентный доход − процентный расход, к активам |\n| **Комиссионный доход** | Платежи, карты, брокеридж — стабильный доход |\n| **CIR** (cost-to-income) | Эффективность, ниже 40% — отлично |\n| **CoR** (стоимость риска) | Резервы под потери, % кредитов |\n| **NPL 90+** | Доля просроченных кредитов |\n| **ROE** | Сравнивай со стоимостью капитала Ke |\n| **Н1.0 / CET1** | Достаточность капитала (ограничивает дивиденды и рост) |\n\n## Ритейл\n\n- **LFL (like-for-like) продажи** — рост выручки сопоставимых магазинов (работающих > 12 месяцев) = **трафик** × **средний чек**.\n- **Торговая площадь**, рост сети, **выручка на м²**.\n- **Валовая маржа**, **EBITDA-маржа** (до/после МСФО 16!).\n- **Доля онлайна**, **оборачиваемость запасов**.\n- Отрицательный оборотный капитал (платят поставщикам позже, чем продают).\n\n## Телеком\n\n- **Абоненты**, **ARPU** (выручка на абонента), **churn** (отток, % в месяц).\n- **CAPEX / выручка** (стройка сетей), **EBITDA-маржа** (обычно 35–45%).\n- Экосистемы (МТС: финтех, медиа, облака) — оценка по частям (SOTP).\n\n## IT и интернет\n\n| KPI | Что это |\n|---|---|\n| **MAU / DAU** | Активные пользователи в месяц / день |\n| **GMV** | Общий объём продаж на маркетплейсе (не выручка!) |\n| **Take rate** | Выручка / GMV — какую долю берёт платформа |\n| **ARR / MRR** | Годовая / месячная повторяющаяся выручка (подписки) |\n| **NRR (net revenue retention)** | Выручка от старых клиентов год к году; > 100% — клиенты платят больше |\n| **CAC / LTV** | Стоимость привлечения клиента / доход с клиента за всё время; LTV/CAC ≥ 3 |\n| **Правило 40** | Рост выручки % + маржа FCF % ≥ 40 |\n\n## Девелопмент\n\n- **Продажи в м² и рублях**, **средняя цена м²**, **доля ипотеки** в продажах (зависит от льготных программ и ставок).\n- **Земельный банк** (сколько можно построить), **эскроу-счета** (деньги покупателей хранятся в банке до сдачи дома), **проектное финансирование** (ставка снижается при наполнении эскроу).\n- Оценка: NAV проектов, P/B, EV/EBITDA.\n\n## Электроэнергетика\n\n- **Установленная мощность** (ГВт), **выработка** (млрд кВт·ч), **КИУМ** (коэффициент использования мощности).\n- **РСВ** (рынок на сутки вперёд), **КОМ** (конкурентный отбор мощности), **ДПМ** (договоры о предоставлении мощности: гарантированная доходность на новые станции).\n- Сети: **RAB** и тарифы, регулируемые государством.\n\n## Авиация\n\n- **Пассажиропоток**, **RPK** (оплаченные пассажиро-километры), **ASK** (предельные кресло-километры), **load factor** = RPK / ASK (заполняемость, ~85–90% — хорошо).\n- **Доход на RPK (yield)**, **затраты на ASK (CASK)**, **топливо** — до 30% затрат.\n- Аренда самолётов → смотри EBITDAR и долг с учётом лизинга.\n\n## Удобрения и химия\n\n- **Продажи по продуктам** (фосфорные, азотные, калийные), **цены** (DAP, карбамид), **себестоимость** (газ, апатит, сера), **экспортные квоты и пошлины**.\n"},{"id":"struktura-kapitala","title":"Структура капитала и дивиденды","short":"Модильяни–Миллер, оптимальный долг, дивиденды vs байбэк","md":"> **Суть.** Сколько брать долга и сколько отдавать акционерам — два главных решения финдиректора. Долг дешевле (налоговый щит), но повышает риск банкротства. Деньги, которые компания не может вложить с доходностью выше WACC, лучше вернуть акционерам.\n\n## Теорема Модильяни–Миллера (ММ)\n\n1. **Без налогов** (идеальный рынок): стоимость компании **не зависит** от структуры капитала. Долг дешевле, но с ростом долга растёт Ke, и WACC не меняется.\n```f\nV_L = V_U\nKe = Ku + (Ku − Kd) × D/E\n```\n2. **С налогами**: долг создаёт стоимость за счёт налогового щита.\n```f\nV_L = V_U + t × D            (для постоянного долга)\n```\n3. **Реальность**: с ростом долга растут **издержки финансовых трудностей** (риск банкротства, потеря клиентов и поставщиков, ограничения ковенантов).\n\n## Теории структуры капитала\n\n- **Компромиссная (trade-off)**: оптимальный долг там, где выгода налогового щита = рост ожидаемых издержек банкротства. WACC минимален.\n- **Иерархия источников (pecking order)**: компании сначала финансируются из своей прибыли, потом долгом, а акции выпускают в последнюю очередь (рынок читает эмиссию как сигнал «акции переоценены»).\n- **Market timing**: компании выпускают акции, когда рынок их высоко оценивает (волны IPO на растущем рынке).\n\n**Практика:** капиталоёмкие и стабильные бизнесы (сети, телеком, инфраструктура) держат больше долга (ND/EBITDA 2–3×); IT и циклические — меньше. В РФ при ставках 14–20% долг дорогой, поэтому многие компании держат низкий долг или чистый кэш.\n\n## Возврат денег акционерам\n\n| | Дивиденды | Байбэк (обратный выкуп) |\n|---|---|---|\n| Как | Выплата всем пропорционально | Покупка своих акций на рынке |\n| Налог для акционера (РФ) | 13–15% НДФЛ | Только при продаже акций |\n| Гибкость | Рынок ждёт стабильности, снижение — негативный сигнал | Можно менять от года к году |\n| Влияние на EPS | Нет | EPS растёт (акций меньше) |\n| Типично | РФ (культура высоких дивидендов) | США (Apple, Alphabet и др.) |\n\n**Важно:** при прочих равных ни дивиденд, ни байбэк не создают стоимость сами по себе — деньги просто переходят из компании акционерам. Стоимость создаётся, если иначе менеджмент потратил бы деньги на проекты с ROIC < WACC.\n\n## Дивиденды в России\n\n- Многие компании платят по **дивидендной политике**: доля прибыли по МСФО или от свободного денежного потока (например, 50% чистой прибыли).\n- **Госкомпании**: ориентир правительства — **50% чистой прибыли по МСФО**.\n- **Дивидендный гэп**: после отсечки (последний день, когда купленная акция даёт право на дивиденд) цена акции падает примерно на размер дивиденда.\n- **Т+1**: на Мосбирже расчёты на следующий день, поэтому купить нужно **за день до** даты отсечки.\n\n## Дивидендные метрики\n\n```f\nPayout ratio = Дивиденды / Чистая прибыль\nДивидендная доходность = DPS / Цена\nУстойчивый рост g = ROE × (1 − Payout)\nПокрытие дивидендов = FCF / Дивиденды        (> 1 — платят из заработанных денег)\n```\n\n## Эмиссия и размытие\n\n- **Допэмиссия (SPO, cash-in)** привлекает деньги, но **размывает** долю старых акционеров. Если деньги вложены с ROIC > WACC — стоимость на акцию может вырасти.\n- **Конвертируемые облигации** — долг, который можно превратить в акции: ниже купон, но потенциальное размытие.\n- **Опционы менеджмента** — учитывай в разводнённом числе акций (метод казначейских акций, treasury stock method).\n"},{"id":"praktikum","title":"Практикум: задачи с решениями","short":"15 задач на NPV, WACC, DCF, мультипликаторы, LBO, облигации","md":"> Сначала реши сам на бумаге или в Excel, потом нажми на задачу и сверься. Все ответы пересчитаны.\n\n### Деньги во времени\n\n<details class=\"qa\"><summary><span>1<\/span>Сколько сегодня стоят 500 тыс. ₽, которые ты получишь через 4 года, если ставка 16%?<\/summary><div>\n\nPV = 500 / 1,16⁴ = 500 / 1,811 ≈ **276 тыс. ₽**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>2<\/span>Проект: −200 сегодня, затем 60, 80, 90, 70. Ставка 15%. NPV, IRR, простой и дисконтированный payback?<\/summary><div>\n\nPV потоков: 52,2 + 60,5 + 59,2 + 40,0 = 211,9 → **NPV ≈ +11,9** (принимаем). **IRR ≈ 17,8%** (> 15%).\nПростой payback: накоплено −140, −60, +30 → 2 + 60/90 ≈ **2,7 года**. Дисконтированный: после 3-го года −28,2, в 4-й +40,0 → 3 + 28,2/40,0 ≈ **3,7 года**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>3<\/span>Кредит 10 млн ₽ на 5 лет под 15% годовых, ежегодные равные платежи. Каков платёж?<\/summary><div>\n\nPMT = 10 × 0,15 / (1 − 1,15⁻⁵) ≈ **2,98 млн ₽** в год. В Excel: `=ПЛТ(15%;5;-10)`.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>4<\/span>Свободный поток следующего года 120, дальше растёт на 4% вечно, WACC 14%. Сколько стоит компания?<\/summary><div>\n\nГордон: 120 / (0,14 − 0,04) = **1 200**.\n\n<\/div><\/details>\n\n\n### Стоимость капитала\n\n<details class=\"qa\"><summary><span>5<\/span>Капитализация 600, долг 400, Ke 22%, Kd 16%, налог 25%. WACC?<\/summary><div>\n\nWACC = 0,6 × 22% + 0,4 × 16% × 0,75 = 13,2% + 4,8% = **18,0%**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>6<\/span>Бета аналога 1,3 при D/E = 0,5. Наша компания держит D/E = 1,0. Налог 25%. Какую бету взять?<\/summary><div>\n\nβU = 1,3 / (1 + 0,75 × 0,5) = 1,3 / 1,375 ≈ 0,945. βL = 0,945 × (1 + 0,75 × 1,0) ≈ **1,65**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>7<\/span>Rf = 16,6%, бета 1,1, ERP 7%. Ke по CAPM?<\/summary><div>\n\nKe = 16,6% + 1,1 × 7% = **24,3%**.\n\n<\/div><\/details>\n\n\n### Оценка\n\n<details class=\"qa\"><summary><span>8<\/span>EBIT 300, налог 25%, амортизация 80, CAPEX 120, оборотный капитал вырос на 20. FCFF?<\/summary><div>\n\nFCFF = 300 × 0,75 + 80 − 120 − 20 = 225 + 80 − 140 = **165**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>9<\/span>Капитализация 1 000, долг 400, кэш 100, доли меньшинства 50, ассоциированные компании 30. EV? Если EBITDA 220 — EV/EBITDA?<\/summary><div>\n\nEV = 1 000 + 400 − 100 + 50 − 30 = **1 320**. EV/EBITDA = 1 320 / 220 = **6,0×**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>10<\/span>EBITDA 80, медиана EV/EBITDA аналогов 5×, чистый долг 150, 10 млн акций. Цена акции?<\/summary><div>\n\nEV = 400; Equity = 400 − 150 = 250; цена = **25 ₽**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>11<\/span>Банк: ROE 20%, Ke 18%, g 5%. Справедливый P/B?<\/summary><div>\n\nP/B = (ROE − g) / (Ke − g) = 15 / 13 ≈ **1,15×**. Если банк торгуется по 0,8×, рынок либо закладывает более высокий Ke, либо не верит в устойчивость ROE.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>12<\/span>Чистая маржа 10%, оборачиваемость активов 1,5, активы/капитал = 2. ROE?<\/summary><div>\n\nDuPont: 10% × 1,5 × 2 = **30%**.\n\n<\/div><\/details>\n\n\n### M&A и LBO\n\n<details class=\"qa\"><summary><span>13<\/span>Фонд покупает компанию с EBITDA 50 за 7× (350), долг 210, свои деньги 140. Через 5 лет EBITDA 70, выход за 7×, долг погашен до 90. MoM и IRR?<\/summary><div>\n\nEV на выходе 490; капитал = 490 − 90 = 400. **MoM = 400/140 ≈ 2,86×**, **IRR = 2,857^(1/5) − 1 ≈ 23,4%**.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>14<\/span>Покупатель: чистая прибыль 200, 100 млн акций, цена 30 (P/E 15). Покупает цель с прибылью 30 за 360 (P/E 12), платит своими акциями. Accretive или dilutive?<\/summary><div>\n\nНовых акций: 360 / 30 = 12 млн. EPS до: 2,00. EPS после: 230 / 112 ≈ **2,05 (+2,7%, accretive)**: покупатель платит более «дорогими» акциями за более «дешёвую» прибыль.\n\n<\/div><\/details>\n\n\n### Облигации\n\n<details class=\"qa\"><summary><span>15<\/span>Облигация на 2 года, купон 12% раз в год, цена 95% номинала. Доходность к погашению и дюрация?<\/summary><div>\n\nРешаем 95 = 12/(1+y) + 112/(1+y)²: **YTM ≈ 15,1%**. Дюрация Маколея ≈ **1,89 года**, модифицированная ≈ 1,64 → рост ставок на 1 п.п. снизит цену примерно на 1,6%.\n\n<\/div><\/details>\n\n"},{"id":"karera","title":"Карьера: как попасть в инвестбанкинг","short":"Куда идти, как готовиться, резюме, собеседования, план на год","md":"> **Суть.** В IB берут тех, кто **уже** умеет базу: модели в Excel, оценку, понимание рынка. Путь почти всегда идёт через **стажировки**. Набор на летние стажировки в крупных банках начинается за 6–9 месяцев до лета, поэтому планировать надо заранее.\n\n## Куда идти в России\n\n| Тип | Примеры | Что делают |\n|---|---|---|\n| Инвестбанки при крупных банках | Сбер CIB, ВТБ (корпоративно-инвестиционный бизнес), Газпромбанк, Альфа-Банк, Т-Банк (инвестбанкинг) | M&A, размещения акций и облигаций, кредитование |\n| Брокеры и инвесткомпании | БКС, Финам, Атон, Ренессанс Капитал, Совкомбанк | ECM/DCM, аналитика (research), sales & trading |\n| Консалтинг (бывшая «большая четвёрка») | Kept, Б1, «Технологии Доверия», ДРТ | Оценка, финансовый due diligence, M&A advisory |\n| Фонды и управляющие | PE-фонды, УК (Альфа-Капитал, Сбер УК и др.) | Инвестиции в компании, управление активами |\n| Корпорации | M&A и корпфинансы крупных компаний | Сделки «изнутри», стратегия |\n\nСтартовые позиции: **стажёр → аналитик**. Хорошая точка входа без профильного диплома — **оценка и due diligence в консалтинге** или **аналитика (research)**.\n\n## Что нужно уметь (чек-лист)\n\n- ✅ Три формы отчётности и их связь — без запинки.\n- ✅ DCF целиком, WACC, мультипликаторы, мост EV → Equity.\n- ✅ Excel быстро, без мыши; простая трёхформенная модель с нуля за 2–3 часа.\n- ✅ PowerPoint: аккуратные слайды (таблица аналогов, «футбольное поле»).\n- ✅ Рынок: ключевая ставка, индекс Мосбиржи, крупные сделки и IPO последних месяцев, 2–3 компании, которые ты можешь разобрать подробно.\n- ✅ Английский (отчётность, терминология, часть интервью).\n\n## Резюме (CV)\n\n- **1 страница**, обратный хронологический порядок.\n- Образование (ВШЭ — сильный бренд; средний балл, если высокий), опыт (стажировки, проекты), навыки (Excel, финмоделирование, языки), достижения (олимпиады, кейс-чемпионаты).\n- Каждый пункт опыта — **глагол + результат + цифра**: «Построил DCF-модель угольного проекта; NPV 2,5 млрд ₽, IRR 28%».\n- Учебные проекты считаются: домашка по Project Black — это реальный опыт финмоделирования, его можно указать.\n\n## Собеседование: этапы\n\n1. **Онлайн-тесты**: логика, математика, английский, иногда Excel.\n2. **HR / fit-интервью**: «Почему IB?», «Почему наш банк?», «Расскажи о себе», «Сложная ситуация в команде». Готовь истории по схеме **STAR** (ситуация → задача → действие → результат).\n3. **Технические вопросы**: отчётность, оценка, WACC, мультипликаторы, LBO, рынок (см. главу «Вопросы с собеседований»).\n4. **Кейс / тест на модель**: построить мини-модель или оценить компанию за ограниченное время.\n5. **Superday**: несколько интервью подряд с сотрудниками разного уровня.\n\n**Почему IB (пример честного ответа):** «Мне интересно, как устроены компании и сделки; я хочу быстро учиться на реальных задачах; мне нравится сочетание анализа (модели, оценка) и работы с клиентами. Я уже построил модель проекта и разобрался в оценке — хочу делать это профессионально».\n\n## Кейс-чемпионаты и сообщества\n\n- Кейс-чемпионаты по финансам и M&A (участие и призовые места сильно помогают резюме).\n- Студенческие инвестиционные клубы и финансовые клубы вузов.\n- Курсы: Wall Street Prep, CFI, Breaking Into Wall Street (англ.); сертификат **CFA** (уровень I можно сдавать на последнем курсе).\n\n## План на учебный год\n\n| Когда | Что делать |\n|---|---|\n| Сейчас – декабрь | Пройти справочник целиком, решить практикум, сделать свою модель одной компании (например, Сбер или Лукойл) по МСФО |\n| Декабрь – февраль | Резюме, подача на летние стажировки, кейс-чемпионат |\n| Февраль – апрель | Тесты и интервью; ежедневно 15 минут новостей рынка (ставка ЦБ, сделки, IPO) |\n| Лето | Стажировка → оффер на следующий год |\n"},{"id":"project-black","title":"Разбор домашки: Project Black","short":"Угольный проект по листам модели — что откуда берётся и как защищать","md":"> **Суть задачи.** Инвестор думает, вкладываться ли в угольную шахту «Project Black» (коксующийся уголь, 2023–2040). Нужно достроить финмодель, посчитать **NPV, IRR и срок окупаемости** и проверить критерии: **NPV > 2 000 млн ₽, IRR > 20%, payback < 8 лет** (+ средняя EBITDA-маржа > 15%). Итог в базовом сценарии: **NPV 2 468 млн ₽, IRR 27,9%, окупаемость 5,8 года, EBITDA-маржа 30,4%** → все критерии выполнены.\n\n## Карта модели\n\n| Лист | Что там | Что делали мы |\n|---|---|---|\n| **Dashboard** | Итоги и таблицы сценариев | Ничего: сам подтягивается |\n| **Inputs** | Все допущения: макро, цена угля, добыча, ставка, затраты, CAPEX | Заполняли зелёные ячейки: выбор сценария, netback, WACC, дисконт, удельные затраты |\n| **Calc** | Выручка, затраты, CAPEX в номинале, амортизация, оборотный капитал, налог | Формулы по годам с учётом чувствительности (Sens_…) |\n| **Results** | FCFF, NPV, IRR, payback | Строки денежного потока |\n| **Handouts** | Таблицы для слайда | Подтягивается |\n| Damodaran, Ibbotson, CBR | Справочные данные: беты, ERP, премия за размер, ставки | Источники для WACC |\n\n**Зелёные ячейки** — то, что нужно было заполнить; всё остальное шаблон считает сам. Исходные данные шаблона не меняли, даже где они спорные.\n\n## 1. Макро: сценарии через ВЫБОР\n\nВ Inputs есть три набора макро (база, оптимистичный, пессимистичный): глобальная инфляция, российская инфляция, курс USD/RUB. Ячейка-переключатель (номер сценария) выбирает нужный:\n```f\n=ВЫБОР($B$18; база; оптимист; пессимист)        (англ. CHOOSE)\n```\nТак же выбирается сценарий цены угля (база / пессимист / оптимист / прогноз менеджмента).\n\n## 2. Цена угля: netback\n\nУголь продаётся с привязкой к мировой цене **HCC** (Hard Coking Coal) в порту покупателя. Шахта получает меньше: вычитаем всю логистику до шахты. Это **netback-цена** (цена «франко-станция Озёрное», FCA).\n\n```f\nNetback ($/т) = HCC − Фрахт (Япония–Восточный) − Перевалка в порту − Ж/д до станции\nЖ/д в $       = Ж/д в ₽ / курс\nNetback (₽/т) = Netback ($/т) × курс\n```\n2023 год: 90 − 3,15 − 10,50 − 21,63 (= 1 400 ₽ / 64,73) = **54,72 $/т × 64,73 ≈ 3 542 ₽/т**.\nФрахт и перевалка индексируются глобальной инфляцией (они в долларах), ж/д тариф — российской (он в рублях).\n\n## 3. Добыча и выручка\n\nДобыча растёт с 900 тыс. т (2023) до 1 300 тыс. т с 2026 года.\n```f\nВыручка = Netback (₽/т) × Добыча\n2023: 3 542 ₽/т × 900 тыс. т ≈ 3 188 млн ₽\n```\n\n## 4. Ставка дисконтирования (WACC)\n\nСчитается в долларах по CAPM, потом переводится в рубли.\n\n| Шаг | Формула | Значение |\n|---|---|---|\n| Безрисковая ставка (UST) | из исследования | 4,18% |\n| Премия за риск рынка (Дамодаран) | | 5,94% |\n| Бета без долга (угольная отрасль, Дамодаран) | | 1,43 |\n| Бета с долгом (Хамада) | 1,43 × (1 + (1 − 0,2) × 0,5) | **2,00** |\n| Премия за размер | Ibbotson | 3,05% |\n| Ke в долларах | 4,18% + 2,00 × 5,94% + 3,05% | **19,1%** |\n| Ke в рублях | пересчёт через инфляции (в шаблоне) | 19,9% |\n| Стоимость долга (кредиты нефинансовым компаниям, ЦБ) | | 13,86% |\n| Доли | D/E = 0,5 → D/V = 1/3, E/V = 2/3 | |\n| **WACC** | 2/3 × 19,9% + 1/3 × 13,86% × (1 − 0,2) | **16,95%** |\n\n> **На защите могут спросить про пересчёт Ke в рубли.** Учебниковая формула: (1 + Ke$) × (1 + π₽) / (1 + π$) − 1. С инфляциями из модели (2,19% и 3,50%) она даёт около 17,6%, а ячейка шаблона показывает 19,9%. Мы оставили шаблон без изменений; если спросят — честно скажи, что заметил расхождение и как правильно.\n\nНалог в модели 20% (ставка шаблона; с 2025 года в РФ 25% — тоже хороший вопрос для обсуждения).\n\n## 5. Дисконтирование середины года\n\nПотоки приходят в течение года, поэтому период дисконтирования: 2023 — 0 (год инвестиций), 2024 — 0,5, 2025 — 1,5 и т.д.\n```f\nКоэффициент = 1 / (1 + WACC)^период        2024: 1 / 1,1695^0,5 ≈ 0,925\n```\n\n## 6. Затраты (OPEX)\n\nУдельные затраты заданы в ценах 2023 года и индексируются российской инфляцией:\n- добыча 2 550 ₽/т, переработка 900 ₽/т, НДПИ 45 ₽/т (переменные, × объём);\n- административные 90 млн ₽ и вспомогательные 20 млн ₽ в год (постоянные).\n\n## 7. CAPEX и амортизация\n\n- CAPEX задан в **реальных ценах 2023 года**: рублёвая часть переводится в номинал российской инфляцией, долларовая — глобальной инфляцией и курсом.\n- Амортизация двумя группами: **оборудование** за 6 лет (16,7% в год) и **инфраструктура** за 10 лет (10% в год). Каждая годовая порция CAPEX амортизируется своим «окном» лет — поэтому в формулах сумма за скользящий период.\n\n## 8. Оборотный капитал и налог\n\n- Дебиторка = 5% выручки, кредиторка = 5% OPEX, запасы — из шаблона. В поток идёт **изменение** оборотного капитала.\n- Налог на прибыль с **переносом убытков**: убытки первых лет уменьшают налог потом, но не больше чем на 50% базы года (правило РФ).\n\n## 9. Итог: FCFF → NPV, IRR, payback\n\n```f\nFCFF = EBITDA − Налог − CAPEX − Δ Оборотный капитал\nNPV  = Σ FCFF × Коэффициент дисконтирования = 2 468 млн ₽\nIRR  = ВСД(FCFF) = 27,9%\nPayback = 5,8 года (накопленный поток становится положительным в 6-й год)\n```\n\n## 10. Сценарии и чувствительность\n\n**IRR по сценариям** (строки — цена угля, столбцы — макро):\n\n| Цена \\ Макро | База | Оптимист | Пессимист |\n|---|---|---|---|\n| **База** | **27,9%** | 32,0% | 24,9% |\n| Пессимист | 9,1% | 8,3% | 9,5% |\n| Оптимист | 70,8% | 105,3% | 53,3% |\n| Прогноз менеджмента | 43,5% | 56,5% | 35,0% |\n\n**NPV**, млн ₽: база 2 468; при пессимистичной цене угля −1 850…−2 420 (проект убыточен); при оптимистичной 5 700–7 240.\n\n**Вывод для слайда:** проект проходит все критерии в базе, но **очень чувствителен к цене угля** (главный риск): при пессимистичной цене NPV отрицательный. Макро (курс и инфляция) влияет меньше. Торнадо-диаграмма на слайде показывает это наглядно.\n\n## Вопросы, которые могут задать на защите\n\n<details class=\"qa\"><summary><span>1<\/span>Почему ставка дисконтирования в рублях, а CAPM в долларах?<\/summary><div>\n\nДля CAPM лучше данные по развитому рынку (UST, ERP и беты Дамодарана), а потоки проекта в рублях. Поэтому ставку переводят в рубли через разницу инфляций (паритет покупательной способности).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>2<\/span>Зачем премия за размер?<\/summary><div>\n\nПроект небольшой относительно публичных компаний; небольшие компании исторически рискованнее и доходнее (данные Ibbotson/Kroll).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>3<\/span>Почему бета 2,0?<\/summary><div>\n\nБезрычаговая бета угольной отрасли 1,43, плюс целевой долг D/E = 0,5 повышает риск акционеров: 1,43 × (1 + 0,8 × 0,5) = 2,0.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>4<\/span>Что такое netback и почему вычитаем логистику?<\/summary><div>\n\nМировая цена — в порту покупателя. Шахта получает цену на своей станции, поэтому вычитаем фрахт, перевалку и ж/д тариф.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>5<\/span>Почему нет терминальной стоимости?<\/summary><div>\n\nШахта конечна (запасы), модель идёт до конца срока проекта.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>6<\/span>Главный риск проекта?<\/summary><div>\n\nЦена угля: при пессимистичном сценарии цены IRR ≈ 9% < WACC, NPV < 0. Митигирование: долгосрочные контракты, хеджирование, снижение затрат.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>7<\/span>Почему дисконтируем на середину года?<\/summary><div>\n\nПотоки распределены в течение года, а не приходят 31 декабря; mid-year точнее.\n\n<\/div><\/details>\n\n"},{"id":"stazhirovka","title":"Собеседование на стажировку: мотивация и что шарить","short":"Почему брать тебя на 2 курсе, рынок на октябрь 2026, банки, бюджет, ОФЗ","md":"> **Суть.** На стажировку в IB берут не за диплом, а за три вещи: **мотивация** (понятно, зачем тебе это), **понимание рынка** (можешь поговорить о ставке, ОФЗ, бюджете, секторах) и **техническая база** (мультипликаторы, DCF, почему банки оценивают иначе). Ниже — готовые ответы и цифры на октябрь 2026 с источниками.\n\n## Почему ты, а не четверокурсник\n\nРаботодатель думает: «Зачем брать второкурсника?» Твой ответ — это твои преимущества:\n\n| Твой аргумент | Почему он работает |\n|---|---|\n| **Долгий горизонт** | Ты можешь работать 2–3 года до выпуска. Банк вкладывается в обучение один раз и получает аналитика, который уже знает их процессы к 4 курсу. Четверокурсник уйдёт через год. |\n| **Гибкий график** | 20–30 часов в неделю, можно наращивать. Сбер CIB прямо берёт со 2 курса и допускает совмещение с учёбой. |\n| **Уже есть база** | Ты построил DCF-модель угольного проекта (NPV, IRR, WACC с CAPM и бетой по Хамаде, сценарии, чувствительность). Это то, чем стажёр занимается в первый месяц. |\n| **Юридическое образование** | В M&A и ECM половина работы — документы: SPA, due diligence, корпоративные одобрения, проспекты. Юрист с финансовой базой понимает и модель, и договор. Это редкое сочетание. |\n| **Мотивация, а не «надо куда-то»** | Ты сам выбрал финансы на юрфаке, учишься по Розенбауму и Дамодарану, следишь за рынком каждый день. |\n\n### Ответ «Почему IB и почему сейчас» (на 60 секунд)\n\n> «Я учусь на юрфаке ВШЭ, но меня всегда тянуло к тому, как устроены сделки целиком: не только договор, но и почему компания стоит столько, сколько стоит. В этом семестре я построил свою первую DCF-модель — угольный проект, считал WACC через CAPM, перевод ставки в рубли, сценарии цены угля. Понял, что мне это нравится больше всего. Я каждый день слежу за рынком: сейчас ставка 14%, ЦБ взял паузу, длинные ОФЗ около 16,6–16,9%, бюджет сильно дефицитный. Хочу начать сейчас, на втором курсе, потому что за 2–3 года до выпуска смогу вырасти в полноценного аналитика внутри команды, а юридическая база поможет в документации по сделкам».\n\n**Чего не говорить:** «хочу много зарабатывать», «не знаю, чем ещё заняться», «мне всё равно, какой отдел».\n\n### Структура ответов на fit-вопросы (STAR)\n**S**ituation → **T**ask → **A**ction → **R**esult. Подготовь 3 истории: сложный проект (Project Black), работа в команде, ситуация, где ты ошибся и исправил.\n\n## Рынок: что знать наизусть (октябрь 2026)\n\n| Показатель | Значение | Источник |\n|---|---|---|\n| Ключевая ставка | **14%**; 11.09.2026 ЦБ впервые за год прервал снижение; следующее заседание **23.10.2026** | [ЦБ](https://www.cbr.ru/press/keypr/) |\n| Инфляция | **6,35% г/г** (сентябрь); прогноз ЦБ на 2026 — 6–7% | [Эксперт / Росстат](https://expert.ru/news/godovaya-inflyatsiya-v-rossii-v-sentyabre-sostavila-635) |\n| ОФЗ 10 лет | **16,6–16,9%** (КБД 16,64% на 12.10; по G-кривой ~16,9% на 29.09), спред к ставке ~290 б.п. | [ЦБ КБД](https://www.cbr.ru/hd_base/zcyc_params/), [ПСБ/Финмаркет](https://www.finmarket.ru/database/analytics/6717226) |\n| Индекс Мосбиржи | ~2 390 (12.10.2026), летом опускался ниже 2 000 | [Ведомости](https://www.vedomosti.ru/investments/articles/2026/10/13/1236524-utrennii-zvon) |\n| Нефть | Brent ~$106 (13.10, из-за Ближнего Востока); Urals в сентябре $92,08 | [Интерфакс](https://www.interfax.ru/business/1122176), [Лента](https://lenta.ru/news/2026/10/05/urals/) |\n| Ставка ФРС | 3,75–4,00% (повышение 16.09.2026) | [ФРС](https://www.federalreserve.gov/newsevents/pressreleases/monetary20260916a.htm) |\n\n### Почему длинные ОФЗ дают больше ключевой ставки (кривая растущая)\n1. **Много предложения.** Минфин занимает больше из-за дефицита: чистое привлечение на 2026 год повышено до **5,0 трлн ₽**, в IV квартале план 2,45 трлн, половина — бумаги от 10 лет. 30 сентября аукцион вообще отменили — не было спроса по приемлемым ценам ([Коммерсантъ](https://www.kommersant.ru/doc/8989894), [Интерфакс](https://www.interfax.ru/russia/1119745)).\n2. **Пауза ЦБ.** Рынок перестал ждать быстрого снижения ставки ([ПСБ](https://www.finmarket.ru/database/analytics/6717226)).\n3. **Инфляционные и бюджетные риски.** Ожидания населения выросли до 14,2%, дефицит бюджета в 2 раза выше плана ([Финам](https://www.finam.ru/publications/item/dokhodnosti-po-dlinnym-ofz-k-kontsu-goda-mogut-skhodit-k-17-20260924-0910/)).\n4. **Премия за срок** — за то, что держишь бумагу долго в неопределённости.\n\n### Бюджет (частый вопрос)\n\n| Показатель | Значение | Источник |\n|---|---|---|\n| Дефицит 2026 по закону | 3,8 трлн ₽ (1,6% ВВП) | [Интерфакс](https://www.interfax.ru/business/1119496) |\n| Новая оценка Минфина на 2026 | **7,3 трлн ₽ (3,2% ВВП)** — вдвое больше закона | там же |\n| Факт январь–сентябрь | дефицит 5,19 трлн ₽ (2,2% ВВП); расходы +14,5% г/г, доходы +10% | [Ведомости](https://www.vedomosti.ru/economics/news/2026/10/09/1235952-defitsit-byudzheta) |\n| Нефтегазовые доходы, 9 мес. | 5,47 трлн ₽ (**−17%** г/г) из-за демпфера; план года снижен до 7,6 трлн | [Moscow Times](https://ru.themoscowtimes.com/2026/10/05/neftegazovye-dokhody-byudzheta-rf-v-sentyabre-upali-na-22-gg-za-9-mes-na-17-a207775) |\n| Проект на 2027 | дефицит 5,4 трлн (2,2% ВВП); **базовая цена нефти $50** (было $59); внесён 30.09, первое чтение 29.10 | [Коммерсантъ](https://www.kommersant.ru/doc/8991082) |\n| ФНБ, ликвидная часть | 3,8 трлн ₽ (1,6% ВВП) на 01.10.2026 | [Moscow Times](https://ru.themoscowtimes.com/2026/10/07/likvidnye-rezervy-rf-umenshilis-v-sentyabre-do-16-vvp-a208031) |\n| Налоги в проекте | дивиденды и проценты — в общую прогрессивную шкалу НДФЛ; налог 30% на сверхдоход ГМК | [Ведомости](https://www.vedomosti.ru/economics/articles/2026/09/24/1231407-minfin-vnes) |\n\n**Как связать в ответе:** большой дефицит → Минфин больше занимает → давление на ОФЗ и доходности растут → ЦБ осторожнее снижает ставку (бюджетный импульс проинфляционный) → выше ставка дисконтирования → ниже оценки компаний.\n\n## Банки: почему P/B и ROE, а не EV/EBITDA\n\nУ банка долг — это **сырьё**, а не способ финансирования; проценты — его выручка и себестоимость. Поэтому EV, FCFF и EBITDA для банка не определены. Дамодаран: мультипликаторы стоимости компании «cannot be easily adapted», зато P/E и P/B «are a much better fit», а на P/B сильнее всего влияет ROE ([Дамодаран, гл. 21](https://pages.stern.nyu.edu/~adamodar/pdfiles/val3ed/c21.pdf)).\n\n```f\nСправедливый P/B ≈ (ROE − g) / (Ke − g)\nROE > Ke  →  банк стоит дороже капитала (P/B > 1)\nROE < Ke  →  дешевле (P/B < 1)\n```\n\n| | Сбербанк | ВТБ | Т-Технологии |\n|---|---|---|---|\n| ROE | **24%** (2К26, МСФО) | 16,7% (8 мес.) | **28%** (2К26) |\n| Стоимость риска (CoR) | 1,0% | 0,9% | 4,7% (розничные кредиты, кредитки) |\n| NIM | 6,7% | 2,6% | 11,6% |\n| Капитал | CET1 12,6%; Н20.0 группы 15,1% | **Н20.0 10,4% при минимуме 10%** | CET1 11,8%; Н1.0 12,5% |\n| P/B | 0,76 | **0,26** | 0,96 |\n| Почему так | Высокий ROE, стабильные дивиденды 50% прибыли | Капитал на минимуме, урезанные дивиденды, допэмиссия по 87 ₽ при цене ~51 ₽ (размытие) | Самый высокий ROE и рост, но выше риск (CoR) |\n\nИсточники: [Интерфакс о Сбере](https://www.interfax.ru/business/1106241), [smart-lab: Сбер 2К26](https://smart-lab.ru/blog/1334502.php), [БКС о ВТБ](https://bcs-express.ru/novosti-i-analitika/rossiyskiy-rynok/vtb-otchitalsia-za-avgust-i-soobshchil-o-srokakh-zakrytiia-sdelki-s-rwb), [Финуслуги о Т](https://finuslugi.ru/navigator/investirovat/stat_vosem-tsifr-otchyota-t-tekhnologiy-za-ii-kvartal-2026-goda-kak-chitat-ikh-po-poryadku), мультипликаторы — smart-lab LTM на 13.10.2026.\n\n**Термины:**\n- **CoR (cost of risk)** — резервы под плохие кредиты за год / средний кредитный портфель. Рост CoR съедает прибыль.\n- **CET1 / Н1.0 / Н20.0** — достаточность капитала: сколько собственного капитала на рисковые активы. Ниже норматива нельзя платить дивиденды и быстро расти. Н20.0 — норматив банковской группы.\n- **NIM** — чистая процентная маржа: сколько банк зарабатывает на разнице ставок.\n\n## Positive Technologies vs Яндекс: почему у Positive EV/EBITDA выше\n\n| | Positive (POSI) | Яндекс (YDEX) |\n|---|---|---|\n| EV/EBITDA LTM | **5,9×** | **4,6×** |\n| P/E LTM | 7,2× | 7,6× |\n| Масштаб EBITDA LTM | 15,6 млрд ₽ | 328 млрд ₽ |\n\nПочему рынок платит за Positive больше на рубль EBITDA:\n1. **Ожидания роста.** Компания ждёт отгрузок 40–45 млрд ₽ в 2026 году против 33,6 млрд в 2025-м (+20–35%), рынок кибербезопасности растёт на импортозамещении и требованиях регуляторов.\n2. **Сезонность.** 60–70% отгрузок приходится на IV квартал, поэтому прибыль за последние 12 месяцев (LTM) в середине года занижена → мультипликатор выглядит выше. Аналитики прямо говорят: «всё решит IV квартал» ([Коммерсантъ](https://www.kommersant.ru/doc/8845714), [rb.ru](https://rb.ru/news/akcii-positive-technologies-vzleteli-na-7-polugodovoj-otchet-kompanii-prevzoshel-prognozy-analitikov/), [блог компании](https://smart-lab.ru/company/positive-technologies/blog/1333756.php)).\n3. **Высокая валовая маржа** (7,3 млрд валовой прибыли из 9,5 млрд выручки в 1П26) — программный продукт масштабируется дёшево.\n\nНо премия сильно сжалась: в 2021–2024 годах EV/EBITDA Positive был 12–25×, а после провала прогноза 2024 года, роста расходов, долга и допэмиссии — около 6× ([InvestFuture](https://investfuture.ru/articles/pozitiv-negativit-pochemu-on-upal-na-30)).\n\nПочему Яндекс дешевле: конгломератный дисконт (поиск, такси, e-com, финтех — рынок не понимает, сколько стоит каждая часть), размытие из-за программы акций для сотрудников, а в октябре — **удары по дата-центрам** (Сасово 8.10, Калуга 9.10, Владимир 11.10; −7,7% за два дня) ([Интерфакс](https://www.interfax.ru/business/1121210), [Коммерсантъ](https://www.kommersant.ru/doc/9025823)). По оценке «Эйлера», Яндекс торгуется с дисконтом 23–31% к техсектору ([Прайм](https://1prime.ru/20260615/yandex-870779225.html)).\n\n**Как отвечать на собесе:** «Мультипликатор — это ожидания. Positive дороже на рубль EBITDA, потому что рынок закладывает быстрый рост и знает, что LTM-EBITDA в середине года занижена сезонностью. Яндекс — диверсифицированный конгломерат с дисконтом и сейчас с операционными рисками».\n\n## Медианные мультипликаторы по секторам РФ\n\n| Сектор | P/E | EV/EBITDA | Почему такой |\n|---|---|---|---|\n| Финансы | 3,6× | — | высокая ставка, P/B вместо EV |\n| Электроэнергетика | 3,1× | 2,2× | регулируемые тарифы, госучастие |\n| Нефтегаз | 5,0× | 4,2× | санкции, налоги, цена нефти |\n| Потребсектор | 6,4× | 4,7× | |\n| IT | 8,4× | 5,7× | рост |\n| Промышленность | 12,6× | 5,8× | |\n\nИсточник: [fin-vista](https://fin-vista.ru/market), 13.10.2026. Подробно — вкладка «Рынки».\n\n## 15 вопросов, которые реально задают (с короткими ответами)\n\n<details class=\"qa\"><summary><span>1<\/span>Какая сейчас ключевая ставка и что будет 23 октября?<\/summary><div>\n\n14%. Решение заранее неизвестно — покажи логику. Против снижения: инфляция 6–7%, ускорение в октябре из-за тарифов, рост инфляционных ожиданий, большой бюджетный дефицит. За снижение: высокая реальная ставка (14% − 6,35% ≈ 7,6%) и охлаждение экономики.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>2<\/span>Сколько дают 10-летние ОФЗ и почему больше ставки?<\/summary><div>\n\nОколо 16,6–16,9%. Большие заимствования Минфина, пауза ЦБ, инфляционные и бюджетные риски, премия за срок.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>3<\/span>Что происходит с бюджетом?<\/summary><div>\n\nДефицит 2026 оценивается в 3,2% ВВП вместо 1,6% по закону, нефтегазовые доходы −17% из-за демпфера; в проекте 2027 базовая цена нефти снижена до $50.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>4<\/span>Почему банки не оценивают по EV/EBITDA?<\/summary><div>\n\nДолг — сырьё банка, проценты — выручка. Оценка через P/B, P/E, DDM, остаточную прибыль; P/B зависит от ROE против Ke.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>5<\/span>Почему ВТБ стоит 0,26 капитала, а Т — почти 1?<\/summary><div>\n\nROE ВТБ ниже и капитал на минимуме (Н20.0 10,4%), допэмиссия размывает акционеров; у Т ROE 28% и рост.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>6<\/span>Что такое стоимость риска?<\/summary><div>\n\nРезервы под плохие кредиты к кредитному портфелю. У Т-Технологий высокая (4,7%) из-за розницы, у Сбера около 1%.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>7<\/span>Почему у Positive EV/EBITDA выше, чем у Яндекса?<\/summary><div>\n\nОжидания роста, сезонность (LTM занижена), маржинальный софт; Яндекс — конгломерат с дисконтом.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>8<\/span>Какие мультипликаторы у российского рынка и почему такие низкие?<\/summary><div>\n\nМедианный P/E около 7×, у индекса ниже 5×. Высокая ставка и стоимость капитала (~23% у брокеров), санкции, уход иностранцев.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>9<\/span>Как ставка влияет на оценку компаний?<\/summary><div>\n\nRf ↑ → Ke и WACC ↑ → PV потоков ↓; плюс дороже долг. Сильнее всего страдают закредитованные компании, девелоперы, акции роста.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>10<\/span>Почему упал «Полюс» в июле?<\/summary><div>\n\nПредложил не платить дивиденды до 2030 года ради инвестпроектов и из-за дорогого долга: −18% на открытии ([Интерфакс](https://www.interfax.ru/business/1101916)).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>11<\/span>Что такое дивидендный гэп?<\/summary><div>\n\nПосле отсечки цена падает примерно на размер дивиденда (Сбер −7%, Транснефть −14% в июле 2026).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>12<\/span>Почему нефтяники выросли 12 октября?<\/summary><div>\n\nДоговорённость России и США о поставках дизеля и временная лицензия OFAC: индекс +3,1%, «Роснефть» +9% ([Интерфакс](https://www.interfax.ru/business/1121925)).\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>13<\/span>Как перевести долларовую ставку в рубли?<\/summary><div>\n\n(1 + K$) × (1 + π₽) / (1 + π$) − 1.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>14<\/span>Расскажи про любую сделку, за которой следил.<\/summary><div>\n\nСм. главу «Реальные кейсы»: например, покупка банка «Точка» Т-Технологиями за 84,8 млрд ₽ с оплатой акциями по 320 ₽.\n\n<\/div><\/details>\n\n\n<details class=\"qa\"><summary><span>15<\/span>Зачем банку стажёр-юрист?<\/summary><div>\n\nСделки — это документы: due diligence, SPA, корпоративные одобрения, проспект эмиссии. Я понимаю и модель, и договор.\n\n<\/div><\/details>\n\n\n## Куда подаваться\n\n| Банк | Что известно | Источник |\n|---|---|---|\n| **Сбер CIB** | Стажировка «корпоративно-инвестиционный бизнес», **со 2 курса**, 20–40 ч/нед, до 81 300 ₽/мес; наборы волнами (весна) | [Сбер студентам](https://sberstudent.ru/internship/), [Банкинформ](https://bankinform.ru/news/137007) |\n| ВТБ (КИБ) | «ВТБ Юниор», есть управление инвестбанкинга; старшие курсы, 40 ч/нед; подача весной | [ВТБ](https://rabota.vtb.ru/internship/), [Changellenge](https://changellenge.com/event/vtb-unior-go/) |\n| Альфа-Банк | Общая стажировка (аналитика, финансы), окно в апреле–мае | |\n| Газпромбанк, Совкомбанк | Программы для 3 курса и старше | |\n\n**Совет:** пик набора — март–май, старт летом. Готовь резюме к февралю, параллельно пиши напрямую через карьерный центр ВШЭ и LinkedIn/Telegram-каналы банков.\n"},{"id":"keysy","title":"Реальные кейсы: сделки и истории 2025–2026","short":"IPO, SPO, M&A в России и мире — что произошло и чему это учит","md":"> **Как пользоваться.** Каждый кейс — это готовая история для собеседования: что произошло, цифры, источник и **вывод** (какую теорию он иллюстрирует). Выбери 2–3 и разберись в них досконально — на вопрос «расскажи про сделку, за которой следил» это лучший ответ.\n\n## Кейс 1. Т-Технологии покупают банк «Точка» (M&A, оплата акциями)\n\n- **Что:** Т-Технологии покупают 100% банка «Точка» за **84,8 млрд ₽**. 64% оплачивается **своими новыми акциями по 320 ₽** (на 27% дороже рынка), 36% — деньгами в долг. Условия утверждены 01.10.2026, закрытие — конец 2026 года.\n- **Сверка цены:** «Интеррос» ранее купил 25% «Точки» у VK за 21,2 млрд ₽ — это те же 84,8 млрд за 100%.\n- **Логика:** усилить бизнес для малого и среднего бизнеса (B2B); «Точка» сохраняет бренд и команду.\n- **Источники:** [Т—Ж](https://t-j.ru/news/t-i-tochka/), [InvestFuture](https://investfuture.ru/articles/vk-prodaet-25-aktsiy-tochka-banka-interrosu-za-21-2-mlrd-rubley-1178393488)\n\n**Чему учит:** оплата акциями vs деньгами (глава «M&A и LBO»); цена допэмиссии выше рынка: покупатель выпускает меньше акций (меньше размытие), а реальная стоимость сделки для продавца по рыночной цене ниже номинальных 84,8 млрд; сделки-аналоги (цена пакета 25% как ориентир).\n\n## Кейс 2. Яндекс продаёт Авто.ру Т-Технологиям (продажа непрофильного актива)\n\n- **Что:** анонс 18.03.2026, закрыта 02.06.2026, цена **35 млрд ₽** (в долг). Яндекс признал прибыль около 25,7 млрд ₽.\n- **Логика покупателя:** автоэкосистема (автокредиты, страхование), синергии от 45 млрд ₽ операционного дохода за 3 года. **Логика продавца:** высвободить капитал, сфокусироваться.\n- **Источники:** [Moscow Times](https://ru.themoscowtimes.com/2026/03/18/ndeks-prodal-t-tekhnologiyam-servis-avtoru-za-35-mlrd-r-a190052), [Профиль](https://profile.ru/news/economy/t-tehnologii-zakryli-sdelku-po-pokupke-avto-ru-za-35-mlrd-rublej-1866906/amp/)\n\n**Чему учит:** синергии как обоснование премии; продажа части бизнеса и SOTP-оценка конгломерата.\n\n## Кейс 3. ВТБ: SPO по 87 ₽ при цене рынка около 51 ₽ (размытие)\n\n- **Что:** допэмиссия до 6,3 млрд акций по **87 ₽** (до 547,5 млрд ₽) для партнёрства с Wildberries; закрытие ожидалось в конце октября 2026. Рыночная цена в сентябре — около 51 ₽, то есть SPO на ~69% дороже рынка. Акция обновила исторический минимум 49,7 ₽ в августе — давит «навес» допэмиссии.\n- **Контекст:** норматив капитала Н20.0 — 10,4% при минимуме 10%, поэтому банку нужен капитал; дивиденды урезаны.\n- **Источники:** [Эксперт](https://expert.ru/news/aktsionery-vtb-utverdili-dopemissiyu-na-314-mlrd-rubley), [Moscow Times](https://ru.themoscowtimes.com/2026/09/24/vtb-sdvinul-spo-na-oktyabr-uveren-v-sdelke-a206891), [Коммерсантъ](https://www.kommersant.ru/doc/8910061)\n\n**Чему учит:** почему банк с низким капиталом торгуется по P/B 0,26; размытие доли акционеров; «навес» предложения давит на цену.\n\n## Кейс 4. «Полюс» отказывается от дивидендов до 2030 года\n\n- **Что:** 08.07.2026 менеджмент предложил не платить дивиденды до 2030 года из-за крупных инвестпроектов, дорогого долга и роста налогов. На открытии **−18%**, за три дня — более **−30%**. Следом упал Норникель (−7,5% в моменте) на страхе, что пример заразителен.\n- **Источники:** [Интерфакс](https://www.interfax.ru/business/1101916), [Ведомости](https://www.vedomosti.ru/investments/news/2026/07/08/1212136-aktsii-nornikelya)\n\n**Чему учит:** в России инвесторы платят за дивиденды (DDM и дивидендная доходность важнее роста); реинвестировать имеет смысл, только если ROIC > WACC — рынок в этом усомнился при ставке 14%.\n\n## Кейс 5. Удары по дата-центрам Яндекса (операционный риск)\n\n- **Что:** 8 октября 2026 атака беспилотника остановила ЦОД в Сасове (Рязанская обл.) — YDEX −3,4%; 9 октября повреждён ЦОД в Калуге — −4,8%; 11 октября остановлен ЦОД во Владимире. За два дня −7,7%, от пика 7 октября около −12%. 13 октября отскок примерно +3% на восстановлении сервисов.\n- **Источники:** [Интерфакс 8.10](https://www.interfax.ru/business/1121210), [Интерфакс 9.10](https://www.interfax.ru/business/1121475), [Коммерсантъ 13.10](https://www.kommersant.ru/doc/9025823)\n\n**Чему учит:** не все риски в модели финансовые — операционные (инфраструктура) мгновенно отражаются в цене; разница между временным ущербом (отскок) и изменением долгосрочных потоков.\n\n## Кейс 6. Санкции против «Роснефти» и ЛУКОЙЛа и продажа зарубежных активов\n\n- **Что:** 23.10.2025 США ввели блокирующие санкции против двух крупнейших нефтяников; индекс −3,1%. ЛУКОЙЛ начал продавать LUKOIL International: сделка с Gunvor сорвалась без лицензии OFAC (07.11.2025, −4,2%), в январе 2026 — договорённость с Carlyle (+3,2%).\n- **Источники:** [Коммерсантъ](https://www.kommersant.ru/doc/8142098), [Коммерсантъ](https://www.kommersant.ru/doc/8181806), [Интерфакс](https://www.interfax.ru/business/1070030)\n\n**Чему учит:** вынужденная продажа (distressed M&A) — продавец без переговорной силы, регуляторные одобрения (OFAC) как условие закрытия сделки.\n\n## Кейс 7. IPO ДОМ.РФ vs IPO МТС Банка (почему одни IPO растут, другие падают)\n\n| | ДОМ.РФ | МТС Банк |\n|---|---|---|\n| Дата | 20.11.2025 | апрель 2024 |\n| Объём | 25 млрд ₽ (cash-in), free float 10,1% | 11,5 млрд ₽ |\n| Цена | 1 750 ₽, капитализация ~315 млрд | 2 500 ₽ (верх диапазона) |\n| Что потом | ~2 058 ₽ (**+18%**), P/BV 0,77 | ~965 ₽ (**−61%**), P/B 0,29 |\n\nИсточники: [Финансы Mail](https://finance.mail.ru/article/dom-rf-provel-ipo-i-privlek-25-mlrd-na-moskovskoy-birzhe-68787249/), [Доход](https://www.dohod.ru/analytic/research/ipo-dom-rf), [Moscow Times](https://ru.themoscowtimes.com/2024/05/30/factbox-ipo-spo-i-pryamye-listingi-kompaniy-s-aktivami-v-rf-v-2024-godu-a132417)\n\n**Чему учит:** дисконт к IPO и цена размещения (верх диапазона на пике ажиотажа — риск); оценка банка по P/B; в 2024 году было 14 размещений, в 2025-м — всего 4 ([Т—Ж](https://t-j.ru/ipo-2026/)).\n\n## Кейс 8. Сбер покупает 41,9% «Элемента» у АФК «Система»\n\n- **Что:** январь 2026, 27 млрд ₽, оферта миноритариям по 0,1372 ₽ — примерно на **39% ниже цены IPO** 2024 года (0,2236 ₽).\n- **Источник:** [InvestFuture](https://investfuture.ru/articles/detali-sdelki-sber-kupil-41-9-v-elemente-u-afk-sistema-za-27-mlrd-rubley)\n\n**Чему учит:** обязательное предложение (оферта) миноритариям при смене контроля; продажа с долговой нагрузкой у продавца («Система» сокращает долг).\n\n## Мировые кейсы\n\n| Сделка | Цифры | Чему учит | Источник |\n|---|---|---|---|\n| **IPO SpaceX** (июнь 2026) | $85,7 млрд с опционом — крупнейшее IPO в истории; $135 за акцию, оценка $1,77 трлн, +19% в первый день | Book-building, greenshoe, оценка роста | [Forbes](https://www.forbes.com/sites/tylerroush/2026/06/15/spacex-says-historic-ipo-raised-more-than-85-billion/), [NPR](https://www.npr.org/2026/06/11/nx-s1-5853199/spacex-ipo-price-elon-musk) |\n| **Paramount Skydance → Warner Bros. Discovery** (2026) | ~$110 млрд; Netflix ранее договорился о покупке части бизнеса за $82,7 млрд, но не стал повышать цену и получил $2,8 млрд компенсации (break fee) | Конкурирующие предложения, break fee | [FMT](https://www.freemalaysiatoday.com/category/business/2026/04/24/warner-bros-discovery-shareholders-approve-paramount-deal), [Yahoo Finance](https://finance.yahoo.com/news/m-boomed-were-top-5-194817836.html) |\n| **Union Pacific → Norfolk Southern** (2025) | $88 млрд с долгом | Стратегические синергии, антимонопольное одобрение | [Yahoo Finance](https://finance.yahoo.com/news/m-boomed-were-top-5-194817836.html) |\n| **PIF + Silver Lake + Affinity → Electronic Arts** (2025) | $55 млрд — рекордный LBO в игровой индустрии | Структура LBO, роль суверенных фондов | там же |\n\n## Рынок M&A в России: контекст\nВ I квартале 2026 года объём M&A — $5,3 млрд (−28% г/г), ни одной сделки дороже $1 млрд ([Коммерсантъ / AK&M](https://www.kommersant.ru/doc/8692111)). Типичные сделки сейчас: выход иностранных компаний с дисконтом (Citi продал российский бизнес «Ренессанс Капиталу»), консолидация внутри экосистем (Т, Сбер), продажа национализированных активов на торгах.\n\n> **Совет:** заведи заметку «мои 3 сделки» — для каждой: кто, что, сколько, мультипликатор (если известен), логика, риски, чем закончилось. Это лучший ответ на «Расскажи о сделке».\n"},{"id":"glossariy","title":"Глоссарий","short":"Термины и сокращения от A до Я","md":"| Термин | Расшифровка | Значение |\n|---|---|---|\n| **ABB** | Accelerated Bookbuilding | Быстрое (1–2 дня) размещение пакета акций среди институциональных инвесторов |\n| **Accretion / Dilution** | | Рост / снижение EPS покупателя после сделки |\n| **APV** | Adjusted Present Value | Стоимость без долга + PV налогового щита |\n| **ARPU** | Average Revenue Per User | Средняя выручка на пользователя (телеком, интернет) |\n| **ARR** | Annual Recurring Revenue | Годовая повторяющаяся выручка (SaaS) |\n| **Beta (β)** | | Чувствительность акции к рынку |\n| **Bookrunner** | | Банк, ведущий книгу заявок при размещении |\n| **CAGR** | Compound Annual Growth Rate | Среднегодовой темп роста: (Конец/Начало)^(1/n) − 1 |\n| **CAPEX** | Capital Expenditures | Капитальные затраты (покупка ОС) |\n| **CAPM** | Capital Asset Pricing Model | Модель: Ke = Rf + β × ERP |\n| **CET1** | Common Equity Tier 1 | Базовый капитал банка (Базель III) |\n| **CFO** | Cash Flow from Operations | Операционный денежный поток: деньги от основной деятельности |\n| **CFI** | Cash Flow from Investing | Инвестиционный поток: CAPEX, покупка и продажа активов и компаний |\n| **CFF** | Cash Flow from Financing | Финансовый поток: долг, дивиденды, байбэки, эмиссия акций |\n| **CIM** | Confidential Information Memorandum | Подробный меморандум о продаваемой компании |\n| **CIR** | Cost-to-Income Ratio | Расходы / доходы банка |\n| **CoR** | Cost of Risk | Стоимость риска (резервы / кредиты) |\n| **CRP** | Country Risk Premium | Страновая премия за риск |\n| **D&A** | Depreciation & Amortization | Амортизация ОС и НМА |\n| **DCF** | Discounted Cash Flow | Оценка по дисконтированным денежным потокам |\n| **DCM** | Debt Capital Markets | Долговой рынок капитала |\n| **DDM** | Dividend Discount Model | Модель дисконтирования дивидендов |\n| **DPS** | Dividend Per Share | Дивиденд на акцию |\n| **DSO / DIO / DPO** | Days Sales / Inventory / Payables Outstanding | Дни оборота дебиторки / запасов / кредиторки |\n| **Due diligence (DD)** | | Комплексная проверка компании перед сделкой |\n| **EBIT** | Earnings Before Interest & Taxes | Операционная прибыль до процентов и налогов |\n| **EBITDA** | Earnings Before Interest, Taxes, D&A | Прибыль до процентов, налогов и амортизации |\n| **ECM** | Equity Capital Markets | Рынок акционерного капитала (IPO, SPO) |\n| **EPS** | Earnings Per Share | Прибыль на акцию |\n| **ERP** | Equity Risk Premium | Премия за риск вложений в акции |\n| **EV** | Enterprise Value | Стоимость бизнеса (капитал + чистый долг + …) |\n| **EVA** | Economic Value Added | (ROIC − WACC) × Инвестированный капитал |\n| **FCF** | Free Cash Flow | Свободный денежный поток: деньги, которые остаются после операционных расходов, налогов и инвестиций |\n| **FCFF** | Free Cash Flow to Firm | Свободный поток всем инвесторам (до долга): EBIT×(1−t) + D&A − CAPEX − ΔNWC. Дисконтируется по WACC |\n| **FCFE** | Free Cash Flow to Equity | Свободный поток акционерам (после долга). Дисконтируется по Ke |\n| **FFO** | Funds From Operations | Денежная прибыль REIT |\n| **Free float** | | Доля акций в свободном обращении |\n| **Goodwill** | | Превышение цены покупки над справедливой стоимостью чистых активов |\n| **Greenshoe** | | Опцион организатора на доп. размещение (до 15%) для стабилизации цены |\n| **ICR** | Interest Coverage Ratio | Покрытие процентов (EBIT / проценты) |\n| **IFRS / МСФО** | International Financial Reporting Standards | Международные стандарты отчётности |\n| **IPO** | Initial Public Offering | Первичное публичное размещение: компания впервые продаёт акции на бирже |\n| **SPO** | Secondary Public Offering | Вторичное размещение акций уже публичной компании |\n| **IRR** | Internal Rate of Return | Внутренняя норма доходности (ставка, при которой NPV = 0) |\n| **LBO** | Leveraged Buyout | Покупка компании преимущественно за счёт долга |\n| **Lock-up** | | Запрет продавать акции после IPO (обычно 180 дней) |\n| **LTM / TTM / NTM** | Last / Trailing / Next Twelve Months | Последние / следующие 12 месяцев |\n| **M&A** | Mergers & Acquisitions | Слияния и поглощения |\n| **MAC** | Material Adverse Change | Оговорка о существенном негативном изменении |\n| **MoM / MOIC** | Multiple of Money / Multiple on Invested Capital | Во сколько раз выросли вложения |\n| **MVA** | Market Value Added | Рыночная стоимость − инвестированный капитал |\n| **NAV** | Net Asset Value | Стоимость чистых активов |\n| **NBO / BO** | (Non-) Binding Offer | (Не)обязывающее предложение о покупке |\n| **NCI** | Non-Controlling Interest | Доли меньшинства |\n| **NDA** | Non-Disclosure Agreement | Соглашение о конфиденциальности |\n| **Net Debt** | | Чистый долг = Долг − Денежные средства |\n| **NIM** | Net Interest Margin | Чистая процентная маржа банка |\n| **NOPAT** | Net Operating Profit After Tax | EBIT × (1 − t) |\n| **NPL** | Non-Performing Loans | Проблемные кредиты |\n| **NPV** | Net Present Value | Чистая приведённая стоимость |\n| **NWC** | Net Working Capital | Чистый оборотный капитал |\n| **OPEX** | Operating Expenses | Операционные расходы |\n| **P/E** | Price to Earnings | Капитализация / чистая прибыль (= цена / EPS). За сколько лет прибыли окупится покупка компании |\n| **P/B** | Price to Book | Капитализация / балансовый собственный капитал. Главный мультипликатор для банков |\n| **P/S** | Price to Sales | Капитализация / выручка. Для убыточных и быстрорастущих компаний |\n| **Payback** | | Срок окупаемости |\n| **PE (Private Equity)** | | Фонды прямых инвестиций |\n| **PEG** | P/E to Growth | P/E, делённый на темп роста EPS |\n| **PI** | Profitability Index | PV потоков / инвестиции |\n| **PIK** | Payment-in-Kind | Проценты, которые капитализируются в долг вместо выплаты |\n| **RAB** | Regulatory Asset Base | Регулируемая база активов (сети, инфраструктура) |\n| **Rf** | Risk-free rate | Безрисковая ставка |\n| **RI** | Residual Income | Остаточная прибыль: ЧП − Ke × Капитал |\n| **ROE** | Return on Equity | Чистая прибыль / собственный капитал. Доходность денег акционеров |\n| **ROA** | Return on Assets | Чистая прибыль / активы. Для банков норма 1–3% |\n| **ROIC** | Return on Invested Capital | NOPAT / инвестированный капитал. Если ROIC > WACC, компания создаёт стоимость |\n| **ROCE** | Return on Capital Employed | EBIT / (активы − краткосрочные обязательства) |\n| **SG&A** | Selling, General & Administrative | Коммерческие и управленческие расходы |\n| **SOTP** | Sum of the Parts | Оценка по частям |\n| **SPA** | Share Purchase Agreement | Договор купли-продажи акций |\n| **Synergies** | | Синергии: доп. стоимость от объединения |\n| **Teaser** | | Короткое анонимное описание компании для покупателей |\n| **TV** | Terminal Value | Терминальная (постпрогнозная) стоимость |\n| **TSR** | Total Shareholder Return | Полная доходность акционера (рост цены + дивиденды) |\n| **VDR** | Virtual Data Room | Виртуальная комната данных для due diligence |\n| **WACC** | Weighted Average Cost of Capital | Средневзвешенная стоимость капитала |\n| **YTM** | Yield to Maturity | Доходность к погашению |\n| **Accrued interest** | | См. НКД |\n| **Basis point (б.п.)** | | Базисный пункт = 0,01%. 50 б.п. = 0,5 п.п. |\n| **Capital rationing** | | Ограниченный бюджет на инвестиции; проекты ранжируют по PI |\n| **Comps** | Comparable companies | Таблица сопоставимых компаний и их мультипликаторов |\n| **Covenant** | | Условие кредитного договора (например, ND/EBITDA ≤ 3×) |\n| **Credit spread** | | Доходность облигации компании минус доходность госбумаги того же срока |\n| **Earn-out** | | Часть цены сделки, которая выплачивается при достижении будущих результатов |\n| **Equity Value** | | Стоимость акционерного капитала (для публичной компании — капитализация) |\n| **FDV** | Fully Diluted Valuation | Капитализация криптотокена по максимальной эмиссии |\n| **G-spread** | | Спред доходности облигации к кривой госбумаг (КБД) на том же сроке |\n| **Hurdle rate** | | Минимальная требуемая доходность проекта (часто WACC + премия) |\n| **Leverage** | | Финансовый рычаг: использование долга; часто мерится ND/EBITDA |\n| **Locked box** | | Механизм цены сделки, зафиксированной по балансу на прошлую дату |\n| **MOIC** | Multiple on Invested Capital | Во сколько раз вырос вложенный капитал фонда |\n| **Pitchbook** | | Презентация банка для клиента: идея сделки, оценка, аналоги |\n| **Precedent transactions** | | Сделки-аналоги: мультипликаторы прошлых сделок M&A |\n| **Run-rate** | | Годовой показатель, экстраполированный по последнему периоду (квартал × 4) |\n| **Sell-side / Buy-side** | | Консультирование продавца / покупателя в сделке; также брокеры (sell-side) и фонды (buy-side) |\n| **Tender offer** | | Публичное предложение купить акции у всех акционеров |\n| **Waterfall** | | Очерёдность выплат кредиторам и акционерам при распределении денег или банкротстве |\n| **WC peg** | | Нормальный уровень оборотного капитала, от которого корректируют цену сделки |\n| **Дефолт** | | Неисполнение обязательств по долгу (невыплата купона или погашения) |\n| **Квал** | Квалифицированный инвестор | Статус для доступа к сложным инструментам; присваивается по критериям ЦБ (размер активов, опыт сделок, образование и др.) |\n| **ПДН** | Показатель долговой нагрузки | Доля доходов заёмщика, уходящая на платежи по кредитам (регулирует ЦБ) |\n| **КБД** | Кривая бескупонной доходности | Кривая доходности ОФЗ (ЦБ, Мосбиржа) |\n| **НКД** | Накопленный купонный доход | Часть купона, накопленная с последней выплаты |\n| **ОФЗ** | Облигации федерального займа | Гособлигации РФ |\n| **РСБУ** | Российские стандарты бухучёта | |\n| **ФСО** | Федеральные стандарты оценки | Стандарты оценочной деятельности РФ |\n| **Н1** | Норматив достаточности капитала | Требование ЦБ к капиталу банков |\n"},{"id":"istochniki","title":"Что читать и где брать данные","short":"Учебники, сайты, источники цифр этого справочника","md":"## Учебники (по приоритету)\n\n1. **Rosenbaum, Pearl — «Investment Banking: Valuation, LBOs, M&A, and IPOs»**. Практика IB: comps, сделки, DCF, LBO, M&A. Ближе всего к работе аналитика.\n2. **Koller, Goedhart, Wessels (McKinsey) — «Valuation: Measuring and Managing the Value of Companies»** (рус. «Стоимость компаний: оценка и управление»). Фундамент DCF, ROIC, EVA.\n3. **Асват Дамодаран — «Инвестиционная оценка» (Investment Valuation)** и «Damodaran on Valuation». Все методы, отраслевая специфика, банки, стартапы.\n4. **Брейли, Майерс, Аллен — «Принципы корпоративных финансов»** (Principles of Corporate Finance). Базовая теория: NPV, CAPM, структура капитала, опционы.\n5. **Халл — «Опционы, фьючерсы и другие производные финансовые инструменты»** (Hull). Деривативы.\n6. **Fabozzi — «Bond Markets, Analysis and Strategies»**. Облигации.\n\n## Сайты\n\n| Что | Где |\n|---|---|\n| Данные Дамодарана: ERP, беты и мультипликаторы по отраслям, CRP по странам | pages.stern.nyu.edu/~adamodar |\n| Ключевая ставка, КБД ОФЗ, курсы | cbr.ru |\n| Котировки и данные Мосбиржи | moex.com, iss.moex.com (API) |\n| Мультипликаторы российских компаний | smart-lab.ru/q/shares_fundamental, fin-vista.ru |\n| Раскрытие эмитентов РФ | e-disclosure.ru |\n| Отчётность американских компаний | sec.gov/edgar (10-K, 10-Q) |\n| Мультипликаторы лане из 28 пунктов» по Украине","text":"Западные СМИ сообщили о плане США по урегулированию, и рынок закрыл неделю ростом на 6,3% по индексу МосБиржи. РТС прибавил 4,4% на фоне резкого укрепления рубля.","move":"+2,2%","src":"Интерфакс","url":"https://www.interfax.ru/business/1059298"},{"tic":"IMOEX","date":"2026-03-02","title":"Удары США и Израиля по Ирану: нефть к $80, индекс на максимуме","text":"Война в Персидском заливе и атаки на танкеры в Ормузском проливе подняли Brent к $80. Нефтяники выросли на 5–10%, а индекс закрылся на максимуме с сентября 2025 года.","move":"+1,3%","src":"Интерфакс","url":"https://www.interfax.ru/business/1075616"},{"tic":"IMOEX","date":"2026-04-24","title":"ЦБ снизил ставку до 14,5%, но дал жёсткий сигнал","text":"Регулятор не исключил более жёсткой политики в будущем, и рынок воспринял это как намёк на паузу. Сильнее всего упали закредитованные компании и металлурги.","move":"−1,4%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8622706"},{"tic":"IMOEX","date":"2026-06-19","title":"ЦБ снизил ставку лишь на 25 б.п., до 14,25%","text":"Рынок ждал снижения на 50 б.п. Индекс в моменте опустился до минимума с декабря 2024 года (2408 п.), и с этого заседания началось летнее падение.","move":"−1,4%","src":"Интерфакс","url":"https://www.interfax.ru/business/1096989"},{"tic":"IMOEX","date":"2026-06-24","title":"Обвал на 4%: дешевеющая нефть, санкции G7 и пауза ЦБ","text":"Brent впервые с начала ближневосточного конфликта опустилась ниже $74, а G7 пригрозила ужесточить санкции против нефтегаза. Металлурги и IT подешевели на 5–8%.","move":"≈−4%","src":"Интерфакс","url":"https://www.interfax.ru/business/1098111"},{"tic":"IMOEX","date":"2026-07-16","title":"Худший день с сентября 2022 года, индекс у 2000 пунктов","text":"Геополитика, ожидания паузы ЦБ и дивидендные отсечки обрушили индекс до 2022 п. 16–17 июля он впервые с октября 2022 года ушёл ниже 2000 п. и потерял 8,7% за неделю.","move":"−4,24%","src":"Коммерсантъ","url":"https://www.kommersant.ru/doc/8816739"},{"tic":"IMOEX","date":"2026-07-24","title":"ЦБ неожиданно снизил ставку до 14%","text":"До решения индекс опускался ниже 2100 п., после него развернулся вверх. Лидерами стали Мосбиржа, VK и «Газпром».","move":"+0,5% днём","src":"Интерфакс","url":"https://www.interfax.ru/business/1105313"},{"tic":"IMOEX","date":"2026-08-14","title":"Падение на 4,3% из-за геополитики и фиксации прибыли","text":"Лавров скептически оценил возможный приезд Уиткоффа и Кушнера, Россия потребовала у Госдепа объяснений по разведданным для Киева. Это сильнейшее падение с сентября 2022 года.","move":"−4,3%","src":"Интерфакс","url":"https://www.interfax.ru/business/1109404"},{"tic":"IMOEX","date":"2026-08-25","title":"Скачок на 3% на сообщении о визите директора ЦРУ в Москву","text":"CBS со ссылкой на источники сообщила о первом визите Джона Рэтклиффа в Россию. Сильнее рынка выросли «Татнефть», Ozon и ЛУКОЙЛ.","move":"+2,9%","src":"Ведомости","url":"https://www.vedomosti.ru/investments/news/2026/08/25/1223652-indeks-mosbirzhi"},{"tic":"IMOEX","date":"2026-09-11","title":"ЦБ прервал цикл снижения и сохранил ставку 14%","text":"Регулятор поставил смягчение на паузу и заявил, что проинфляционные риски преобладают. Индекс растерял дневной рост и закрылся ниже 2290 п.","move":"−1,2%","src":"Интерфакс","url":"https://www.interfax.ru/business/1115596"},{"tic":"IMOEX","date":"2026-10-12","title":"Дизельная сделка России и США: рынок вырос на 3%","text":"Договорённость о поставках российского дизеля в США и выдача OFAC временной лицензии подстегнули покупки. Лидировали «Роснефть», АЛРОСА, «Сургутнефтегаз» и «Татнефть».","move":"+3,1%","src":"Интерфакс","url":"https://www.interfax.ru/business/1121925"},{"tic":"YDEX","date":"2025-10-29","title":"Сильный отчёт за III квартал 2025 года, повышен прогноз EBITDA","text":"Выручка выросла на 32%, скорректированная чистая прибыль — на 78%. Прогноз EBITDA на 2025 год повышен до ~270 млрд руб.","move":"+3,3% в моменте","src":"РБК","ur
