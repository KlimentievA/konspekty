<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('fdata').textContent);
var CH=D.chapters,S=D.static;
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var view=$('#view');

/* тема */
var root=document.documentElement;
function applyTheme(t){if(t)root.setAttribute('data-theme',t);else root.removeAttribute('data-theme')}
applyTheme(store('theme')||'');
$('#b-theme').onclick=function(){
  var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  var t=dark?'light':'dark';applyTheme(t);store('theme',t);
};

/* числа */
function nf(x,d){if(x==null||isNaN(x))return '—';return Number(x).toLocaleString('ru-RU',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function auto(x){if(x==null||isNaN(x))return '—';var a=Math.abs(x);return nf(x,a>=1000?0:a>=10?2:a>=1?2:a>=0.01?4:6)}
function pct(x,d){if(x==null||isNaN(x))return '<span>—</span>';var c=x>0?'up':x<0?'down':'';return '<span class="'+c+'">'+(x>0?'+':'')+nf(x,d==null?2:d)+'%</span>'}
function mult(x){return x==null?'—':nf(x,x>=100?0:x>=10?1:2)+'×'}
function bigUsd(x){if(x==null)return '—';if(x>=1e12)return nf(x/1e12,2)+' трлн $';if(x>=1e9)return nf(x/1e9,1)+' млрд $';return nf(x/1e6,0)+' млн $'}
function hm(d){return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}

/* markdown */
var heads=[];
marked.use({gfm:true,breaks:false,renderer:{
  code:function(code,lang){if(lang==='f')return '<div class="f">'+esc(code)+'</div>\n';return '<pre><code>'+esc(code)+'</code></pre>\n'},
  table:function(h,b){return '<div class="tablewrap"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div>\n'},
  heading:function(text,level,raw){if(level===1)return '';if(level===2){var id='h'+heads.length;heads.push({id:id,t:raw});return '<h2 id="'+id+'">'+text+'</h2>\n'}return '<h'+level+'>'+text+'</h'+level+'>\n'},
  link:function(href,title,text){return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+text+'</a>'}
}});
CH.forEach(function(c,i){c.i=i;c.plain=c.md.replace(/<[^>]+>/g,' ').replace(/[#*|`>_-]{1,}/g,' ').replace(/\s+/g,' ');c.low=c.plain.toLowerCase()});

/* ---------------- обучение ---------------- */
function renderLearn(){
  var h='<section class="hero"><h1>Справочник по корпоративным финансам</h1><p>Всё, что нужно для работы в инвестбанкинге: отчётность, NPV и IRR, WACC, DCF, мультипликаторы, методы оценки по секторам, M&A и LBO, рынки, вопросы с собеседований. Цифры по рынкам на октябрь 2026.</p></section><div class="chs">';
  CH.forEach(function(c,i){h+='<a class="ch" href="#learn/'+c.id+'"><span class="n">'+(i+1)+'</span><span><b>'+esc(c.title)+'</b><i>'+esc(c.short)+'</i></span></a>'});
  view.innerHTML=h+'</div>';
}
function renderChapter(c){
  heads=[];var body=marked.parse(c.md);
  var toc=heads.map(function(x){return '<a href="#" data-to="'+x.id+'">'+esc(x.t)+'</a>'}).join('');
  var pv=CH[c.i-1],nx=CH[c.i+1];
  view.innerHTML='<div class="doc"><article class="art"><p class="eyebrow"><a href="#learn">Обучение</a> · '+(c.i+1)+' из '+CH.length+'</p><h1>'+esc(c.title)+'</h1>'+
    (heads.length>2?'<details class="toc"><summary>Содержание</summary><nav>'+toc+'</nav></details>':'')+
    '<div class="prose">'+body+'</div><nav class="pager">'+
    (pv?'<a href="#learn/'+pv.id+'"><small>← Назад</small><b>'+esc(pv.title)+'</b></a>':'')+
    (nx?'<a class="nx" href="#learn/'+nx.id+'"><small>Дальше →</small><b>'+esc(nx.title)+'</b></a>':'')+
    '</nav></article>'+(heads.length>2?'<aside class="side"><p class="h">Содержание</p>'+toc+'</aside>':'')+'</div>';
  if(Q){hl(view.querySelector('.prose'),Q)}
}
view.addEventListener('click',function(e){
  var a=e.target.closest('[data-to]');if(!a)return;e.preventDefault();
  var el=document.getElementById(a.getAttribute('data-to'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  var d=a.closest('details.toc');if(d)d.open=false;
});

/* поиск */
var Q='';
function hl(el,q){
  var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),n,list=[];
  while(n=w.nextNode())if(re.test(n.nodeValue))list.push(n);
  list.forEach(function(t){var s=document.createElement('span');s.innerHTML=esc(t.nodeValue).replace(re,'<mark>$1</mark>');t.parentNode.replaceChild(s,t)});
  var m=el.querySelector('mark');if(m){var d=m.closest('details');if(d)d.open=true;setTimeout(function(){m.scrollIntoView({block:'center'})},50)}
}
function renderSearch(q){
  var ql=q.toLowerCase(),res=[];
  CH.forEach(function(c){var i=c.low.indexOf(ql),n=0,j=i;while(j>=0){n++;j=c.low.indexOf(ql,j+1)}if(i>=0||c.title.toLowerCase().indexOf(ql)>=0)res.push({c:c,i:i,n:n})});
  res.sort(function(a,b){return b.n-a.n});
  var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  view.innerHTML='<section class="results"><p class="eyebrow">Поиск</p>'+(res.length?res.map(function(r){
    var s=r.i>=0?r.c.plain.slice(Math.max(0,r.i-80),r.i+160):r.c.short;
    return '<a class="hit" href="#learn/'+r.c.id+'" data-hl="1"><small>'+esc(r.c.title)+' · совпадений: '+r.n+'</small><b>'+esc(r.c.title)+'</b><p>…'+esc(s).replace(re,'<mark>$1</mark>')+'…</p></a>'}).join(''):'<p class="empty">Ничего не найдено по запросу «'+esc(q)+'».</p>')+'</section>';
}
var qi=$('#q'),sb=$('#search');
$('#b-search').onclick=function(){sb.classList.toggle('on');if(sb.classList.contains('on'))qi.focus();else{qi.value='';Q='';route()}};
var qt;qi.addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(function(){Q=qi.value.trim();if(Q.length>=2)renderSearch(Q);else route()},180)});
view.addEventListener('click',function(e){var a=e.target.closest('a[data-hl]');if(a){/* Q остаётся для подсветки */}});

/* ---------------- рынки: загрузка ---------------- */
function getJSON(url,ms){
  var c=window.AbortController?new AbortController():null,t=setTimeout(function(){c&&c.abort()},ms||9000);
  return fetch(url,{signal:c&&c.signal,cache:'no-store'}).then(function(r){clearTimeout(t);if(!r.ok)throw new Error(r.status);return r.json()});
}
function iss(block){var o={};if(!block)return o;block.data.forEach(function(row){var x={};block.columns.forEach(function(k,i){x[k]=row[i]});o[x.SECID]=x});return o}
var M={ru:null,idx:null,ofz:null,fx:null,cr:null,snap:null,t:{},err:{}};
var ISS='https://iss.moex.com/iss/engines/stock/markets/';
function loadSnap(){if(M.snap!==null)return Promise.resolve(M.snap);return getJSON('markets.json',6000).then(function(j){M.snap=j;return j}).catch(function(){M.snap=false;return false})}
function loadRU(){
  var t=S.ru.map(function(r){return r[0]}).join(',');
  return getJSON(ISS+'shares/boards/TQBR/securities.json?iss.meta=off&iss.only=securities,marketdata&securities.columns=SECID,PREVPRICE,SHORTNAME&marketdata.columns=SECID,LAST,LCURRENTPRICE,LASTTOPREVPRICE,UPDATETIME,VALTODAY&securities='+t)
  .then(function(j){var s=iss(j.securities),m=iss(j.marketdata),o={};Object.keys(s).forEach(function(k){var a=s[k],b=m[k]||{},p=b.LAST||b.LCURRENTPRICE||a.PREVPRICE;o[k]={p:p,ch:b.LAST?b.LASTTOPREVPRICE:(p&&a.PREVPRICE?(p/a.PREVPRICE-1)*100:null),tm:b.UPDATETIME,vol:b.VALTODAY}});M.ru=o;M.t.ru=new Date();M.err.ru=0})
  .catch(function(){M.err.ru=1;return loadSnap().then(function(sn){if(sn&&sn.ru){M.ru=sn.ru;M.t.ru='snap'}})});
}
function loadIdx(){
  return getJSON(ISS+'index/securities.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,CURRENTVALUE,LASTCHANGEPRC,UPDATETIME&securities=IMOEX,RTSI,RGBI,MOEXOG,MOEXFN,MOEXMM,MOEXIT')
  .then(function(j){var m=iss(j.marketdata),o={};Object.keys(m).forEach(function(k){o[k]={v:m[k].CURRENTVALUE,ch:m[k].LASTCHANGEPRC,tm:m[k].UPDATETIME}});M.idx=o;M.err.idx=0})
  .catch(function(){M.err.idx=1;return loadSnap().then(function(sn){if(sn&&sn.idx)M.idx=sn.idx})});
}
function loadOFZ(){
  return getJSON(ISS+'bonds/boards/TQOB/securities.json?iss.meta=off&iss.only=securities,marketdata&securities.columns=SECID,SHORTNAME,MATDATE,COUPONPERCENT,PREVPRICE&marketdata.columns=SECID,LAST,YIELD,DURATION,UPDATETIME')
  .then(function(j){var s=iss(j.securities),m=iss(j.marketdata),a=[];Object.keys(s).forEach(function(k){var x=s[k],y=m[k]||{};if(!/^SU2[46]/.test(k))return;a.push({id:k,n:x.SHORTNAME,mat:x.MATDATE,c:x.COUPONPERCENT,p:y.LAST||x.PREVPRICE,y:y.YIELD,d:y.DURATION?y.DURATION/365:null})});
    a.sort(function(p,q){return p.mat<q.mat?-1:1});M.ofz=a;M.t.ofz=new Date();M.err.ofz=0})
  .catch(function(){M.err.ofz=1});
}
function loadFX(){
  return getJSON('https://www.cbr-xml-daily.ru/daily_json.js').then(function(j){M.fx=j;M.t.fx=new Date();M.err.fx=0})
  .catch(function(){M.err.fx=1;return loadSnap().then(function(sn){if(sn&&sn.fx)M.fx=sn.fx})});
}
function loadCR(){
  return getJSON('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=25&page=1&price_change_percentage=24h,7d')
  .then(function(a){M.cr=a.map(function(x){return {s:x.symbol.toUpperCase(),n:x.name,p:x.current_price,c24:x.price_change_percentage_24h_in_currency,c7:x.price_change_percentage_7d_in_currency,cap:x.market_cap,vol:x.total_volume}});M.t.cr=new Date();M.crsrc='CoinGecko';M.err.cr=0})
  .catch(function(){
    var sy=['BTC','ETH','BNB','SOL','XRP','DOGE','TON','ADA','TRX','AVAX','LINK','DOT','LTC','BCH'];
    return getJSON('https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(sy.map(function(s){return s+'USDT'})))).then(function(a){
      M.cr=a.map(function(x){return {s:x.symbol.replace(/USDT$/,''),n:x.symbol.replace(/USDT$/,''),p:+x.lastPrice,c24:+x.priceChangePercent,c7:null,cap:null,vol:+x.quoteVolume}});M.t.cr=new Date();M.crsrc='Binance';M.err.cr=0})
    .catch(function(){M.err.cr=1;return loadSnap().then(function(sn){if(sn&&sn.crypto){M.cr=sn.crypto;M.t.cr='snap';M.crsrc='снимок'}})});
  });
}
function usdRub(){try{return M.fx.Valute.USD.Value}catch(e){return 83.9153}}

/* ---------------- рынки: виды ---------------- */
var SUBS=[['summary','Сводка'],['ru','Россия'],['us','США'],['crypto','Крипта'],['bonds','Ставки и ОФЗ'],['fx','Валюты']],cur='summary';
function subnav(){return '<nav class="sub">'+SUBS.map(function(s){return '<a class="chip'+(s[0]===cur?' on':'')+'" href="#markets/'+s[0]+'">'+s[1]+'</a>'}).join('')+'</nav>'}
function status(key,label){
  var t=M.t[key],e=M.err[key],cls,txt;
  if(t instanceof Date){cls='live';txt=label+': обновлено в '+hm(t)}
  else if(t==='snap'){cls='';txt=label+' недоступны из браузера — показан снимок '+(M.snap&&M.snap.updated?'от '+esc(M.snap.updated):'')}
  else if(e){cls='off';txt=label+' сейчас недоступны — показаны сохранённые данные'}
  else{cls='';txt=label+': загрузка…'}
  return '<div class="stat '+cls+'"><span class="dot"></span><span>'+txt+'</span><button type="button" data-reload>Обновить</button></div>';
}
function tile(k,v,s){return '<div class="tile"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>'}
function stTiles(a){return a.map(function(r){return tile(esc(r[0]),esc(r[1]),esc(r[2]))}).join('')}

function vSummary(){
  var ix=M.idx||{},h='<div class="sect"><h2>Сейчас на рынках</h2><div class="tiles">';
  var im=ix.IMOEX,rg=ix.RGBI,rt=ix.RTSI;
  h+=tile('Индекс Мосбиржи',im?nf(im.v,2):'2 393,83',im?pct(im.ch)+' · '+(im.tm||''):'закрытие 12.10.2026');
  h+=tile('RGBI (гособлигации)',rg?nf(rg.v,2):'—',rg?pct(rg.ch)+' · '+(rg.tm||''):'индекс цен ОФЗ');
  h+=tile('РТС ($)',rt?nf(rt.v,2):'898,65',rt?pct(rt.ch):'закрытие 12.10.2026');
  var fx=M.fx&&M.fx.Valute;
  h+=tile('USD/RUB (ЦБ)',fx?nf(fx.USD.Value,4):'83,9153',fx?pct((fx.USD.Value/fx.USD.Previous-1)*100)+' · на '+new Date(M.fx.Date).toLocaleDateString('ru-RU'):'13.10.2026');
  var btc=M.cr&&M.cr.filter(function(x){return x.s==='BTC'})[0],eth=M.cr&&M.cr.filter(function(x){return x.s==='ETH'})[0];
  var nc=M.err.cr?'нет связи с биржами':'загрузка…';
  h+=tile('Bitcoin',btc?'$'+nf(btc.p,0):'—',btc?pct(btc.c24)+' за 24 ч · '+nf(btc.p*usdRub(),0)+' ₽':nc);
  h+=tile('Ethereum',eth?'$'+nf(eth.p,0):'—',eth?pct(eth.c24)+' за 24 ч':nc);
  var su=(M.snap&&M.snap.us)||{};
  [['^GSPC','S&P 500'],['^IXIC','Nasdaq']].forEach(function(x){var v=su[x[0]];if(v&&v.p)h+=tile(x[1],nf(v.p,2),pct(v.ch)+' · снимок '+esc(M.snap.updated||''))});
  h+='</div><p class="note">Мосбиржа отдаёт котировки бесплатно с задержкой около 15 минут. Курсы ЦБ обновляются раз в день. Крипта — в реальном времени (CoinGecko, запасной источник Binance).</p></div>';
  h+='<div class="sect"><h2>Россия: ставки и макро</h2><div class="tiles">'+stTiles(S.macro.ru)+'</div></div>';
  h+='<div class="sect"><h2>США</h2><div class="tiles">'+stTiles(S.macro.us)+'</div><p class="note">Ставки и мультипликаторы зафиксированы на дату в подписи; источники в «Обучение → Что читать».</p></div>';
  if(M.idx&&(ix.MOEXOG||ix.MOEXFN)){

var sortState={};
function table(id,cols,rows){
  var st=sortState[id]||{};
  if(st.k!=null){rows=rows.slice().sort(function(a,b){var x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;if(typeof x==='string')return st.asc?x.localeCompare(y,'ru'):y.localeCompare(x,'ru');return st.asc?x-y:y-x})}
  var h='<div class="tablewrap"><table class="dt" data-t="'+id+'"><thead><tr>'+cols.map(function(c,i){return '<th data-k="'+c.k+'" class="'+(c.num?'num ':'')+(i===0?'sticky ':'')+(st.k===c.k?'sorted'+(st.asc?' asc':''):'')+'">'+c.t+'</th>'}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr>'+cols.map(function(c,i){return '<td class="'+(c.num?'num ':'')+(c.cls||'')+(i===0?' sticky':'')+'">'+c.f(r)+'</td>'}).join('')+'</tr>'});
  return h+'</tbody></table></div>';
}

});

    '<p class="note">'+esc(S.ru_sect_asof)+'. Медиана P/E рынка 7,0×, EV/EBITDA нефинансовых компаний 5,2×.</p></div>';

}
function vUS(){
  var sn=(M.snap&&M.snap.us)||{};
  var rows=S.us.map(function(r){var l=sn[r[0]]||{};return {tic:r[0],nm:r[1],sec:r[2],cap:r[3],pe:r[4],fpe:r[5],ev:r[6],pb:r[7],ps:r[8],dy:r[9],p:l.p,ch:l.ch}});

  if(hasP)cols.push({k:'p',t:'Цена, $',num:1,f:function(r){return auto(r.p)}},{k:'ch',t:'За день',num:1,f:function(r){return pct(r.ch)}});
  cols=cols.concat([

    filters('us',S.us.map(function(r){return r[2]}))+table('us',cols,rows)+
    '<p class="sect note">Мультипликаторы: '+esc(S.us_asof)+' (данные S&P Global). У Tesla и AMD высокий P/E из-за упавшей прибыли и ожиданий роста; у Berkshire прибыль по US GAAP включает переоценку портфеля акций.</p>';
  h+='<div class="sect"><h2>Мультипликаторы по отраслям США</h2>'+table('uss',[
    {k:0,t:'Отрасль',f:function(r){return esc(r[0])}},{k:1,t:'P/E trailing',num:1,f:function(r){return mult(r[1])}},{k:2,t:'P/E forward',num:1,f:function(r){return mult(r[2])}},{k:3,t:'EV/EBITDA',num:1,f:function(r){return r[3]==null?'—':mult(r[3])}}],S.us_sect)+
    '<p class="note">'+esc(S.us_sect_asof)+'. Агрегаты считаются как сумма капитализаций / сумма прибылей, включая убыточные компании, поэтому trailing P/E выше медианного; сравнивай по forward.</p></div>';

}

function svgLine(pts,opt){
  var W=460,H=230,L=44,R=16,T=20,B=28,xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]});
  var x0=opt.x0!=null?opt.x0:Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=opt.y0!=null?opt.y0:Math.floor(Math.min.apply(0,ys)-1),y1=Math.ceil(Math.max.apply(0,ys)+1);
  function X(v){return L+(v-x0)/(x1-x0)*(W-L-R)}function Y(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B)}
  var h='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label)+'">';
  for(var g=0;g<=4;g++){var v=y0+(y1-y0)*g/4;h+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" opacity=".6"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+nf(v,v%1?1:0)+'%</text>'}
  var d='';pts.forEach(function(p,i){var x=X(p[0]),y=Y(p[1]);if(opt.step&&i)d+='H'+x+'V'+y;else d+=(i?'L':'M')+x+','+y});
  h+='<path class="ln" d="'+d+'"/>';
  pts.forEach(function(p,i){if(opt.dots)h+='<circle class="pt" cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.2"/>';var lb=opt.xl(p,i);if(lb)h+='<text x="'+X(p[0])+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>';if(opt.vl&&opt.vl(p,i))h+='<text class="lb" x="'+X(p[0])+'" y="'+(Y(p[1])-8)+'" text-anchor="middle">'+nf(p[1],2)+'</text>'});
  return h+'</svg>';
}
function vBonds(){
  var k=S.kbd,h='<div class="grid2 sect"><div class="box"><h2 style="margin:0">Кривая ОФЗ (КБД)</h2>'+
    svgLine(k.pts,{label:'Кривая бескупонной доходности',dots:1,xl:function(p){return [1,3,5,10,20].indexOf(p[0])>=0?p[0]+' л':''},vl:function(p,i){return i===0||p[0]===10||i===k.pts.length-1}})+
    '<p class="note">ЦБ РФ, '+k.date+'. Кривая растущая: короткие 13,7%, длинные 16,6–16,7%.</p></div>';
  var kr=S.keyrate.map(function(r){var d=new Date(r[0]);return [d.getTime(),r[1],r[0]]});

    '<p class="note">С 21% (начало 2025) до 14% (с 27.07.2026). Следующее заседание 23.10.2026.</p></div></div>';
  h+='<div class="sect"><h2>ОФЗ на Мосбирже</h2>'+status('ofz','Котировки ОФЗ');

    h+=table('ofz',[
      {k:'n',t:'Выпуск',cls:'nm',f:function(x){return '<b>'+esc(x.n)+'</b><i>'+esc(x.id)+'</i>'}},
      {k:'mat',t:'Погашение',f:function(x){return x.mat?new Date(x.mat).toLocaleDateString('ru-RU'):'—'}},
      {k:'c',t:'Купон',num:1,f:function(x){return x.c?nf(x.c,2)+'%':'плав.'}},

      '<p class="note">SU26… — ОФЗ-ПД (постоянный купон), SU24… — ОФЗ-ПК (плавающий купон). Доходность эффективная, к погашению. Задержка ~15 мин.</p>';
  }else if(M.err.ofz)h+='<p class="empty">Мосбиржа сейчас недоступна. Ориентир — кривая КБД выше.</p>';
  return h+'</div>';
}
function vFX(){
  var j=M.fx,h=status('fx','Курсы ЦБ');

  return h+'<p class="sect note">Официальный курс ЦБ на '+new Date(j.Date).toLocaleDateString('ru-RU')+' (устанавливается на следующий день после торгов). Источник: cbr-xml-daily.ru (зеркало данных ЦБ).</p>';

}

var state='';
function route(){
  var h=decodeURIComponent(location.hash.slice(1)),p=h.split('/');
  var sec=p[0]==='markets'?'markets':'learn';
  document.querySelectorAll('#sw a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===sec)});
  state=sec;
  if(sec==='markets'){
    cur=SUBS.some(function(s){return s[0]===p[1]})?p[1]:'summary';store('fin:sub',cur);
    drawMarkets();refresh();startTimer();document.title='Рынки · Финансы';
  }else{
    clearInterval(timer);
    var c=CH.filter(function(x){return x.id===p[1]})[0];
    if(c){renderChapter(c);document.title=c.title+' · Финансы';store('fin:last',c.id)}else{renderLearn();document.title='Финансы'}
  }
}
