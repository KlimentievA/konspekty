риска.\n\nЗакрытый по смыслу перечень критериев недобросовестности (конфликт интересов, сокрытие информации, сделка без одобрения, удержание документов, заведомо невыгодные условия) и неразумности (решение без учёта информации, без получения необходимой информации, без обычных внутренних процедур) — п. 2–3 Постановления № 62.\n\nДиректор освобождается от ответственности, если докажет, что действие было частью взаимосвязанных сделок, направленных на получение выгоды в совокупности, либо совершено для предотвращения ещё большего ущерба (п. 2 Постановления № 62, п. 10–11 Обзора ВС РФ 2025).\n\n---\n\n## Задачи\n\n## Задача 1. Меньшенин и ООО «М&Ю»\n\n**Ответ:**\n\nИск Меньшенина к ООО обоснован — договор не исполнен, уплаченная сумма подлежит возврату, возможны убытки и неустойка/проценты (ст. 395 ГК) — это бесспорно.\n\nТребование о привлечении участников ООО как соответчиков по долгам общества не имеет перспективы в заявленном виде — действует принцип самостоятельной ответственности ЮЛ и ограниченной ответственности участников (п. 1 ст. 56, п. 1 ст. 87 ГК): участники не отвечают по обязательствам ООО в пределах его неисполнения как такового.\n\nУчастники юридического лица могут быть привлечены к ответственности по его обязательствам только в случаях, прямо предусмотренных законом, в частности:\n\n- субсидиарная ответственность контролирующих лиц при банкротстве ЮЛ, если банкротство вызвано их действиями/бездействием (ст. 61.11 Закона о банкротстве, п. 3 ст. 3 Закона об ООО, п. 3 ст. 53.1 ГК) — требует доказывания, что именно действия участников (а не рыночный риск) привели к невозможности погашения долга;\n- ответственность по п. 3.1 ст. 3 Закона об ООО, если общество исключено из ЕГРЮЛ как недействующее — неисполнение обязательств может быть отнесено на контролирующих лиц, действовавших недобросовестно/неразумно.\n\nНа приведённых фактах (распродажа имущества в августе, фактическое прекращение деятельности накануне срока исполнения) есть основания ставить вопрос о недобросовестном выводе активов контролирующими лицами — но для этого Меньшенину нужен отдельный иск по специальным нормам (не «соответчики» в деле о понуждении к исполнению договора), с доказыванием вины конкретных участников в доведении общества до невозможности исполнения.\n\nРешение: в иске к ООО — удовлетворить (взыскание уплаченной суммы, убытков); в ходатайстве о привлечении участников соответчиками в этом же процессе — отказать как не основанном на законе; самостоятельный иск к участникам возможен только по специальным основаниям (субсидиарная ответственность) при доказывании их вины в выводе активов.\n\n---\n\n## Задача 2. Фонд «Защити медведя»\n\n**Ответ:**\n\nКритерии разграничения коммерческих/некоммерческих организационно-правовых форм — не характер фактической деятельности, а (1) закрытый перечень форм (ст. 50 ГК) и целей, допустимых для каждой; (2) запрет распределения прибыли между учредителями/участниками некоммерческой организации (п. 1 ст. 50 ГК) — это главный материальный критерий, а не сам факт занятия приносящей доход деятельностью.\n\nФонд (ст. 123.17–123.20 ГК) — некоммерческая унитарная организация, преследующая социальные, благотворительные, культурные, образовательные или иные общественно полезные цели — защита дикого животного и просветительская деятельность по этике охоты прямо укладываются в допустимые цели (общественно полезная/природоохранная цель).\n\nУказание на возможность продажи сувениров, видео/аудиопродукции, экотуров не выходит за пределы правоспособности фонда — некоммерческая организация вправе заниматься приносящей доход деятельностью, если это служит достижению её уставных целей и соответствует им (п. 4 ст. 50 ГК, п. 2 ст. 123.17 ГК) — продажа сувениров и экотуры прямо служат просветительской/природоохранной цели (информирование, сбор средств на уставную деятельность).\n\nРешение: отказ регистрирующего органа незаконен — цели деятельности фонда соответствуют допускаемым законом для этой организационно-правовой формы; требование Монастырского подлежит удовлетворению.\n\nИзменился бы ответ при зарплате Монастырского 500 тыс. руб./мес? Само по себе высокое вознаграждение директора-учредителя не меняет квалификацию на стадии регистрации — регистрирующий орган проверяет соответствие целей закону, а не фактическое распределение денежных потоков, которое ещё не наступило. Но это создаёт основания для последующего контроля: если выплата вознаграждения фактически будет использоваться как скрытая форма распределения прибыли учредителю в обход запрета п. 1 ст. 50 ГК (вознаграждение явно несоразмерно объёму реальной работы и рыночному уровню оплаты труда в сравнимой должности), это может быть основанием для требований надзорного органа о приведении деятельности в соответствие с законом или — в случае систематичности и грубости — для иска о ликвидации (подп. 3 п. 3 ст. 61 ГК) за осуществление деятельности, противоречащей уставным целям. На стадии же регистрации это основанием для отказа не является.\n\n---\n\n## Задача 3. АО «Schuld не haftung» — Егоров и недействительное избрание директора\n\n**Ответ:**\n\nКлючевая норма — п. 2 ст. 51 ГК: данные, включённые в ЕГРЮЛ, признаются достоверными, пока не доказано иное, в том числе в части сведений о лице, имеющем право действовать от имени ЮЛ без доверенности; лицо, добросовестно полагавшееся на данные реестра, вправе исходить из них.\n\nИсключение из этой защиты — если соответствующие данные включены в реестр в результате неправомерных действий третьих лиц или иным путём помимо воли юридического лица (абз. 3 п. 2 ст. 51 ГК).\n\nКритическое разграничение (прямо проводит Кузнецов, опираясь на практику ВАС):\n\n- если Егоров попал в ЕГРЮЛ как директор из-за того, что решение о его избрании признано недействительным (то есть формальная процедура была проведена, но с пороком, выявленным позже) — это внутренний корпоративный дефект, риск которого не должен перекладываться на добросовестных третьих лиц, не участвовавших в формировании воли общества и не обязанных проверять легитимность корпоративных процедур;\n- если же запись была внесена на основании поддельных документов либо помимо воли участников вообще (например, рейдерский захват реестра) — добросовестность контрагента сделку не спасает (ориентир — Постановление Президиума ВАС № 2417/09 от 02.06.2009).\n\nНа фактах задачи — именно первый случай (решение о избрании признано недействительным, но само избрание формально состоялось и было внесено в реестр в установленном порядке). Третье лицо, не знавшее и не долженствовавшее знать об этих обстоятельствах, добросовестно — имущество истребованию не подлежит.\n\nСделка, совершённая Егоровым, являлась действительной на момент совершения (презумпция п. 2 ст. 51 ГК работала в пользу контрагента) — её не требовалось «оспаривать» отдельно, достаточно было довода о добросовестности в защиту от виндикационного/реституционного требования; формально акционеры, если настаивают на пороке, могли бы пытаться оспорить сделку, но при доказанной добросовестности контрагента в иске было бы отказано.\n\nРешение: в иске акционеров к третьему лицу — отказать.\n\nЕсли третье лицо проверило ЕГРЮЛ перед сделкой и там был указан именно Егоров — это лишь усиливает его добросовестность (прямое доказательство разумной осмотрительности), решение не меняется — иск также отклоняется, но с ещё более прочным обоснованием.\n\n---\n\n## Задача 4. Чупрунов и Зайцев — право единолично менять директора\n\n**Ответ:**\n\nВопрос сводится к пределам автономии воли в уставе непубличного ООО и к различению императивных и диспозитивных норм корпоративного законодательства (тема статьи Кузнецова «Пределы автономии воли в корпоративном праве», 2017).\n\nЗакон (ст. 40 Закона об ООО) относит избрание (назначение) единоличного исполнительного органа к компетенции общего собрания участников (если уставом не отнесено к компетенции совета директоров) — по общему правилу это коллективное решение, а не право одного участника единолично распоряжаться директорской должностью.\n\nОпределение императивности/диспозитивности правила корпоративного законодательства — не формальное («закон прямо не разрешил — значит нельзя»), а по существу (функциональный тест, развиваемый Кузнецовым и общей методологией диспозитивности в ГК, п. 4 ст. 421 ГК):\n\n- направлена ли норма на защиту интересов третьих лиц или публичного порядка (тогда императивна) или только на баланс интересов самих участников (тогда может быть изменена их общим согласием);\n- направлена ли норма на защиту слабой/миноритарной стороны внутри самого отношения (тогда отступление от неё в ущерб этой стороне, да ещё и без её согласия, недопустимо, даже если формально «все согласились» в уставе).\n\nУстав, дающий одному конкретному участнику право единолично в любой момент прекращать полномочия директора (включая смену без решения общего собрания, без участия второго участника), по сути лишает второго участника (Зайцева) его базового корпоративного права на участие в управлении — это не техническое перераспределение компетенции, а предоставление одному из равных участников одностороннего контроля над ключевым корпоративным решением в обход коллективной процедуры.\n\nТакое положение устава может быть признано недействительным как противоречащее существу законодательного регулирования компетенции общего собрания (ст. 40 Закона об ООО, с учётом ст. 181.5 ГК о ничтожности решений, принятых за пределами компетенции, а само положение устава — по аналогии недействительности условий договора, противоречащих существу законодательного регулирования, п. 4 ст. 1 ГК, ст. 10 ГК — злоупотребление правом при создании конструкции, блокирующей участника).\n\nОснование для иска — п. 1 ст. 174.1 / ст. 181.5 ГК (ничтожность в части, противоречащей компетенции органа, установленной законом) и общие нормы о недействительности сделок/решений, противоречащих закону (ст. 168 ГК применительно к условиям устава как многосторонней сделки).\n\nРешение: положение устава признать недействительным (ничтожным в этой части); прекращение полномочий Зайцева, основанное на этом положении, признать недействительным; Зайцев восстанавливается в должности директора до принятия нового решения в установленном законом порядке (общим собранием).\n\n---\n\n## Задача 5. Кузнецов и Абрамова — ООО «Медицина и право», поездки во Францию и Испанию\n\n**Ответ:**\n\nПрирода отношений между директором и ЮЛ — отношения представительства, осложнённые фидуциарными обязанностями: директор обязан действовать добросовестно и разумно в интересах ЮЛ (п. 3 ст. 53 ГК, ст. 53.1 ГК).\n\nЧто нужно доказать для взыскания убытков с директора (п. 1–3 Постановления Пленума ВАС № 62, развито в п. 9–11 Обзора ВС РФ 2025 по ст. 53.1 ГК): (1) противоправность — недобросовестность или неразумность конкретных действий директора; (2) факт и размер убытков; (3) причинно-следственную связь между действиями директора и убытками. Бремя доказывания всех элементов — на истце (Абрамовой), кроме случаев, когда директор отказывается от пояснений или даёт явно неполные объяснения — тогда бремя может быть переложено на него.\n\nПравило защиты делового решения (п. 9 Обзора ВС РФ 2025, п. 1 Постановления № 62): негативные последствия сами по себе не свидетельствуют о недобросовестности/неразумности — это соответствует рисковому характеру предпринимательской деятельности; суд не оценивает экономическую целесообразность решений директора, а только их правомерность; разумность презюмируется, пока не доказано, что поведение с очевидностью не отвечало обычным условиям оборота.\n\nПрименительно к фактам: траты на поездки и литературу связаны с заявленной целью деятельности общества (юридические услуги клиентам медицинских организаций) — повышение квалификации юриста в принципе относится к сфере разумной деловой активности директора-юриста, а не к очевидно постороннему личному интересу.\n\nРешающий довод в пользу Кузнецова — улучшение финансовых показателей общества в пять раз за три года, которое он связывает с применением полученных знаний — это прямое доказательство отсутствия убытков как таковых либо, при их формальном наличии (сами траты), довод о том, что действия были частью деятельности, в совокупности направленной на получение выгоды (по аналогии с принципом учёта совокупного экономического результата, п. 11 Обзора ВС РФ 2025) — конкретные расходы нельзя оценивать изолированно от общего контекста управления, приведшего к росту показателей.\n\nАбрамовой нужно было бы доказать не просто факт трат, а то, что именно эти траты не отвечали интересам общества и Кузнецов знал или должен был знать об этом (например, что поездки носили личный, туристический характер без связи с профессиональной деятельностью, либо что книги не использовались и не могли использоваться в работе) — на приведённых фактах такого не доказано.\n\nРешение: в иске Абрамовой отказать — расходы относятся к сфере обычного делового усмотрения директора, конкретная недобросовестность/неразумность не доказана, а достигнутый финансовый результат опровергает презумпцию причинения убытков.\n\n---\n\n## Задача 6. ООО «Чтец» — реорганизация АО «Кавон» путём разделения\n\n**Ответ:**\n\nТребование о солидарной ответственности ООО «Мила» и ООО «Дина» обоснованно — п. 5 ст. 60 ГК: если разделительный баланс не позволяет определить правопреемника по обязательству либо нарушен принцип справедливого распределения активов и обязательств пропорционально между правопреемниками, они отвечают солидарно.\n\nНа фактах задачи признак нарушения справедливого распределения — прямой и очевидный: всё ликвидное имущество ушло «Миле», все долги — «Дине». Это классический состав для солидарной ответственности, а не просто повод для отдельного иска об оспаривании самой реорганизации.\n\nОтсутствие возражений кредитора против реорганизации как таковой значения не имеет — солидарная ответственность по п. 5 ст. 60 ГК не является санкцией за нарушение процедуры реорганизации (публикации, уведомления), а компенсирует содержательный дисбаланс распределения активов и обязательств; она не зависит от того, воспользовался ли кредитор правом потребовать досрочного исполнения обязательства (п. 2 ст. 60 ГК) — это два самостоятельных, не исключающих друг друга способа защиты.\n\nДовод «Милы» о том, что она не должна отвечать за весь долг, поскольку обязанным лицом по разделительному балансу названа «Дина» — несостоятелен именно потому, что формальное распределение в разделительном балансе не связывает кредитора, если оно несправедливо по существу; иное превращало бы реорганизацию в удобный инструмент вывода активов из-под требований кредиторов.\n\nСсылка ответчиков на соблюдение всех формальных требований закона (публикации, ЕГРЮЛ) не исключает ответственности по п. 5 ст. 60 ГК — эта норма рассчитана именно на случаи формально законной, но содержательно несправедливой реорганизации; формальная законность процедуры и справедливость распределения — разные, не пересекающиеся условия.\n\nРешение: иск ООО «Чтец» о взыскании 2,5 млн руб. солидарно с ООО «Мила» и ООО «Дина» — удовлетворить.\n\nЕсли бы реорганизация была проведена с нарушением закона в части публикации сведений — это дало бы кредитору дополнительное основание: право потребовать досрочного исполнения обязательства либо прекращения обязательства с возмещением убытков (п. 2 ст. 60 ГК), поскольку он не был надлежащим образом уведомлён и не успел воспользоваться этим правом вовремя; возможна также постановка вопроса о признании реорганизации несостоявшейся при особо грубых нарушениях (ст. 60.1 ГК). Solidaритарная ответственность по п. 5 ст. 60 ГК при этом сохранилась бы в любом случае — нарушение процедуры публикации её не отменяет, а лишь добавляет кредитору другие средства защиты.\n\n---\n\n## Задача 7. ООО «Четвёртый этаж» — корпоративный тупик (дедлок)\n\n**Ответ:**\n\nОснование иска Ероховой — подп. 5 п. 3 ст. 61 ГК: ликвидация ЮЛ по решению суда возможна, если деятельность общества становится невозможной или существенно затруднённой — в том числе при длительном корпоративном тупике между участниками с равными долями.\n\nНа фактах — классический deadlock: три равных участника (по 1/3), устав требует единогласия, два года подряд не удаётся принять ни одного решения, включая критически важные (избрание директора, одобрение сделок с заинтересованностью) — деятельность общества объективно парализована.\n\nДовод Монастырского и Меньшенина («сохраняем интерес, готовы выкупить долю Ероховой») не исключает принудительную ликвидацию автоматически, но существенно меняет его перспективу: современная практика (развивающая принцип соразмерности и субсидиарности ликвидации как крайней меры) требует от суда сначала оценить, есть ли менее радикальный способ разрешить корпоративный конфликт, прежде чем прекращать существование работающего бизнеса.\n\nКлючевой тест — ликвидация является крайней мерой (ultima ratio): суд должен оценить, не могут ли права участника быть защищены иным способом — в первую очередь через выход участника / выкуп доли по справедливой цене (ст. 23 Закона об ООО — приобретение доли обществом в предусмотренных уставом или законом случаях) либо через исключение участника, систематически блокирующего деятельность общества, по ст. 67 ГК (если поведение одной стороны носит явно недобросовестный, деструктивный характер).\n\nНа фактах задачи ситуация симметрична — нет одного «виновника» дедлока, оба лагеря (Ерохова vs Монастырский+Меньшенин) одинаково не могут договориться, и оба предложили выкуп доли друг друга, то есть реальный экономический выход (выкуп) доступен и предложен сторонами добровольно, просто они не сошлись в том, кто кого выкупает.\n\nПоскольку есть реальная воля продолжать бизнес у части участников и экономически обоснованная альтернатива (выкуп доли), а ликвидация уничтожает действующее предприятие вместе с рабочими местами и имущественным комплексом, принцип соразмерности говорит в пользу приоритета выкупа доли над ликвидацией — суду следует в первую очередь предложить/содействовать разрешению спора через выкуп, а не удовлетворять иск о ликвидации формально при сохраняющейся возможности сохранить юридическое лицо.\n\nРешение: в иске о ликвидации — отказать (либо приостановить его рассмотрение), предложив сторонам реализовать механизм выкупа доли (в судебном порядке по требованию любой из сторон, если добровольно не договорятся о цене) как менее радикальное и экономически более оправданное средство разрешения корпоративного конфликта; ликвидация может быть удовлетворена только если выяснится, что и этот механизм не способен разрешить тупик (например, стороны не могут согласовать даже независимую оценку, или деструктивное поведение носит явно недобросовестный характер у одной из сторон).\n\n---\n\n## Задача 8. Предприниматель Поветкина и ликвидированное ООО «Градстрой»\n\n**Ответ:**\n\nОбщий принцип: после завершения ликвидации и исключения ЮЛ из ЕГРЮЛ его обязательства по общему правилу прекращаются (правоспособность утрачена, нет субъекта, к которому можно предъявить требование) — отсюда довод участников, что они не отвечают по долгам общества (принцип ограниченной ответственности, п. 1 ст. 87 ГК), формально верен.\n\nДовод о том, что требование «считается погашенным», поскольку Поветкина не заявила его ликвидационной комиссии — также по общему правилу корректен: п. 5.1 ст. 64 ГК — требования кредитора, не заявленные до утверждения ликвидационного баланса (при условии надлежащего уведомления о ликвидации в установленном порядке), по общему правилу считаются погашенными, если иное не следует из обстоятельств (недобросовестность ликвидационной комиссии).\n\nОднако есть специальная норма, которая и решает дело в пользу Поветкиной: п. 5.1 ст. 64 ГК (в системной связи с п. 6 ст. 64 ГК) — требования кредиторов, заявленные после истечения срока, установленного ликвидационной комиссией, удовлетворяются из имущества, оставшегося после удовлетворения требований кредиторов, заявленных в срок — то есть погашение требования не означает, что оставшееся имущество можно свободно распределить между участниками, минуя непогашенных кредиторов, если оно ещё не было распределено на момент предъявления требования.\n\nНа фактах — после удовлетворения всех заявленных в срок требований у общества осталось имущество на 500 тыс. руб., которое было распределено между участниками до того, как стало известно о требовании Поветкиной (либо одновременно/вскоре после завершения ликвидации) — участники, получившие это имущество, неосновательно обогатились за счёт того, что не был учтён непогашенный долг перед Поветкиной.\n\nПравовая конструкция защиты Поветкиной — требование к участникам в пределах полученного ими при распределении ликвидационного остатка (аналогия с правилами о неосновательном обогащении, ст. 1102 ГК, и специальными нормами о защите не заявивших требования кредиторов при распределении имущества ликвидированного ЮЛ) — её требование (300 тыс. руб.) полностью укладывается в размер распределённого участникам остатка (500 тыс. руб.).\n\nРешение: иск Поветкиной к участникам — удовлетворить в пределах полученного ими при распределении ликвидационного остатка (300 тыс. руб. из 500 тыс. руб.), а не как общую субсидиарную ответственность по всем долгам общества.\n\nЕсли бы суд установил, что участники знали о наличии долга — это меняло бы квалификацию принципиально: распределение оставшегося имущества при заведомой осведомлённости о непогашенном долге кредитора является недобросовестным поведением (ст. 10 ГК) и может служить основанием не только для взыскания в пределах полученного по правилам о неосновательном обогащении, но и для привлечения участников, принявших такое решение, к ответственности за убытки, причинённые кредитору, по аналогии с ответственностью контролирующих лиц за недобросовестные действия (ст. 53.1 ГК по аналогии, ст. 1064 ГК) — то есть ответственность могла бы выйти за пределы формально полученного остатка, если доказана причинная связь между сокрытием долга и невозможностью его погашения.\n\n---\n\n## Задача 9. Сидрерия — исключение ООО из ЕГРЮЛ в административном порядке\n\n**Ответ:**\n\nМеханизм — ст. 64.2 ГК, ст. 21.1 Закона о госрегистрации юридических лиц: регистрирующий орган вправе исключить из ЕГРЮЛ ЮЛ, которое в течение последних 12 месяцев не представляло отчётность и не осуществляло операций хотя бы по одному банковскому счёту («фактически прекратившее деятельность»); решение о предстоящем исключении публикуется, заинтересованные лица вправе направить возражения в течение трёх месяцев со дня публикации.\n\nСуд первой инстанции формально прав в одном: процедура публикации была соблюдена, и по общему правилу именно на участников/кредиторов возложена обязанность проявлять разумную осмотрительность и отслеживать такие публикации (это соответствует принципу публичной достоверности реестра, п. 2 ст. 51 ГК) — поэтому довод о непроявлении осмотрительности Орловой формально обоснован.\n\nНо это не единственный критерий законности исключения — административный порядок по ст. 64.2 ГК рассчитан именно на фактически недействующие, «брошенные» организации без активов; наличие у общества ликвидных активов прямо исключает применение этого упрощённого механизма, поскольку он не предполагает расчётов с кредиторами и распределения имущества, а при наличии активов обязательна полноценная процедура ликвидации (ст. 61–64 ГК) с соблюдением прав кредиторов и дебиторов.\n\nСудебная практика (развивающая п. 6 ст. 22 Закона о госрегистрации, позиции ВС РФ) признаёт наличие нереализованных ликвидных активов самостоятельным основанием для признания решения об административном исключении незаконным — административный порядок не предназначен для ситуаций, когда есть что распределять, независимо от того, пропустили ли заинтересованные лица трёхмесячный срок на возражения.\n\nРешение по первоначальному требованию: суд первой инстанции решил неправильно, сославшись только на формальное соблюдение процедуры публикации и непроявление осмотрительности Орловой — он не оценил довод о наличии ликвидных активов, который сам по себе исключает законность применения упрощённого порядка; акт об исключении должен быть признан недействительным (отменён) независимо от пропуска трёхмесячного срока, поскольку нарушение касается не процедурных, а материальных предпосылок применения нормы.\n\nДругой способ защиты прав Орловой — помимо оспаривания самого решения об исключении, законодательство (с 2023 г. — п. 8 ст. 22 Закона о госрегистрации) предусматривает специальную процедуру восстановления в ЕГРЮЛ недействующего ЮЛ по заявлению лица, чьи права и законные интересы затрагиваются исключением (в том числе участника, обнаружившего наличие активов), в судебном порядке в течение установленного срока (как правило, в пределах трёх лет с момента исключения) — это более прямой и специализированный путь, чем общее оспаривание ненормативного акта регистрирующего органа, и именно его стоит рекомендовать Орловой как основной.\n\n---\n\n## Задача 10. Бар «Crazy bear» — принудительная ликвидация за нарушения режима локдауна\n\n**Ответ:**\n\nОснование иска Роспотребнадзора — подп. 3 п. 3 ст. 61 ГК: принудительная ликвидация ЮЛ по иску госоргана при осуществлении деятельности с неоднократными или грубыми нарушениями закона.\n\nКлючевые ограничители применения этой нормы, выработанные практикой (в т.ч. с учётом правовых позиций КС РФ о соразмерности санкций и практики по делам о принудительной ликвидации): (1) ликвидация — это крайняя мера ответственности, несоразмерная обычным нарушениям, применяемая только при невозможности защитить публичный интерес иными, менее радикальными средствами (штраф, приостановление деятельности, запрет конкретных видов деятельности); (2) нарушения должны носить неустранимый либо систематически повторяющийся характер, создающий реальную, а не гипотетическую угрозу охраняемым законом ценностям; (3) оценивается соразмерность ликвидации характеру и степени общественной опасности нарушений, а также то, сохраняется ли нарушение/его угроза на момент рассмотрения дела судом.\n\nНа фактах — нарушения (проведение вечеринок в условиях локдауна) были неоднократными, но: (1) они привязаны к конкретному, временному правовому режиму (карантинные ограничения, действовавшие в определённый период пандемии); (2) к моменту рассмотрения дела этот режим фактически утратил актуальность — случаи заболевания перестали регистрироваться, то есть сам охраняемый интерес (эпидемиологическая безопасность в условиях конкретного локдауна) отпал.\n\nДовод общества о том, что нарушение не является неустранимым — обоснован и имеет значение: нарушения были связаны с конкретными мероприятиями в конкретный период, не затрагивали постоянный характер деятельности бара как такового (в отличие от, например, систематического нарушения правил безопасности, заложенного в саму бизнес-модель) — то есть это не ситуация, когда правомерная деятельность в принципе невозможна без нарушения закона.\n\nОценка нарушений, отпавших к моменту рассмотрения дела, с точки зрения их актуальной общественной опасности (а не формального факта привлечения к ответственности в прошлом) — соответствует требованию соразмерности: ликвидация ЮЛ — не наказание за прошлые факты сами по себе, а мера защиты актуального публичного интереса, который к моменту разрешения спора отсутствует.\n\nРешение: в иске Роспотребнадзора о ликвидации ООО «Crazy bear» — отказать; совершённые нарушения могут служить основанием для применения уже примененных административных санкций (штрафов), но не оправдывают крайнюю меру ликвидации действующего, в остальном законопослушного юридического лица при отпавшей к моменту рассмотрения дела угрозе.\n\n---\n\n## Дополнение к практикуму\n\n## Задача 1. Иванов, ООО «Ромашка» и ООО «Лютик» — варианты пороков полномочий директора\n\n**Ответ по вариантам:**\n\nУчредительный договор ограничивает полномочия директора (требуется одобрение собрания) — ограничение, установленное внутренним документом, не противопоставимо добросовестному третьему лицу, не знавшему и не долженствовавшему знать об ограничении (абз. 2 п. 1 ст. 174 ГК) — сделка оспорима, а не ничтожна, и только если доказано, что контрагент (ООО «Лютик») знал/должен был знать об ограничении. В иске Петрова следует отказать при недоказанности осведомлённости контрагента.\n\nРешение о избрании директора признано недействительным — применяется логика задачи 3 семинара (Schuld не haftung): это не влечёт ничтожность сделки по ст. 168 ГК автоматически — действует защита добросовестных третьих лиц, полагавшихся на данные ЕГРЮЛ (п. 2 ст. 51 ГК). Довод Петрова о ничтожности по ст. 168 ГК — ошибочен по актуальной практике, в иске следует отказать при добросовестности ООО «Лютик».\n\nСделка совершена после истечения срока полномочий директора — устойчивая практика: полномочия директора не прекращаются автоматически по истечении уставного срока (он продолжает действовать до избрания нового во избежание ситуации, когда ЮЛ остаётся без органа) — срок полномочий директора не отражается в ЕГРЮЛ, поэтому контрагент защищён презумпцией п. 2 ст. 51 ГК, пока не доказано, что он знал/должен был знать об истечении срока. В иске отказать при отсутствии доказательств осведомлённости.\n\nДвое директоров без прямого указания на совместность действий — действует презумпция п. 5 ст. 185 ГК (по аналогии к полномочиям, определённым решением собрания): при множественности представителей каждый действует самостоятельно, если иное прямо не следует из обстоятельств или устава. Если устав не указывал прямо на необходимость совместного подписания — сделка, подписанная одним Ковалевым, действительна. В иске отказать.\n\nДвое директоров, но устав ограничивает Ковалева только сделками по выполнению работ (без права распоряжения имуществом) — здесь уставное ограничение компетенции конкретного содиректора также регулируется п. 1 ст. 174 ГК: сделка оспорима при доказанности осведомлённости контрагента об ограничении полномочий именно этого содиректора. Разграничение компетенции между несколькими директорами, закреплённое в уставе, не противопоставимо третьим лицам автоматически — только по правилам ст. 174 ГК. В иске отказать при недоказанности осведомлённости ООО «Лютик».\n\nОбщий вывод по задаче: во всех пяти вариантах иск Петрова, по общему правилу, не подлежит удовлетворению, если не доказана недобросовестность контрагента (знал/должен был знать об ограничении, пороке или истечении полномочий) — это прямое следствие признания директора представителем, действующим в рамках защиты доверия к ЕГРЮЛ и принципа общей правоспособности коммерческого ЮЛ (п. 2 ст. 51 ГК, п. 1 ст. 174 ГК, ст. 183 ГК по аналогии).\n\n---\n\n## Задача 2. Списание избыточных стройматериалов директором без специальных знаний\n\n**Ответ:**\n\nДовод директора («я не инженер, ошибся бы любой на моём месте») не освобождает его автоматически от ответственности — стандарт заботливости директора не требует личных специальных познаний в каждой сфере деятельности общества, но требует создания надлежащей системы управления и контроля, обеспечивающей разумный уровень осмотрительности при принятии решений (п. 12 Обзора ВС РФ 2025 по ст. 53.1 ГК) — директор мог и должен был привлечь специалиста (инженера, независимый технический аудит списания) при отсутствии собственных компетенций в специализированном вопросе.\n\nКритерий неразумности (п. 3 Постановления Пленума ВАС № 62) прямо включает: совершение действия без соблюдения обычных внутренних процедур (согласование со специалистом) и непринятие мер для получения необходимой информации, хотя разумный директор отложил бы решение до её получения.\n\nСсылка на то, что он совершил «ту же ошибку, что совершил бы любой участник оборота с сопоставимыми знаниями» — некорректно сформулированный тест: сравнение должно идти не с «любым неспециалистом», а с разумным директором в сопоставимых обстоятельствах, который, зная о собственной некомпетентности в специальном вопросе, обязан был восполнить этот пробел привлечением профильного специалиста, а не действовать вслепую.\n\nРешение: иск участников подлежит удовлетворению, если доказано, что директор не предпринял разумных мер для проверки объёма списания (не привлёк специалиста, не затребовал обоснование), а не просто в силу самого факта отсутствия у него профильного образования; отсутствие профильных знаний — не основание освобождения от ответственности, а довод в пользу того, что он тем более обязан был создать систему контроля/привлечь эксперта.\n\n---\n\n## Задача 3. Петров — повреждение автомобиля на стоянке\n\n**Ответ:**\n\nДовод истцов о том, что директор «не обеспечил сохранность имущества», сформулирован слишком широко — ответственность директора не является абсолютной гарантией сохранности любого имущества общества при любых обстоятельствах; она ограничена стандартом разумности и добросовестности, а не отвечает за любой случайный вред, причинённый третьими лицами (вандализм на стоянке).\n\nПравило защиты делового решения и общие принципы ответственности директора (п. 1 Постановления № 62) требуют установить конкретное недобросовестное или неразумное действие/бездействие директора, находящееся в причинной связи с убытками, — например, отсутствие обычных для данного вида деятельности мер предосторожности (охраняемая стоянка, видеонаблюдение, страхование автопарка), если такие меры были экономически оправданы и обычны для сопоставимых организаций, а директор ими пренебрёг.\n\nСам по себе факт причинения вреда третьими лицами (повреждение шин, стекла неизвестными) — не основание для взыскания с директора убытков, причинённых непосредственно этими третьими лицами; это не риск предпринимательской деятельности, управляемый директором, а случайное неправомерное действие посторонних лиц, за которое отвечают они сами (деликтная ответственность, ст. 1064 ГК), а не директор.\n\nРешение: в иске к Петрову следует отказать, если истцы не докажут конкретное упущение в организации хранения имущества (например, не было обеспечено страхование автопарка, хотя это обычная практика для компаний с автопарком, или автомобиль был оставлен без присмотра в заведомо небезопасном месте вопреки обычной практике) — голой ссылки на факт причинения вреда недостаточно для вывода о недобросовестности/неразумности директора.\n\n---\n\n## Задача 4. ООО «Помощь» — поручительство за ООО «Ромашка», одобренное собранием\n\n**Ответ:**\n\nДовод директора о недобросовестности иска, поскольку участники сами одобрили сделку, не является безусловным основанием для отказа в иске — согласно п. 7 Постановления Пленума ВАС № 62, сам факт одобрения коллегиальным органом/участниками не освобождает директора от ответственности, поскольку у него самостоятельная обязанность действовать добросовестно и разумно, независимо от одобрения.\n\nОднако в данном случае это обстоятельство имеет значение по другой линии: согласно п. 20 Обзора ВС РФ 2025 по ст. 53.1 ГК, отсутствие/наличие корпоративного одобрения само по себе не определяет ответственность — решающим является, было ли поведение директора объективно отвечающим интересам ЮЛ на момент совершения сделки, а ответственность наступает, только если действия были направлены на причинение вреда обществу (недобросовестность), а не просто повлекли убыток из-за последующего объективного риска (неплатёж со стороны ООО «Ромашка»).\n\nВыдача поручительства за аффилированное/связанное хозяйственным образом общество на обычных рыночных условиях, без признаков сговора директора с бенефициарами ООО «Ромашка» в ущерб ООО «Помощь», относится к обычному предпринимательскому риску — сам факт неисполнения обязательства должником (ООО «Ромашка») не может автоматически перекладываться на директора поручителя, который не контролирует платёжеспособность должника.\n\nОдобрение участниками сделки имеет значение как доказательство того, что директор не скрывал информацию, действовал прозрачно, и что риск был принят самими участниками осознанно (в отличие от ситуации сокрытия информации, п. 2 Постановления № 62) — это говорит в пользу применения правила защиты делового решения, а не против директора.\n\nРешение: в иске участников к директору о взыскании убытков за выдачу поручительства, по общему правилу, следует отказать, если не доказано, что директор действовал недобросовестно (например, скрыл от участников реальное финансовое состояние ООО «Ромашка» на момент одобрения, или сделка изначально была частью схемы по выводу активов) — при отсутствии таких доказательств убыток от неплатежа должника относится к обычному предпринимательскому риску, осознанно принятому самим обществом через одобрение участников.\n"},{"id":"civil-5","title":"Семинар 3. Задачи и статьи","short":"Семинар 3","date":"16 окт","md":"*Порядок на семинаре (со слов преподавателя): сначала задачи из «Дополнения к практикуму» (1–4), потом основные задачи 3–6. Статьи Кузнецова, на которых построены задачи 4 и 6, пересказаны в части 3. Нормы без пометки взяты из статей Кузнецова или общеизвестны. «(сверить)» — первоисточник открыть не удалось, проверь по тексту перед семинаром.*\n\n## Часть 1. Дополнение к практикуму (задачи 1–4)\n\n### Задача 1. Иванов, ООО «Ромашка» и ООО «Лютик»: пять вариантов\n\n**Суть.** Участник «Ромашки» Петров оспаривает договор купли-продажи, который заключил директор. Основания разные, вопрос один: что делать с сомнениями в полномочиях директора.\n\n**Общая логика (ответ на все пять вариантов):**\n\n- Сделка директора, вышедшего за пределы полномочий или избранного с пороком, не ничтожна. Максимум оспорима.\n- Ограничение полномочий органа по уставу или иному документу действует против контрагента, только если он знал или должен был знать об ограничении (п. 1 ст. 174 ГК). Иск вправе подать лицо, в интересах которого ограничение установлено. Доказывать осведомлённость «Лютика» должен Петров.\n- Данные ЕГРЮЛ о директоре считаются достоверными, общество не вправе ссылаться на их недостоверность против добросовестного контрагента (п. 2 ст. 51 ГК). Добросовестность презюмируется (п. 5 ст. 10 ГК).\n\n**(1) Директор не вправе продавать имущество без одобрения собрания (по учредительному договору)**\n\n- Это ограничение полномочий директора внутренним документом, значит, п. 1 ст. 174 ГК: сделка оспорима, ничтожности нет.\n- Если ограничение записано только в договоре об учреждении между участниками, а не в уставе, то это корпоративный договор: он не создаёт обязанностей для третьих лиц, а нарушение даёт основание оспорить сделку только если контрагент знал об ограничении (ст. 67.2 ГК, сверить пункт).\n- Решение: в иске отказать, если «Лютик» не знал и не должен был знать об ограничении.\n\n**(2) Решения об избрании директора признаны недействительными, значит, сделка ничтожна по ст. 168**\n\n- Довод Петрова неверен. Порок избрания директора — внутренний корпоративный дефект. Его риск несёт общество, а не контрагент, который ни на формирование органа, ни на его проверку повлиять не мог.\n- Ключевая норма — п. 2 ст. 51 ГК: «Ромашка» не вправе ссылаться на недостоверность записи о директоре в ЕГРЮЛ в отношениях с лицом, которое на неё полагалось.\n- Исключение — запись внесена в результате неправомерных действий третьих лиц или помимо воли общества (подделка документов, рейдерство). Здесь решения собраний были, воля участников формально выражена, исключение не работает.\n- Отсутствие полномочий — не основание ничтожности по ст. 168. Для неуполномоченного лица есть специальная норма (ст. 183 ГК), но и она вытесняется п. 2 ст. 51 в пользу добросовестного контрагента.\n- Решение: в иске отказать, если «Лютик» добросовестен.\n\n**(3) Сделка совершена после истечения срока полномочий директора**\n\n- Срок полномочий в ЕГРЮЛ, как правило, не указывается (сверить). Контрагент, который полагался на запись о директоре, защищён п. 2 ст. 51 ГК.\n- Если «Лютик» знал, что срок вышел, у директора не было полномочий: сделка считается совершённой от имени самого директора, пока «Ромашка» её не одобрит (п. 1 ст. 183 ГК). Одобрение действует с момента совершения (п. 2 ст. 183).\n- Решение: в иске отказать, пока Петров не докажет осведомлённость «Лютика».\n\n**(4) Директоров двое (Ковалев и Смирнов), сделку должны были подписать оба**\n\n- Всё решает устав: директора действуют совместно или независимо. Орган юридического лица может состоять из нескольких лиц (п. 1 ст. 53 ГК, ст. 40 Закона об ООО).\n- Устав требует совместных действий, а подписал один: это выход за пределы полномочий, п. 1 ст. 174 ГК, сделка оспорима. Если порядок действия (совместно или независимо) вносится в ЕГРЮЛ (сверить), а «Лютик» реестр смотрел, он знал — и иск скорее будет удовлетворён.\n- Устав молчит или предусматривает независимые действия: основания для иска нет.\n- Решение: на данных условия — отказать, пока не доказано, что устав требовал двух подписей и что контрагент об этом знал.\n\n**(5) Двое директоров, Ковалев по уставу вправе заключать только договоры на выполнение работ, а продал имущество**\n\n- Разграничение компетенции между директорами по уставу — тоже ограничение полномочий органа, п. 1 ст. 174 ГК. Сделка оспорима, и только при доказанной осведомлённости контрагента.\n- Нюанс: если ограничение конкретного директора есть в уставе, но не видно из ЕГРЮЛ, суд будет оценивать осмотрительность «Лютика». Чем необычнее сделка (распоряжение имуществом, когда директор по уставу не вправе), тем выше стандарт: разумный контрагент запрашивает устав (практика, сверить).\n- Решение: отказать, если нет доказательств осведомлённости; удовлетворить, если «Лютик» видел устав.\n\n**Итог.** Во всех пяти вариантах основание «ничтожность» не работает. Исход решают два вопроса: что видно из ЕГРЮЛ и знал ли контрагент об ограничении.\n\n---\n\n### Задача 2. Списание избыточных стройматериалов директором без строительных знаний\n\n**Суть.** Участники взыскивают убытки с директора. Он ссылается на то, что не инженер и ошибку допустил бы любой участник оборота с такими же знаниями.\n\n**Ответ:**\n\n- Норма: п. 3 ст. 53 и ст. 53.1 ГК. Директор обязан действовать добросовестно и разумно в интересах общества, убытки возмещает по иску общества или участников. Разъяснения — Постановление Пленума ВАС № 62 от 30.07.2013.\n- Довод директора «любой участник ошибся бы» построен на неверном стандарте. Разумность директора измеряется не сопоставлением с любым неспециалистом, а поведением обычного директора такой компании в сопоставимых условиях.\n- Из этого не следует, что директор обязан быть инженером. Обязанность другая: принять разумные меры, чтобы компенсировать недостаток знаний. Привлечь профильных специалистов, запросить обоснование списания, организовать внутренний контроль, а не действовать вслепую.\n- Директор вправе опираться на заключения компетентных работников и подрядчиков, если нет причин им не доверять.\n- Правило защиты делового решения: суд не оценивает целесообразность решения и не отвечает за результат, если решение принято добросовестно, на основе разумно собранной информации и без личного интереса.\n- Что должны доказать истцы: убытки (излишнее списание привело к реальным потерям общества, например лишние закупки), причинную связь, недобросовестность или неразумность директора (обычные процедуры и проверки не проведены). Само по себе отсутствие диплома инженера неразумностью не является.\n\n**Решение:** сам довод директора не освобождает его от ответственности, но и вывод «обязан был знать как специалист» ничего не доказывает. Иск удовлетворяется, если истцы докажут убытки и то, что директор не принял обычных для такой компании мер (не привлёк специалистов, не проверил смету и списание). Если он докажет, что действовал на основании заключений специалистов и предпринял меры, чтобы вникнуть, — в иске отказать.\n\n---\n\n### Задача 3. Петров: повреждение автомобиля общества на стоянке (иск на 5 млн руб.)\n\n**Суть.** Шины проколоты, стекло разбито неизвестными. Участники требуют с директора 5 млн руб. убытков: «не обеспечил сохранность».\n\n**Ответ:**\n\n- Ответственность директора не гарантийная. Он не отвечает за любой вред, причинённый имуществу третьими лицами (вандализм). Вред причинили неизвестные лица — отвечать должны они (ст. 1064 ГК).\n- Директор отвечает за свои действия и бездействие, если они недобросовестны или неразумны (п. 3 ст. 53, ст. 53.1 ГК). Нужно показать конкретное упущение: не организовал обычные для такой компании меры (охраняемая стоянка, видеонаблюдение, страхование автопарка), хотя они экономически разумны и распространены.\n- Нужна причинная связь между упущением и вредом: вандализм произошёл бы и при обычных мерах — связи нет.\n- Размер: ремонт шин и стекла несопоставим с 5 млн руб. Убытки доказываются (ст. 15 ГК), и размер, скорее всего, завышен.\n- Правило защиты делового решения: выбор способа хранения (платная охраняемая стоянка или нет) — управленческое решение, оценивать его целесообразность суд не вправе.\n\n**Решение:** в иске отказать. Только если истцы докажут конкретное упущение директора, которое было причиной вреда, а размер убытков подтвердят, иск удовлетворяется в части подтверждённого ущерба, но не в 5 млн.\n\n---\n\n### Задача 4. ООО «Помощь»: поручительство за «Ромашку» на 7 млн руб., одобренное собранием\n\n**Суть.** Директор вынес вопрос на собрание, большинство одобрило поручительство. «Ромашка» не заплатила, банк взыскал 7 млн с «Помощи». Часть участников требует убытки с директора. Он отвечает: вы же сами одобрили.\n\n**Ответ:**\n\n- Одобрение собранием само по себе не освобождает директора. У него собственная обязанность действовать добросовестно и разумно (п. 3 ст. 53 ГК), и она не исчезает от того, что участники проголосовали «за». Решающий вопрос: получили ли участники полную и достоверную информацию о риске (финансовое состояние «Ромашки», зачем нужно поручительство, есть ли регресс или встречное обеспечение).\n- Сокрытие информации, личный интерес директора в «Ромашке», заведомо безрассудная сделка — основания для ответственности, и одобрение их не покрывает (Пленум ВАС № 62, перечни недобросовестного и неразумного поведения, конкретные пункты сверить).\n- Если информацию раскрыли и участники приняли риск осознанно, правило защиты делового решения работает в пользу директора: неплатёж «Ромашки» — обычный предпринимательский риск, не вина директора.\n- Довод «вы сами одобрили» хорош для тех участников, которые голосовали «за». Их иск противоречит их же поведению: недопустимо извлекать преимущество из противоречивого поведения (п. 4 ст. 1, п. 5 ст. 10 ГК; по аналогии п. 5 ст. 166 ГК, эстоппель). Участники, голосовавшие «против» или воздержавшиеся, вправе предъявить иск, но на них лежит доказывание недобросовестности и неразумности.\n- Если поручительство — крупная сделка, одобрение собрания обязательно (ст. 46 Закона об ООО), и директор его получил. Это снимает вопрос о форме, но не о разумности.\n\n**Решение:** в иске отказать, если не доказано сокрытие информации, личный интерес или полное отсутствие экономического смысла (безвозмездное поручительство за неплатёжеспособную компанию без оценки рисков). Тогда требования голосовавших «за» участников отклоняются ещё и по эстоппелю.\n\n---\n\n## Часть 2. Основные задачи 3–6\n\n### Задача 3. АО «Schuld не haftung»: Егоров и недействительное избрание директора\n\n**Суть.** Егоров как генеральный директор продал имущество. Позже решение о его избрании признали недействительным, акционеры требуют вернуть имущество. Покупатель не знал о пороке.\n\n**Ответ:**\n\n- Прав покупатель.\n- Нормы: п. 2 ст. 51 ГК (данные ЕГРЮЛ признаются достоверными, общество не вправе ссылаться на недостоверность против добросовестного контрагента); п. 1 ст. 53 и п. 1 ст. 182 ГК (орган действует от имени юридического лица); ст. 183 ГК (сделка неуполномоченного лица); п. 5 ст. 10 ГК (презумпция добросовестности); ст. 181.3–181.4 ГК (недействительность решений собраний).\n- Логика: недействительное решение недействительно с момента принятия, то есть формально Егоров директором не был. Но этот порок возник внутри общества — в процедуре избрания, которую контрагент проверить не мог. Риск такого дефекта несёт общество, а не добросовестный покупатель.\n- Исключение, когда реестр не защищает: запись внесена в результате неправомерных действий третьих лиц или иным путём помимо воли общества (подделка документов, рейдерство). Здесь запись внесена на основании решения собрания, то есть воля участников была, значит, исключения нет.\n- Действительна ли сделка: да, она не ничтожна. Отсутствие полномочий — не основание для ничтожности по ст. 168 ГК.\n- Требовала ли оспаривания: да. Оспоримая сделка действительна, пока суд не признал иное. Ничтожная не нуждалась бы в оспаривании, но оснований ничтожности нет. Требовать вернуть имущество, не оспорив сделку и не получив реституцию, нельзя. А оспорить не получится: общество не вправе ссылаться на недостоверность ЕГРЮЛ против добросовестного покупателя (п. 2 ст. 51).\n- Если покупатель проверил ЕГРЮЛ и увидел Егорова: решение не меняется, только укрепляется — проверка реестра прямо подтверждает добросовестность и «полагался на реестр». Если не проверял: сама по себе непроверка не доказывает, что он знал о пороке, добросовестность презюмируется. Но ссылаться на п. 2 ст. 51 удобнее тому, кто смотрел реестр. Если бы в ЕГРЮЛ значился другой человек, покупатель защиты бы не имел.\n\n**Решение:** в иске акционеров к покупателю отказать.\n\n---\n\n### Задача 4. Чупрунов и Зайцев: право единолично менять директора по уставу ООО\n\n**Суть.** Оба учредили ООО и записали в устав право Чупрунова в любой момент прекратить полномочия директора и назначить нового. Поссорившись, Чупрунов снял Зайцева и назначил себя. Зайцев просит признать пункт устава недействительным (закон такого права не предусматривает) и признать недействительным прекращение его полномочий.\n\nОпора — статья Кузнецова о деле «Яна Тормыш» (Определение ВС от 11.06.2020 № 306-ЭС19-24912), пересказ в части 3 ниже.\n\n**Ответ:**\n\n- Можно ли оспаривать положение устава: да, но оспаривание устава — это оспаривание решения собрания (учредителей), которым он утверждён. Так сказал ВС в деле «Яна Тормыш». К решениям собраний применяются общие нормы о сделках (п. 110 Пленума ВС № 25), включая ст. 168 ГК.\n- Основания: ничтожность по ст. 168 ГК как противоречащее существу законодательного регулирования (п. 74 Пленума ВС № 25) либо оспоримость по ст. 181.4 ГК (нарушение закона). Довод Зайцева в пользу ничтожности по ст. 181.5 ГК: назначение директора относится к компетенции собрания (ст. 33 Закона об ООО, сверить), а устав передал его одному участнику.\n- Как определить императивность и диспозитивность (центральная мысль Кузнецова):\n    - формула «закон прямо не разрешил, значит, нельзя» не работает; отсутствие в статье оговорки «если иное не предусмотрено уставом» не доказывает императивность, по крайней мере для непубличных обществ;\n    - для ООО действует презумпция диспозитивности (ВС в деле «Яна Тормыш»): устав вправе отступать от закона, если это прямо не запрещено или недопустимость не вытекает из существа законодательного регулирования;\n    - существо регулирования определяют по целям: нельзя ли этим вредить третьим лицам (кредиторам, контрагентам); не запирается ли участник на неопределённо долгий срок без выхода; защищена ли ограниченная рациональность участников при потенциально бессрочном образовании. Изменения устава обычно требуют единогласия, потому что затрагивают права каждого.\n- Применение к фактам: положение распределяет контроль между двумя участниками. Третьих лиц оно не затрагивает: директор для контрагентов остаётся тем же, что записан в ЕГРЮЛ. Зайцев не заперт в обществе без выхода (но проверь, есть ли у него право выйти или продать долю). Положение принято единогласно, Зайцев сам его подписал при создании. Досрочно прекратить полномочия директора можно в любой момент и без объяснения причин, то есть положение лишь меняет, кто это решает.\n- Возражения Зайцева: контроль над ключевой должностью уходит к одному участнику, второй лишается голоса. Это может быть признано обходом правил о компетенции собрания и принципа участия в управлении (ст. 65.2 ГК), особенно при равных долях и при отсутствии у Зайцева выхода.\n- Прекращение полномочий самого Зайцева как директора: вопрос трудовой. Прекращение трудового договора с руководителем по решению уполномоченного органа допустимо без вины, но с компенсацией (п. 2 ст. 278 и ст. 279 ТК).\n\n**Решение:** по логике Определения ВС и статьи Кузнецова положение устава, скорее всего, действительно (презумпция диспозитивности, согласие Зайцева, третьих лиц не затрагивает), поэтому в обоих требованиях отказать. Зайцев имеет шанс только если докажет, что положение лишает его участия в управлении по существу и без возможности выхода. Прямой нормы о праве участника единолично менять директора я не проверял (дополнительные права участников по уставу, ст. 8 Закона об ООО, сверить).\n\n---\n\n### Задача 5. Кузнецов и Абрамова: ООО «Медицина и право», поездки во Францию и Испанию на 3 млн руб.\n\n**Суть.** Директор и участник Кузнецов за три года потратил 3 млн руб. общества на поездки в библиотеки и юридическую литературу, объясняет повышением квалификации. Абрамова требует убытки. Кузнецов: результаты общества выросли в пять раз.\n\n**Ответ:**\n\n- Природа отношений директора и юридического лица: вовне орган выступает от имени общества как представитель (п. 1 ст. 53 и п. 1 ст. 182 ГК). Внутри — договор (трудовой по ТК или гражданско-правовой) плюс корпоративные отношения. Содержание обязанностей фидуциарное: действовать в интересах общества добросовестно и разумно (п. 3 ст. 53, ст. 53.1 ГК). Для руководителя организации убытки считаются по правилам гражданского законодательства (ст. 277 ТК).\n- Что доказывать, чтобы взыскать убытки с директора: нарушение — недобросовестность или неразумность конкретных действий (Пленум ВАС № 62); убытки и их размер (ст. 15 ГК); причинная связь между действиями и убытками. Вина презюмируется, директор вправе её опровергать. Доказывает истец, но перечни из Пленума № 62 (когда недобросовестность или неразумность считаются доказанными) облегчают ему задачу.\n- Правило защиты делового решения: суд не проверяет экономическую целесообразность решений директора и не наказывает за коммерческую неудачу, если решение принято добросовестно, без личного интереса (конфликта интересов), на основе разумного объёма информации и с обоснованным убеждением, что оно в интересах общества. Идея: предпринимательская деятельность рискованна и суд не вправе подменять собой менеджмент. Об этом же говорил Конституционный Суд в Постановлении от 24.02.2004 № 3-П: у судов есть объективные пределы в выявлении деловых просчётов. Литература — Ключарева (Закон, 2015, № 11).\n- Слабое место Кузнецова: BJR не защищает решения, принятые в личном интересе. Расходы на повышение квалификации самого директора могут быть расценены как трата общества на личные нужды. Спасёт его документальная связь с деятельностью: поездки подтверждены задачами общества (командировки, отчёты, использование литературы для клиентов, информирование участников). Одобрение остальных участников, если было, тоже важно.\n- Довод «результаты выросли в пять раз»: он не оправдывает расходы сам по себе (рост мог быть по иным причинам), но говорит о том, что убытков общество не понесло или причинной связи нет, а также что поведение директора в целом было разумным.\n\n**Решение:** в иске Абрамовой отказать, если Кузнецов подтвердит связь расходов с деятельностью общества, а Абрамова не докажет личный интерес и убытки. Если окажется, что поездки — личные, а литература не использовалась, иск удовлетворяется на эту часть расходов.\n\n---\n\n### Задача 6. ООО «Чтец» и АО «Кавон»: реорганизация разделением\n\n**Суть.** «Чтец» дал «Кавону» 5 млн руб. займа. Тот разделился на «Милу» (всё ликвидное имущество) и «Дину» (все долги). «Мила» заплатила «Чтецу» 2,5 млн, остаток предложила взыскать с «Дины». «Чтец» требует 2,5 млн солидарно. Ответчики ссылаются на то, что «Чтец» не возражал против реорганизации и закон был соблюдён. Опора — статья Кузнецова о защите кредиторов при реорганизации, пересказ в части 3 ниже.\n\n**Ответ (способы защиты кредиторов при реорганизации, ст. 60 ГК):**\n\n- Информирование: реорганизуемое общество публикует сообщение о реорганизации, чтобы кредиторы узнали о ней (п. 1 ст. 60).\n- Требование в суде досрочного исполнения обязательства, а если нельзя — прекращения обязательства и возмещения убытков (п. 2 ст. 60). Только для кредиторов, чьи требования возникли до публикации; срок для предъявления — 30 дней с последней публикации (сверить). Эти требования не приостанавливают реорганизацию (абз. 6 п. 2 ст. 60), хотя общество должно исполнить их до завершения реорганизации (абз. 4 п. 2).\n- Обеспечительные меры, включая приостановление реорганизации (по судебной практике).\n- Солидарная ответственность лиц, созданных в результате реорганизации, а также контролирующих лиц, членов коллегиальных органов и лица, действующего от имени общества, если они своими действиями способствовали тому, что требования кредитора не удовлетворены (п. 3 ст. 60 вместе с п. 3 ст. 53.1 и п. 3 ст. 53 ГК).\n- Солидарная ответственность правопреемников при несправедливом распределении активов и обязательств, если разделительный баланс не позволяет определить правопреемника по обязательству (п. 5 ст. 60). Бремя доказывать, что распределение справедливо, лежит на реорганизованном обществе и правопреемниках, а не на кредиторе (практика, на которую ссылается Кузнецов, например Постановление АС Поволжского округа от 30.05.2018 по делу № А55-3451/2017).\n- Оспаривание самой реорганизации как несостоявшейся (ст. 60.1 ГК, сверить) — крайняя мера.\n\n**Решение по фактам:**\n\n- Распределение очевидно несправедливо: всё ликвидное имущество у «Милы», все долги у «Дины». «Мила» сама заплатила половину долга, то есть де-факто владеет активами. Правопреемники не докажут справедливость распределения, поэтому они отвечают солидарно (п. 5 ст. 60 ГК), а кредитор вправе потребовать исполнения как от любого из них, так и от обоих (п. 1 ст. 323 ГК).\n- Довод «„Чтец“ не возражал против реорганизации» не работает. Права по п. 2 ст. 60 — самостоятельный способ защиты, который кредитор вправе не использовать. Солидарная ответственность по п. 5 не зависит от того, возражал ли кредитор.\n- Довод «закон соблюдён, публикации были»: формальная законность процедуры и справедливость распределения активов — разные вопросы. Публикация обеспечивает информирование, а не гарантирует, что правопреемники достаточны для расчёта по долгам.\n- Решение: иск «Чтеца» о взыскании 2,5 млн руб. солидарно с «Милы» и «Дины» удовлетворить. Между собой правопреемники урегулируют расчёты в порядке регресса (ст. 325 ГК).\n\n**Изменилось бы решение при нарушении публикации?** Нет, иск о солидарной ответственности по п. 5 удовлетворяется так же: нарушение публикации не отменяет ответственность, а лишь добавляет кредитору основания. Что добавляется: срок для требований по п. 2 ст. 60 не начинает течь, поэтому кредитор вправе потребовать досрочного исполнения или прекращения обязательства с убытками; контролирующие лица и органы отвечают по п. 3 ст. 60; можно просить приостановить реорганизацию обеспечительной мерой, если она ещё не завершена, и поставить вопрос о признании реорганизации несостоявшейся (ст. 60.1 ГК, сверить).\n\n---\n\n## Часть 3. Статьи Кузнецова к семинару\n\nДве статьи из списка к семинару. Для каждой: основная суть, пересказ по разделам и вывод для задачи. Статья 1 нужна для задачи 4, статья 2 для задачи 6.\n\n### Статья 1. «Новая жизнь российского корпоративного права и ограничения на отчуждение доли (акций)»\n\nКомментарий к Определению Судебной коллегии по экономическим спорам ВС РФ от 11.06.2020 № 306-ЭС19-24912 («Вестник экономического правосудия РФ», 2020, № 8). Дело ООО «Яна Тормыш» (по-татарски «новая жизнь»).\n\n#### Основная суть\n\n- ВС РФ сделал три вещи: признал товарищескую природу хозяйственных обществ, ввёл презумпцию диспозитивности для непубличных обществ (ООО), начал формировать понятие «существо законодательного регулирования» как предел автономии воли.\n- Автор считает бесполезными споры о «настоящей природе» корпорации (договор или институт). Нужно прагматично искать пределы автономии воли для каждого правила.\n- Отсутствие в законе оговорки «если иное не предусмотрено уставом» не означает императивность нормы (для непубличных обществ).\n- Нельзя навечно «запереть» участника в обществе без выхода и без возможности вернуть инвестиции.\n\n#### Фабула и судебные акты\n\n- Участник ООО требовал, чтобы общество выкупило его долю (п. 2 ст. 23 Закона об ООО): ему отказали в согласии продать долю третьим лицам. Одновременно он оспаривал пункт устава о цене при реализации преимущественного права — по номинальной стоимости доли (значительно ниже рыночной).\n- Три инстанции отказали: устав утверждён решением собрания, которое отдельно не оспорено; процедурных нарушений нет; номинальная цена закону не противоречит; суд общей юрисдикции прекратил административное дело по ч. 11 ст. 15.23.1 КоАП.\n- ВС все акты отменил и направил дело на новое рассмотрение. Его тезисы: 1) устав — по существу товарищеское соглашение и сделка, к которой применимы правила о сделках; 2) раз устав утверждён решением собрания, оспаривание устава — оспаривание этого решения; 3) к решениям собраний применимы общие положения о сделках, включая ничтожность из-за противоречия существу законодательного регулирования; 4) при общей презумпции диспозитивности для ООО положение устава противоречит существу регулирования, если участнику долгосрочно запрещён выход без возврата инвестиций; такое положение ничтожно; 5) протокол собрания подписан только частью участников и не удостоверен нотариально; 6) решение суда общей юрисдикции по делу об административном правонарушении ничего не говорит о законности устава.\n\n#### Пересказ по разделам\n\n**1. Устав — товарищеское соглашение и принцип диспозитивности**\n\n- История: договорная теория корпорации старая, XIX век, отражена в ст. 1832 ГК Франции; потом её сменила институциональная теория (юридическое лицо — предлагаемый законом способ организации сообщества), позже вновь движение к гибкости (французское упрощённое акционерное общество SAS, испанское SRL).\n- Современный подход: корпорация — смешанный феномен. Прямо договором не является, но имеет черты договора, и их вес зависит от формы (АО — преимущественно жёсткие институциональные правила).\n- Критика российской моды 2000-х на «фирма — это контракт» (экономический анализ права): понятия договора в экономике и догматике разные, поэтому экономический анализ не может доказать или опровергнуть договорную природу общества.\n- Выбор «диспозитивность или императивность» не равен выбору «договорный или недоговорный». Договорное право тоже содержит много императивных норм.\n- Для ООО ВС прямо указал: в основе регулирования лежит презумпция диспозитивности. Для публичных обществ оправданна презумпция императивности (масса неквалифицированных акционеров, защита рынка акций, стандартизация).\n- ВС отметил диспозитивность любых ограничений на отчуждение доли в ООО, включая преимущественное право покупки. Устав может отступать от закона, если это не запрещено прямо и не противоречит существу регулирования. Изменения в устав, как правило, требуют единогласия.\n- ВС назвал устав «соглашением, имеющим гражданско-правовую природу» вместо слова «договор». Автор: акцент на слове «товарищество», а не «соглашение». Важно связать общества с договором товарищества (п. 1 ст. 1041 ГК): любое общество кроме однособственного — это объединение вкладов для общей цели. ВС не ссылался на ст. 421 ГК (свобода договора), то есть договорной свободы в полном объёме не признал.\n\n**2. Оспаривание устава — оспаривание решения собрания, которым он утверждён**\n\n- В практике было две линии: устав можно оспаривать самостоятельно (общий срок давности) или нельзя, это оспаривание решения собрания. ВС выбрал вторую и правильно уточнил, что суд обязан квалифицировать требование, а не отказывать из-за «неправильного способа защиты».\n\n**3. Решение собрания — сделка**\n\n- Решения собраний — вид сделок, но не полное совпадение: для недействительности действуют особые правила (глава 9.1 ГК). Но они недоработаны, и правоприменитель вынужден обращаться к общим нормам о сделках (п. 110 Постановления Пленума ВС № 25 от 23.06.2015).\n- Пробел главы 9.1: противоречие закону (без разделения на процедуру и содержание) — основание оспоримости (п. 1 ст. 181.4 ГК). После срока давности порочный устав остался бы действовать навсегда, даже если он явно противоречит императивной норме. Практика решала это выводом: суд не применяет положения устава, противоречащие закону (абз. 3 п. 5 Постановления Пленумов ВС и ВАС № 90/14 от 09.12.1999 по ООО).\n- ВС в этом деле обратился к ст. 168 ГК: ничтожность из-за противоречия существу законодательного регулирования (п. 74 Постановления Пленума ВС № 25). К иску о признании решения ничтожным по этому основанию давность не применяется (к последствиям недействительности — применяется).\n- Новое по сравнению с прежними разъяснениями: ничтожность наступает не просто за отклонение от нормы, а за противоречие существу регулирования. Это (а) подчёркивает значимость нарушения и уводит от примитивного вопроса «есть ли в норме оговорка о допустимости отступления» и (б) показывает, что дело не только в нарушении конкретной нормы: может не быть и её, а быть искажение законодательной модели.\n\n**4. Существо законодательного регулирования: недопустимо «вечное товарищество»**\n\n- Идея старая: Nulla societatis in aeternum coitio est (Дигесты, D. 17.2.70). Не существует свободы связать себя с обществом навечно. Это видно в нормах об ограничениях на отчуждение, исключении, выходе, ликвидации.\n- Аргументы против «вечного товарищества»: 1) корпорации потенциально бессрочны, а люди не могут предвидеть долгосрочные последствия (ограниченная рациональность, оптимизм на старте); 2) фидуциарные отношения в ГК нигде не бывают вечными (п. 2 ст. 610, ст. 782, ст. 977, 1003, 1004, 1010, 1024, 1052), а участник корпорации несёт обязанности (п. 4 ст. 65.2 ГК), в том числе рискует субсидиарной ответственностью как контролирующее лицо; 3) нельзя полностью лишить собственника права распоряжаться вещью; 4) неопределённо долгое обязательство вообще недопустимо.\n- Два способа избежать «вечного товарищества»: дать возможность отчуждения доли или дать право выхода (потребовать выкупа). Запрет или согласие на отчуждение должны уравновешиваться правом выхода и наоборот.\n- Временный запрет допустим без права выхода: ВС впервые признал допустимость запрета (необходимости согласия) на отчуждение на «разумный краткосрочный период», например срок окупаемости или разработки технологии. Автор: «краткосрочный» создаёт презумпцию краткости; срок может быть и 5–10 лет и больше, если обоснован, но чем длиннее, тем убедительнее нужна мотивировка.\n- Сравнение: Испания (ст. 108 закона о компаниях: бессрочный запрет допустим, только если устав разрешает выход в любой момент или срок запрета не более пяти лет); Франция (ограничения должны быть временными и оправданными, для SAS — до 10 лет); Германия (запрет допустим, потому что есть право выхода по уважительной причине, для России это слишком оценочно).\n- Российское регулирование непоследовательно: в ООО есть компромисс (п. 2 ст. 23 Закона об ООО: запрет или отказ в согласии — общество обязано выкупить долю), в непубличном АО такой нормы нет, но согласие на отчуждение ограничено пятью годами (п. 5 ст. 7 Закона об АО). Автор: в ООО и непубличном АО должны быть допустимы обе модели — временный запрет или постоянный, но с правом выкупа.\n- Цена при преимущественном праве: преимущественное право — тоже ограничение на отчуждение и подчиняется тем же рамкам. Заниженная заранее установленная цена фактически запирает участника. В АО суд вправе не применять цену из устава, если она существенно ниже рыночной (п. 3 ст. 7 Закона об АО), что по сути ничтожность в конкретных обстоятельствах.\n- ВС также объявил ничтожным положение о заниженной цене, сославшись на недопустимость запирать участника и на ст. 1048 ГК (запрет лишать участника права на прибыль): продав долю по заведомо заниженной цене, он не получит ничего. Важные уточнения: критерий — «существенно отличающаяся от рыночной» (грубое отклонение), и даже такая цена допустима, но только на время («разумный краткосрочный период»). Суды вмешиваются, если цена очевидно несоразмерна и участники не смогли её обосновать.\n- Всё сказанное относится и к корпоративным договорам: они не могут обходить существо законодательного регулирования.\n\n#### Как применять к задаче 4 (Чупрунов и Зайцев)\n\n1. Оспаривание положения устава = оспаривание решения собрания (учредителей), которым он утверждён.\n2. Основание — ст. 168 ГК: противоречие существу регулирования (п. 74 Пленума ВС № 25) или ст. 181.4–181.5 ГК.\n3. В ООО презумпция диспозитивности. Довод «закон такого не предусматривает» слаб: отсутствие в норме оговорки об уставе не делает её императивной.\n4. Проверить положение по критериям существа регулирования: затронуты ли третьи лица; заперт ли участник без выхода; согласился ли он на это при создании.\n5. Вывод по статье: положение, скорее всего, допустимо (затрагивает только баланс сил двух участников, принято единогласно), но риск есть, если у Зайцева нет ни выхода, ни продажи доли.\n\n### Статья 2. «Основания защиты кредиторов при реорганизации: оптимальная модель»\n\n(«Вестник гражданского права», 2021, № 1).\n\n#### Основная суть\n\n- Кредиторов при реорганизации нужно защищать только тогда, когда реорганизация причиняет им ущерб (угрожает исполнению обязательства). Защита не должна быть безусловной.\n- Российская модель защиты, с поправками, автор считает оптимальной: она предварительная (a priori), позволяет заранее оценить размер требований, не приостанавливает реорганизацию (нет почвы для шантажа кредиторов) и защищает кредиторов, чьи требования не исполнены ни до, ни после реорганизации (п. 5 ст. 60 ГК).\n- Предложение автора: прямо указать в п. 2 ст. 60 ГК, что права кредитора возникают при вреде от реорганизации, при этом вред презюмируется, пока не доказано иное.\n\n#### Пересказ по разделам\n\n**1. Введение**\n\n- Любой правопорядок ищет баланс между интересами реорганизуемых обществ и кредиторов. Российский подход с 1994 г.: право требовать досрочного исполнения или прекращения обязательства и возмещения убытков (п. 2 ст. 60 ГК) при почти полном отсутствии требований к раскрытию информации. Реформы 2008 и 2014 гг. принципов не изменили.\n- Российская дискуссия оторвана от европейской традиции. Европейские директивы (ст. 99 и 146 Директивы 2017/1132, раньше Третья и Шестая директивы) говорят, что кредиторов надо защищать при ущербе, но унификации не предусматривают и ничего не объясняют по существу.\n- В Германии защита предоставляется после реорганизации (право требовать обеспечения), в России, Франции, Испании и Швейцарии (для разделения и выделения) — до её завершения. Эти страны автор и использует для сравнения.\n\n**2. Обоснование защиты кредиторов**\n\n- Исторически: должника нельзя заменить без согласия кредитора. Но реорганизация идёт по универсальному правопреемству, согласие кредиторов не требуется (иначе реорганизация была бы практически невозможна). Специальные права кредиторов возникли как замена согласия. Дополнительный аргумент: при некоторых формах реорганизации должник исчезает без ликвидации и расчётов с кредиторами.\n- Разбор взглядов: формальный критерий «защищать только при замене должника» отвергнут. Прекращается ли конкретное юридическое лицо — неважно, ведь для кредитора юридическое лицо — это набор имущества. Круг защищаемых не совпадает с кругом тех, чьё согласие нужно (защита нужна только кредиторам, чьи права возникли до публикации о реорганизации). Аналогия с наследованием имеет ограниченную ценность: цели разные, в наследовании переход неизбежен, в реорганизации зависит от воли участников, и реорганизации нужен режим благоприятствования.\n- Современное обоснование: риск уменьшения имущества, на которое можно обратить взыскание (французское droit de gage). Но аргумент «реорганизация сама по себе угрожает» уязвим: слияние и присоединение обычно усиливают общество; злоупотребления присущи любой форме с ограниченной ответственностью и совершаются другими способами; убыль имущества сопровождает и любые другие сделки (в том числе крупные).\n- Поэтому акцент сместился с абстрактного риска на конкретный вред — нарушение ожиданий получить удовлетворение. Права кредитора — превентивные меры, сохраняющие гарантии исполнения (близко к правам залогодержателя при угрозе предмету залога, п. 3 ст. 343 ГК).\n- Дуалистическая теория обязательства: в обязательство входит не только обязанность исполнить, но и обязанность воздерживаться от всего, что сделает исполнение невозможным или затруднит его. Отсюда право кредитора возразить против реорганизации и понятно, почему защищаются лишь те, чьё обязательство возникло до реорганизации (до публикации). Позже возникшее требование: должник уже не обязан воздерживаться.\n- Почему нельзя оставить вопрос договору, как в странах общего права: неравенство переговорных возможностей оставит мелких кредиторов без защиты; договорное право досрочного исполнения не приостановит реорганизацию; без информации о реорганизации договорные условия бессмысленны.\n- Сравнение, наличие ущерба как условие. Франция: суд оценивает, есть ли угроза исполнению, и лишь в редких случаях находит требования обоснованными. Испания: ст. 44 Закона о реорганизации чётких указаний не содержит, есть оговорка о кредиторах, чьи требования уже достаточно гарантированы. Швейцария (ст. 25 для слияний, ст. 46 для разделений): общество обязано предоставить обеспечение по требованию кредитора, если не докажет, что реорганизация не угрожает исполнению; бремя доказывания на обществе (у него есть информация); доказательства — отчётность, заключение эксперта, рейтинги, мнение банка.\n- Россия: модель критиковали как излишне жёсткую (де-факто ведёт к банкротству общества), предлагали ограничить защиту случаями ущерба; Концепция развития корпоративного законодательства до 2008 г.; в ГК такого условия прямо нет. Автор считает, что п. 2 ст. 60 ГК подразумевает необходимость вреда (судебная процедура существует там, где есть нарушенное право). Пример — Постановление 17 ААС от 22.12.2017 по делу № А50-17312/2017: сам факт реорганизации не основание для досрочного исполнения, если нет доказательств использования реорганизации для ухода от обязательств.\n- Но автор поддерживает презумпцию вреда, как минимум при разделении и выделении, и бремя опровержения на реорганизуемом обществе. По аналогии с практикой о солидарной ответственности правопреемников: бремя доказывания справедливого распределения активов и обязательств лежит на реорганизованном лице и правопреемниках (много постановлений арбитражных судов округов, например Поволжского округа от 30.05.2018, дело № А55-3451/2017).\n- Что такое «вред»: либо финансовое состояние реорганизованного общества не позволяет удовлетворить требование, либо умаление коммерческих гарантий (шире, включает перспективы). Автор выбирает вторую концепцию, но с ближайшими перспективами общества. Оценка вреда близка к бизнес-решению, а предпринимательская деятельность рискованна (абз. 3 п. 1 ст. 2 ГК); КС РФ в Постановлении от 24.02.2004 № 3-П отметил объективные пределы возможностей судов выявлять деловые просчёты.\n\n**3. Защита предварительная (a priori) или последующая (a posteriori)**\n\n- Предварительная модель сильнее защищает кредиторов, часто с парализующим эффектом (реорганизация невозможна до удовлетворения кредиторов). Последующая не приостанавливает реорганизацию.\n- Россия всегда строила защиту по предварительной модели (п. 2 ст. 60 ГК с 1994 г.). Её достоинства: защиту можно получить до наступления вреда; обществу выгодно заранее знать число и размер требований, выявить «неучтённых» кредиторов и оценить доверие к плану реорганизации; нет риска, что решение суда после реорганизации приведёт к несостоятельности.\n- Недостаток: у каждого кредитора де-факто право вето и возможность шантажа. Страны борются с этим по-разному. Франция: требования не приостанавливают реорганизацию, но неисполнение решения суда делает её непротивопоставимой кредитору (он действует как если бы реорганизации не было). Испания: с 2012 г. реорганизация может продолжаться вопреки возражениям (правда, возникла коллизия, как и в России). Швейцария: предварительная защита при разделении и выделении, общество может просить суд разрешить продолжить реорганизацию.\n- Россия: спор о парализующем эффекте. С 2008 г. (ОАО) и 2014 г. (все юридические лица) закон прямо говорит, что предъявление требований не приостанавливает реорганизацию (абз. 6 п. 2 ст. 60), но абз. 4 п. 2 требует исполнить требования до завершения реорганизации. Есть п. 3 ст. 60 о солидарной ответственности. Практика: требования кредиторов не мешают завершению реорганизации.\n- Предложения других авторов (право требовать приостановления, запрет завершения до удовлетворения) автор отвергает: приостановление можно получить обеспечительной мерой; солидарная ответственность правопреемников, органов и контролирующих лиц решает проблему злоупотреблений; сверхзащита толкает бизнес в обход реорганизации, к «функциональным субститутам». Правка: в абз. 4 п. 2 ст. 60 указать, что требования исполняются в порядке досрочного исполнения (ст. 315 ГК), чтобы снять противоречие с абз. 6.\n\n#### Как применять к задаче 6 («Чтец», «Мила», «Дина»)\n\n1. Реорганизация разделением: риск вреда кредитору максимален (презумпция вреда, бремя доказывания справедливого распределения на правопреемниках).\n2. Всё ликвидное имущество у «Милы», все долги у «Дины» — типичное несправедливое распределение: основание солидарной ответственности правопреемников (п. 5 ст. 60 ГК).\n3. Возражение «кредитор не возражал против реорганизации и процедура соблюдена» не отменяет п. 5: право возразить по п. 2 — это самостоятельный способ защиты, а солидарная ответственность — защита на случай, если требования не исполнены ни до, ни после реорганизации.\n4. Нарушение публикации даёт кредитору дополнительные возможности (срок по п. 2 не течёт, п. 3, обеспечительные меры), но основания для иска по п. 5 уже есть и без этого.\n"}]},{"id":"const","name":"Конституционное право","hue":262,"notes":[{"id":"const-1","title":"Виды законов и этапы развития Конституции","short":"Виды законов","date":"11 сен","md":"Виды законов по юридической силе:\n- Конституционные\n- Обычные\n- Органические\n- Чрезвычайные\n\nЭтапы развития Конституции России\n- Конституция РСФСР 1918 (Декреты О мире О земле О суде)\n- **Раздел I.** Декларация прав трудящегося и эксплуатируемого народа\n- **Раздел II.** Общие положения Конституции Российской Социалистической Федеративной Советской Республики\n- **Раздел III.** Конструкция Советской власти\n- **Раздел IV.** Избирательное право\n- **Раздел V.** Бюджетное право\n- **Раздел VI.** О гербе и флаге\n\n- Конституция РСФСР 1925\n- Конституция РСФСР 1937\n- Конституция РСФСР 1978\n- Конституция 1993\n"},{"id":"const-2","title":"Тема 1. Семинар 1","short":"Семинар 1","date":"15 сен","md":"# Семинарское занятие 1\n\n### Вопрос 1. Конституционное право как отрасль права. Предмет и метод конституционного права. Структура отрасли конституционного права. Конституционное и государственное право.\n\n**Ответ:**\n\n**1. Понятие конституционного права**  \nВедущая отрасль российского права — система правовых норм, регулирующих основы конституционного строя, права и свободы человека и гражданина, федеративное устройство государства, систему организации и функционирования органов государственной власти и местного самоуправления.\n\n**2. Предмет конституционного права** — общественные отношения:\n\n- складывающиеся в связи с закреплением основ конституционного строя (форма правления, форма государственного устройства, политический режим, суверенитет);\n- по поводу правового положения личности (права, свободы, обязанности человека и гражданина, гражданство);\n- в сфере фе
