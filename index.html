<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F4F1E8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Конспекты"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style><title>Конспекты семинаров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&family=Inter:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
<style>
:root{
  --bg:#F4F1E8; --rail:#ECE8DB; --surface:#FBF9F3; --fg:#25221C; --muted:#665F52; --faint:#857E6E;
  --line:#D9D3C2; --line2:#E5E0D2; --accent:#A93D28; --mark:#F5DC94; --cl:0.58; --ch:0.11;
  --serif:'Literata','Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:16px; --hdr:0px; --h:70;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
--bg:#171611; --rail:#1D1C16; --surface:#22211A; --fg:#E8E4D8; --muted:#A39D8E; --faint:#716B5F;
--line:#33312A; --line2:#292820; --accent:#E8886B; --mark:#5B4A17; --cl:0.76; --shadow:0 1px 0 rgba(0,0,0,.25);
color-scheme:dark;
} }
:root[data-theme="dark"]{
--bg:#171611; --rail:#1D1C16; --surface:#22211A; --fg:#E8E4D8; --muted:#A39D8E; --faint:#716B5F;
--line:#33312A; --line2:#292820; --accent:#E8886B; --mark:#5B4A17; --cl:0.76; --shadow:0 1px 0 rgba(0,0,0,.25);
color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--mark)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent);background:oklch(var(--cl) var(--ch) var(--h))}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);transition:transform .28s ease}
.rail.hide{transform:translateY(-100%)}
.brandrow{display:flex;align-items:center;gap:4px;padding:8px 8px 4px var(--gut);min-height:52px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;margin-right:auto;font:600 21px/1 var(--serif);letter-spacing:-.01em}
.brand .sec{color:var(--accent);font-weight:500}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.ibtn:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.searchbar{display:none;align-items:center;gap:8px;margin:2px var(--gut) 8px;padding:0 4px 0 12px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.searchbar:focus-within{border-color:var(--faint)}
.searchbar>svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
.searchbar input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--fg);font:400 16px var(--sans)}
.searchbar input::placeholder{color:var(--faint)}
.searchbar input::-webkit-search-cancel-button{display:none}
.searchbar .ibtn{width:34px;height:34px;visibility:hidden}
.searchbar.has .ibtn{visibility:visible}
.rail.s-open .searchbar{display:flex}
.subjects{display:flex;gap:8px;overflow-x:auto;padding:4px var(--gut) 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.subjects::-webkit-scrollbar{display:none}
.subj{display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap;padding:7px 13px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);font:500 14px/1.2 var(--sans)}
.subj .ct{display:none}
.subj.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.subj.on .dot{background:var(--bg)}
.railfoot{display:none}

main{min-width:0;padding-inline:var(--gut);padding-bottom:96px}

/* ---------- вкладки конспектов ---------- */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:20;display:flex;gap:6px;overflow-x:auto;
  margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);background:var(--bg);border-bottom:1px solid var(--line);
  scrollbar-width:none;transition:top .28s ease}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;display:flex;flex-direction:column;gap:2px;padding:10px 12px 11px;text-decoration:none;color:var(--muted);white-space:nowrap}
.tab .td{font:500 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums}
.tab .tl{font:500 14.5px/1.3 var(--sans)}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg)}
.tab.on .td{color:var(--muted)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);background:oklch(var(--cl) var(--ch) var(--h))}

/* ---------- прогресс ---------- */

/* ---------- главная ---------- */
.rise{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.home{max-width:1000px;margin-inline:auto;padding-top:44px}
.home h1{margin:0;font:600 clamp(40px,8vw,64px)/1.02 var(--serif);letter-spacing:-.025em}
.home h1 .sec{color:var(--accent);font-weight:400;margin-right:.12em}
.home .lead{margin:16px 0 0;max-width:44ch;font:400 18px/1.55 var(--serif);color:var(--muted)}
.home .stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin:20px 0 0;font:500 12px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums}
.resume{display:inline-flex;flex-direction:column;gap:3px;margin-top:28px;padding:13px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;max-width:100%}
.resume:hover{border-color:var(--faint)}
.resume .k{font:500 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.resume .v{font:600 17px/1.3 var(--serif)}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:44px 56px;margin-top:52px}
.isub h2{display:flex;align-items:center;gap:11px;margin:0 0 6px;font:600 23px/1.2 var(--serif);letter-spacing:-.01em}
.isub h2 a{text-decoration:none}
.isub h2 a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.isub h2 .cnt{margin-left:auto;font:500 13px var(--sans);color:var(--faint);font-variant-numeric:tabular-nums}
.isub ul{list-style:none;margin:0;padding:0}
.isub li a{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line2);text-decoration:none}
.isub li:last-child a{border-bottom:1px solid var(--line2)}
.isub li a:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.isub .d{font:500 12.5px/1.3 var(--sans);color:var(--faint);font-variant-numeric:tabular-nums}
.isub .t{font:400 16.5px/1.4 var(--serif)}

/* ---------- ближайшие пары, закладки ---------- */
.next,.bms{margin-top:34px;max-width:640px}
.next h2,.bms h2{margin:0 0 6px;font:600 12px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.nx-list{border-bottom:1px solid var(--line2)}
.nx-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line2);text-decoration:none}
a.nx-row:hover .nt b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.nx-row .nd{font:500 13px/1.35 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.nx-row .nd em{display:block;font-style:normal;font-weight:700;color:var(--fg)}
.nx-row .nt b{display:block;font:600 16.5px/1.3 var(--serif)}
.nx-row .nt i{display:block;margin-top:2px;font:400 13.5px/1.4 var(--sans);font-style:normal;color:var(--muted)}
.nx-row.now .nd em::after{content:" · идёт";color:var(--accent)}
.next .src{margin:8px 0 0;font:400 12px/1.4 var(--sans);color:var(--faint)}
.next .none{margin:0;padding:12px 0;font:400 15px/1.5 var(--sans);color:var(--muted);border-top:1px solid var(--line2)}
.bm-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line2)}
.bms .bm-row:last-child{border-bottom:1px solid var(--line2)}
.bm-row a{flex:1;min-width:0;padding:10px 0;text-decoration:none}
.bm-row a:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.bm-row b{display:block;font:600 15.5px/1.3 var(--serif);overflow-wrap:anywhere}
.bm-row i{display:block;margin-top:2px;font:400 13px/1.4 var(--sans);font-style:normal;color:var(--muted)}
.bm-row button{width:34px;height:34px;color:var(--faint);font-size:21px;line-height:1}
.bm-row button:hover{color:var(--accent)}
.bm{margin-left:.45em;padding:0 .2em;font:inherit;font-size:.72em;line-height:1;color:var(--faint);opacity:.55;vertical-align:.08em;cursor:pointer;background:none;border:0}
.bm:hover,.bm.on{opacity:1;color:var(--accent)}
.prose{zoom:var(--fz,1)}
html:root[data-skin=c] .next,html:root[data-skin=c] .bms,html:root[data-skin=f] .next,html:root[data-skin=f] .bms{margin-inline:auto;text-align:left}

/* ---------- страница конспекта ---------- */
.note-wrap{display:grid;grid-template-columns:minmax(0,1fr);justify-content:center;gap:0 64px;padding-top:30px}
.note{min-width:0;max-width:700px;width:100%;margin-inline:auto}
.eyebrow{display:flex;align-items:center;gap:9px;margin:0;font:500 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow .sep{color:var(--faint)}
.note h1{margin:14px 0 22px;font:600 clamp(28px,5.2vw,42px)/1.14 var(--serif);letter-spacing:-.015em;text-wrap:balance}
.back{display:inline-flex;margin-bottom:18px;font:500 13.5px var(--sans);color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

.toc-inline{margin:0 0 26px;border-block:1px solid var(--line);font:400 14.5px/1.4 var(--sans)}
.toc-inline summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer;font:500 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toc-inline summary::-webkit-details-marker{display:none}
.toc-inline summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.toc-inline[open] summary::after{transform:rotate(-135deg)}
.toc-inline .n{color:var(--faint);font-variant-numeric:tabular-nums}
.toc-inline .list{display:flex;flex-direction:column;padding:0 0 12px;max-height:56vh;overflow-y:auto}
.toc a{display:block;padding:6px 0;text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--fg)}
.toc a.d1{padding-left:14px}
.toc a.d2{padding-left:28px}
.toc-side{display:none}

.prose{font:400 17px/1.7 var(--sans);hyphens:none;-webkit-hyphens:none;overflow-wrap:break-word}
.prose>:first-child{margin-top:0}
.prose p{margin:0 0 1.05em}
.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{scroll-margin-top:84px;text-wrap:balance;hyphens:manual}
.prose h2{margin:2.3em 0 .75em;padding-top:1.15em;border-top:1px solid var(--line);font:600 25px/1.22 var(--serif);letter-spacing:-.01em}
.prose h2:first-child{margin-top:0;padding-top:0;border-top:0}
.prose h3{margin:2.8em 0 .9em;padding:.65em 1em .7em;font:600 20px/1.3 var(--serif);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-left-color:oklch(var(--cl) var(--ch) var(--h));border-radius:10px}
.prose h4{margin:1.7em 0 .45em;font:600 18.5px/1.38 var(--serif)}
.prose h5,.prose h6{margin:1.7em 0 .5em;font:600 12px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose li{margin:.5em 0;padding-left:.2em}
.prose li>ul,.prose li>ol{margin:.5em 0 .2em}
.prose li>p{margin:0 0 .5em}
.prose li::marker{color:var(--accent)}
.prose p.lbl{margin:1.4em 0 .6em;font:600 12px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.prose p.sub{margin:1.7em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line2)}
.prose p.verdict{margin:1.5em 0;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px}
.prose p.gist{margin:0 0 1.3em;padding:12px 16px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px}
.prose strong{font-weight:650}
.prose a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.prose blockquote{margin:1.25em 0;padding:.05em 0 .05em 1.1em;border-left:3px solid var(--accent);border-left-color:oklch(var(--cl) var(--ch) var(--h));font-style:italic}
.prose blockquote p{margin:0 0 .6em}
.prose blockquote>:last-child{margin-bottom:0}
.prose hr{border:0;border-top:1px solid var(--line);margin:2.3em 0}
.prose hr+h2{margin-top:0;padding-top:0;border-top:0}
.prose code{font:.86em var(--mono);padding:.12em .36em;border-radius:5px;background:var(--rail)}
.prose pre{overflow-x:auto;margin:1.2em 0;padding:14px 16px;border-radius:10px;background:var(--rail);font:14px/1.55 var(--mono)}
.prose pre code{padding:0;background:none;font:inherit}
.prose img{max-width:100%;height:auto}
.tablewrap{overflow-x:auto;margin:1.3em 0;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.prose table{width:100%;border-collapse:collapse;font:400 15px/1.45 var(--sans);font-variant-numeric:tabular-nums;hyphens:manual}
.prose th,.prose td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2);min-width:5.5em}
.prose th{font:600 12px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--rail);border-bottom:1px solid var(--line)}
.prose tr:last-child td{border-bottom:0}
.prose .nw{white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px;padding-top:26px;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:5px;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none}
.pager a:hover{border-color:var(--faint);background:var(--surface)}
.pager .nx{grid-column:2;text-align:right}
.pager .k{font:500 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.pager .v{font:600 16px/1.3 var(--serif);overflow-wrap:anywhere}

/* ---------- результаты поиска ---------- */
.results{max-width:760px;margin-inline:auto;padding-top:34px}
.results h1{margin:0 0 6px;font:600 clamp(24px,4.6vw,32px)/1.2 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
.results .sub{margin:0 0 22px;font:400 14.5px var(--sans);color:var(--muted)}
.hit{display:block;padding:18px 0;border-top:1px solid var(--line);text-decoration:none}
.hit:last-child{border-bottom:1px solid var(--line)}
.hit .meta{display:flex;align-items:center;gap:9px;font:500 11.5px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hit h3{margin:8px 0 6px;font:600 20px/1.3 var(--serif)}
.hit:hover h3{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hit p{margin:0;font:400 15px/1.55 var(--sans);color:var(--muted);overflow-wrap:anywhere}
.hit .more{display:inline-block;margin-top:6px;font:500 12px var(--sans);color:var(--faint)}
.empty{padding:36px 0;font:400 17px/1.5 var(--serif);color:var(--muted)}

/* ---------- широкие экраны ---------- */
@media (min-width:900px){
  :root{--gut:44px}
  .app{grid-template-columns:292px minmax(0,1fr)}
  .rail{top:0;height:100vh;display:flex;flex-direction:column;padding:26px 16px 18px;border-bottom:0;border-right:1px solid var(--line);background:var(--rail);overflow-y:auto;transform:none!important}
  .brandrow{padding:0 0 0 10px;min-height:0;margin-bottom:22px}
  .brand{font-size:25px}
  #btn-search{display:none}
  .searchbar{display:flex;margin:0 0 20px;background:var(--surface)}
  .subjects{flex-direction:column;gap:2px;overflow:visible;padding:0}
  .subj{padding:9px 12px;border:0;border-radius:10px;font-size:15.5px;white-space:normal}
  .subj:hover{background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--fg)}
  .subj.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
  .subj.on .dot{background:oklch(var(--cl) var(--ch) var(--h))}
  .subj .ct{display:block;margin-left:auto;font:500 12.5px var(--sans);color:var(--faint);font-variant-numeric:tabular-nums}
  .railfoot{display:block;margin-top:auto;padding:24px 10px 0;font:400 12.5px var(--sans);color:var(--faint)}
  .tabs{top:0}
  .tab{padding:14px 12px 13px}
  .note-wrap{padding-top:44px}
  .prose{font-size:17.5px}
  #btn-style{position:fixed!important;top:12px!important;right:18px!important;margin:0!important;order:0!important;z-index:70;width:42px;height:42px;
    background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:999px;color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.08)}
  #btn-style:hover{background:var(--fg);color:var(--bg)}
  .tabs{padding-right:calc(var(--gut) + 56px)}
}
@media (min-width:1240px){
  .note-wrap{grid-template-columns:minmax(0,700px) 224px}
  .note-wrap.no-toc{grid-template-columns:minmax(0,700px)}
  .toc-inline{display:none}
  .toc-side{display:block;position:sticky;top:96px;align-self:start;max-height:calc(100vh - 120px);overflow-y:auto;padding-top:6px;font:400 13.5px/1.4 var(--sans);scrollbar-width:thin}
  .toc-side .h{margin:0 0 8px;font:500 11.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .toc-side a{padding:5px 0 5px 12px;border-left:1px solid var(--line)}
  .toc-side a.d1{padding-left:24px}
  .toc-side a.d2{padding-left:36px}
  .toc-side a.on{color:var(--fg);border-left-color:var(--accent)}
}
@media (max-width:560px){
  .pager{grid-template-columns:1fr}
  .pager .nx{grid-column:1}
  .prose{font-size:16.5px}
  .prose h2{font-size:22px}
  .prose h3{font-size:19.5px}
  .home{padding-top:30px}
  .idx{gap:36px}
}

<script type="application/json" id="data">{"subjects":[{"id":"civil","name":"Гражданское право","hue":70,"notes":[{"id":"civil-1","title":"Учебники","short":"Учебники","date":"1 сен","md":"Учебники:\nМГУ Суханов\nСергеев Александр\nРусское гражданское право Шершеневич\nГангал и Крашенинникова\nЯценко и Громов задачи\n\nГражданское право-право личной свободы. Самая массовая отрасль.\n"},{"id":"civil-2","title":"Тема 1. Понятие и система частного права","short":"Частное право","date":"11 сен","md":"**Ключевая идея Черепахина**, на которую нанизано всё остальное — устойчивость формы права при изменчивости его содержания:\n\n> «Устойчивость формальной стороны в праве при изменяемости его содержания заставляет проводить основные разделения всего правового материала с точки зрения формы... а не с точки зрения их содержания» (Черепахин)\n\nИтоговая формула, которой заканчивается сама статья — её стоит выучить дословно, это готовый ответ на экзамене:\n\n> «Частноправовое отношение построено на началах координации субъектов, частное право представляет собой систему децентрализованного регулирования жизненных отношений. Публично-правовое отношение построено на началах субординации субъектов, публичное право представляет собой систему централизованного регулирования» (Черепахин)\n\n_(Оговорка: работа Агаркова «Ценность частного права» в загруженных файлах отсутствует — цитирую её только через то, как её пересказывает и оспаривает Черепахин.)_\n\n---\n\n#### Вопрос 1. Этапы развития частного права. Значение глоссаторов, постглоссаторов, римской юриспруденции\n\n**Ответ:**\n\n- **Архаический Рим** (до III в. до н.э.) — Законы XII таблиц, сакрально-формальные сделки (mancipatio, stipulatio), легисакционный процесс.\n- **Классический период** (I в. до н.э. — III в. н.э.) — расцвет юриспруденции (Лабеон, Гай, Папиниан, Ульпиан, Павел), преторское правотворчество, ius gentium — право оборота с чужестранцами.\n- **Кодификация Юстиниана** (529–534 гг.) — Дигесты, Институции, Кодекс: материал на тысячу лет вперёд.\n- **Глоссаторы** XI–XIII вв. (Ирнерий, Аккурсий, Болонская школа) — интерлинеарные и маргинальные заметки к тексту, восстановление и сакрализация Corpus iuris civilis как ratio scripta, рождение университетской юридической науки.\n- **Постглоссаторы-комментаторы** XIV в. (Бартол де Сассоферрато, Бальд) — переход от толкования к **приспособлению** права к живому обороту городов; их заслуга — теория статутов (прямой исток МЧП) и учение о юридическом лице.\n- Дальше по цепочке: гуманисты (mos gallicus), школа естественного права, кодификации XIX века (ФГК, ГГУ), пандектистика Савиньи, социализация права в XX веке.\n\n---\n\n#### Вопрос 2. Предпосылки частного права в Риме, его место в обществе\n\n**Ответ:**\n\n- Развитая товарно-денежная экономика и средиземноморская торговля — нужно было право для оборота с негражданами.\n- Институт частной собственности (dominium) и автономная familia, куда государство не вмешивалось.\n- Республика мыслила res publica как общее дело, отдельное от дел частных лиц.\n- Гибкая преторская техника — новые иски создавались «снизу», от спора к норме, без изменения писаного права.\n- Независимое сословие юристов, дававших респонсы (ius publice respondendi).\n- **Место в обществе:** частное право занимало господствующее положение — Дигесты почти целиком посвящены ему, публичное право систематической разработки не получило.\n- Важная оговорка: это было право **граждан** — формальное равенство существовало лишь внутри круга полноправных лиц.\n\n---\n\n#### Вопрос 3. Основные теории разграничения частного и публичного права\n\n**Ответ:**\n\n_Материальные теории (вопрос «что регулируется»):_\n\n- **Теория интереса** — Ульпиан, Савиньи, Шершеневич. Классическая формула:\n    \n    > «Omnе jus publicum est quod ad statum rei romanae spectat, privatum quod ad singulorum utilitatem» (Ульпиан) — «публичное право то, что имеет в виду пользу государства, частное — пользу отдельных лиц».\n    \n- **Психологический вариант Петражицкого** — деление на лично-свободное и социально-служебное право в зависимости от направления сознания управомоченного.\n- **Предметная теория** — имущественное против неимущественного (Шлоссман, Кавелин, Мейер).\n\n_Формальные теории (вопрос «как регулируется»):_\n\n- **Теория инициативы защиты** — Иеринг, Тон, Муромцев.\n- **Теория положения субъекта в правоотношении** — Кокошкин: частное право — отношения равных, публичное — отношения с носителем принудительной власти.\n- **Теория централизации-децентрализации** — Штаммлер, Покровский.\n- Вывод Черепахина: для догматики годятся только формальные критерии, причём два последних — «одно и то же решение вопроса... лишь в двух различных плоскостях» (Черепахин).\n\n---\n\n#### Вопрос 4. Материальные теории. Можно ли любой интерес отнести к частному или публичному?\n\n**Ответ:**\n\n- **Нет.** Возражение Покровского (пересказ Черепахина): устройство семьи, собственности, наследования небезразлично государству — но это институты гражданского права; контракт о поставке провианта для армии служит публичному интересу — но остаётся частноправовым.\n- Обратный пример: суд и полиция — публично-правовые институты, но служат интересам частных лиц.\n- Отдельно — критика Петражицкого: квалификация зависит от настроения субъекта, что порождает внутреннее противоречие (предприниматель, заботящийся о рабочих, оказывается носителем «публичного» права).\n- Вывод: интерес нельзя определённо отнести ни туда, ни сюда — но материальный критерий сохраняет значение **для политики права**, то есть для вопроса о целесообразности, а не для догматики.\n\n---\n\n#### Вопрос 5. Интерес в защите прав потребителей — частный или публичный?\n\n**Ответ:**\n\n- **Частноправовой слой:** конкретное требование потребителя к продавцу (замена, возврат денег, вред здоровью) — отношение координационное, ни одна сторона не властна над другой.\n- **Публично-правовой слой:** надзор Роспотребнадзора, административная ответственность, иски в защиту неопределённого круга лиц.\n- Важно: императивность норм (ничтожность условий, ущемляющих права потребителя) сама по себе **не делает** отношение публичным — Черепахин прямо пишет, что диспозитивность не признак частного права:\n    \n    > «Не все частноправовые нормы диспозитивны... и в частном праве имеют место властные приказы» (Черепахин)\n    \n- Гибридные конструкции для обсуждения: потребительский штраф (50% от суммы иска), групповые иски.\n\n---\n\n#### Вопрос 6. Формальные теории — подробнее\n\n**Ответ:**\n\n_Инициатива защиты (Тон, Муромцев):_\n\n- Критерий — кому предоставлена защита при нарушении: потерпевшему (частное право) или власти ex officio (публичное право).\n- Возражения Черепахина: 1) берёт «болезненное состояние права», а не отношение как таковое; 2) уголовное преследование бывает и по частному почину; 3) часто невозможно установить, кому принадлежит инициатива.\n\n_Положение субъекта в правоотношении (Кокошкин):_\n\n- Существенно не то, что субъектом является государство, а **характер его вступления** в отношение — отсюда различение actes de puissance (властно) и actes de gestion (как равный участник оборота, например казна).\n\n_Централизация-децентрализация (Покровский):_\n\n- Публичное право — приказы из единого центра (воинская повинность, наказание); частное право — государство даёт лишь рамки, остальное отдаёт множеству «маленьких центров».\n- Соотношение с предыдущей теорией — одно решение в двух плоскостях: субъективного права и объективного права. Централизация = неравенство субъектов, децентрализация = их равенство.\n\n---\n\n#### Вопрос 7. Аргументы за бессмысленность деления на частное и публичное\n\n**Ответ:**\n\n- Историческая изменчивость границ между частным и публичным.\n- Взаимопроникновение элементов (императивность в частном праве, договорные формы в публичном).\n- Отсутствие общепризнанного критерия — Гримм считал всякую попытку теоретического обоснования «безнадёжной».\n- Идеологический довод Гойхбарга: деление изжило себя даже в буржуазных странах.\n- Критика Дюги — нет субъективных прав, только социальные функции.\n- Критика Кельзена — всякое право государственно, значит негосударственной сферы права не существует.\n\n**Ответ Черепахина на всё это:**\n\n- Сокращение сферы частного права — факт, но «это вовсе не доказывает, что частного права уже нет» (Черепахин).\n- Гойхбарг непоследователен: призывает уничтожить то, чего, по его же утверждению, уже не существует.\n- Вопрос о принадлежности отношения решается не желанием юристов, а тем, что правопорядок уже отдал его на усмотрение частных лиц.\n- Пашуканис (которого Черепахин поддерживает): противоположность частного и публичного — не выдумка юристов, а сущностная черта самой правовой формы, и логическая, и историческая.\n\n---\n\n#### Вопрос 8. Сферы частного и публичного права, «серые» зоны\n\n**Ответ:**\n\n- Традиционно частное: гражданское, семейное, торговое, МЧП.\n- Традиционно публичное: конституционное, административное, уголовное, финансовое, процессуальное.\n- «Серые» зоны: трудовое право, семейное право, земельное и градостроительное право, корпоративное право, антимонопольное право, право несостоятельности, госзакупки и ГЧП.\n- Черепахина это не смущает — он прямо признаёт «отсутствие резкой демаркационной линии между этими двумя правовыми областями в каждый данный момент», и именно это требует устойчивого **формального** критерия, а не отказа от деления.\n\n---\n\n#### Вопрос 9. Антимонопольное регулирование — частное право? Дела частного обвинения служат публичным целям?\n\n**Ответ:**\n\n- Антимонопольное регулирование **двухслойное**:\n    - публичный слой — ФАС, предписания, оборотные штрафы (защита конкуренции как состояния рынка);\n    - частный слой — иски о взыскании убытков от нарушения (ст. 37 ЗоЗК), оспаривание навязанных условий.\n- В целом относить его к частному праву оснований нет, но частноправовые притязания внутри него есть.\n- **Дела частного обвинения** служат публичным целям: наказание назначается судом от имени государства, а не потерпевшего; потерпевший не получает имущественного предоставления от осуждения.\n- Частная инициатива здесь — процессуальный диспозитивный механизм, а не изменение природы отношения (прямая иллюстрация возражения Черепахина против теории инициативы защиты: «возбуждение уголовного преследования возможно и по частному почину»).\n\n---\n\n#### Вопрос 10. Формальное равенство. Возможна ли субординация в частном праве?\n\n**Ответ:**\n\n- Равенство здесь **юридическое**, а не фактическое:\n    \n    > «О равенстве или неравенстве здесь говорится лишь с точки зрения правовой... которое может и не соответствовать фактическому, являющемуся непосредственным результатом экономических отношений» (Черепахин)\n    \n- Экономическое неравенство сторон (монополист и потребитель, работодатель и работник) равенства не колеблет.\n- Субординация в частном праве возможна, но всегда **производна** — от собственного волеизъявления обязанного лица или от закона, установившего власть в чужом интересе.\n- Примеры: хозяйская власть работодателя, родительская власть, власть большинства в корпорации.\n- Тест Черепахина: важно не то, что праву соответствует обязанность, а «на чём эта обязанность основана: на властном ли приказе со стороны или же на собственном волеизъявлении обязанного лица».\n\n---\n\n#### Вопрос 11. Аристотель: распределительная и уравнивающая справедливость\n\n**Ответ:**\n\n- **Распределительная справедливость** — распределение благ по достоинству, геометрическая пропорция, отношение «распределитель — множество получателей».\n- **Уравнивающая (корректирующая) справедливость** — восстановление равенства между двумя лицами, арифметическая пропорция, закон «обходится со сторонами как с равными».\n- Частное право по форме тяготеет к корректирующей модели: договор — эквивалентный обмен, деликт — восстановление положения потерпевшего.\n- Вайнриб (The Idea of Private Law) доводит это до формализма: частное право имманентно биполярно («истец против ответчика»), соображения распределения в эту форму не вмещаются.\n- Но полностью соглашаться нельзя: внутри частного права много институтов с распределительной логикой — обязательная доля в наследстве, алименты, снижение неустойки, защита слабой стороны.\n- Вывод для семинара: частное право по **форме** корректирующее, но законодатель часто использует эту форму для распределительных целей — это и называется социализацией частного права.\n\n---\n\n#### Вопрос 12. Ценность отделения частного права от публичного. Приватизация и опубличивание\n\n**Ответ:**\n\n- Идея Агаркова (по пересказу Черепахина и по логике самого спора): частное право резервирует за лицом сферу самоопределения — область, где человек действует своей волей и в своём интересе, а не как исполнитель чужой функции.\n- _(Замечание: Черепахин Агаркова частично критикует — за принятие теории лично-свободного и социально-служебного права он «оказывается причастным к... подновлению Ульпиана».)_\n- Прочая ценность деления: ограничение государства (казна подчиняется общим нормам оборота), правовая определённость при изменчивости содержания.\n- **Приватизация публичного права** — передача властных функций частным субъектам (частные исполнители, СРО, аутсорсинг публичных услуг). Риск — обход гарантий и подотчётности.\n- **Опубличивание частного права** — рост императивности, административный контроль над сделками, принудительное заключение договоров. Риск — эрозия автономии воли.\n- Michaels и Jansen: связь частного права с государством исторически случайна (продукт кодификаций XIX века); сегодня европеизация, глобализация и приватизация её ослабляют, но частное право вне государства теряет прежнюю легитимацию.\n\n---\n\n#### Вопрос 13. Теория частного права у Кельзена\n\n**Ответ:**\n\n- Чистое учение о праве: государство отождествляется с правопорядком → негосударственной сферы права не существует → дуализм теряет принципиальный характер.\n- Что остаётся: различие в способе создания норм — частное право **автономно** (договор — правотворческий акт самих адресатов), публичное **гетерономно** (норма создаётся органом без их участия).\n- Это различие степени, а не сущности.\n- Идеологическая критика Кельзена: изображение частного права как «свободной от государства» зоны скрывает, что его принудительность обеспечивает тот же государственный аппарат.\n- Сопоставление с Черепахиным: оба формалисты, но выводы противоположны — Черепахин на формальном критерии деление **сохраняет** и делает основным, Кельзен на том же основании **понижает** его до технического различия.\n\n---\n\n#### Вопрос 14. Аргументы Леона Дюги против концепции частного права\n\n**Ответ:**\n\n- Отказ от метафизических понятий воли и субъективного права — реальна только объективная норма, укоренённая в **социальной солидарности**.\n- Собственность — не право, а **социальная функция**: собственник обязан использовать вещь социально полезно.\n- Критика автономии воли — реальные договоры (присоединения, коллективные соглашения) не объясняются встречей двух равных воль.\n- Переход от ответственности за вину к ответственности за риск (профессиональный риск, объективная ответственность).\n- Итог: и частное, и публичное право — системы объективных норм; государство перестаёт быть сувереном и становится совокупностью органов публичной службы → дуализм снимается.\n- Критика самого Дюги: без субъективного права непонятно, кто и на каком основании предъявляет иск; по сути он описывает **социализацию** частного права, а не его исчезновение — тот же ответ, что Черепахин даёт Гойхбаргу.\n\n---\n\n#### Вопрос 15. Трудовое право как частное. Хозяйская власть\n\n**Ответ:**\n\n- Признаки частноправовой природы: возникновение из свободного договора (ст. 15, 56 ТК), эквивалентный обмен труда на оплату, защита по иску работника.\n- **Хозяйская власть** (Л.С. Таль, «Трудовой договор», 1913) — три элемента:\n    - диспозитивная (директивная) — указания о работе;\n    - нормативная — правила внутреннего распорядка;\n    - дисциплинарная — взыскания.\n- Основание власти — природа предприятия как организации, требующей единой воли.\n- Противоречия с формальным равенством нет: власть коренится в **договоре**, работник сам подчинил себя чужой воле, она ограничена предметом трудовой функции.\n- Ключевое отличие от публичной власти: не даёт права **принуждать физически** — санкция это взыскание или увольнение, а не исполнение обязанности силой.\n\n---\n\n#### Вопрос 16. Является ли семейное право частным? Зачем публичные субъекты?\n\n**Ответ:**\n\n- За частную природу: равенство супругов (ст. 1 СК), возникновение отношений из акта воли (брак, брачный договор, соглашение об алиментах), субсидиарное применение гражданского законодательства (ст. 4 СК).\n- За самостоятельность: высокая императивность, закрытый перечень допускаемых соглашений, обязательная регистрация актов гражданского состояния.\n- **Роль органов опеки и прокурора** — не замена частного интереса публичным, а **восполнение отсутствующей автономии**: ребёнок не может сам сформировать и заявить свой интерес, а законный представитель может действовать против него.\n- Формальный критерий не колеблется: спор остаётся спором координированных субъектов, участие органа опеки — участие с заключением, а не в качестве стороны.\n\n---\n\n#### Вопрос 17. МЧП — частное право? Цель и специфика норм\n\n**Ответ:**\n\n- По предмету — да, обслуживает частноправовые отношения (договорные, деликтные, семейные) с иностранным элементом.\n- По технике своеобразно: коллизионная норма не регулирует поведение сторон, а адресована **правоприменителю** — указывает, какое право применить.\n- Цель — правовая определённость и гармония решений (Савиньи: поиск «оседлости» правоотношения), защита разумных ожиданий сторон.\n- Специфика норм:\n    - двучленная структура коллизионной нормы вместо трёхчленной;\n    - **автономия воли сторон** в выборе применимого права (ст. 1210 ГК) — максимум децентрализации, какой знает право;\n    - встроенные ограничители — сверхимперативные нормы (ст. 1192 ГК) и оговорка о публичном порядке (ст. 1193 ГК).\n- Связь с курсом: МЧП показывает, что частное право способно работать вне одного государства, но полностью не отделяется от него.\n\n---\n\n#### Вопрос 18. Дуализм частного права. Формирование торгового права\n\n**Ответ:**\n\n- Дуализм — параллельное существование гражданского и торгового права, обычно с двумя кодексами.\n- Генезис: средневековая купеческая **lex mercatoria** (ярмарки, портовые города, собственные суды) → субъективный критерий (право сословия купцов) → **Code de commerce** 1807 г. — переход к объективному критерию (торговая сделка) → германское Торговое уложение — возврат к субъективному критерию (коммерсант).\n- Сохраняется: Германия (HGB), Франция, Австрия, Испания, Япония.\n- Отказались (монизм): Швейцария (1911), Италия (1942), Нидерланды, Россия, Квебек, Чехия.\n- Причина отказа: коммерциализация гражданского права (торговые правила стали общими), исчезновение сословия купцов, появление более функциональной дихотомии **B2B/B2C**.\n\n---\n\n#### Вопрос 19. Есть ли в России предпосылки для торгового права?\n\n**Ответ:**\n\n- Исторически были: Устав торговый, коммерческие суды с 1832 г., научная школа (К.И. Малышев, Шершеневич, Каминка).\n- В советское время — концепция хозяйственного права (Гойхбарг, Стучка), которую цивилисты, включая Черепахина, последовательно отвергали.\n- Сейчас — **формальный монизм при фактической дифференциации**: ст. 2 ГК включает предпринимательские отношения в предмет гражданского права; внутри ГК — специальный слой норм для предпринимателей (ответственность без вины, публичный договор, ограничение снижения неустойки).\n- Позиция Суханова: дуализм обусловлен сословным строем, которого больше нет; необходимая дифференциация уже достигнута внутри ГК.\n- Вывод: предпосылки для **дифференциации** есть и реализованы, предпосылок для полноценного **дуализма** (отдельного кодекса) — нет.\n\n---\n\n### ЗАДАЧИ\n\n#### Задача 1. Дмитрий против государства — зачёт налогов\n\n**Ответ:**\n\n- Требование Дмитрия обосновано: вред от незаконного задержания возмещается за счёт казны независимо от вины (ст. 1070 ГК), упущенный заработок входит в состав вреда.\n- Зачёт неправомерен по трём причинам:\n    - ст. 410 ГК рассчитана на гражданско-правовые обязательства, а налоговая обязанность возникает из властного подчинения;\n    - государство участвует в двух отношениях в **разном качестве** — как равный участник оборота (деликт) и как носитель фискального суверенитета (налог);\n    - у государства есть собственный порядок взыскания недоимки (НК РФ).\n- **Решение:** иск удовлетворить полностью, зачёт отклонить, недоимку взыскивать отдельно.\n- Теория: прямая иллюстрация тезиса Черепахина — «правоотношение не теряет своего частноправового характера от того, что в нём участвует государство».\n\n---\n\n#### Задача 2. Губернатор и бариста\n\n**Ответ:**\n\n- Договор розничной купли-продажи заключён с **гражданином** — покупка кофе для личного потребления не относится к полномочиям должностного лица (ст. 124–125 ГК про участие публичных образований в обороте).\n- Ссылки на многодетность и пенсионный статус не создают права на отсрочку — коммерческий кредит (ст. 823 ГК) возникает только по соглашению сторон.\n- Предложение обменять кофе на скидку по ЖКУ — **ничтожно**: это использование должностного положения в частном интересе, конфликт интересов.\n- **Решение:** иск кофейни к гражданину о взыскании стоимости кофе удовлетворить.\n- Теория: присутствие должностного лица не делает отношение публичным; попытка перевести частный долг на публичный ресурс — пример «приватизации» в дурном смысле (см. вопрос 12).\n\n---\n\n#### Задача 3. Галицын и Гусев\n\n**Ответ:**\n\n- Указания заказчика обязательны, только если это предусмотрено договором (по аналогии со ст. 973, 992 ГК о поручении и комиссии) — такая обязанность основана на собственном волеизъявлении, а не на власти.\n- Понудить к исполнению услуг в натуре нельзя — обязательство личного характера (постановление Пленума ВС РФ по ст. 308.3 ГК); средства защиты Галицына — отказ от договора и убытки.\n- Переквалификация в трудовой договор — гарантия работника, инициировать её может он сам, ГИТ или прокурор, но **не заказчик в свою пользу**.\n- **Парадокс задачи:** довод Гусева спасает его в обоих сценариях — если договор гражданско-правовой, принуждение к личным услугам недопустимо; если трудовой — тем более, принудительный труд запрещён (ст. 4 ТК).\n- Вывод: хозяйская власть даёт право приказывать, но не право принуждать физически.\n\n---\n\n#### Задача 4. Нестерова против производителя йогуртов\n\n**Ответ:**\n\n- Право на обращение в суд у Нестеровой есть, права требования — нет.\n- Требование о запрете злоупотребления доминирующим положением по существу публично-правовое — это компетенция ФАС (ст. 23 ЗоЗК), а не индивидуальный иск.\n- Материально основания тоже нет: отсутствие товара без конкретного компонента — не навязывание условия о предмете; ассортимент — коммерческое решение производителя.\n- Доминирующее положение не доказано наблюдением одного супермаркета — нужны границы товарного рынка и доля (ст. 5 ЗоЗК).\n- Довод о неэффективности ФАС — политический, а не юридический.\n- **Решение:** в иске отказать. Но при доказанном личном вреде от нарушения Нестерова могла бы предъявить иск об убытках (ст. 37 ЗоЗК) — это и есть частноправовой слой антимонопольного права.\n\n---\n\n#### Задача 5. Супруги Алексеевы — договор о подарках\n\n**Ответ:**\n\n- Обещание «ежемесячно дарить подарок» ничтожно — нет конкретного предмета дарения (п. 2 ст. 572 ГК), не согласовано существенное условие.\n- Даже при определённости предмета — ст. 577 ГК даёт право отказаться от исполнения при изменении семейного положения; развод под это подпадает.\n- **Свобода договора не является принципом семейного права** — принципы перечислены в ст. 1 СК (равенство супругов, взаимное согласие, защита детей).\n- Свобода договора действует лишь в рамках поименованных соглашений и не распространяется на личные неимущественные отношения (п. 3 ст. 42 СК).\n- **Решение:** в иске отказать.\n\n---\n\n#### Задача 6. Яковлев и снос самовольной постройки\n\n**Ответ:**\n\n- Право на иск о сносе имеет не только публичная власть, но и любое лицо, чьи права нарушены сохранением постройки (разъяснения судов по ст. 222 ГК).\n- Если участок общий для дома (ст. 36 ЖК) — это негаторный иск сособственников (ст. 304 ГК), право на иск бесспорно.\n- Если участок муниципальный — нужно доказать нарушение конкретных прав (инсоляция, проезды, шум), а не абстрактную ссылку на строительные нормы.\n- Довод про «подозрительных людей» — публичный интерес общественного порядка; для частного иска его нужно перевести в конкретное нарушение конкретного права.\n- **Теория:** интерес двойственный — материально публичный (градостроительная дисциплина), но по форме конструкция иска частноправовая. Материальный критерий тут бессилен, формальный различает без труда.\n\n---\n\n#### Задача 7. Дедиков и Коровин — штраф\n\n**Ответ:**\n\n- Требование о поставке и убытках — удовлетворить при доказанности (размер убытков может определяться с разумной степенью достоверности, п. 5 ст. 393 ГК).\n- Довод Дедикова о разрушении имущественного равновесия неверен:\n    - неустойка — не встречное предоставление по обмену, а мера ответственности за нарушение (ст. 330 ГК), освобождающая от доказывания убытков;\n    - неосновательного обогащения нет — есть законное основание (договор, ст. 1102 ГК);\n    - ссылка на нарушенную эквивалентность, которую сам же согласовал, противоречит запрету непоследовательного поведения.\n- Но логика частично учтена правом: неустойка по общему правилу **зачётная** (ст. 394 ГК — против двойного взыскания), а явно несоразмерная — может быть **снижена** (ст. 333 ГК).\n- Теория: показывает предел корректирующей модели Вайнриба — неустойка содержит штрафной элемент сверх эквивалентного обмена, оправданный автономией воли, а не эквивалентностью.\n\n---\n\n#### Задача 8. Фогельсон и Смирнов\n\n**Ответ:**\n\n- Права Смирнова нарушены — ограничение свободы передвижения, право на компенсацию морального вреда (ст. 151 ГК).\n- Довод о временной невозможности исполнения слаб — точнее говорить о праве приостановить исполнение или отказаться от договора из-за утраты доверия.\n- Сломанная дверь возмещению не подлежит — правомерные действия полиции и крайняя необходимость (ст. 1067 ГК), опасность создана самим Фогельсоном (ст. 1083 ГК).\n- **Главный тезис Фогельсона неверен:** кредитор не вправе физически принуждать должника к исполнению —\n    - обязательство связывает волю, а не тело;\n    - принуждение — монополия государства, реализуемая через процесс;\n    - принудительный труд запрещён независимо от вида договора;\n    - недопустимо понуждение к исполнению обязательств личного характера даже через суд.\n- Теория: децентрализация содержания отношений в частном праве возможна именно потому, что принуждение централизовано государством.\n\n---\n\n#### Задача 9. Маша Кучерова и киностудия\n\n**Ответ:**\n\n- Довод киностудии неверен: ч. 4 ст. 63 ТК прямо допускает трудовой договор с детьми до 14 лет в организациях кинематографии — с согласия родителя и разрешения органа опеки.\n- Даже если разрешение не получено — фактически выполненная работа подлежит оплате (аналогия со ст. 67.1 ТК), трудовое право не знает реституции труда.\n- Довод родителей о свободе договора юридически неверен по мотивировке — ребёнок субъект права, а не объект распоряжения; родители действуют как законные представители **в интересах ребёнка** (ст. 65 СК).\n- Компенсация морального вреда **в пользу самих родителей** неправомерна — нарушено право Маши, а не их собственное (ст. 237 ТК — вред возмещается работнику); заявить требование можно только от её имени.\n- Теория: показывает верный результат при изначально неверной посылке — хороший материал для обсуждения на семинаре.\n\n---\n\n#### Задача 10. Коновалова и обжигающий кофе\n\n**Ответ:**\n\n- Возмещение стоимости лечения и компенсация морального вреда — удовлетворить при доказанности недостатка услуги, независимо от вины (ст. 1095 ГК, ст. 14–15 ЗоЗПП); при грубой неосторожности потерпевшей — уменьшить возмещение (ст. 1083 ГК).\n- Требование обязать замерять температуру напитков — **отклонить**: у истицы нет субъективного права требовать определённой организации техпроцесса, это компетенция Роспотребнадзора.\n- Штраф 5% от оборота кафе — **отклонить**: закон не предусматривает такой санкции по иску потребителя, оборотные штрафы взыскиваются в бюджет, а не в пользу частного лица.\n- Единственный близкий институт — штраф 50% по п. 6 ст. 13 ЗоЗПП за несоблюдение добровольного порядка удовлетворения требований, но нужно соблюдение досудебной процедуры.\n- Теория: мотив «защиты будущих потребителей» — функция публичного правоприменения; интерес потребителя нерасчленим по содержанию, но по форме защиты разграничение чёткое.\n"},{"id":"civil-3","title":"Источники гражданского права","short":"Источники","date":"15 сен","md":"## Иерархия источников (по убыванию силы)\n\n1. Конституция РФ\n2. Общепризнанные принципы и нормы международного права, международные договоры РФ\n3. ГК РФ и принятые в соответствии с ним федеральные законы\n4. Указы Президента РФ\n5. Постановления Правительства РФ\n6. Акты министерств и иных федеральных органов исполнительной власти\n7. Обычаи\n8. Особое положение — судебная практика\n\n---\n\n## 1. Законодательство\n\n**Узкое понятие ст. 3 ГК:** гражданское законодательство = ГК РФ + принятые в соответствии с ним федеральные законы. Указы Президента, постановления Правительства и ведомственные акты формально **не входят** в понятие «законодательство» — они называются иными правовыми актами, содержащими нормы гражданского права.\n\n**ГК как основа отрасли.** Не выше других ФЗ по юридической силе формально, но нормы иных законов должны **соответствовать ГК** (п. 2 ст. 3) — это требование системного единства, а не строгая иерархия.\n\n**ФКЗ в гражданском праве — их действительно мало**, потому что ФКЗ принимаются только по вопросам, прямо названным в Конституции (судебная система, Правительство, чрезвычайное положение), а это не гражданско-правовые вопросы. Из касающихся отрасли:\n\n- ФКЗ «О Правительстве РФ» — полномочия по изданию актов, затрагивающих оборот;\n- ФКЗ «О Верховном Суде РФ» — полномочия ВС по разъяснениям судебной практики.\n\nФКЗ сильнее обычных ФЗ (ФЗ не могут им противоречить), но прямого гражданско-правового регулирования почти не содержат — их значение опосредованное.\n\n**Подзаконные акты, уровни (ст. 3 ГК):**\n\n- **Указы Президента** — не должны противоречить ГК и законам; в 1990-е играли большую роль (приватизация, ценные бумаги) при отставании законотворчества, сейчас их вес меньше;\n- **Постановления Правительства** — во исполнение ГК, законов и указов; обычно регулируют технические вопросы (правила отдельных договоров, типовые формы, регистрация);\n- **Ведомственные акты** министерств — содержат нормы гражданского права только в случаях и пределах, прямо предусмотренных ГК и другими законами, то есть лишь при прямом делегировании.\n\n**Акты с неясной природой:**\n\n- **акты Банка России** — не орган исполнительной власти, но издаёт обязательные нормы (ценные бумаги, расчёты), место в перечне ст. 3 ГК не определено;\n- **локальные акты организаций** (уставы) — спорно, источник права или акт индивидуального регулирования;\n- **акты СРО** и **технические регламенты** — обязательны в силу прямой отсылки закона, а не сами по себе.\n\n---\n\n## 2. Обычаи\n\n**Определение (ст. 5 ГК):** сложившееся и широко применяемое в какой-либо области деятельности правило поведения, не предусмотренное законодательством, независимо от того, зафиксировано ли оно в документе.\n\n**Признаки:** устойчивая и неоднократная практика; широкое признание, а не единичный случай; необязательна письменная фиксация.\n\n**Субсидиарность.** Обычай применяется, только если вопрос не урегулирован ни императивной нормой закона, ни договором сторон (п. 2 ст. 5 ГК) — самый слабый по силе источник, уступает и закону, и договору.\n\n**Виды:** обычаи делового оборота в предпринимательской сфере (ИНКОТЕРМС, обычаи морских портов) и иные обычаи, не только предпринимательские.\n\n**Историческая связь:** это современный аналог lex mercatoria — купеческого права, которое государство постепенно кодифицировало (см. вопрос 18 темы 1).\n\n---\n\n## 3. Международные договоры и общепризнанные принципы и нормы международного права\n\n**Конституционная основа (ч. 4 ст. 15 Конституции):** составная часть правовой системы РФ; если договором установлены иные правила, чем законом, — применяются правила договора.\n\n**Ст. 7 ГК дублирует это для отрасли:**\n\n- международные договоры применяются к гражданским отношениям непосредственно, кроме случаев, когда для применения нужен внутригосударственный акт;\n- при коллизии с гражданским законодательством приоритет у международного договора.\n\n**Уровень приоритета:** выше обычного ФЗ (включая ГК), но не выше Конституции — КС РФ вправе проверять конституционность международных обязательств.\n\n**Примеры значения:** Венская конвенция о международной купле-продаже товаров (CISG), конвенции об интеллектуальной собственности, о международных перевозках.\n\n**Не путать** с обычаями делового оборота из ст. 5 ГК — это разные категории: там внутренний обычай, здесь — источник международного права.\n\n---\n\n## 4. Судебная практика\n\n**Формальная позиция:** Россия — романо-германская семья, прецедент источником права не признаётся, ст. 3 ГК судебную практику не называет. Суд применяет и толкует норму, а не создаёт её.\n\n**Фактическая роль значительно выше формальной**, реализуется через несколько разных каналов:\n\n- **Постановления Пленума ВС РФ** — формально акты толкования, но по факту содержат детализированные правила, обязательные для судов, и фактически формируют единообразную практику применения по всей стране.\n- **Обзоры судебной практики**, утверждённые Президиумом ВС РФ, — тоже ориентируют нижестоящие суды.\n- **Постановления Конституционного Суда** — акты негативного правотворчества: КС не создаёт норму, но может признать норму неконституционной, и она перестаёт применяться; также даёт конституционно-конформное толкование, обязательное для всех судов.\n- **Решения по конкретным делам** формально обязательны только для сторон, но фактически нижестоящие суды ориентируются на практику вышестоящих инстанций, что создаёт эффект, близкий к прецеденту, хотя де-юре им не являющийся.\n\n**Аналогия закона и аналогия права** (ст. 6 ГК) — отдельный связанный вопрос: при пробеле в законе и отсутствии применимого обычая используется норма, регулирующая сходные отношения (аналогия закона); если и это невозможно — права и обязанности определяются исходя из общих начал и смысла гражданского законодательства, требований добросовестности, разумности и справедливости (аналогия права). Это не «источник» в строгом смысле, а способ восполнения пробела, но по факту суд в этот момент действует творчески, приближаясь к правотворчеству.\n\n**Общий вывод:** судебная практика — не источник права по формальной доктрине, но по факту важнейший механизм единообразного применения и толкования всех остальных источников, а иногда и восполнения пробелов там, где законодатель не успел или не смог урегулировать отношения прямо.\n"},{"id":"civil-4","title":"Семинар 2. Юридические лица","short":"Юридические лица","date":"9 окт","md":"Ключевая идея Кузнецова («Орган юридического лица как его представитель»), на которую нанизана половина семинара — реформированный ГК прямо назвал органы представителями, и это не терминологическая мелочь, а смена всей догматической базы:\n\n> «Юридическое лицо приобретает гражданские права и принимает на себя гражданские обязанности через свои органы, действующие от его имени (**пункт 1 статьи 182**)...» (п. 1 ст. 53 ГК РФ)\n\nРабочий вывод, который стоит держать в голове для всех «директорских» задач:\n\n> «...главную роль играют не доктринальные выкладки, а практические последствия той или иной теории» (А.В. Егоров, пересказ Кузнецова)\n\n---\n\n## Вопрос 1. Происхождение института юридического лица\n\n**Ответ:**\n\nЗачатки — римские collegia, universitates (муниципии), храмовые и благотворительные фонды (piae causae) позднего Рима — но без разработанной догматики «лица» как особого субъекта.\n\nСредневековье — постглоссаторы (Бартол, Бальд) разрабатывают учение о persona ficta применительно к городским коммунам, цехам, университетам — чтобы объяснить, почему корпорация может иметь права отдельно от конкретных её членов.\n\nКаноническое право — учение папы Иннокентия IV о корпорации как persona ficta et representata, важное для последующей теории фикции.\n\nНовое время — торговые компании (Ост-Индские компании), появление явочного порядка образования в противовес разрешительному.\n\nXIX век — немецкая пандектистика (Савиньи — теория фикции; Гирке — теория реальности/органическая теория) формирует конкурирующие объяснения, обслуживающие разный политический заказ (разрешительная vs явочная регистрация).\n\n---\n\n## Вопрос 2. Основные теории юридических лиц\n\n**Ответ:**\n\nТеория фикции (Савиньи) — реальны только люди, ЮЛ — условная юридическая конструкция, приписываемая государством; отсюда разрешительный (концессионный) порядок регистрации.\n\nТеория реальности (органическая теория) (Гирке) — ЮЛ — реально существующий социальный организм («союзная личность»), откуда органы — не представители, а части этого организма; обслуживала явочный порядок.\n\nТеория интереса (Иеринг) — ЮЛ — технический приём для защиты интересов стоящих за ним людей (бенефициаров).\n\nТеория коллектива (советская доктрина — Братусь) — ЮЛ есть коллектив трудящихся, организованный государством.\n\nТеория директора (Толстой) / теория государства (Аскназий) — в условиях плановой экономики акцент смещался на то, кто именно реализует волю ЮЛ.\n\nТеория социальной реальности / «никто» (Nobody) — современный прагматический взгляд: вопрос о «субстрате» не имеет самостоятельного юридического значения.\n\n---\n\n## Вопрос 3. Практическое значение теорий юридических лиц\n\n**Ответ:**\n\nСегодня в зарубежном праве нет привязки к конкретной теории при решении практических вопросов (Zimmer); сами российские авторы признают их схоластический характер (Суханов).\n\nСпор о теориях исторически обслуживал конкретные практические задачи — выбор между разрешительным и явочным порядком регистрации, конструкцию статуса органа.\n\nСегодня теория органа используется как щит против пересмотра статуса директора — но, как показывает Кузнецов, сама по себе она не отвечает ни на один прикладной вопрос (ответственность, объём полномочий, последствия пороков воли) без фактического заимствования норм о представительстве.\n\nПрактический вывод семинара: теории ЮЛ — не инструмент решения дел, инструмент — конкретные нормы (ст. 53, 53.1, 174, 182, 183 ГК).\n\n---\n\n## Вопрос 4. Организационно-правовая форма: понятие и зачем нужны разные формы\n\n**Ответ:**\n\nОрганизационно-правовая форма — закреплённый законом стандартный набор характеристик ЮЛ: порядок образования имущества, структура управления, объём и характер ответственности участников, порядок распределения прибыли и управления рисками.\n\nЗаконодатель закрывает перечень форм (numerus clausus, п. 2 ст. 48, ст. 50 ГК) — участники оборота не могут изобретать собственные конструкции ЮЛ.\n\nЗачем нужен закрытый перечень: (1) снижение издержек оборота — контрагенту не нужно каждый раз разбираться в индивидуальном уставе, достаточно знать форму; (2) защита кредиторов — предсказуемый набор гарантий (уставный капитал, субсидиарная/солидарная ответственность и т.п.); (3) ограничение злоупотреблений — без закрытого перечня возможно конструирование форм, искусственно ограничивающих ответственность.\n\nРазные формы существуют, чтобы обслуживать разные экономические потребности: малый бизнес с единым контролем (ООО), привлечение капитала широкого круга инвесторов (ПАО), объединение имущества без цели прибыли (фонд, АНО), ведение деятельности без обособления имущества от учредителя-государства (унитарное предприятие).\n\n---\n\n## Вопрос 5. Классификации юридических лиц\n\n**Ответ:**\n\nПо цели деятельности — коммерческие / некоммерческие (ст. 50 ГК).\n\nПо характеру прав участников — корпорации / унитарные организации (ст. 65.1 ГК).\n\nПо объёму прав учредителей на имущество — право собственности учредителя сохраняется (унитарные предприятия, учреждения) / участники имеют обязательственные права (хозяйственные общества, товарищества, кооперативы) / у учредителей нет имущественных прав вовсе (фонды, АНО, религиозные организации) — ст. 48 ГК.\n\nПо составу учредителей — ЮЛ с одним учредителем (компания одного лица) / с множественностью участников.\n\nПо степени ответственности участников — с ограниченной ответственностью (ООО, АО) / с субсидиарной ответственностью участников (товарищества, производственные кооперативы, некоторые некоммерческие формы).\n\n---\n\n## Вопрос 6. Коммерческие и некоммерческие юридические лица\n\n**Ответ:**\n\nКритерий из п. 1 ст. 50 ГК — основная цель деятельности: извлечение прибыли (коммерческие) либо отсутствие такой цели как основной (некоммерческие).\n\nНекоммерческие организации вправе заниматься приносящей доход деятельностью, если это служит достижению целей, ради которых они созданы, и соответствует этим целям (п. 4 ст. 50 ГК) — то есть деятельность разрешена инструментально, а не как самостоятельная цель.\n\nПрибыль некоммерческой организации не подлежит распределению между участниками/учредителями — это ключевое материальное отличие, а не сам факт отсутствия предпринимательской деятельности.\n\nПеречень некоммерческих форм — закрытый и значительно длиннее, чем коммерческих (ст. 50 ГК содержит исчерпывающий список и тех, и других).\n\n---\n\n## Вопрос 7. Корпорации и унитарные организации\n\n**Ответ:**\n\nКорпорации (ст. 65.1 ГК) — учредители (участники) обладают правом членства и формируют высший орган (общее собрание/съезд). Примеры: хозяйственные общества и товарищества, кооперативы, общественные организации.\n\nУнитарные организации — учредители не становятся участниками и не приобретают прав членства (фонды, учреждения, автономные некоммерческие организации, государственные корпорации, религиозные организации, унитарные предприятия).\n\nПрактическое следствие деления — применимость общих норм о корпоративном управлении (гл. 4 § 2, ст. 65.2–65.3 ГК): право на участие в управлении, на информацию, на оспаривание решений, на выход/исключение — всё это работает только в корпорациях.\n\nУнитарные организации управляются органом, формируемым не участниками (а учредителем единолично либо в порядке, установленном при создании) — здесь нет корпоративного конфликта в классическом смысле, поэтому неприменимы, например, нормы о корпоративном договоре.\n\n---\n\n## Вопрос 8. Практическое значение классификаций юридических лиц\n\n**Ответ:**\n\nКлассификация определяет применимый правовой режим целиком: объём правоспособности (специальная у НКО и унитарных предприятий — п. 1 ст. 49 ГК, общая у коммерческих корпораций), доступные способы защиты прав участников (выход, исключение, оспаривание решений — только в корпорациях), необходимость уставного капитала (только у хозяйственных обществ), возможность распределения прибыли.\n\nПроцессуальное значение — корпоративные споры (гл. 28.1 АПК) определяются по признаку корпорации, а не любого ЮЛ вообще.\n\nДеление коммерческих/некоммерческих значимо для налогового режима, для субсидиарной ответственности учредителей, для допустимости приносящей доход деятельности.\n\nВывод: классификации — не кабинетная схоластика, а инструмент определения конкретного набора норм, применимых к спору.\n\n---\n\n## Вопрос 9. Товарищеская природа корпораций, включая хозяйственные общества\n\n**Ответ:**\n\nИсторически хозяйственные общества (особенно ООО) выросли из договора товарищества — соединение лиц и капиталов для общей цели, и это наследие заметно в регулировании непубличных форм.\n\nПроявления товарищеской природы: право на выход участника (ст. 94 ГК, ст. 26 Закона об ООО), преимущественное право покупки доли (ст. 21 Закона об ООО), возможность исключения участника за грубое нарушение обязанностей (ст. 67 ГК), требование единогласия или квалифицированного большинства по ключевым вопросам, допустимость жёстких ограничений на отчуждение доли в уставе.\n\nВ то же время общество с ограниченной ответственностью и акционерное общество, в отличие от классического товарищества, предполагают ограничение ответственности участников и юридическую обособленность капитала от личности участников — то есть это гибридная конструкция: по структуре отношений — товарищество, по модели ответственности — объединение капиталов.\n\nЭто прямо связано с темой пределов автономии воли в уставе (Кузнецов, «Пределы автономии воли в корпоративном праве») — товарищеская природа непубличных обществ (ООО, непубличное АО) оправдывает большую диспозитивность устава по сравнению с публичными обществами, где превалирует защита анонимного инвестора.\n\n---\n\n## Вопрос 10. Принцип самостоятельной ответственности юридических лиц\n\n**Ответ:**\n\nЮЛ отвечает по своим обязательствам всем принадлежащим ему имуществом (п. 1 ст. 56 ГК) — это прямое следствие имущественной обособленности (ст. 48 ГК).\n\nУчредитель (участник) не отвечает по обязательствам ЮЛ, а ЮЛ не отвечает по обязательствам учредителя (участника), за исключением случаев, предусмотренных ГК или другим законом (п. 2 ст. 56 ГК) — например, субсидиарная ответственность при банкротстве по вине контролирующих лиц (ст. 61.11 Закона о банкротстве, ст. 53.1 ГК).\n\nСмысл принципа — разграничение рисков: кредиторы ЮЛ могут рассчитывать только на имущество самого ЮЛ, а не на личное имущество его участников; это и есть базовая функция юридического лица как обособленного имущественного комплекса.\n\nПринцип касается именно обязательств, а не прав — имущество ЮЛ юридически полностью обособлено от имущества учредителей, даже если экономически они контролируют весь денежный поток.\n\n---\n\n## Вопрос 11. Принцип ограниченной ответственности участников и его роль в экономике\n\n**Ответ:**\n\nВ хозяйственных обществах (ООО, АО) участники несут риск убытков только в пределах стоимости своих долей/акций (п. 1 ст. 87, п. 1 ст. 96 ГК) — это не то же самое, что самостоятельная ответственность ЮЛ (вопрос 10), а дополнительная гарантия для самих участников.\n\nЭкономическая функция: ограниченная ответственность снижает барьер входа в предпринимательство и стимулирует инвестирование в рискованные проекты — инвестор заранее знает верхнюю границу своих потерь.\n\nЭто облегчает диверсификацию риска — можно вложиться в несколько компаний малыми долями, не принимая на себя риск разорения от каждой из них.\n\nОбратная сторона — риск недокапитализации и злоупотреблений (вывод активов, искусственное банкротство) — отсюда институты субсидиарной ответственности контролирующих лиц, требования к уставному капиталу, доктрина снятия корпоративной вуали (ст. 53.1 ГК как компромиссная конструкция: не отменяя ограниченной ответственности как правила, вводит персональную ответственность за злоупотребление контролем).\n\n---\n\n## Вопрос 12. Уставный капитал: значение и функция\n\n**Ответ:**\n\nФормально — минимальный размер имущества, гарантирующего интересы кредиторов (п. 1 ст. 90, п. 1 ст. 99 ГК) — но современная доктрина относится к этой функции скептически: минимальный размер (10 000 руб. для ООО) давно не выполняет реальной гарантийной роли.\n\nФактические функции: (1) определение долей участия и объёма корпоративных прав (голоса, дивиденды пропорционально доле); (2) сигнальная функция при создании — демонстрация серьёзности намерений учредителей; (3) формальный порог для некоторых правовых последствий (уменьшение капитала ниже минимума — основание ликвидации, ст. 90, 99 ГК, ст. 20 Закона об ООО).\n\nСовременная тенденция (в т.ч. в зарубежных правопорядках) — смещение акцента с формального уставного капитала на содержательные тесты платёжеспособности (solvency test) и институты ответственности контролирующих лиц как более эффективные механизмы защиты кредиторов.\n\n---\n\n## Вопрос 13. Органы юридических лиц как представители: особенность и отличие от обычных добровольных представителей\n\n**Ответ:**\n\nЦентральный тезис Кузнецова: п. 1 ст. 53 ГК прямо отсылает к п. 1 ст. 182 ГК — органы являются представителями, их полномочия закреплены в учредительном документе (а не в доверенности) — это «уставные представители».\n\nКритика органической теории («орган — часть ЮЛ»): она не объясняет, почему действия физического лица, создающие последствия для другого субъекта, не являются представительством; реальность физических лиц, осуществляющих полномочия, нельзя «отменить» умозрительной конструкцией.\n\nЗаконным представителем в строгом смысле можно считать только общее собрание участников; директор и члены иных органов получают полномочия через сделку (избрание) — это добровольное представительство, и к нему по п. 4 ст. 185 ГК применяются правила о доверенности, если иное не установлено законом и не противоречит существу отношений.\n\nКлючевые отличия от классического представителя:\n\n- полномочия директора во внешних отношениях по общему правилу неограниченны (принцип общей правоспособности коммерческого ЮЛ) — в отличие от представителя по доверенности, чей объём полномочий всегда определён текстом доверенности;\n- легитимация директора идёт не через документ на руках у контрагента, а через ЕГРЮЛ — функциональный аналог доверенности, на публичную достоверность которого вправе полагаться третьи лица (п. 2 ст. 51 ГК);\n- директор, в отличие от представителя, по умолчанию вправе привлекать третьих лиц к исполнению своих функций без формального передоверия — институт передоверия (ст. 187 ГК) к нему неприменим, поскольку не отвечает существу отношений (Постановление Президиума ВАС № 9324/13);\n- истечение срока полномочий директора не прекращает их автоматически (в отличие от истечения срока доверенности) — директор действует до избрания нового, что объясняется отсутствием сведений о сроке полномочий в ЕГРЮЛ и защитой добросовестных третьих лиц;\n- при этом к директору применимы нормы о запрете представителю совершать сделки в отношении себя лично/конфликте интересов (п. 3 ст. 182 ГК) — это прямо признано практикой (п. 10 информационного письма Президиума ВАС № 162 от 10.12.2013: «положение лица, которое в силу закона или учредительных документов юридического лица выступает от его имени, и положение представителя во многом аналогичны»), если сделка не подпадает под специальное регулирование сделок с заинтересованностью.\n\n---\n\n## Вопрос 14. Учреждение юридического лица: правовая природа\n\n**Ответ:**\n\nУчреждение ЮЛ — многостадийный юридический состав, а не единый акт: (1) решение учредителей (сделка — для корпораций многосторонняя, договорного типа) об учреждении, утверждение устава, назначение органов; (2) формирование имущества (оплата уставного капитала, взнос в фонд); (3) государственная регистрация — правообразующий юридический факт, с которым закон связывает возникновение правосубъектности (п. 2 ст. 51 ГК).\n\nРешение об учреждении корпорации с несколькими учредителями — это особый корпоративный договор-правоотношение, отличный от обычной гражданско-правовой сделки: он создаёт не права требования между сторонами, а порождает новый субъект права.\n\nДо регистрации ЮЛ не существует — сделки, совершённые от имени «создаваемого» ЮЛ, по общему правилу связывают лиц, их совершивших (с солидарной ответственностью при множественности), а не будущее ЮЛ, если впоследствии оно их прямо не одобрит (ст. 8, п. 1 ст. 53 ГК, аналогия со ст. 183 ГК).\n\n---\n\n## Вопрос 15. Государственная регистрация юридических лиц: зачем нужна и правовые последствия\n\n**Ответ:**\n\nФункции регистрации: (1) конститутивная — правосубъектность ЮЛ возникает в момент внесения записи в ЕГРЮЛ (п. 2 ст. 51 ГК), а не с момента принятия решения учредителями; (2) информационная/публичная достоверность — реестр открыт, и данные из него признаются достоверными, пока не доказано иное (п. 2 ст. 51 ГК) — на это полагаются третьи лица при проверке полномочий директора, статуса ЮЛ, состава участников (для непубличных форм — ЕГРЮЛ, для АО — реестр акционеров); (3) контрольная — проверка формального соответствия документов закону (без проверки содержательной законности сделки, лежащей в основе создания).\n\nПоследствия: лицо, добросовестно полагавшееся на данные реестра, вправе исходить из них, даже если они не соответствуют действительности, за исключением случаев, когда соответствующие данные были включены в реестр в результате неправомерных действий третьих лиц или иным путём помимо воли ЮЛ (п. 2 ст. 51 ГК) — отсюда и разграничение Кузнецова: если «лжедиректор» попал в реестр из-за недействительности решения о его избрании — добросовестный контрагент защищён; если документы были поддельными или запись внесена вовсе помимо воли участников — не защищён.\n\n---\n\n## Вопрос 16. Учредительный документ: понятие и значение\n\n**Ответ:**\n\nУчредительный документ (как правило — устав, п. 1 ст. 52 ГК) определяет: наименование, место нахождения, порядок управления, предмет и цели деятельности (если установлена специальная правоспособность), иные сведения, предусмотренные законом для данной организационно-правовой формы.\n\nЗначение: (1) источник полномочий органов — именно устав определяет компетенцию органов, порядок их формирования, ограничения (отсюда — «уставное представительство» директора); (2) рамка для определения интересов ЮЛ при оценке добросовестности/разумности директора (Постановление Пленума ВАС № 62, п. 2); (3) инструмент диспозитивного регулирования непубличных корпораций — устав ООО/непубличного АО может отступать от диспозитивных норм закона (тема пределов автономии воли, Кузнецов, 2017).\n\nВажное ограничение (прямо проявляется в задаче «Чупрунов и Зайцев»): ограничения полномочий органа, установленные уставом, не могут быть противопоставлены добросовестным третьим лицам, которые о них не знали и не должны были знать (абз. 2 п. 1 ст. 174 ГК) — устав связывает внутренние отношения, но не автоматически внешние.\n\n---\n\n## Вопрос 17. Реорганизация ЮЛ: понятие, формы, способы защиты прав участников и кредиторов\n\n**Ответ:**\n\nРеорганизация — способ прекращения и/или создания ЮЛ с универсальным правопреемством (ст. 57, 58 ГК). Формы: слияние, присоединение, разделение, выделение, преобразование; с 2014 г. допускается смешанная реорганизация (сочетание форм, в т.ч. с участием нескольких организационно-правовых форм).\n\nЗащита прав кредиторов:\n\n- право потребовать досрочного исполнения обязательства, а при невозможности — прекращения обязательства и возмещения убытков (п. 2 ст. 60 ГК), для публичных АО и некоторых случаев — только возмещение убытков;\n- обязательная публикация сведений о реорганизации в журнале «Вестник государственной регистрации» дважды с периодичностью не реже раза в месяц (п. 1 ст. 60 ГК);\n- при разделении/выделении — если разделительный баланс не позволяет определить правопреемника по обязательству либо нарушен принцип справедливого распределения активов и обязательств, реорганизованное ЮЛ и вновь созданные ЮЛ несут по этому обязательству солидарную ответственность (п. 5 ст. 60 ГК) — ключевая норма для задачи «Чтец».\n\nЗащита прав участников: участник, голосовавший против решения о реорганизации либо не принимавший участия в голосовании, при наличии признаков заведомой невыгодности условий конвертации долей/акций вправе требовать возмещения убытков от лиц, недобросовестно способствовавших принятию решения о реорганизации (ст. 60.1, 60.2 ГК); возможно оспаривание решения о реорганизации и признание реорганизации несостоявшейся (ст. 60.1, 60.2 ГК) при грубых нарушениях.\n\n---\n\n## Вопрос 18. Прекращение юридического лица: основания и процедура\n\n**Ответ:**\n\nПрекращение бывает с правопреемством (реорганизация, кроме выделения) и без правопреемства (ликвидация).\n\nЛиквидация (ст. 61–64 ГК): добровольная (по решению учредителей/участников либо уполномоченного органа ЮЛ, в т.ч. в связи с истечением срока/достижением цели) и принудительная — по решению суда по требованию госоргана или органа местного самоуправления (п. 3 ст. 61 ГК), в частности:\n\n- при грубых неустранимых нарушениях закона, допущенных при создании ЮЛ, либо при осуществлении деятельности с неоднократными или грубыми нарушениями закона (подп. 3 п. 3 ст. 61 ГК) — критерии соразмерности санкции и устранимости нарушения выработаны практикой (КС РФ, ВС РФ) — прямая база для задачи «Crazy bear»;\n- при невозможности достижения целей, ради которых создано ЮЛ, в том числе когда осуществление деятельности становится невозможным или существенно затруднённым (подп. 5 п. 3 ст. 61 ГК) — это основание применяется, в частности, при корпоративном тупике (deadlock) между равными участниками, когда по иску участника суд может принудительно ликвидировать ООО — прямая база для задачи «Четвёртый этаж».\n\nПроцедура: назначение ликвидационной комиссии/ликвидатора, публикация сообщения о ликвидации, выявление кредиторов и дебиторов, составление промежуточного ликвидационного баланса, расчёты с кредиторами в очередности ст. 64 ГК, составление окончательного ликвидационного баланса, распределение оставшегося имущества между участниками (п. 8 ст. 63, п. 1 ст. 67 ГК), внесение записи об исключении из ЕГРЮЛ (завершающий, правопрекращающий факт).\n\nОтдельный упрощённый механизм — исключение недействующего ЮЛ из ЕГРЮЛ в административном порядке (ст. 64.2 ГК, ст. 21.1 Закона о госрегистрации ЮЛ) при одновременном непредставлении отчётности в течение 12 месяцев и отсутствии операций по счетам — также сопровождается публикацией и трёхмесячным сроком на подачу возражений заинтересованными лицами.\n\n---\n\n## Вопрос 19. Несостоятельность юридического лица: общее понятие\n\n**Ответ:**\n\nНесостоятельность (банкротство) — признанная арбитражным судом неспособность должника в полном объёме удовлетворить требования кредиторов по денежным обязательствам и(или) исполнить обязанность по уплате обязательных платежей (ст. 2 Закона о банкротстве).\n\nПризнак банкротства ЮЛ — неспособность исполнить обязательства в течение трёх месяцев с даты, когда они должны были быть исполнены (п. 2 ст. 3 Закона о банкротстве), при превышении порогового размера требований.\n\nПроцедуры: наблюдение, финансовое оздоровление, внешнее управление, конкурсное производство, мировое соглашение.\n\nСвязь с темой семинара — субсидиарная ответственность контролирующих лиц при банкротстве (гл. III.2 Закона о банкротстве, опирающаяся на ст. 53.1 ГК) — это тот же инструментарий добросовестности/разумности директора, что в Постановлении Пленума ВАС № 62, но применённый в ситуации недостаточности имущества ЮЛ для расчёта с кредиторами.\n\n---\n\n## Вопрос 20. Правило защиты делового решения (business judgment rule)\n\n**Ответ:**\n\nСформулировано (применительно к российскому праву) в Постановлении Пленума ВАС РФ № 62 от 30.07.2013 и развито в Обзоре практики по спорам о применении ст. 53.1 ГК РФ (утв. Президиумом ВС РФ 30.07.2025, п. 9):\n\n> «Корпоративное законодательство основывается на принципе защиты делового решения, исходя из которого предполагается, что наличие негативных для корпорации последствий от принятых руководителем решений само по себе не может являться основанием для привлечения его к ответственности, поскольку возможность возникновения убытков... соответствует рисковому характеру предпринимательской деятельности» (п. 9 Обзора ВС РФ)\n\nСуд не проверяет экономическую целесообразность решений директора — проверяется только правомерность поведения (п. 1 Постановления № 62).\n\nРазумность действий директора предполагается — бремя доказывания недобросовестности/неразумности лежит на истце (п. 5 ст. 10 ГК, п. 1 Постановления № 62); директор отвечает, только если поведение с очевидностью не отвечало обычным условиям оборота и выходило за пределы нормального хозяйственного
