 для уголовного преследования или отбывания наказания — в соответствии с международным договором РФ (либо, при его отсутствии, на основе принципа взаимности)\n\n### 6. Толкование уголовного закона\n\n- **Понятие:** толкование — интеллектуально-волевая деятельность по установлению точного содержания (смысла) уголовно-правовой нормы, необходимая для её правильного и единообразного применения\n\n**По субъекту:**\n\n- **легальное (аутентичное)** — исходит от органа, издавшего закон, либо специально уполномоченного; в УК РФ это, в частности, **примечания к статьям**, которые дают обязательные для применения определения понятий (напр., примечание к ст. 158 — определение хищения; примечание к ст. 285 — определение должностного лица; примечание к ст. 205 — определение террористического акта)\n- **судебное** — казуальное (даётся судом при рассмотрении конкретного дела, обязательно только для этого дела) и разъяснения Пленума Верховного Суда РФ (даются в виде постановлений по категориям дел — напр., Постановление Пленума ВС РФ от 27.12.2002 № 29 «О судебной практике по делам о краже, грабеже и разбое» — формально новых норм не создают, но обязательны для нижестоящих судов и фактически определяют единообразие практики)\n- **доктринальное (научное)** — даётся учёными в комментариях, монографиях, статьях; не имеет обязательной юридической силы, но влияет на законотворчество и судебную практику\n\n**По приёмам (способам):**\n\n- **грамматическое** — на основе правил языка, синтаксиса, значения слов\n- **систематическое** — путём сопоставления толкуемой нормы с другими нормами УК РФ и иных законов (напр., понять пределы применения нормы Особенной части можно только вместе с нормами Общей части)\n- **историческое** — с учётом истории принятия нормы, целей, которые преследовал законодатель, обстоятельств, вызвавших её появление\n- **логическое** — на основе законов формальной логики (напр., толкование от противного, по аналогии права)\n\n**По объёму:**\n\n- **буквальное (адекватное)** — смысл нормы полностью совпадает с её текстуальным выражением (наиболее распространённый и предпочтительный вид)\n- **ограничительное** — норме придаётся более узкий смысл, чем следует из буквального текста (напр., понятие «близкие родственники» в некоторых нормах толкуется уже, чем бытовое понятие «родственники»)\n- **распространительное** — норме придаётся более широкий смысл, чем следует из буквального текста (напр., открытые перечни вроде «иные тяжкие последствия» толкуются расширительно с учётом конкретных обстоятельств)\n- **важное ограничение:** расширительное толкование, **ухудшающее положение лица**, недопустимо — по существу оно означало бы применение уголовного закона по аналогии, что прямо запрещено ст. 3 УК РФ\n\n---\n\n## II. Задачи\n\n**Задача 1. Поезд Москва — Минск**\n\n- Х. подлил клофелин М., ограбил его, сошёл ещё на территории России; М. умер уже в Беларуси\n- **Закон какой страны:** РФ. Само деяние (введение опасного вещества + завладение имуществом) полностью окончено на территории России; смерть — лишь последствие, наступившее позже и в другом месте, но это не переносит место преступления (по аналогии с правилом ст. 9 ч. 2 о времени деяния). По территориальному принципу (ст. 11 ч. 1) отвечает по УК РФ. Квалификация — п. «в» ч. 4 ст. 162 (разбой, повлёкший смерть по неосторожности)\n- **Время преступления:** момент самого действия/бездействия, независимо от того, когда наступили последствия (ст. 9 ч. 2)\n\n**Задача 2. Лайнер в Японском море**\n\n- Судно приписано к Владивостоку, убийство произошло в открытом море вне терр. вод Японии\n- **Закон какого государства:** РФ — принцип флага (ч. 3 ст. 11): судно, приписанное к порту РФ, в открытом море приравнивается к территории России; гражданство виновного и потерпевшего роли не играет\n- **Если бы судно было в территориальных водах Японии:** по общему правилу юрисдикция перешла бы к Японии (её территориальное море — часть её государственной территории), хотя международная практика допускает исключение для чисто внутренних происшествий на борту иностранного судна при мирном проходе; кроме того, приоритет всегда имеет международный договор РФ, если он предусматривает иное (оговорка в ч. 3 ст. 11)\n\n**Задача 3. Разбой 2003 г. и отмена конфискации**\n\n- Преступление 14.11.2003, приговор 26.03.2004 по новой (более мягкой) редакции ст. 162 после ФЗ №162-ФЗ от 08.12.2003, отменившего конфискацию\n- **Правильно ли поступил суд:** да — ФЗ №162-ФЗ убрал обязательную конфискацию (более суровое доп. наказание), заменив её штрафом, а значит новая редакция улучшает положение осуждённого\n- **Обратная сила:** да, в силу ч. 1 ст. 10 — закон, устраняющий более суровое дополнительное наказание, имеет обратную силу и распространяется на деяния, совершённые до его принятия\n\n**Задача 4. Убийство 1996 г., приговор 1997 г., лишение наград**\n\n- Убийство совершено в марте 1996 г. (действовал УК РСФСР), приговор вынесен в феврале 1997 г. (УК РФ уже вступил в силу)\n- **Применимый закон:** по общему правилу ст. 9 — закон времени деяния, то есть УК РСФСР; сам факт более позднего приговора это не меняет\n- **Но:** суд обязан был сравнить санкцию ст. 102 «б» УК РСФСР с санкцией аналогичной нормы нового УК РФ (п. «и» ч. 2 ст. 105) по правилу ст. 10 — если новая норма мягче, применить именно её\n- **Лишение наград:** по обоим кодексам суд вправе лишить осуждённого за тяжкое/особо тяжкое преступление государственных наград (ст. 48 УК РФ) — это его законная компетенция; фактическое аннулирование награды технически оформляется указом Президента РФ на основании приговора\n- **Вывод:** приговор обоснован при условии, что суд действительно сравнил санкции обоих кодексов и не нашёл более мягкой нормы в новом УК\n\n**Задача 5. Нападение на албанского студента**\n\n- Х. в Воронеже с ножом напал на студента из Албании и забрал его вещи\n- **Закон какого государства:** РФ — территориальный принцип (ст. 11 ч. 1): значение имеет только место деяния, гражданство потерпевшего роли не играет. Квалификация — разбой (ст. 162)\n- **Смысл территориального принципа:** закон применяется ко всем лицам на территории государства независимо от гражданства (своих граждан, иностранцев, апатридов), кроме лиц с иммунитетом (ст. 11 ч. 4)\n\n**Задача 6. Кража в общежитии (Намибия — Конго)**\n\n- Студент из Намибии украл вещи студента из Конго в московском общежитии\n- **Применимый закон:** РФ — снова по территориальному принципу (ст. 11 ч. 1); гражданство ни виновного, ни потерпевшего значения не имеет. Квалификация — кража (ст. 158)\n\n**Задача 7. Гражданин Израиля, заочно осуждённый в Колумбии**\n\n- Задержан в Домодедово, ранее заочно осуждён в Колумбии за подготовку боевиков\n- **Привлечение по УК РФ:** как правило, невозможно — деяние не направлено против интересов РФ/её граждан (нет оснований для реального принципа), а универсальный принцип (ч. 3 ст. 12) требует ещё и того, чтобы лицо не было осуждено за это деяние за рубежом — здесь же уже есть приговор колумбийского суда (пусть и заочный), что отражает принцип недопустимости повторной ответственности за одно деяние (ч. 2 ст. 6)\n- **Экстрадиция в Колумбию:** допустима (ч. 2 ст. 13) — правило не требует, чтобы выдача шла именно в страну гражданства, важно лишь, что сам он не гражданин РФ\n- **Условия выдачи:** запрос с документами, двойная преступность деяния, неполитический характер обвинения, отсутствие оснований для отказа по ст. 464 УПК (сроки давности, приговор/прекращённое дело в РФ по тому же делу и т.п.), гарантии неприменения смертной казни и справедливого суда; решение — Генпрокуратура РФ, с судебным контролем\n- **Универсальный принцип:** ответственность по УК РФ иностранца, совершившего преступление за рубежом, независимо от места и гражданства, если это предусмотрено международным договором РФ (терроризм, захват заложников, оборот наркотиков и т.п.) и лицо не было осуждено за это за границей\n\n**Задача 8. Выдача Испании (акт терроризма)**\n\n- Х.-Р. — гражданин Испании, совершил теракт на территории Испании, выдан по решению Генпрокуратуры РФ\n- **Правомерность:** да — запрет на выдачу (ч. 1 ст. 13) касается только граждан РФ, к нему не относится; применяется ч. 2 ст. 13 + Европейская конвенция о выдаче 1957 г. (участники — и Россия, и Испания)\n- **Порядок решения вопроса о выдаче:** Генпрокурор РФ проверяет двойную преступность деяния, отсутствие политического характера, отсутствие гражданства РФ у лица, отсутствие оснований отказа по ст. 464 УПК, при необходимости — гарантии неприменения смертной казни; решение подлежит проверке судом (ст. 463 УПК)\n\n---\n\n## III. Судебная практика\n\n**1) Обращения в КС РФ по статьям УК (2014–2024)** — представительный список (не исчерпывающий, за полным списком — на ksrf.ru):\n\n- Постановление №32-П от 11.12.2014 — ст. 159.4 (мошенничество в предпринимательской сфере)\n- Постановление №6-П от 25.02.2016 — право женщин на суд присяжных (жалоба Лымарь)\n- Постановление №2-П от 10.02.2017 — ст. 212.1 (дело Дадина)\n- Определение от 27.09.2017 — ст. 282 (жалобы Поткина и Корта)\n- Постановление №11-П от 08.04.2021 — ст. 116.1 (дело Саковой)\n- Постановление №8-П/2025 от 19.02.2025 — ч. 1 ст. 226.1 (жалоба Панова)\n\n**2) Три решения, признавшие норму конституционной**\n\n- **№2-П/2017 (ст. 212.1, дело Дадина):** норма сама по себе не противоречит Конституции, но применяться должна соразмерно опасности содеянного; поскольку в деле заявителя это не было соблюдено, приговор предписано пересмотреть\n- **Определение 2017 г. (ст. 282, Поткин и Корт):** жалобы на «неопределённость» формулировок отклонены — оценочные понятия сами по себе не делают норму неконституционной, если она поддаётся толкованию обычными способами и практикой высших судов\n- **№8-П/2025 (ст. 226.1, Панов):** норма о контрабанде признана соответствующей Конституции РФ (за подробностями мотивировки — полный текст на ksrf.ru)\n\n**3) Два решения о несоответствии Конституции**\n\n- **№32-П/2014 (ст. 159.4):** необоснованная привилегия для «предпринимательского» мошенничества — вшестеро более высокий порог крупного размера и мягче наказание, чем по общей ст. 159, без разумного оправдания различия (нарушение принципа равенства)\n- **№11-П/2021 (ст. 116.1, дело Саковой):** норма позволяла привлечь к ответственности за повторные побои только лицо, привлечённое ранее к административной ответственности, но не лицо, уже судимое за насильственное преступление — образовался неоправданный пробел, ставящий более опасных лиц в привилегированное положение\n\n**4) Пять решений о смягчении наказания по ст. 10 УК РФ (отбывающие наказание)**\n\n- Механизм: ч. 2 ст. 10 УК РФ + п. 13 ст. 397 УПК РФ («приведение приговора в соответствие с новым уголовным законом»), рассматривается по ходатайству осуждённого судом по месту отбывания наказания\n- Массовый реальный пример: после признания ст. 159.4 неконституционной (№32-П/2014) суды по всей стране пересматривали приговоры, переквалифицируя деяния на ст. 159 с пересчётом наказания; похожая волна пересмотров прошла после решения по ст. 116.1 (№11-П/2021)\n- Для конкретных дел с номерами — точечный поиск на sudact.ru по запросу «приведение приговора в соответствие» + «ст. 10 УК РФ» + нужная статья\n\n**5) Пять приговоров в отношении иностранных граждан + специфика применения закона**\n\n- Общее правило — территориальный принцип: иностранцы отвечают наравне с гражданами РФ, специальных «льготных» составов для них нет\n- Специфика практики: ограничение свободы не назначается иностранцам без постоянного места жительства в РФ (ч. 6 ст. 53 УК); обязательно обеспечивается право на переводчика (ст. 18 УПК) — нарушение часто становится основанием отмены приговора; после отбытия наказания обычно решается вопрос об административном выдворении / признании пребывания нежелательным (отдельная административная мера); ходатайства об УДО и замене наказания более мягким в отношении иностранцев без регистрации в РФ удовлетворяются реже\n- Для конкретных дел — sudact.ru по запросу «гражданин Республики … осуждён» + статья УК\n\n**6) Пять решений по вопросам выдачи**\n\n- Нормативная база: ст. 13 УК РФ, глава 54 УПК РФ (ст. 460–468), Постановление Пленума ВС РФ №11 от 14.06.2012\n- Типичные категории решений: отказ в выдаче из-за гражданства РФ (в т.ч. приобретённого уже после преступления); отказ при реальном риске пыток или преследования по дискриминационным мотивам в запрашивающем государстве; отказ из-за истечения сроков давности или наличия приговора/прекращённого дела в РФ по тому же обвинению; жалобы на нарушения при избрании экстрадиционного ареста (ст. 466 УПК); подтверждение законности выдачи при наличии дипломатических гарантий (неприменение смертной казни, справедливый суд)\n- Для конкретных дел с номерами — раздел судебной практики на vsrf.ru или запрос «выдача лица» / «экстрадиция» на sudact.ru\n"},{"id":"crim-3","title":"Преступление и состав преступления","short":"Преступление","date":"27 сен","md":"## I. Теория\n\n**1. Понятие и признаки преступления (ст. 14 УК РФ)**\n\nПреступление — виновно совершённое общественно опасное деяние, запрещённое УК РФ под угрозой наказания.\n\nПризнаки преступления:\n\n1. **Деяние** — только акт поведения (действие или бездействие); мысли, намерения, убеждения ненаказуемы\n2. **Общественная опасность** — материальный признак; включает:\n\n- характер (качественная сторона — какому именно объекту причинён вред)\n- степень (количественная сторона — размер вреда, способ совершения, форма вины, обстоятельства)\n\n3. **Противоправность** — формальный (юридический) признак: запрет установлен только УК РФ (принцип «нет преступления без указания на то в законе», ст. 3 УК РФ)\n4. **Виновность** — деяние совершено умышленно или по неосторожности; объективное вменение (ответственность без вины) не допускается (ст. 5 УК РФ)\n5. **Наказуемость** — за деяние предусмотрена угроза применения наказания\n\n**2. Криминализация и декриминализация**\n\n- **Криминализация** — признание деяния преступным путём включения соответствующей нормы в УК РФ\n- **Декриминализация** — обратный процесс: исключение деяния из числа преступлений полностью либо перевод в разряд административных правонарушений\n\nКритерии (основания) криминализации:\n\n1. Достаточная степень общественной опасности деяния\n2. Распространённость деяния\n3. Невозможность эффективного противодействия иными (неуголовно-правовыми) средствами\n4. Соответствие принципам права (законности, справедливости и т.д.)\n5. Учёт международных обязательств РФ\n6. Наличие ресурсов у правоохранительной и судебной системы для применения нормы\n\nПримеры декриминализации: ст. 116 УК РФ (побои без отягчающих обстоятельств) частично переведена в КоАП РФ с одновременным появлением ст. 116.1 УК РФ для лиц, ранее подвергнутых административному наказанию; первый случай неуплаты алиментов декриминализирован в пользу ст. 5.35.1 КоАП РФ; ст. 159.4 УК РФ признана неконституционной (Постановление КС РФ № 32-П от 11.12.2014) и утратила силу.\n\n**3. Классификация преступлений (ст. 15 УК РФ)**\n\nПо характеру и степени общественной опасности выделяются четыре категории:\n\n1. **Преступления небольшой тяжести** — умышленные и неосторожные деяния, максимальное наказание не превышает 3 лет лишения свободы\n2. **Преступления средней тяжести** — умышленные деяния с максимальным наказанием до 5 лет; неосторожные — до 10 лет\n3. **Тяжкие преступления** — умышленные деяния с максимальным наказанием до 10 лет; неосторожные — до 15 лет\n4. **Особо тяжкие преступления** — умышленные деяния, наказание за которые превышает 10 лет лишения свободы либо предусмотрено более строгое наказание\n\nЗначение категоризации:\n\n- влияет на вид рецидива (ст. 18 УК РФ)\n- влияет на возможность условно-досрочного освобождения (ст. 79 УК РФ)\n- влияет на сроки давности (ст. 78, 83 УК РФ)\n- влияет на вид исправительного учреждения (ст. 58 УК РФ)\n- влияет на возможность освобождения от уголовной ответственности (ст. 75, 76 УК РФ)\n- суд вправе изменить категорию преступления на менее тяжкую при наличии смягчающих обстоятельств, но не более чем на одну ступень (ч. 6 ст. 15 УК РФ)\n\n**4. Малозначительность деяния (ч. 2 ст. 14 УК РФ)**\n\nНе является преступлением действие (бездействие), формально содержащее признаки состава, но в силу малозначительности не представляющее общественной опасности.\n\nПризнаки малозначительности:\n\n1. Деяние формально подпадает под все признаки состава, описанного в диспозиции статьи\n2. Фактически причинённый вред (либо угроза вреда) отсутствует или явно незначителен\n3. Как правило, отсутствует умысел лица на причинение более значительного вреда\n\nМалозначительность устанавливается индивидуально в каждом конкретном случае (размер вреда, способ действия, обстановка, личность) и означает **полное отсутствие состава преступления**, а не просто основание для освобождения от ответственности — в этом её принципиальное отличие от декриминализации (которая отменяет норму в целом, а не оценивает конкретный случай).\n\n**5. Понятие и признаки состава преступления**\n\nСостав преступления — совокупность предусмотренных уголовным законом объективных и субъективных признаков, характеризующих общественно опасное деяние как конкретное преступление (юридическая, нормативная модель преступления, в отличие от преступления как реального социального явления).\n\nЭлементы состава преступления:\n\n1. **Объект** — общественные отношения, охраняемые уголовным законом, которым причиняется вред или создаётся угроза его причинения\n2. **Объективная сторона** — внешнее проявление преступления:\n\n- обязательные признаки: деяние, последствия, причинная связь (для материальных составов)\n- факультативные признаки: способ, место, время, обстановка, орудия и средства совершения\n\n3. **Субъект** — физическое, вменяемое лицо, достигшее возраста уголовной ответственности (ст. 19–23 УК РФ)\n4. **Субъективная сторона** — психическое отношение лица к деянию и последствиям:\n\n- обязательный признак: вина (умысел или неосторожность)\n- факультативные признаки: мотив, цель\n\nПризнаки состава делятся на:\n\n- **обязательные** — без них состава нет ни при каких обстоятельствах (например, вина)\n- **факультативные** — предусмотрены не в каждом составе, но если прямо названы в конкретной статье, становятся обязательными именно для неё (например, мотив в п. «з», «и», «л» ч. 2 ст. 105 УК РФ)\n\n**6. Виды составов преступлений**\n\nПо степени общественной опасности:\n\n1. **Основной** состав — без отягчающих и смягчающих обстоятельств (обычно ч. 1 статьи)\n2. **Квалифицированный** состав — с отягчающими признаками, повышающими опасность (ч. 2–4 статьи)\n3. **Привилегированный** состав — со смягчающими признаками (например, ст. 106–108 УК РФ в сравнении со ст. 105)\n\nПо конструкции объективной стороны:\n\n1. **Материальный** состав — преступление окончено с момента наступления указанных в законе последствий (ст. 105, 158 УК РФ)\n2. **Формальный** состав — окончено с момента совершения самого деяния, независимо от последствий (ст. 162, 290 УК РФ)\n3. **Усечённый** состав — момент окончания законодателем перенесён на более раннюю стадию (ст. 209 УК РФ — бандитизм окончен с момента создания банды, ещё до совершения ею каких-либо нападений)\n\nПо структуре (способу описания признаков):\n\n1. **Простой** состав — все признаки характеризуют одно действие, один объект, одну форму вины (ч. 1 ст. 158)\n2. **Сложный (составной)** состав:\n\n- объединяющий два самостоятельных деяния в один состав (ст. 162 разбой = насилие + хищение)\n- с двумя объектами\n- с двумя формами вины (ст. 27)\n- с альтернативными действиями (ст. 222 — приобретение/хранение/передача/сбыт и т.д.)\n\n**7. Понятие уголовной ответственности**\n\nЛегального определения в УК РФ нет. Доктринальный подход: уголовная ответственность — это предусмотренная уголовным законом обязанность лица, совершившего преступление, претерпеть неблагоприятные последствия своего деяния (осуждение от имени государства, назначение наказания или иных мер уголовно-правового характера, судимость), реализуемая в рамках уголовно-правового отношения между государством и лицом, совершившим преступление. Понятие шире наказания: ответственность может реализовываться и без назначения наказания, и включает саму судимость как правовое последствие.\n\n**8. Основание уголовной ответственности (ст. 8 УК РФ)**\n\nОснованием уголовной ответственности является совершение деяния, содержащего все признаки состава преступления, предусмотренного УК РФ. Это единственное и достаточное основание, отражающее единство двух подходов:\n\n1. **Философского** — деяние как проявление свободы воли, за которое лицо несёт ответственность\n2. **Юридического** — формальное наличие в деянии всех признаков конкретного состава (объекта, объективной стороны, субъекта, субъективной стороны)\n\nПока не установлены все признаки состава — нет основания для уголовной ответственности, даже если деяние объективно причинило вред (например, при невиновном причинении вреда, ст. 28 УК РФ, либо при действиях невменяемого лица).\n\n**9. Реализация уголовной ответственности**\n\nФормы реализации уголовной ответственности:\n\n1. **Назначение наказания** с реальным отбыванием — основная форма (обвинительный приговор)\n2. **Назначение наказания без реального отбывания** — условное осуждение (ст. 73), отсрочка (ст. 82)\n3. **Освобождение от наказания** при сохранении судимости — например, УДО, освобождение в связи с болезнью, амнистией (ст. 79–83)\n4. **Иные меры уголовно-правового характера без назначения наказания** — принудительные меры медицинского характера к невменяемым (гл. 15), судебный штраф (ст. 76.2), конфискация имущества (гл. 15.1)\n5. **Освобождение от уголовной ответственности** — деятельное раскаяние, примирение с потерпевшим, истечение сроков давности (ст. 75–78); в этом случае ответственность вообще не реализуется — нет ни осуждения, ни судимости\n\n---\n\n## II. Задачи (подробный разбор)\n\n**Задача 1. Б. в гипермаркете «Окей» — похитила товар на 2 342 руб.**\n\nКлюч к решению — соотношение ст. 158 и ст. 158.1 УК РФ с административной ст. 7.27 КоАП РФ. Законодатель установил чёткий стоимостный порог: хищение чужого имущества стоимостью не более **2 500 рублей** само по себе является лишь административным правонарушением — мелким хищением (ст. 7.27 КоАП РФ содержит внутри себя ещё и деление: ч. 1 — стоимость до 1 000 руб., ч. 2 — от 1 000 до 2 500 руб.; но для вопроса «преступление или нет» значение имеет именно общая граница в 2 500 руб., а не это внутреннее деление, которое влияет лишь на строгость административного наказания). Уголовная ответственность за хищение стоимостью до 2 500 руб. наступает лишь в одном случае — если лицо ранее, в течение года, уже подвергалось административному наказанию по ст. 7.27 КоАП РФ за такое же деяние: тогда повторное мелкое хищение образует состав **ст. 158.1 УК РФ**. Если же сумма хищения превышает 2 500 рублей, деяние в любом случае квалифицируется как кража по ст. 158 УК РФ, независимо от того, привлекалось ли лицо ранее к ответственности.\n\nВ условии задачи Б. взяла товары на общую сумму 2 342 руб. — это меньше порога в 2 500 руб. Никаких сведений о том, что Б. ранее уже привлекалась к административной ответственности за мелкое хищение, в условии нет. Фактические обстоятельства (изъятие товара, пересечение линии касс без оплаты, попытка скрыться, задержание с товаром после противокражных ворот) полностью подтверждают, что хищение было доведено до конца — то есть оно совершено, а не только начато.\n\n**Вывод:** при отсутствии данных о прежней административной ответственности за аналогичное деяние поведение Б. **не является преступлением** — это административное правонарушение по ст. 7.27 КоАП РФ. Если бы у следствия имелись сведения о том, что Б. в течение предшествующего года уже привлекалась к административной ответственности за мелкое хищение, содеянное образовывало бы состав ст. 158.1 УК РФ, несмотря на небольшую сумму.\n\n**Задача 2. Ц. и мобильный телефон А.**\n\nЦ. под предлогом необходимости позвонить попросил у А. телефон — это классический обман как способ хищения (введение потерпевшего в заблуждение относительно истинной цели получения вещи: якобы кратковременное пользование, а на самом деле — намерение обратить вещь в свою собственность). Получив телефон, Ц. попытался скрыться с ним, делая вид, что продолжает разговаривать — то есть уже приступил к реализации своего преступного намерения, но был остановлен потерпевшим А. до того, как реально обратил телефон в свою пользу и получил возможность распорядиться им как своим собственным.\n\nПоскольку преступление не было доведено до конца по обстоятельствам, не зависящим от воли виновного (телефон отобрал сам потерпевший, а не Ц. добровольно отказался от своего замысла), это исключает применение правил о добровольном отказе (ст. 31 УК РФ) и требует квалификации как неоконченное преступление.\n\n**Вывод:** содеянное Ц. образует **покушение на мошенничество** — ст. 30 ч. 3 + ст. 159 УК РФ (хищение чужого имущества путём обмана, не доведённое до конца по независящим от лица обстоятельствам). Поведение Ц. **является преступным**.\n\n**Задача 3. Патрон, найденный в ящике с медалями после смерти дедушки**\n\nФормально хранение боеприпасов без соответствующего разрешения образует объективную сторону состава ч. 1 ст. 222 УК РФ («Незаконные приобретение, передача, сбыт, хранение, перевозка или ношение оружия, его основных частей, боеприпасов»), поскольку патрон калибра 5,6 мм относится к боеприпасам.\n\nОднако формальное наличие признаков состава не означает автоматически наличие преступления — необходимо оценить деяние через призму ч. 2 ст. 14 УК РФ (малозначительность). Значимые для этой оценки обстоятельства: П. не приобретал патрон целенаправленно — он случайно обнаружил его среди личных вещей умершего родственника (медалей); хранил его «без определённой цели», то есть без намерения использовать по назначению, продать, передать кому-либо; речь идёт о единичном патроне малого калибра (типично спортивно-охотничьего назначения), а не о партии боеприпасов или боеприпасах к боевому оружию. Судебная практика достаточно устойчиво признаёт малозначительными именно такие ситуации — случайное обнаружение и хранение одного-двух патронов без какого-либо умысла на их применение или сбыт.\n\n**Вывод:** формально признаки ч. 1 ст. 222 УК РФ в действиях П. присутствуют, но с учётом малозначительности деяния (случайность обнаружения, единичность предмета, отсутствие цели использования) содеянное, вероятнее всего, **не образует преступления** в силу ч. 2 ст. 14 УК РФ. Окончательная оценка малозначительности — вопрос факта, разрешаемый следствием и судом с учётом всех обстоятельств дела.\n\n**Задача 4. Порох, хранившийся более 10 лет, переданный знакомому (~185 г)**\n\nПорох — взрывчатое вещество для целей **ст. 222.1 УК РФ** (незаконные приобретение, передача, сбыт, хранение, перевозка или ношение взрывчатых веществ или взрывных устройств) — в отличие от ст. 222, которая охватывает оружие и боеприпасы, порох как самостоятельная категория регулируется именно этой статьёй.\n\nИзначально Б. приобрёл порох законно (для самостоятельного снаряжения патронов при действующем разрешении на оружие). Однако после прекращения действия разрешения дальнейшее хранение пороха стало незаконным — законность первоначального приобретения не спасает от ответственности за последующее незаконное хранение, если основания для правомерного владения отпали. Кроме того, Б. совершил ещё одно самостоятельное действие, прямо названное в диспозиции ст. 222.1, — **передачу** взрывчатого вещества другому лицу, причём сделал это без надлежащей проверки его правомочий (полагаясь исключительно на слова знакомого о наличии охотничьего билета).\n\nПо сравнению с Задачей 3 здесь гораздо меньше оснований для признания деяния малозначительным: срок незаконного хранения весьма значителен (более 10 лет); количество вещества (около 185 г) уже не единично-символическое, а способно представлять реальную опасность при неправильном обращении; передача пороха постороннему лицу без проверки его прав — самостоятельный акт безответственного поведения, создающий риск попадания взрывчатого вещества к лицу, не имеющему законных оснований для его использования.\n\n**Вывод:** действия Б. образуют состав ч. 1 ст. 222.1 УК РФ (в части и незаконного хранения, и незаконной передачи взрывчатого вещества) и, в отличие от Задачи 3, малозначительными признаны быть, скорее всего, не могут.\n\n**Задача 5. П. предложил несовершеннолетнему совершить разбой и убийство (ч. 4 ст. 150 УК РФ)**\n\nКлючевой момент — состав ст. 150 УК РФ является **формальным**: согласно п. 42 Постановления Пленума ВС РФ от 01.02.2011 № 1 «О судебной практике применения законодательства, регламентирующего особенности уголовной ответственности и наказания несовершеннолетних», под вовлечением несовершеннолетнего в совершение преступления понимаются **действия взрослого лица, направленные на возбуждение желания совершить преступление**. Преступление считается оконченным с момента совершения таких действий, **независимо от того**, совершил ли несовершеннолетний впоследствии соответствующее преступление. Именно поэтому отсутствие иных установленных действий, направленных непосредственно на совершение самого разбоя или убийства (то есть того факта, что несовершеннолетний ничего не успел исполнить), не исключает ответственности П. — самого предложения (склонения) уже достаточно для оконченного преступления.\n\nПоскольку П. склонял несовершеннолетнего к совершению особо тяжкого преступления (убийство) в связи с разбоем, содеянное правильно отнесено к ч. 4 ст. 150 УК РФ, которая охватывает вовлечение несовершеннолетнего именно в совершение тяжкого или особо тяжкого преступления (либо в преступную группу, либо по мотивам ненависти/вражды).\n\n**Вывод:** решение суда **обоснованно** — для оконченного состава ст. 150 УК РФ достаточно самого факта вовлечения (предложения), совершение вовлечённым лицом преступления не требуется, поэтому отсутствие иных установленных действий на квалификацию не влияет.\n\n**Задача 6. Е. и незаконное предпринимательство (доход 2 522 168 руб.)**\n\nСостав ст. 171 УК РФ требует либо причинения крупного ущерба, либо извлечения дохода в крупном размере (в задаче данных о причинённом кому-либо ущербе нет, поэтому вопрос решается исключительно через размер дохода). Важный нюанс: порог «крупного размера» для гл. 22 УК РФ (примечание к ст. 170.2 УК РФ, на которое ссылается и ст. 171) неоднократно менялся — до 06.04.2024 составлял 2 250 000 руб., а Федеральным законом от 06.04.2024 № 79-ФЗ повышен до **3 500 000 руб.**\n\nДоход Е. (2 522 168 руб.) превышает старый порог, но **не достигает нового**. Поэтому ответ прямо зависит от того, по какой редакции закона оценивается деяние: если оно совершено и должно оцениваться по редакции, действовавшей до 06.04.2024, доход образует крупный размер, и содеянное образует состав ч. 1 ст. 171 УК РФ; если применяется действующая (после 06.04.2024) редакция, порог не достигнут, и при отсутствии крупного ущерба гражданам, организациям или государству деяние состава преступления не образует — с учётом того, что закон, повышающий порог, улучшает положение лица и в силу ст. 10 УК РФ имеет обратную силу (если приговор ещё не вступил в законную силу либо возможен его пересмотр).\n\n**Вывод:** без уточнения точной даты вынесения приговора однозначного ответа дать нельзя — задача построена именно на пересечении двух тем: криминообразующего признака ст. 171 (крупный размер дохода) и правил действия уголовного закона во времени (ст. 10 УК РФ).\n\n**Задача 7. Г. упала на З. на лестнице (неосторожное причинение лёгкого вреда)**\n\nГлава 16 УК РФ содержит специальный состав неосторожного причинения вреда здоровью только для **тяжкого** вреда (ст. 118 УК РФ). Норм, устанавливающих ответственность за неосторожное причинение лёгкого (или среднего) вреда здоровью, в УК РФ не существует вообще — ст. 115 УК РФ (умышленное причинение лёгкого вреда) требует именно умысла, а неосторожная форма для этого уровня тяжести законодателем не криминализирована.\n\nПо фактическим обстоятельствам именно З. была инициатором конфликта (стала стаскивать Г. с лестницы, дёргать за одежду из личной неприязни), а Г., пытаясь удержаться и за что-то зацепиться, случайно упала на З., причинив ей лёгкий вред. Это классическая ситуация отсутствия состава преступления именно из-за отсутствия соответствующей нормы в законе, а не из-за отсутствия причинной связи (причинная связь как раз есть).\n\n**Вывод:** неосторожное причинение лёгкого вреда здоровью **не является преступлением** ни при каких обстоятельствах, поскольку соответствующего состава в УК РФ не предусмотрено. Действия Г. состава преступления не образуют.\n\n**Задача 8. Р. разбил витрину холодильника в кафе (31 600 руб.)**\n\nУмышленное повреждение чужого имущества, повлёкшее значительный ущерб, образует состав ст. 167 УК РФ. Значительность ущерба для этой статьи определяется так же, как при хищениях (по аналогии с примечанием 2 к ст. 158 УК РФ) — минимальный порог составляет 5 000 руб., а конкретный размер оценивается судом с учётом имущественного положения потерпевшего. 31 600 руб. плюс испорченные кондитерские изделия — вполне достаточно для признания ущерба значительным.\n\nОтдельный вопрос — мотив содеянного. Если поведение Р. в целом (нецензурная брань, игнорирование замечаний, конфликт с посетителем, а затем демонстративное повреждение имущества именно в ответ на выдворение администратором) расценивается как проявление явного неуважения к обществу, содеянное может быть квалифицировано по п. «б» ч. 2 ст. 167 УК РФ (из хулиганских побуждений); если же это скорее личная месть конкретно администратору за выдворение, а не демонстрация пренебрежения к окружающим в целом, то квалификация ограничивается ч. 1 ст. 167 УК РФ.\n\n**Вывод:** поведение Р. **является преступным** — как минимум по ч. 1, а с учётом общего хулиганского контекста происходящего (систематическое неуважение к правилам поведения в общественном месте, предшествовавшее самому повреждению имущества) — вероятнее по ч. 2 ст. 167 УК РФ.\n\n**Задача 9. В. ест бананы в супермаркете (алкогольное опьянение)**\n\nФормально поедание товара без оплаты образует признаки хищения — кража путём потребления является распространённым на практике способом совершения хищения в магазинах самообслуживания. Однако стоимость съеденного (около 15 бананов) явно ничтожна и, скорее всего, укладывается в порог мелкого хищения (до 2 500 руб., ст. 7.27 КоАП РФ) — по аналогии с логикой Задачи 1.\n\n**Вывод:** признаков общественной опасности, требуемых именно для уголовной ответственности, в действиях В. **не усматривается** — деяние либо малозначительно (ч. 2 ст. 14 УК РФ), либо, при отсутствии данных о прежних административных наказаниях за мелкое хищение, образует лишь административное правонарушение (ст. 7.27 КоАП РФ), но не преступление. Состояние алкогольного опьянения само по себе от ответственности не освобождает (ст. 23 УК РФ), но здесь оно приведено скорее как объяснение бессвязности его поведения, а не как отдельное обстоятельство, влияющее на квалификацию.\n\n**Задача 10. С. и лов рыбы запрещёнными сетями (без улова)**\n\nСостав п. «б» ч. 1 ст. 256 УК РФ (незаконная добыча с применением самоходного плавающего средства, взрывчатых или химических веществ, электротока либо других запрещённых орудий и способов массового истребления водных биоресурсов) сформулирован как **формальный**: преступление окончено с момента применения запрещённого способа лова независимо от того, был ли фактически произведён улов. То, что С. не поймал рыбы, само по себе ответственности не исключает — в отличие от п. «а» той же статьи (с причинением крупного ущерба), где нужен реальный ущерб (определяемый по установленным Правительством РФ таксам, свыше 100 000 руб.).\n\nОднако, как прямо указано в п. 6 Постановления Пленума ВС РФ от 23.11.2010 № 26 (процитированном в самой задаче), формальной классификации орудия лова недостаточно — суд обязан установить, могло ли применение данного орудия с учётом конкретных обстоятельств повлечь массовое истребление водных биоресурсов, а не просто ограничиться констатацией того, что сеть относится к запрещённым орудиям лова.\n\n**Вывод:** однозначного ответа «да» или «нет» без дополнительных фактических данных дать нельзя — это прямо вопрос факта. Если суд установит (с учётом видов рыбы, времени года, статуса акватории и т.п.), что три ставные сети общей длиной 12 м реально способны повлечь массовое истребление рыбных запасов в данной акватории, содеянное образует оконченный состав п. «б» ч. 1 ст. 256 УК РФ, и признак общественной опасности присутствует. Если же с учётом конкретных обстоятельств такая способность не подтвердится, а крупный ущерб (п. «а») тоже отсутствует (рыба не поймана), уголовная ответственность исключается, и деяние может повлечь лишь административную ответственность за нарушение правил рыболовства (ст. 8.37 КоАП РФ).\n"},{"id":"crim-4","title":"Виды объектов преступления","short":"Объекты","date":"29 сен","md":"Классификация проводится по двум разным основаниям, которые часто путают: **«по вертикали»** (степень обобщения — от общего к частному) и **«по горизонтали»** (роль объекта внутри одного конкретного преступления).\n\n### Классификация «по вертикали» (по степени обобщения)\n\nСтроится по принципу «от общего к частному» — каждый нижестоящий уровень является частью вышестоящего:\n\n1. **Общий (интегрированный) объект** — вся совокупность общественных отношений, охраняемых уголовным законом в целом. Закреплён в ст. 2 УК РФ: права и свободы человека и гражданина, собственность, общественный порядок и общественная безопасность, окружающая среда, конституционный строй РФ, мир и безопасность человечества. Единый для абсолютно всех преступлений — не даёт различить одно преступление от другого, но задаёт общие границы уголовно-правовой охраны.\n    \n2. **Родовой объект** — группа однородных, взаимосвязанных общественных отношений, охраняемых нормами одного **раздела** Особенной части УК РФ. Именно по родовому объекту выделены разделы:\n    \n\n- раздел VII — личность\n- раздел VIII — экономика\n- раздел IX — общественная безопасность и общественный порядок\n- раздел X — государственная власть\n- раздел XI — военная служба\n- раздел XII — мир и безопасность человечества\n\n3. **Видовой объект** — более узкая группа отношений внутри родового объекта, охраняемых нормами одной **главы**. Например, внутри раздела VII (личность):\n\n- глава 16 — жизнь и здоровье\n- глава 17 — свобода, честь и достоинство личности\n- глава 18 — половая неприкосновенность и половая свобода личности\n- глава 19 — конституционные права и свободы человека и гражданина\n- глава 20 — семья и несовершеннолетние\n- глава 21 (в разделе VIII) — собственность\n\n4. **Непосредственный объект** — конкретное общественное отношение, которому причинён вред данным конкретным преступлением (например, жизнь конкретного человека при убийстве, отношения собственности конкретного потерпевшего при краже). Это тот уровень, который реально фигурирует при квалификации отдельного преступного деяния.\n\nПрактическое значение этой иерархии: родовой и видовой объекты — критерий построения системы Особенной части (законодатель группирует нормы именно по ним), а непосредственный объект — рабочий инструмент квалификации конкретного дела.\n\n### Классификация «по горизонтали» (применительно к непосредственному объекту)\n\nПрименяется тогда, когда одно преступление одновременно посягает на несколько разных отношений (так называемые **двухобъектные** и **многообъектные** составы):\n\n1. **Основной непосредственный объект** — то отношение, ради охраны которого создана данная норма; именно оно определяет, в какую главу/раздел помещена статья. Вред основному объекту причиняется всегда, при любом совершении данного преступления.\n    \n2. **Дополнительный непосредственный объект** — отношение, которое **обязательно** нарушается вместе с основным при совершении данного преступления, хотя само по себе не определяет родовую принадлежность нормы. Например:\n    \n\n- разбой (ст. 162 УК РФ, расположена в главе о преступлениях против собственности) — основной объект: отношения собственности; дополнительный: здоровье личности (насилие, опасное для жизни/здоровья, — обязательный элемент состава);\n- изнасилование, повлёкшее тяжкий вред здоровью (ч. 3 ст. 131) — основной объект: половая неприкосновенность; дополнительный: здоровье.\n\n3. **Факультативный непосредственный объект** — отношение, которое **может** пострадать при совершении преступления, но не обязательно для наличия состава. Например, при хулиганстве (ст. 213) здоровье личности может пострадать, а может и не пострадать — в любом случае состав хулиганства (по признаку грубого нарушения общественного порядка) уже есть.\n\nРазница между дополнительным и факультативным объектом принципиальна: без вреда дополнительному объекту квалифицированного состава просто не будет (придётся квалифицировать по другой, более мягкой статье), а без вреда факультативному объекту состав остаётся тем же самым — просто это обстоятельство не учитывается либо учитывается при назначении наказания.\n\n### Итоговая схема (для быстрого запоминания)\n\n|Основание деления|Уровни|\n|---|---|\n|По вертикали (обобщение)|общий → родовой → видовой → непосредственный|\n|По горизонтали (роль в составе)|основной → дополнительный → факультативный|\n\nВажно не путать эти две классификации между собой: «родовой» и «основной» — это ответы на разные вопросы («насколько это отношение общее» и «является ли оно главным для данной статьи среди нескольких пострадавших отношений» соответственно).\n"},{"id":"crim-5","title":"Семинар 5. Объективная сторона преступления","short":"Объективная сторона","date":"12 окт","md":"## Теоретическая часть (вопросы для подготовки к семинару)\n\n**1. Понятие, содержание и юридическое значение объективной стороны преступления**\n\nОбъективная сторона преступления — это внешнее выражение общественно опасного деяния, протекающее в определённых условиях места, времени и обстановки и причиняющее вред охраняемым уголовным законом общественным отношениям (объекту). Это один из четырёх элементов состава преступления наряду с объектом, субъектом и субъективной стороной.\n\nСодержание объективной стороны образуют:\n\n1. Общественно опасное деяние (действие или бездействие)\n2. Общественно опасные последствия (для материальных составов)\n3. Причинная связь между деянием и последствием (для материальных составов)\n4. Факультативные признаки: способ, орудия и средства, время, место, обстановка совершения преступления\n\nЮридическое значение объективной стороны:\n\n1. Является основанием уголовной ответственности — именно внешне выраженное деяние, а не мысли или намерения, порождает уголовно-правовые последствия\n2. Служит критерием отграничения преступлений друг от друга и от иных правонарушений\n3. Позволяет установить момент окончания преступления\n4. Факультативные признаки, не входящие в основной состав, учитываются как квалифицирующие обстоятельства либо при индивидуализации наказания (ст. 61, 63 УК РФ)\n5. Через признаки объективной стороны устанавливается форма вины\n\n**2. Объективная сторона в тексте уголовного закона. Обязательные и факультативные признаки**\n\nПризнаки объективной стороны делятся на две группы:\n\n1. **Обязательные** — присутствуют в любом составе преступления. К ним всегда относится деяние; в материальных составах к обязательным добавляются также последствие и причинная связь\n2. **Факультативные** — способ, орудия и средства, время, место, обстановка совершения преступления. Становятся обязательными именно для конкретного состава, если законодатель прямо включил их в диспозицию нормы\n\n**3. Общественно опасное деяние. Понятие уголовно-правового действия и его признаки**\n\nДеяние — обобщающее понятие, охватывающее действие и бездействие как единственно возможные внешние формы выражения преступного поведения.\n\n**Действие** — активное, осознанное и волевое поведение лица, выражающееся в телодвижении (одном или системе телодвижений), повлекшее или способное повлечь вредные изменения в объекте охраны.\n\nПризнаки действия:\n\n1. Общественная опасность — реальная способность причинить вред\n2. Противоправность — предусмотренность деяния в УК РФ\n3. Осознанность — лицо понимает фактическое содержание и значимость совершаемого; действия в бессознательном состоянии (рефлекс, сон, обморок) не являются уголовно-правовым действием\n4. Волимость — деяние выражает волю лица; исключается при непреодолимой силе и физическом принуждении, лишающем возможности руководить своими действиями\n5. Может состоять из одного акта либо системы телодвижений, объединённых единым умыслом\n\n**4. Понятие уголовно-правового бездействия и его признаки. Условия ответственности**\n\n**Бездействие** — общественно опасное, осознанное и волевое пассивное поведение лица, заключающееся в невыполнении действия, которое оно было обязано и могло совершить.\n\nУсловия уголовной ответственности за бездействие:\n\n1. **Обязанность действовать определённым образом**, вытекающая из:\n    - прямого указания закона или иного нормативного акта\n    - профессиональных или служебных обязанностей\n    - добровольно принятых обязательств (договор, обещание)\n    - предшествующего поведения лица, создавшего опасность\n2. **Реальная возможность выполнить требуемое действие** в конкретной ситуации\n\n**5. Понятие непреодолимой силы, физического и психического принуждения и их значение**\n\n1. **Непреодолимая сила** — объективное обстоятельство, лишающее лицо возможности действовать по своей воле; исключает деяние как таковое, уголовная ответственность исключается полностью\n2. **Физическое принуждение** (ч. 1 ст. 40 УК РФ), полностью лишающее возможности руководить своими действиями — исключает уголовную ответственность (отсутствует волевой признак деяния)\n3. **Психическое принуждение**, а равно физическое принуждение с сохранением возможности руководить действиями (ч. 2 ст. 40 УК РФ) — не исключает деяние, вопрос решается по правилам крайней необходимости (ст. 39 УК РФ)\n\n**6. Общественно опасные последствия, их значение. Виды последствий**\n\nЗначение последствий:\n\n1. Обязательный признак объективной стороны в материальных составах\n2. Критерий разграничения преступления и иного правонарушения\n3. Влияют на квалификацию и индивидуализацию наказания\n4. Определяют момент окончания преступления\n\nВиды последствий:\n\n1. **Материальные**: имущественные (реальный ущерб, упущенная выгода); физические (вред жизни и здоровью)\n2. **Нематериальные**: моральный вред; организационный, экологический и т. п.\n\n**7. Формальные и материальные составы, составы реальной опасности и усечённые составы**\n\n1. **Материальный состав** — окончен с момента наступления последствия (ст. 105, 111, 158 УК РФ)\n2. **Формальный состав** — окончен с момента совершения самого деяния, независимо от последствий (ст. 129, 131, 290 УК РФ)\n3. **Состав реальной опасности** — окончен с момента возникновения реальной угрозы последствий (ст. 215, 217, 247 УК РФ)\n4. **Усечённый состав** — момент окончания перенесён законодателем на более раннюю стадию (ст. 162 — разбой окончен с момента нападения; ст. 209 — бандитизм окончен с момента создания банды)\n\n**8. Причинная связь в уголовном праве: понятие и значение. Объективный характер**\n\n**Причинная связь** — объективно существующая связь между деянием и наступившим последствием, при которой деяние является необходимым условием, закономерно порождающим данное последствие.\n\nНосит объективный характер — существует независимо от того, предвидело ли лицо последствие. Значение: обязательный признак объективной стороны материальных составов; без её установления невозможно объективное вменение последствия (иначе ответственность превращается в ответственность за случай, что противоречит принципу вины, ст. 5 УК РФ).\n\n**9. Критерии установления причинной связи и вменения последствий**\n\n1. Деяние по времени предшествует последствию\n2. Деяние — необходимое условие наступления последствия (conditio sine qua non)\n3. Деяние закономерно, а не случайно порождает последствие\n4. Отсутствие причинной связи либо её прерывание самостоятельными факторами (действия третьих лиц, самого потерпевшего, случайность) исключает вменение\n\n**10. Теории причинной связи в отечественном и зарубежном уголовном праве**\n\n1. **Теория эквивалентности** (conditio sine qua non) — причина любое условие, без которого последствие не наступило бы\n2. **Теория адекватной причинности** — причина только типичное, закономерное условие\n3. **Теория необходимого причинения** (доминирует в РФ — Трайнин, Кудрявцев) — причинная связь есть, если деяние — необходимая, закономерная причина; случайное совпадение связи не образует\n4. **Теория риска** — последствие вменяется, если деяние создало/увеличило запрещённый риск, который реализовался\n\n**11. Способ, орудия, средства, время, место и обстановка как факультативные признаки**\n\nСодержание:\n\n1. **Способ** — приёмы и методы совершения деяния\n2. **Орудия и средства** — предметы, использованные для совершения преступления (орудия — непосредственное воздействие; средства — облегчающие совершение)\n3. **Время** — определённый временной период\n4. **Место** — территория совершения деяния\n5. **Обстановка** — совокупность условий, в которых протекает деяние\n\nЗначение:\n\n1. Обязательны для конкретного состава, если включены в диспозицию (способ «путём обмана» — ст. 159)\n2. Квалифицирующий признак — влияет на часть статьи (например, «с применением оружия» — ч. 2 ст. 162)\n3. Если не входят в состав — учитываются при назначении наказания (ст. 61, 63)\n\n---\n\n## Ситуационные задачи\n\n**Задача 1.** Передача имущества Т. под влиянием сообщения о «порче» формально образует внешние признаки растраты/мошенничества, однако уголовная ответственность исключена, поскольку по условиям задачи Т. действовала в состоянии, при котором не помнит своих действий, — то есть деяние лишено обязательного признака осознанности и волимости. Если экспертизой установлено, что Т. находилась в состоянии, исключающем способность понимать значение своих действий (воздействие психотропных веществ, гипноз и т. п.), передача денег не является уголовно-правовым действием Т. в смысле ст. 160 УК РФ — она не распоряжалась имуществом по собственной осознанной воле, а, по сути, выступала орудием в руках И. В действиях самой И., сообщившей ложные сведения о «порче» для получения чужого имущества, содержатся признаки объективной стороны мошенничества (ст. 159 УК РФ) — обман как способ завладения чужим имуществом.\n\nВывод: Т. ответственности за растрату не подлежит, поскольку её поведение не образует уголовно-правового деяния; при наличии умысла на обман ответственность за мошенничество несёт И.\n\n**Задача 2.** Действие Г. формально причинило вред здоровью, однако не обладает признаками общественно опасного уголовно-правового деяния, поскольку является рефлекторной, непроизвольной реакцией на внезапную резкую боль. Рефлекторное телодвижение не контролируется сознанием и волей в момент совершения — отсутствует осознанность и волимость, обязательные признаки действия. Кроме того, здесь отсутствует и вина — это случай (казус), невиновное причинение вреда (ст. 28 УК РФ): лицо не предвидело и по обстоятельствам дела не могло предвидеть наступление вредных последствий.\n\nВывод: действие Г. не обладает признаками общественно опасного деяния — реакция рефлекторна и неосознанна, уголовная ответственность исключается.\n\n**Задача 3.** В действиях бывшей супруги С. отсутствует объективная сторона какого-либо преступления против жизни. Уголовное право строится на материалистическом понимании причинности: причинная связь должна быть объективной, закономерной, устанавливаемой на основе объективных законов природы и общества, а не на предполагаемых сверхъестественных механизмах. Смерть С. наступила в результате ДТП — события с физической, технической причинностью; вера бывшей жены в эффективность «порчи» и даже её собственное убеждение, что «сработало», не создают объективной причинной связи между её действиями и аварией.\n\nВывод: в поведении бывшей супруги отсутствуют признаки объективной стороны какого-либо преступления ввиду отсутствия объективной причинной связи между её действиями и смертью С.\n\n**Задача 4.** В действиях Б. содержатся признаки объективной стороны умышленного причинения вреда здоровью средней тяжести (ст. 112 УК РФ). Довод Б. о том, что он «пальцем П. не тронул», не исключает уголовно-правового значения его действия: деяние может состоять не только в прямом контакте, но и в использовании механизмов, через которые реализуется причиняющее воздействие. Включение центрифуги, в которой находился потерпевший, — это и есть то телодвижение, которым Б. привёл в действие причиняющий вред механизм, совершённое умышленно, на почве личной неприязни. Между включением центрифуги и вредом здоровью имеется прямая причинная связь.\n\nВывод: в поведении Б. присутствуют признаки преступного деяния; его действие выразилось во включении центрифуги — опосредованном, но непосредственно причиняющем вред акте поведения, достаточном для объективной стороны ст. 112 УК РФ.\n\n**Задача 5.** С. совершила убийство новорождённого (ст. 106 либо ст. 105 УК РФ). Деяние выразилось в форме **действия**, а не бездействия: вынесение раздетого ребёнка на мороз ночью — активное, осознанное и волевое телодвижение, непосредственно создающее смертельно опасные условия для новорождённого. Хотя непосредственной причиной смерти стало переохлаждение, юридически значимым деянием признаётся именно активное создание смертельно опасной обстановки.\n\nВывод: С. совершила убийство; её деяние выразилось в форме действия — создания смертельно опасных условий, а не простого бездействия.\n\n**Задача 6.** В поведении А. отсутствуют признаки преступного бездействия. Общим правилом является отсутствие общей обязанности спасать посторонних лиц под угрозой уголовной ответственности — ответственность возможна только при специальной обязанности, вытекающей из закона, профессии, договора либо из создания опасности самим лицом. А. не состоял с ребёнком в правоотношениях, порождающих такую обязанность. Ст. 125 УК РФ также неприменима — А. не создавал опасность и не был обязан иметь заботу о ребёнке. Звонок в службу спасения юридического значения не имеет — это не исполнение обязанности (которой не было), а проявление добросовестности.\n\nВывод: А. ответственности за бездействие не подлежит; оценка не изменилась бы, даже если бы он не позвонил в службу спасения — отсутствие обязанности делает любой вариант поведения уголовно-правовым безразличным.\n\n**Задача 7.** П. как медицинский работник в силу ст. 11, 32 ФЗ № 323-ФЗ обязана оказывать экстренную помощь при угрозе жизни независимо от дежурства. Она частично действовала (осмотр, рекомендация вызвать «03»), но отказалась от простейших реанимационных мер без достаточно веских причин (усталость, общее опасение заражения). Квалификация позволяла ей реально помочь, а отказ стоит в причинной связи со смертью А.\n\nВывод: в поведении П. присутствуют признаки преступного бездействия по ст. 124 УК РФ (неоказание помощи больному без уважительных причин, повлёкшее по неосторожности смерть).\n\n**Задача 8.** Деяние С. — сочетание действия (вынос раздетого новорождённого на мороз) и бездействия (неисполнение обязанности вернуть ребёнка, обусловленное собственным опьянением до беспамятства). Обязанность заботы вытекает из материнства; реальная возможность отсутствовала лишь вследствие добровольно принятого ею опьянения, что свидетельствует о преступной небрежности, а не исключает вину. Умысла на лишение жизни материал задачи не содержит.\n\nВывод: в деянии С. содержатся признаки преступного бездействия; содеянное квалифицируется как причинение смерти по неосторожности (ст. 109 УК РФ).\n\n**Задача 9.** Должность П. как сотрудника полиции имеет уголовно-правовое значение независимо от нерабочего времени (ст. 27 ФЗ «О полиции» — обязанность прийти на помощь и пресечь преступление независимо от дежурства). Довод жены о «другой службе» юридически несостоятелен. П. был обязан пресечь нападение и имел реальную возможность. Конкретной нормы, карающей именно неисполнение такой обязанности как самостоятельное деяние, в Особенной части нет; теоретически оценка возможна по ст. 293 УК РФ при доказанности существенного вреда и причинной связи.\n\nВывод: должность и нерабочее время имеют уголовно-правовое значение — обязанность действовать сохраняется; признаки бездействия формально есть, но квалификация требует дополнительного установления причинной связи и существенности вреда.\n\n**Задача 10.** Деяние С. и Н. выразилось в форме действия — привязывание раздетого Т. к дереву на ночь в лесу. Причинная связь со смертью от переохлаждения имеется — это закономерный результат созданной ими опасности. Поскольку умысел был направлен лишь на «проучивание» комарами, а заморозки были аномальными и непредвидимыми, содеянное образует неосторожную форму вины (преступная небрежность). Если бы те же действия были совершены в январе, когда заморозки предвидимы, оценка сместилась бы в сторону косвенного умысла на убийство.\n\nВывод: деяния выразились в действии, причинная связь имеется; квалификация — причинение смерти по неосторожности (ст. 109 УК РФ); в январе — возможен косвенный умысел на убийство.\n\n**Задача 11.** Формально А. нарушил ПДД, превысив скорость. Однако необходима причинная связь именно между этим нарушением и вредом, а не между управлением автомобилем как таковым и вредом. Внезапность суицидальных действий юноши — обстоятельство, которое водитель не мог предвидеть. Если экспертиза установит, что даже при разрешённой скорости избежать наезда было невозможно, причинная связь между превышением скорости и вредом отсутствует.\n\nВывод: признаки ст. 264 УК РФ будут отсутствовать, если столкновение было неизбежным и при разрешённой скорости — действительной причиной являются самостоятельные действия потерпевшего.\n\n**Задача 12.** Приговор не обоснован. Превышение скорости Ф. на 4,5 км/ч само по себе не могло быть закономерной причиной — такое минимальное увеличение тормозного пути не создаёт качественно иной опасности. Причину создал водитель К., выехавший на главную дорогу без уступления пути, — это необходимое и закономерное условие столкновения.\n\nВывод: приговор в отношении Ф. не обоснован — причинная связь между его превышением скорости и последствиями не установлена; действительная причина ДТП — нарушение К.\n\n**Задача 13.** Между действиями А. и смертью Б. отсутствует причинная связь. Смерть наступила от случайного, самостоятельного обстоятельства — падения сосульки, не связанного закономерно с нанесённым вредом. Применима теория необходимого (закономерного) причинения: причиной признаётся лишь закономерно, а не случайно порождающее последствие условие.\n\nВывод: действия А. не находятся в причинной связи со смертью Б.; А. отвечает лишь за умышленное причинение лёгкого вреда здоровью (ст. 115 УК РФ).\n\n**Задача 14.** Причину травмы создал водитель С., нарушивший ПДД при выезде со второстепенной дороги задом. Манёвр Ч. — вынужденная, объективно необходимая реакция на созданную опасность, совершённая без нарушения правил и без реальной возможности избежать столкновения иначе.\n\nВывод: причиной травмы ребёнка явились действия С.; действия Ч. причинной связи, влекущей ответственность, не образуют.\n\n**Задача 15.** Решение зависит от того, имел ли Г. техническую возможность предотвратить наезд при безопасной для гололёда скорости. М. грубо нарушил правила перехода. Если экспертиза подтвердит отсутствие технической возможности избежать наезда даже при безопасной скорости, причинная связь между превышением скорости и вредом не устанавливается.\n\nВывод: при подтверждении экспертизой отсутствия технической возможности приговор нельзя признать обоснованным — причина ДТП — грубая неосторожность самого М.\n\n**Задача 16.** Причинно-следственная связь между парковкой С. на тротуаре и вредом здоровью ребёнка имеется — это закономерный, предвидимый результат созданной опасности (теория необходимого причинения). М., не нарушавший ПДД, ответственности по ст. 264 не несёт — отсутствует нарушение правил с его стороны.\n\nВывод: причинная связь между действиями С. и последствиями имеется и является закономерной; М. ответственности не подлежит; действия С. при достаточной тяжести вреда могут получить самостоятельную оценку (ст. 268 УК РФ).\n\n**Задача 17.** Смерть находится в причинной связи с действием (не бездействием) С., активно отключившего рубильник. Ссылка на исполнение распоряжения Б. не исключает ответственности по ст. 42 УК РФ, поскольку распоряжение было явно незаконным, а электрик обязан был осознавать его незаконность. Б. несёт ответственность как лицо, отдавшее заведомо незаконное распоряжение без полномочий.\n\nВывод: смерть находится в причинной связи с действием С.; содеянное — причинение смерти по неосторожности (ст. 109 УК РФ) для С., организация деяния — для Б.\n\n**Задача 18.** Деяние П. — единый комплекс действий (удар ножом + утопление тела), направленных на реализацию умысла на убийство. Отклонение непосредственного механизма смерти (асфиксия вместо кровопотери) не прерывает причинную связь — смерть является закономерным результатом совокупных действий, предпринятых для доведения начатого убийства до конца.\n\nВывод: содеянное квалифицируется как оконченное убийство (ст. 105 УК РФ), несмотря на отклонение фактического механизма смерти.\n\n**Задача 19.** Получение взятки (ст. 290 УК РФ) — формальный состав, окончен в момент принятия вознаграждения за незаконное бездействие по службе, независимо от дальнейшего использования средств. Перечисление денег в детский дом и отсутствие претензий у В. не устраняют состав — объект преступления — не имущественные интересы, а нормальное функционирование государственной службы.\n\nВывод: действия С. образуют оконченный состав получения взятки; последствия в виде перевода денег в детский дом уголовно-правового значения не имеют.\n\n**Задача 20.** Описаны признаки незаконной охоты (ст. 258 УК РФ). Квалифицирующее значение имеет место совершения — территория заповедника (п. «г» ч. 1 ст. 258), образующее самостоятельное основание ответственности независимо от количества добытого. Погодные условия, способ разделки и переноски добычи правового значения не имеют.\n\nВывод: решающее значение имеет место охоты (заповедник); иные бытовые детали на квалификацию не влияют.\n\n**Задача 21.** Лестница при совершении кражи — средство преступления (облегчила доступ в помещение); при причинении вреда здоровью сторожу — орудие преступления (непосредственный инструмент воздействия).\n\nВывод: применительно к краже лестница — средство, применительно к вреду здоровью — орудие.\n\n**Задача 22.** Ружьё выступило средством (запор двери, облегчивший удержание кассира) и одновременно орудием психического насилия при угрозе кассиру — обязательный признак объективной стороны разбоя.\n\nВывод: ружьё сыграло двойную роль — орудия угрозы (элемент объективной стороны разбоя) и вспомогательного средства при запоре двери.\n\n**Задача 23.** Прерывание беременности относится к тяжкому вреду здоровью по Медицинским критериям (приказ Минздравсоцразвития № 194н) независимо от срока. Ч. 1 ст. 264 УК РФ описывает последствие обобщённо, без конкретизации видов, значит прерывание беременности полностью охватывается этим составом без дополнительной квалификации по ст. 111 УК РФ.\n\nВывод: последствие полностью охватывается ч. 1 ст. 264 УК РФ, дополнительная квалификация по ст. 111 не требуется.\n\n**Задача 24.** Отказ в возбуждении дела неправомерен. Отсутствие вреда (промах) исключает лишь оконченный состав, но не покушение (ст. 30 ч. 3 + ст. 111/112/115 УК РФ). Хулиганство с оружием (ч. 2 ст. 213) — формальный состав, последствий не требует. Объект посягательства — жизнь и здоровье журналиста, а не его репутация.\n\nВывод: отказ необоснован — усматриваются признаки покушения на вред здоровью и (или) оконченного хулиганства с применением оружия.\n\n**Задача 25.** Формальное неисполнение требования представиться (п. 4 ст. 5 ФЗ «О полиции») есть. Однако халатность (ч. 1 ст. 293) требует существенного нарушения прав, а «утрата доверия к полиции» — абстрактная категория, обычно недостаточная для признания существенности.\n\nВывод: формальные признаки неисполнения обязанности есть, но признаки халатности отсутствуют ввиду недоказанности существенного нарушения прав.\n\n**Задача 26.** Обязанность учреждения обеспечивать безопасность граждан на его территории (п. 2 ст. 13 Закона № 5473-1) распространяется и на иных лиц, включая родственников, и реализуется через сотрудников надзора, включая Ю. Отсутствие прямого указания в должностной инструкции не исключает этой обязанности. Причинная связь между отказом и ухудшением состояния М. прослеживается.\n\nВывод: решение Следственного комитета нельзя признать обоснованным — в отказе Ю. усматриваются признаки преступного бездействия.\n\n**Задача 27.** Между принуждением к принятию яда и смертью от инфаркта причинная связь отсутствует — смерть наступила по иной причине до начала действия яда. Сам факт принуждения с корыстным мотивом образует оконченные действия, направленные на убийство, не доведённое до конца по независящим от К. обстоятельствам.\n\nВывод: оконченного убийства нет ввиду отсутствия причинной связи; содеянное — покушение на убийство из корыстных побуждений (ч. 3 ст. 30, п. «з» ч. 2 ст. 105 УК РФ).\n\n**Задача 28.** Разбой (ст. 162) — усечённый состав, окончен с момента нападения с угрозой, независимо от изъятия имущества. Успешная самооборона Ц. не превращает содеянное в покушение.\n\nВывод: в действиях П. содержатся все признаки оконченного разбоя; неполучение имущества на квалификацию не влияет.\n\n**Задача 29.** Насилие было применено исключительно для изнасилования; умысел на хищение цепи возник позже, без дополнительного насилия.\n\nВывод: признаков разбоя в хищении цепи нет — содеянное образует самостоятельное хищение по совокупности с изнасилованием (ст. 131 УК РФ).\n\n**Задача 30.** Поджог дома с заведомым знанием о нахождении потерпевшего и лишением возможности выбраться образует убийство общеопасным способом (п. «е» ч. 2 ст. 105), либо, при специальном мотиве, ст. 317 УК РФ; уничтожение имущества — самостоятельно по ст. 167 при значительном ущербе.\n\nВывод: содержатся признаки объективной стороны посягательства на жизнь и, при значительном ущербе, умышленного уничтожения имущества.\n\n**Задача 31.** Причинная связь между «порчей» и переломом ноги отсутствует — падение объясняется объективными факторами (гололёд, неосторожность К.).\n\nВывод: причинная связь отсутствует; уголовная ответственность исключается.\n\n**Задача 32.** На момент нанесения ударов В. был уже мёртв — отсутствует объект охраны и причинная связь.\n\nВывод: оконченного убийства нет; содеянное — покушение на негодный объект (ч. 3 ст. 30, ст. 105 УК РФ).\n\n**Задача 33.** Деяние Р. — действие (сбрасывание в воду) + бездействие (неоказание помощи) при наличии обязанности из принятого надзора и создания опасности собственными действиями.\n\nВывод: признаки преступного бездействия имеются; содеянное — убийство путём бездействия либо причинение смерти по неосторожности.\n\n**Задача 34.** Купюра — предмет преступления применительно к изготовлению/сбыту (ст. 186 УК РФ) и средство совершения преступления применительно к приобретению наркотика (ст. 228 УК РФ).\n\nВывод: совокупность двух самостоятельных составов.\n\n**Задача 35.** Способ С. (обман с обещанием брака) не подпадает под исчерпывающий перечень способов ст. 110 УК РФ (угрозы, жестокое обращение, систематическое унижение достоинства).\n\nВывод: признаков доведения до самоубийства не имеется.\n\n**Задача 36.** Б. задержана до получения реальной возможности распорядиться платьем — на кассе, в пределах контролируемой территории.\n\nВывод: не все признаки оконченного хищения присутствуют; содеянное — покушение на кражу (ч. 3 ст. 30, ст. 158 УК РФ).\n\n**Задача 37.** Ч. 1 ст. 123 УК РФ — формальный состав, окончен с момента самого факта проведения аборта ненадлежащим субъектом, независимо от последствий.\n\nВывод: отсутствие последствий не исключает ответственности К. по ч. 1 ст. 123 УК РФ.\n\n---\n\n## Задачи с тестовыми вариантами решения\n\n**Задача 1.** Ответ — **а)** нет, деяние рефлекторное, неосознанное. Икота — непроизвольный рефлекс, лишённый осознанного и волевого характера.\n\n**Задача 2.** Ответ — **в)** нет, состав сложный, предполагает совокупность действий (насилие + половой акт), которые В. не успел выполнить до момента, когда был обезоружен.\n\n**Задача 3.** Ответ — **а)** да, объективная сторона ст. 228 УК РФ альтернативная, достаточно одного действия (приобретения/хранения), последствий состав не требует.\n"}]},{"id":"fin","name":"Финансовый учёт","hue":150,"notes":[{"id":"fin-1","title":"Тема 1. Основы финансового учёта","short":"Основы учёта","date":"","md":"Главный вопрос темы — что принадлежит компании и за чей счёт это появилось.\n\nФинансовый учёт нужен, чтобы фиксировать операции, контролировать ресурсы, считать результат, готовить отчётность и разговаривать с внешними пользователями. У каждого пользователя своё решение: собственник решает, изымать прибыль или оставить в бизнесе; менеджер ищет, где компания теряет деньги; банк решает, давать ли кредит; инвестор — входить ли и по какой цене; поставщик — давать ли отсрочку; государство проверяет налоги.\n\nФинансовый учёт обязателен, ведётся по стандартам, показывает компанию целиком за квартал или год и опирается на прошедшие факты. Управленческий учёт добровольный, правила задаёт сама компания, детализация идёт по продуктам, точкам и проектам, периодичность любая, и он работает не только с фактами, но и с прогнозами.\n\nХозяйственная операция — это событие, которое можно измерить в деньгах и которое меняет финансовое положение компании. Продажа смартфона, оплата аренды, поступление товара — операции. Собеседование, протокол совещания, согласованный план — нет.\n\nОбъектов учёта пять. Активы — ресурсы под контролем компании. Обязательства — требования сторонних лиц. Капитал — доля собственников. Доходы увеличивают капитал, расходы уменьшают. Актив признаётся при трёх условиях сразу: компания контролирует ресурс, он получен в результате прошедшего события и принесёт измеримую будущую выгоду. Поэтому персонал, внутренняя репутация, самостоятельно наработанная база клиентов и рекламная кампания активами не считаются.\n\nТри различения, которые чаще всего путают. Первое: деньги — не доход. При получении кредита, вклада собственника или аванса покупателя деньги приходят, но растёт обязательство или капитал, а не доход. Второе: расход — не выплата. Закупка товара это выплата без расхода, потому что появился актив «запасы»; начисленная зарплата — расход без выплаты, потому что работа уже выполнена; погашение кредита — выплата без расхода, просто уменьшилось обязательство. Третье: операции с собственниками меняют капитал, но в результат периода не входят.\n\nУчётное уравнение: Активы = Обязательства + Капитал, отсюда Капитал = Активы − Обязательства. Изменения бывают четырёх типов. Актив меняется на актив — итог баланса остаётся прежним. Актив и обязательство растут или уменьшаются вместе. Актив и капитал меняются одновременно — это вклад, изъятие, доход или расход. И четвёртый тип — замена одного источника другим, когда активы не трогаются.\n\nТипичные ошибки: считать кредит доходом, признавать расход в момент закупки товара вместо продажи, принимать вклад собственника за прибыль, записывать рекламу в активы.\n\nНапрямую финансовый учёт не показывает качество команды, удовлетворённость клиентов, рыночный потенциал и будущие решения. Отчётность фиксирует последствия решений в деньгах, а не их причины.\n\n| Операция  | Активы            | Обязательства | Капитал           | Проверка                    |\n| --------- | ----------------- | ------------- | ----------------- | --------------------------- |\n| Начало    | 705 000           | 340 000       | 365 000           | 705 000 = 340 000 + 365 000 |\n| 1         | +180 000 −120 000 | 0             | +180 000 −120 000 | 765 000 = 340 000 + 425 000 |\n| 2         | −60 000           | −60 000       | 0                 | 705 000 = 280 000 + 425 000 |\n| 3         | 0                 | +70 000       | −70 000           | 705 000 = 350 000 + 355 000 |\n| 4         | +25 000           | +25 000       | 0                 | 730 000 = 375 000 + 355 000 |\n| 5         | −50 000           | 0             | −50 000           | 680 000 = 375 000 + 305 000 |\n| **Конец** | **680 000**       | **375 000**   | **305 000**       | 680 000 = 375 000 + 305 000 |\n"}]},{"id":"python","name":"Python","hue":195,"notes":[{"id":"python-1","title":"Типы данных","short":"Типы данных","date":"","md":"- Неизменяемые - числа, строки, логический тип, кортежи\n- Изменяемые - списки, множества словари\n"}]},{"id":"links","name":"Ведомости","hue":310,"notes":[{"id":"links-1","title":"Ведомости","short":"Ведомости","date":"","md":"- [Питон — Google Таблица](https://docs.google.com/spreadsheets/d/1yA7Z1Depd6N8ptf15K3MC0IzmocKfK55s-QmGyjc7e8/edit?usp=sharing)\n- [Лекции Майнор](https://docs.360.yandex.ru/view/d/lu4tuHQpz0rSA64BMY02MCPegnqahzm72s0qoIz-cKg6SG84bkVZQ0wwUQ)\n- [Англ цифровое](https://disk.360.yandex.ru/d/QhGTKegGNwls0Q)\n- [Конституционка — Google Таблица](https://docs.google.com/spreadsheets/d/1HypfUsIYpMoitoxGot6LavoJCAQekPblgwtmO2qqBgM/edit?pli=1&gid=0#gid=0)\n"}]}]}</script>
