<script>
(function(){
'use strict';
var root=document.documentElement;
root.lang='ru';
var UPDATED='12 окт';
var DATA=JSON.parse(document.getElementById('data').textContent);
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function plural(n,f){var m=n%10,c=n%100;return n+' '+(m===1&&c!==11?f[0]:(m>=2&&m<=4&&(c<10||c>=20)?f[1]:f[2]))}

/* ---------- данные ---------- */
function plain(md){
  return md.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/^[\s|:-]{3,}$/gm,' ').replace(/[|*_`>#]/g,' ').replace(/\s+/g,' ').trim();
}
var notes={},subjects={},allNotes=[];
DATA.subjects.forEach(function(s){
  subjects[s.id]=s;
  s.notes.forEach(function(n,i){
    n.subject=s;n.idx=i;notes[n.id]=n;allNotes.push(n);
    n.text=plain(n.md);n.tl=n.text.toLowerCase();n.ti=n.title.toLowerCase();
  });
});

/* ---------- markdown ---------- */
var shift=0;
marked.use({gfm:true,breaks:true,renderer:{
  heading:function(text,level){var l=Math.max(2,Math.min(6,level+shift));return '<h'+l+'>'+text+'</h'+l+'>\n'},
  table:function(header,body){return '<div class="tablewrap"><table><thead>'+header+'</thead><tbody>'+body+'</tbody></table></div>\n'},
  link:function(href,title,text){return '<a href="'+esc(href)+'"'+(title?' title="'+esc(title)+'"':'')+' target="_blank" rel="noopener noreferrer">'+text+'</a>'}
}});
function minLevel(md){var m=99;md.replace(/^(#{1,6})[ \t]/gm,function(a,h){if(h.length<m)m=h.length;return a});return m===99?null:m}

/* ---------- состояние ---------- */
var state={tok:'',hl:null,searching:false,heads:null};
var rail=$('#rail'),view=$('#view'),tabsEl=$('#tabs'),input=$('#q'),sbar=$('#searchbar');

function defaultNote(s){
  var id=store('last:'+s.id);
  return (id&&notes[id]&&notes[id].subject===s)?notes[id]:s.notes[s.notes.length-1];
}
function resolve(tok){
  if(notes[tok])return tok;
  if(subjects[tok])return defaultNote(subjects[tok]).id;
  return '';
}
function go(tok){
  tok=resolve(tok);
  try{
    if(tok){if(location.hash.slice(1)!==tok)location.hash=tok}
    else if(location.hash){history.pushState(null,'',location.pathname+location.search)}
  }catch(e){}
  show(tok);
}
window.addEventListener('hashchange',function(){
  var t=resolve(location.hash.slice(1));
  if(t!==state.tok||state.searching)show(t);
});

/* ---------- навигация: предметы и вкладки ---------- */
$('#subjects').innerHTML=DATA.subjects.map(function(s){
  return '<a class="subj" href="#'+s.id+'" data-go="'+s.id+'" data-s="'+s.id+'" style="--h:'+s.hue+'"><span class="dot"></span><span class="nm">'+esc(s.name)+'</span><span class="ct">'+s.notes.length+'</span></a>';
}).join('');

function centerIn(box,el){box.scrollLeft=el.offsetLeft-(box.clientWidth-el.offsetWidth)/2}

function markSubject(n){
  $$('.subj').forEach(function(a){
    var on=!!n&&a.getAttribute('data-s')===n.subject.id;
    a.classList.toggle('on',on);
    if(on){a.setAttribute('aria-current','page');if(window.innerWidth<900)centerIn(a.parentNode,a)}else a.removeAttribute('aria-current');
  });
}
function renderTabs(n){
  var s=n&&n.subject;
  if(!s||s.notes.length<2){tabsEl.hidden=true;tabsEl.innerHTML='';return}
  tabsEl.hidden=false;
  tabsEl.style.setProperty('--h',s.hue);
  tabsEl.innerHTML=s.notes.map(function(x){
    var on=x===n;
    return '<a class="tab'+(on?' on':'')+'" role="tab" aria-selected="'+on+'" href="#'+x.id+'" data-go="'+x.id+'"><span class="td">'+esc(x.date||'—')+'</span><span class="tl">'+esc(x.short)+'</span></a>';
  }).join('');
  var a=$('.tab.on',tabsEl);if(a)centerIn(tabsEl,a);
}

/* ---------- главная ---------- */
/* ---------- расписание ---------- */
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'],WD=['вс','пн','вт','ср','чт','пт','сб'];
var SCHED=JSON.parse($('#sched').textContent),SCHED_SRC='file';
var KEEP=[['Гражданское право','civil'],['Конституционное право','const'],['Уголовное право','crim'],['Основы программирования на Python','python'],['Экономика',null],['Цифровая грамотность',null]];
try{var cch=JSON.parse(store('sched')||'null');if(cch&&cch.list&&cch.list.length&&Date.now()-cch.at<3*864e5){SCHED=cch.list;SCHED_SRC='ruz'}}catch(e){}
function two(n){return ('0'+n).slice(-2)}
function loadLive(){
  if(!/^https?:$/.test(location.protocol)||!window.fetch)return;
  var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},7000);
  var f=function(d){return d.getFullYear()+'.'+two(d.getMonth()+1)+'.'+two(d.getDate())};
  fetch('https://ruz.hse.ru/api/schedule/group/48037?start='+f(new Date())+'&finish='+f(new Date(Date.now()+14*864e5))+'&lng=1',{signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json()}).then(function(arr){
    clearTimeout(tm);var list=[];
    (Array.isArray(arr)?arr:[]).forEach(function(x){
      var nm=String(x.discipline||''),m=null;
      KEEP.forEach(function(k){if(!m&&nm.indexOf(k[0])>-1)m=k});
      if(!m||!x.date||!x.beginLesson)return;
      var kd=String(x.kindOfWork||'');
      list.push({d:String(x.date).replace(/\./g,'-'),b:x.beginLesson,e:x.endLesson,n:nm.replace(/\s*\((рус|анг)\)\s*$/,''),k:/лекц/i.test(kd)?'Лекция':/семин/i.test(kd)?'Семинар':/практ/i.test(kd)?'Практика':kd,r:String(x.auditorium||'').replace(/^.*\/\s*/,''),s:m[1],t:x.lecturer_title||x.lecturer||''});
    });
    if(!list.length)return;
    SCHED=list;SCHED_SRC='ruz';store('sched',JSON.stringify({at:Date.now(),list:list}));
    if(!state.tok&&!state.searching)renderHome();
  }).catch(function(){clearTimeout(tm)});
}
function dayLabel(d){
  var t=new Date(),ts=t.getFullYear()+'-'+two(t.getMonth()+1)+'-'+two(t.getDate());
  var n=new Date(t.getTime()+864e5),ns=n.getFullYear()+'-'+two(n.getMonth()+1)+'-'+two(n.getDate());
  if(d===ts)return 'Сегодня';if(d===ns)return 'Завтра';
  var x=new Date(d+'T12:00:00');return WD[x.getDay()]+', '+x.getDate()+' '+MON[x.getMonth()];
}
function nextHtml(){
  var now=Date.now(),all=SCHED.map(function(x){return {x:x,s:Date.parse(x.d+'T'+x.b+':00+03:00'),e:Date.parse(x.d+'T'+x.e+':00+03:00')}}).sort(function(a,b){return a.s-b.s});
  var list=all.filter(function(o){return o.e>now}).slice(0,4),h='<section class="next"><h2>Ближайшие пары</h2>';
  if(!list.length){
    var last=all.length?dayLabel(all[all.length-1].x.d):'';
    return h+'<p class="none">В расписании пар больше нет'+(last?' (последняя — '+last+')':'')+'. Пришли свежий файл расписания — обновлю.</p></section>';
  }
  h+='<div class="nx-list">'+list.map(function(o){
    var x=o.x,tag=x.s&&subjects[x.s]?'a':'div',link=tag==='a'?' href="#'+x.s+'" data-go="'+x.s+'"':'';
    return '<'+tag+' class="nx-row'+(o.s<=now?' now':'')+'"'+link+'><span class="nd"><em>'+esc(dayLabel(x.d))+'</em>'+esc(x.b)+'–'+esc(x.e)+'</span><span class="nt"><b>'+esc(x.n)+'</b><i>'+esc(x.k)+(x.r?' · ауд. '+esc(x.r):'')+(x.t?' · '+esc(x.t):'')+'</i></span></'+tag+'>';
  }).join('')+'</div>';
  var fa=new Date(all[0].x.d+'T12:00:00'),fz=new Date(all[all.length-1].x.d+'T12:00:00');
  return h+'<p class="src">'+(SCHED_SRC==='ruz'?'Расписание подгружено с ruz.hse.ru':'Расписание из файла: '+fa.getDate()+' '+MON[fa.getMonth()]+' — '+fz.getDate()+' '+MON[fz.getMonth()])+'</p></section>';
}
/* ---------- закладки ---------- */
function getBm(){try{var a=JSON.parse(store('bm')||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function setBm(a){store('bm',JSON.stringify(a))}
function bmIndex(a,n,t){for(var i=0;i<a.length;i++)if(a[i].n===n&&a[i].t===t)return i;return -1}
function bmHtml(){
  var a=getBm(),h='';
  a.forEach(function(b,i){var n=notes[b.n];if(!n)return;
    h+='<div class="bm-row"><a href="#'+b.n+'" data-bmgo="'+b.n+'" data-t="'+esc(b.t)+'"><b>'+esc(b.t)+'</b><i>'+esc(n.subject.name+' · '+n.title)+'</i></a><button type="button" data-bmdel="'+i+'" aria-label="Убрать закладку">×</button></div>';
  });
  return h?'<section class="bms"><h2>Закладки</h2>'+h+'</section>':'';
}

function renderHome(){
  var last=notes[store('last')||''];
  var h='<section class="home"><h1><span class="sec">§</span>Конспекты</h1>'+
    '<p class="lead">Выберите предмет — внутри конспекты по датам. Поиск ищет сразу по всем.</p>'+
    '<p class="stats"><span>'+plural(DATA.subjects.length,['предмет','предмета','предметов'])+' · '+plural(allNotes.length,['конспект','конспекта','конспектов'])+'</span> <span>Обновлено '+esc(UPDATED)+'</span></p>';
  if(last)h+='<a class="resume" href="#'+last.id+'" data-go="'+last.id+'"><span class="k">Продолжить</span><span class="v">'+esc(last.title)+'</span></a>';
  h+=nextHtml()+bmHtml();
  h+='<div class="idx">'+DATA.subjects.map(function(s){
    return '<section class="isub" style="--h:'+s.hue+'"><h2><span class="dot"></span><a href="#'+s.id+'" data-go="'+s.id+'">'+esc(s.name)+'</a><span class="cnt">'+s.notes.length+'</span></h2><ul>'+
      s.notes.map(function(n){return '<li><a href="#'+n.id+'" data-go="'+n.id+'"><span class="d">'+esc(n.date||'—')+'</span><span class="t">'+esc(n.title)+'</span></a></li>'}).join('')+'</ul></section>';
  }).join('')+'</div></section>';
  view.innerHTML=h;
}

/* ---------- конспект ---------- */
function buildToc(heads){
  var stack=[],items=heads.map(function(el){
    var lv=+el.tagName.charAt(1);
    while(stack.length&&stack[stack.length-1]>=lv)stack.pop();
    var d=Math.min(stack.length,2);stack.push(lv);
    return {d:d,t:el.textContent.replace(/\s+/g,' ').trim()};
  });
  return items.map(function(it,i){return '<a href="#" class="d'+it.d+'" data-i="'+i+'">'+esc(it.t)+'</a>'}).join('');
}
function hlDom(rootEl,re){
  var w=document.createTreeWalker(rootEl,NodeFilter.SHOW_TEXT,null),list=[],n,count=0;
  while((n=w.nextNode()))list.push(n);
  list.forEach(function(t){
    if(count>900)return;
    var s=t.nodeValue;re.lastIndex=0;
    if(!re.test(s))return;
    re.lastIndex=0;
    var frag=document.createDocumentFragment(),last=0,m;
    while((m=re.exec(s))){
      if(m[0].length===0){re.lastIndex++;continue}
      if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      var mk=document.createElement('mark');mk.textContent=m[0];frag.appendChild(mk);
      last=m.index+m[0].length;count++;
    }
    if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(frag,t);
  });
  return count;
}
var SKINS={a:'Бумага',c:'Газета',d:'Швейцария',f:'Книга',g:'Поля'},
SW={a:['#F4F1E8','#A93D28'],c:['#F5F2EA','#B3261E'],d:['#ffffff','#E10600'],f:['#FBF8F1','#8A3A2B'],g:['#FDFDFB','#2F5D8A']},
DEF={civil:'a',const:'f',crim:'c',fin:'d',python:'g',links:'a'};
function globalSkin(){var v=store('skin');return SKINS[v]?v:''}
function skinOf(s){return globalSkin()||DEF[s.id]||'a'}
function homeSkin(){return globalSkin()||'a'}
function applySkin(k){root.setAttribute('data-skin',k);syncHdr()}
function renderNote(n){
  var s=n.subject,ml=minLevel(n.md);
  shift=ml===null?0:2-ml;
  var html=marked.parse(n.md);
  var pv=s.notes[n.idx-1],nx=s.notes[n.idx+1];
  var pager=(pv||nx)?'<nav class="pager" aria-label="Соседние конспекты">'+
    (pv?'<a class="pv" href="#'+pv.id+'" data-go="'+pv.id+'"><span class="k">← Назад'+(pv.date?' · '+esc(pv.date):'')+'</span><span class="v">'+esc(pv.title)+'</span></a>':'')+
    (nx?'<a class="nx" href="#'+nx.id+'" data-go="'+nx.id+'"><span class="k">Дальше'+(nx.date?' · '+esc(nx.date):'')+' →</span><span class="v">'+esc(nx.title)+'</span></a>':'')+'</nav>':'';
  view.innerHTML='<div class="note-wrap"><article class="note" style="--h:'+s.hue+'">'+
    (state.hl?'<button class="back" type="button" data-back>← Результаты поиска</button>':'')+
    '<p class="eyebrow"><span class="dot"></span><span>'+esc(s.name)+'</span>'+(n.date?'<span class="sep">·</span><span>'+esc(n.date)+'</span>':'')+'</p>'+
    '<h1>'+esc(n.title)+'</h1><div class="prose">'+html+'</div>'+pager+'</article></div>';
  var prose=$('.prose',view),wrap=$('.note-wrap',view);
  $$('td,th',prose).forEach(function(c){if(c.textContent.length<=26)c.classList.add('nw')});
  $$('p',prose).forEach(function(p){
    var f=p.firstElementChild;
    if(!f||f.tagName!=='STRONG'||p.firstChild!==f)return;
    var t=f.textContent.trim(),alone=p.textContent.trim()===t;
    if(/^Ответ/.test(t)&&alone)p.classList.add('lbl');
    else if(/^Решение/.test(t)&&!alone)p.classList.add('verdict');
    else if(/^Суть\.?$/.test(t))p.classList.add('gist');
    else if(alone)p.classList.add('sub');
  });
  state.heads=$$('h2,h3,h4',prose);
  if(state.heads.length>=3){
    var toc=buildToc(state.heads);
    var det=document.createElement('details');det.className='toc toc-inline';
    det.innerHTML='<summary>Содержание <span class="n">'+state.heads.length+'</span></summary><div class="list">'+toc+'</div>';
    $('.note',view).insertBefore(det,prose);
    var side=document.createElement('aside');side.className='toc toc-side';side.setAttribute('aria-label','Содержание');
    side.innerHTML='<p class="h">Содержание</p>'+toc;
    wrap.appendChild(side);
  }else{wrap.classList.add('no-toc');state.heads=null}
  if(state.hl)hlDom(prose,state.hl.re);
  var bms=getBm();
  $$('h2,h3',prose).forEach(function(h){
    var t=h.textContent.replace(/\s+/g,' ').trim(),on=bmIndex(bms,n.id,t)>-1,b=document.createElement('button');
    h.setAttribute('data-t',t);b.type='button';b.className='bm'+(on?' on':'');b.setAttribute('data-bm','');b.setAttribute('aria-label','Закладка');b.textContent=on?'★':'☆';h.appendChild(b);
  });
}

/* ---------- показ ---------- */
function show(tok){
  state.tok=tok;state.searching=false;
  var n=notes[tok];
  applySkin(n?skinOf(n.subject):homeSkin());
  markSubject(n);renderTabs(n);
  if(n){
    store('last',n.id);store('last:'+n.subject.id,n.id);
    renderNote(n);
  }else{state.heads=null;renderHome()}
  view.classList.remove('rise');void view.offsetWidth;view.classList.add('rise');
  window.scrollTo(0,0);
  if(n&&state.hl){
    var mk=$('mark',view);
    if(mk)window.scrollTo(0,Math.max(0,mk.getBoundingClientRect().top+window.scrollY-140));
  }
  updateScroll();
}

/* ---------- поиск ---------- */
function parseQuery(q){
  var toks=q.toLowerCase().split(/\s+/).filter(Boolean).map(function(t){
    return t.length>=7?t.slice(0,-2):(t.length>=4?t.slice(0,-1):t);   // грубая основа слова: «ответственность» ~ «ответственности»
  });
  if(!toks.length)return null;
  return {toks:toks,re:new RegExp('('+toks.map(function(t){return escRe(t)+'[\\p{L}\\d]*'}).join('|')+')','giu')};
}
function marked_snip(str,re){
  return str.split(re).map(function(p,i){return i%2?'<mark>'+esc(p)+'</mark>':esc(p)}).join('');
}
function count(hay,t){var c=0,i=-1;while(c<999&&(i=hay.indexOf(t,i+1))>-1)c++;return c}
function renderResults(q){
  var Q=parseQuery(q);
  markSubject(null);renderTabs(null);state.heads=null;state.searching=true;
  var res=[];
  allNotes.forEach(function(n){
    var ok=Q.toks.every(function(t){return n.ti.indexOf(t)>-1||n.tl.indexOf(t)>-1});
    if(!ok)return;
    var score=0,hits=0;
    Q.toks.forEach(function(t){hits+=count(n.tl,t);if(n.ti.indexOf(t)>-1)score+=60});
    res.push({n:n,score:score+Math.min(hits,40),hits:hits});
  });
  res.sort(function(a,b){return b.score-a.score});
  var h='<section class="results"><h1>«'+esc(q)+'»</h1>';
  if(!res.length){
    h+='<p class="empty">Ничего не нашлось. Попробуйте короче — например, корень слова.</p></section>';
  }else{
    var tot=res.reduce(function(a,r){return a+r.hits},0);
    h+='<p class="sub">'+plural(res.length,['конспект','конспекта','конспектов'])+', '+plural(tot,['совпадение','совпадения','совпадений'])+'</p>';
    h+=res.slice(0,40).map(function(r){
      var n=r.n,p=-1;
      Q.toks.forEach(function(t){var i=n.tl.indexOf(t);if(i>-1&&(p<0||i<p))p=i});
      var snip='';
      if(p<0)p=0;
      var a=Math.max(0,p-70),b=Math.min(n.text.length,p+130);
      if(a>0){var sa=n.text.indexOf(' ',a);if(sa>-1&&sa<p)a=sa+1}
      if(b<n.text.length){var sb=n.text.lastIndexOf(' ',b);if(sb>p)b=sb}
      snip=(a>0?'… ':'')+n.text.slice(a,b)+(b<n.text.length?' …':'');
      return '<a class="hit" href="#'+n.id+'" data-go="'+n.id+'" data-hl="1" style="--h:'+n.subject.hue+'"><div class="meta"><span class="dot"></span><span>'+esc(n.subject.name)+(n.date?' · '+esc(n.date):'')+'</span></div><h3>'+marked_snip(n.title,Q.re)+'</h3><p>'+marked_snip(snip,Q.re)+'</p>'+(r.hits>1?'<span class="more">'+plural(r.hits,['совпадение','совпадения','совпадений'])+'</span>':'')+'</a>';
    }).join('')+'</section>';
  }
  view.innerHTML=h;
  view.classList.remove('rise');void view.offsetWidth;view.classList.add('rise');
  window.scrollTo(0,0);
  updateScroll();
}
var qTimer=0;
function onInput(){
  var q=input.value.trim();
  sbar.classList.toggle('has',input.value.length>0);
  clearTimeout(qTimer);
  qTimer=setTimeout(function(){
    if(q.length>=2){state.hl=parseQuery(q);renderResults(q)}
    else{
      var was=state.searching||state.hl;
      state.hl=null;
      if(was)show(state.tok);
    }
  },140);
}
input.addEventListener('input',onInput);
function clearSearch(){
  input.value='';sbar.classList.remove('has');
  var was=state.searching||state.hl;state.hl=null;
  if(was)show(state.tok);
}
$('#q-clear').addEventListener('click',function(){clearSearch();input.focus()});
$('#btn-search').addEventListener('click',function(){
  var open=rail.classList.toggle('s-open');
  syncHdr();
  if(open)input.focus();else clearSearch();
});
document.addEventListener('keydown',function(e){
  var tag=(e.target&&e.target.tagName)||'';
  if(e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA'){
    e.preventDefault();
    if(window.innerWidth<900)rail.classList.add('s-open');
    input.focus();input.select();syncHdr();
  }else if(e.key==='Escape'&&(document.activeElement===input||input.value)){
    clearSearch();input.blur();
  }
});

/* ---------- клики ---------- */
document.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.closest)return;
  var back=t.closest('[data-back]');
  if(back){e.preventDefault();var q=input.value.trim();if(q.length>=2)renderResults(q);return}
  var bm=t.closest('[data-bm]');
  if(bm){
    e.preventDefault();var nt=notes[state.tok];
    if(nt){var a=getBm(),tt=bm.parentNode.getAttribute('data-t'),i=bmIndex(a,nt.id,tt);if(i>-1)a.splice(i,1);else a.push({n:nt.id,t:tt});setBm(a);bm.classList.toggle('on',i<0);bm.textContent=i<0?'★':'☆'}
    return;
  }
  var bo=t.closest('[data-bmgo]');
  if(bo){
    e.preventDefault();var tx=bo.getAttribute('data-t');go(bo.getAttribute('data-bmgo'));
    var hh=$$('h2,h3',view).filter(function(h){return h.getAttribute('data-t')===tx})[0];
    if(hh)setTimeout(function(){window.scrollTo(0,hh.getBoundingClientRect().top+window.scrollY-84)},60);
    return;
  }
  var bx=t.closest('[data-bmdel]');
  if(bx){e.preventDefault();var a2=getBm();a2.splice(+bx.getAttribute('data-bmdel'),1);setBm(a2);renderHome();return}
  var ti=t.closest('.toc a[data-i]');
  if(ti){
    e.preventDefault();
    var el=state.heads&&state.heads[+ti.getAttribute('data-i')];
    var det=ti.closest('details');if(det)det.open=false;
    if(el)setTimeout(function(){window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-84,behavior:'smooth'})},det?60:0);
    return;
  }
  var a=t.closest('[data-go]');
  if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button===1)return;
  e.preventDefault();
  go(a.getAttribute('data-go'));
});

/* ---------- тема ---------- */
function effective(){var t=root.getAttribute('data-theme');return t||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
var savedTheme=store('theme');
if(savedTheme==='dark'||savedTheme==='light')root.setAttribute('data-theme',savedTheme);
var toastEl=document.createElement('div');toastEl.className='toast';document.body.appendChild(toastEl);var toastT;
var menu=document.createElement('div');menu.className='skinmenu';menu.hidden=true;document.body.appendChild(menu);
function closeMenu(){menu.hidden=true}
var FZ=[0.88,1,1.12,1.25,1.4],menuLock=0;
function getFz(){var v=+store('fz');return FZ.indexOf(v)>-1?v:1}
function applyFz(v){root.style.setProperty('--fz',v)}
applyFz(getFz());
function setSkin(k){
  store('skin',k);
  var n=notes[state.tok],y=window.scrollY;applySkin(n?skinOf(n.subject):homeSkin());window.scrollTo(0,y);updateScroll();closeMenu();
}
$('#btn-style').addEventListener('click',function(e){
  e.stopPropagation();
  if(!menu.hidden){closeMenu();return}
  var cur=globalSkin()||'auto';
  menu.innerHTML='<div class="fzrow"><span>Размер текста</span><button type="button" data-fz="-1" aria-label="Меньше">А−</button><b>'+Math.round(getFz()*100)+'%</b><button type="button" data-fz="1" aria-label="Больше">А+</button></div><p>Оформление сайта</p>'+['auto'].concat(Object.keys(SKINS)).map(function(k){
    var sw=k==='auto'?'conic-gradient(#A93D28,#3dff8a,#8B7CFF,#E10600,#A93D28)':'linear-gradient(135deg,'+SW[k][0]+' 50%,'+SW[k][1]+' 50%)';
    return '<button type="button" data-skin="'+k+'" class="'+(k===cur?'on':'')+'"><i style="background:'+sw+'"></i>'+(k==='auto'?'Разное по предметам':SKINS[k])+(k===cur?'<b>✓</b>':'')+'</button>';
  }).join('');
  var r=this.getBoundingClientRect();
  menu.style.top=Math.round(r.bottom+6)+'px';menu.style.right=Math.max(8,Math.round(window.innerWidth-r.right))+'px';
  menu.hidden=false;
});
menu.addEventListener('click',function(e){
  var z=e.target.closest('[data-fz]');
  if(z){e.stopPropagation();var i=Math.max(0,Math.min(FZ.length-1,FZ.indexOf(getFz())+(+z.getAttribute('data-fz'))));store('fz',String(FZ[i]));menuLock=Date.now();applyFz(FZ[i]);$('.fzrow b',menu).textContent=Math.round(FZ[i]*100)+'%';return}
  var b=e.target.closest('[data-skin]');if(b){e.stopPropagation();setSkin(b.getAttribute('data-skin'))}
});
document.addEventListener('click',function(e){if(!menu.hidden&&!menu.contains(e.target))closeMenu()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
window.addEventListener('scroll',function(){if(Date.now()-menuLock>500)closeMenu()},{passive:true});
$('#btn-theme').addEventListener('click',function(){
  var n=effective()==='dark'?'light':'dark';
  root.setAttribute('data-theme',n);store('theme',n);
});

/* ---------- шапка на телефоне: прячется при прокрутке вниз ---------- */
var hidden=false,lastY=window.scrollY,acc=0,ticking=false;
function syncHdr(){
  var wide=window.innerWidth>=900;
  root.style.setProperty('--hdr',(wide||hidden)?'0px':rail.offsetHeight+'px');
}
function setHidden(h){
  if(h===hidden)return;
  hidden=h;rail.classList.toggle('hide',h);syncHdr();
}
function updateScroll(){
  var y=window.scrollY,dy=y-lastY;lastY=y;
  var max=document.documentElement.scrollHeight-window.innerHeight;
  if(window.innerWidth>=900||y<60||document.activeElement===input){acc=0;setHidden(false)}
  else if(dy>0){acc=acc>0?acc+dy:dy;if(acc>24)setHidden(true)}
  else if(dy<0){acc=acc<0?acc+dy:dy;if(acc<-48)setHidden(false)}
  if(state.heads){
    var side=$('.toc-side a.on'),idx=-1;
    for(var i=0;i<state.heads.length;i++){if(state.heads[i].getBoundingClientRect().top<=120)idx=i;else break}
    var links=$$('.toc-side a');
    links.forEach(function(l,k){l.classList.toggle('on',k===idx)});
    var cur=links[idx];
    if(cur&&cur!==side){var box=cur.parentNode;if(box.scrollHeight>box.clientHeight)box.scrollTop=cur.offsetTop-box.clientHeight/2}
  }
}
window.addEventListener('scroll',function(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(function(){ticking=false;updateScroll()});
},{passive:true});
window.addEventListener('resize',function(){syncHdr();updateScroll()});
if(window.ResizeObserver)new ResizeObserver(syncHdr).observe(rail);

/* ---------- старт ---------- */
syncHdr();
show(resolve(location.hash.slice(1)));
setTimeout(loadLive,300);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
</script>
