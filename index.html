деративного устройства (состав РФ, статус субъектов, разграничение предметов ведения);\n- по поводу организации и осуществления государственной власти (система органов, порядок формирования, компетенция, взаимоотношения);\n- в сфере организации местного самоуправления.\n\n**3. Метод конституционного права** — приёмы и способы воздействия:\n\n- метод обязывания (императивный) — преобладает в регулировании статуса органов власти;\n- метод запрета;\n- метод дозволения (управомочивания) — преобладает в регулировании прав и свобод;\n- учредительный метод (специфичен только для конституционного права) — государство и общество как бы «учреждают» основы своего устройства нормами Конституции.\n\n**4. Структура отрасли (система институтов):**\n\n- институт основ конституционного строя;\n- институт основ правового статуса человека и гражданина;\n- институт федеративного устройства;\n- институт системы государственной власти (глава государства, парламент, правительство, судебная власть);\n- институт местного самоуправления;\n- институт конституционных поправок и пересмотра Конституции.\n\n**5. Соотношение «конституционное право» и «государственное право»:**\n\n- исторически (до 1993 г., по немецкой традиции Staatsrecht) использовался термин «государственное право» — акцент на организации государства и власти;\n- с принятием Конституции 1993 г. утвердился термин «конституционное право», подчёркивающий приоритет прав и свобод человека, ограничение власти правом (идея конституционализма), регулирование не только государства, но и гражданского общества;\n- в литературе три позиции: а) термины-синонимы; б) конституционное право шире и включает государственное как часть; в) государственное право (государствоведение) шире, конституционное — его часть, ограниченная нормами конституции;\n- преобладающая позиция (Авакьян, Козлова, Кутафин) — термины близки по содержанию, но «конституционное право» точнее отражает концепцию правового, ограниченного государства.\n\n---\n\n### Вопрос 2. Конституционное право в системе российского права. Приоритет конституционного права и его влияние на другие отрасли права.\n\n**Ответ:**\n\nКонституционное право занимает **ведущее (системообразующее) место** среди отраслей права, поскольку:\n\n- регулирует наиболее важные, основополагающие общественные отношения;\n- его источник — Конституция РФ — обладает высшей юридической силой и прямым действием (ч. 1 ст. 15);\n- все иные отрасли (гражданское, уголовное, административное, трудовое, семейное, экологическое, финансовое право и др.) базируются на конституционных принципах и не должны ей противоречить.\n\n**Механизмы влияния (приоритета) на другие отрасли:**\n\n- прямое действие конституционных норм (ч. 1 ст. 15) — применяются непосредственно, в том числе судами;\n- конституционный контроль — Конституционный Суд РФ вправе признать норму любой отрасли не соответствующей Конституции, после чего она утрачивает силу;\n- конкретизация — многие конституционные нормы получают развитие в отраслевом законодательстве:\n    - ст. 34–36 — основа гражданского права;\n    - ст. 37 — основа трудового права;\n    - ст. 46, 47 — основа процессуальных отраслей;\n    - ст. 57 — основа налогового права.\n\n---\n\n### Вопрос 3. Конституционно-правовые нормы. Особенности содержания и структуры.\n\n**Ответ:**\n\n**Особенности содержания:**\n\n- наиболее общий, абстрактный, учредительный характер;\n- регулируют наиболее значимые общественные отношения;\n- велика доля норм-принципов, норм-деклараций, норм-целей и норм-дефиниций (в отличие от «обычных» норм-правил поведения других отраслей);\n- многие нормы адресованы неопределённому кругу субъектов («каждый», «никто»).\n\n**Особенности структуры:**\n\n- классическая трёхчленная структура (гипотеза — диспозиция — санкция) в чистом виде встречается редко;\n- чаще всего отсутствует санкция — она либо вынесена в другие нормы (ФКЗ, ФЗ, иные отрасли права), либо не предусмотрена вовсе из-за декларативного характера нормы;\n- гипотеза часто не выражена как отдельный элемент, а «растворена» в диспозиции;\n- санкции, если есть, чаще носят не карательный, а правовосстановительный либо организационный характер (отмена акта, отрешение от должности, роспуск органа, отказ в регистрации) — это меры конституционно-правовой, а не уголовной или административной ответственности.\n\n---\n\n### Практическое задание 1. Посмотрите тексты конституций США, Франции, ФРГ, Испании, Бразилии, Мексики, Турции и др. Сравните с Конституцией РФ. Проведите дискуссию о предмете отечественного конституционного права.\n\n**Ответ:**\n\n- **США (1787)** — одна из самых кратких и старых действующих конституций; основной текст регулирует организацию власти (три ветви, федерализм, порядок избрания и полномочия); права и свободы закреплены отдельно, в Билле о правах (первые 10 поправок) и последующих поправках.\n- **Франция (1958, V Республика)** — регулирует организацию полупрезидентской республики, статус Президента и Правительства; права и свободы прямо не перечислены в основном тексте, а инкорпорированы через преамбулу отсылкой к Декларации прав человека и гражданина 1789 г. и преамбуле Конституции 1946 г.\n- **ФРГ (Основной закон, 1949)** — начинается с подробной главы «Основные права» (права идут первыми, до организации власти); закрепляет федеративное устройство, принципы правового и социального государства; отдельные положения (человеческое достоинство, федеративное устройство, разделение властей) объявлены неизменяемыми (ст. 79 ч. 3).\n- **Испания (1978)** — устанавливает парламентарную монархию, широкую региональную автономию, подробный каталог прав и свобод.\n- **Бразилия (1988)** — одна из самых объёмных конституций мира, детально регулирует социальные и экономические права, окружающую среду, права коренных народов.\n- **Мексика (1917)** — исторически одна из первых, закрепивших развёрнутые социально-экономические (аграрные, трудовые) права.\n- **Турция (1982)** — подробно регулирует организацию власти и светский характер государства; права и свободы сформулированы с существенными оговорками об ограничениях.\n\n**Вывод для дискуссии:** Конституция РФ 1993 г. по структуре близка к «европейской» модели — отдельная глава об основах конституционного строя (гл. 1), подробная глава о правах и свободах (гл. 2), во многом основанная на международных стандартах, главы о федеративном устройстве и системе органов власти. По объёму она короче бразильской и мексиканской, но содержательнее американской. Предмет отечественного конституционного права в целом совпадает с предметом конституционного права большинства государств — различия связаны в основном со степенью детализации и национальными приоритетами (например, повышенное внимание к социальным правам в Бразилии и Мексике).\n\n---\n\n### Практическое задание 2. Назовите сферы общественных отношений, входящие в предмет конституционного права, и приведите по 3–4 примера норм Конституции РФ по каждой сфере.\n\n**Ответ:**\n\n- **Основы конституционного строя** — ст. 1 (демократическое федеративное правовое государство с республиканской формой правления); ст. 10 (разделение властей); ст. 13 (идеологическое и политическое многообразие); ст. 14 (светский характер государства).\n- **Права и свободы человека и гражданина** — ст. 20 (право на жизнь); ст. 29 (свобода мысли и слова); ст. 31 (право на мирные собрания); ст. 35 (право частной собственности).\n- **Федеративное устройство России** — ст. 65 (состав субъектов РФ); ст. 68 (государственный язык); ст. 71–72 (разграничение предметов ведения РФ и субъектов); ст. 73 (полнота власти субъектов вне предметов ведения РФ и совместного ведения).\n- **Организация и функционирование органов государственной власти** — ст. 80–93 (статус Президента РФ); ст. 94–109 (Федеральное Собрание); ст. 110–117 (Правительство РФ); ст. 118–129 (судебная власть).\n- **Организация местного самоуправления** — ст. 130 (самостоятельное решение населением вопросов местного значения); ст. 131 (структура органов МСУ определяется населением самостоятельно); ст. 132 (полномочия органов МСУ); ст. 133 (гарантии МСУ — судебная защита, компенсация расходов).\n\n---\n\n# Задания для самостоятельного выполнения\n\n### Задание 1. Определите структуру конституционно-правовой нормы, выделите особенности. Разбейте норму на гипотезу, диспозицию и санкцию.\n\n**Ответ:**\n\n**А) Ч. 1 ст. 15:** «Конституция Российской Федерации имеет высшую юридическую силу, прямое действие и применяется на всей территории Российской Федерации. Законы и иные правовые акты, принимаемые в Российской Федерации, не должны противоречить Конституции Российской Федерации».\n\n- **Гипотеза** — текстуально не выделена, подразумевается («если в РФ принимаются законы и иные правовые акты…») и слита с диспозицией.\n- **Диспозиция** — двухчастная: 1) декларативная — Конституция обладает высшей юридической силой, прямым действием, применяется на всей территории РФ; 2) регулятивная, императивная — принимаемые акты не должны ей противоречить.\n- **Санкция** — в тексте отсутствует; обеспечивается иными нормами (в частности, полномочиями Конституционного Суда РФ по ст. 125 признавать неконституционные акты не подлежащими применению).\n- **Особенности:** сочетание нормы-принципа и императивного предписания в одной статье; отсутствие собственной санкции — она вынесена в институт конституционного контроля.\n\n**Б) Ч. 1 ст. 85:** «Президент Российской Федерации может использовать согласительные процедуры для разрешения разногласий между органами государственной власти Российской Федерации и органами государственной власти субъектов Российской Федерации, а также между органами государственной власти субъектов Российской Федерации. В случае недостижения согласованного решения он может передать разрешение спора на рассмотрение соответствующего суда».\n\n- **Гипотеза** — двухзвенная: 1) наличие разногласий между органами власти РФ и субъектов РФ (либо между органами власти субъектов); 2) недостижение согласованного решения — условие для второго варианта поведения.\n- **Диспозиция** — тоже двухзвенная, управомочивающая («может»): 1) использовать согласительные процедуры; 2) передать спор в суд.\n- **Санкция** — отсутствует.\n- **Особенности:** составная (двухступенчатая) гипотеза, соответствующая двум последовательным вариантам поведения; дискреционный характер нормы («может», а не «обязан») — типично для норм-полномочий главы государства; санкция отсутствует, так как речь идёт о праве, а не об обязанности.\n\n**Общий вывод:** конституционно-правовые нормы часто не содержат всех трёх элементов классической структуры (санкция либо отсутствует, либо находится в других нормах), а гипотеза нередко не формулируется отдельно, а вплетена в диспозицию.\n\n---\n\n### Задание 2. Проанализируйте перечисленные нормы Конституции РФ и укажите: а) императивные они или диспозитивные; б) обязывающие, запрещающие или управомочивающие.\n\n**Ответ:**\n\nОбщий принцип: обязывающие и запрещающие нормы, как правило, императивны (не допускают отступления); управомочивающие — как правило, диспозитивны (субъект сам решает, воспользоваться правом или нет). Составные (смешанные) нормы отмечены отдельно.\n\n- **Ч. 2 ст. 9** (формы собственности на землю) — диспозитивная, управомочивающая.\n- **Ч. 3 ст. 13** (политическое многообразие, многопартийность) — диспозитивная, управомочивающая.\n- **Ч. 4 ст. 13** (равенство объединений перед законом) — императивная, обязывающая.\n- **Ч. 5 ст. 13** (запрет экстремистских объединений) — императивная, запрещающая.\n- **Ч. 1 ст. 27** (свобода передвижения) — диспозитивная, управомочивающая.\n- **Ч. 2 ст. 27** (выезд из РФ / возвращение в РФ) — диспозитивная, управомочивающая.\n- **Ч. 2 ст. 35** (владение, пользование, распоряжение имуществом) — диспозитивная, управомочивающая.\n- **Ч. 3 ст. 35** (запрет лишения имущества без суда + условие возмещения) — императивная; смешанная — запрещающая (1-е предложение) и обязывающая (2-е предложение).\n- **Ч. 1 ст. 47** (право на своего судью) — императивная, запрещающая («никто не может быть лишён…»).\n- **Ч. 2 ст. 47** (суд присяжных) — диспозитивная, управомочивающая.\n- **Ч. 1 ст. 51** (свидетельский иммунитет) — диспозитивная, управомочивающая (сформулирована как отсутствие обязанности, по сути — право).\n- **Ч. 2 ст. 51** (иные случаи освобождения от показаний) — диспозитивная, управомочивающая (адресована законодателю).\n- **Ст. 57** (уплата налогов + запрет обратной силы) — императивная; смешанная — обязывающая (1-е предложение) и запрещающая (2-е предложение).\n- **Ч. 5 ст. 66** (изменение статуса субъекта РФ) — диспозитивная, управомочивающая.\n- **Ч. 3 ст. 76** (иерархия законов) — императивная, запрещающая.\n- **Ч. 4 ст. 76** (собственное регулирование субъектов РФ) — диспозитивная, управомочивающая.\n- **Ч. 2 ст. 85** (приостановление актов исполнительной власти субъектов) — диспозитивная, управомочивающая.\n- **Ст. 89** (полномочия Президента: гражданство, награды, помилование) — императивная по обязательности осуществления функции, управомочивающая по содержанию — типичная норма-компетенция, сочетающая оба признака.\n- **Ч. 1 ст. 97** (цензы депутата Госдумы) — императивная (жёсткий перечень условий); смешанная — управомочивающая (право быть избранным при соблюдении условий) и запрещающая (запрет счетов за рубежом).\n- **Ч. 2 ст. 97** (несовместимость мандатов) — императивная, запрещающая.\n- **Ч. 3 ст. 97** (профессиональная основа + запрет иной деятельности) — императивная; смешанная — обязывающая и запрещающая (с исключением для преподавательской, научной и творческой деятельности).\n- **Ст. 106** (обязательное рассмотрение законов в Совете Федерации) — императивная, обязывающая.\n- **Ст. 117** (отставка Правительства, вотум недоверия, вопрос о доверии) — преимущественно диспозитивная, управомочивающая — описывает дискреционные полномочия Правительства, Президента и Госдумы («может», «вправе»).\n"},{"id":"const-3","title":"Тема 1. Вопросы 3–5","short":"Вопросы 3–5","date":"28 сен","md":"### Вопрос 3. Конституционно-правовые отношения. Особенности субъектов и объектов конституционно-правовых отношений. Влияние политики на развитие конституционно-правовых отношений.\n\n**Ответ:**\n\n**1. Понятие и структура**  \nКонституционно-правовое отношение — общественное отношение, урегулированное нормами конституционного права, между гражданином и государством, между федеральными органами власти и органами власти субъектов, иными субъектами. Структура: субъект, объект, содержание (юридическое — права и обязанности; фактическое — реальное поведение).\n\n**2. Особенности субъектов**\n\n- делятся на индивидуальных (граждане, иностранцы, лица без гражданства) и коллективных (государство и его органы, народ, нации и национальные меньшинства, общественные объединения, органы МСУ);\n- ряд субъектов существует только в конституционном праве и не встречается в других отраслях (субъект РФ, избирательный округ, депутатская фракция, народ как самостоятельный субъект);\n- особый субъектный состав — конституционно-правовые отношения объективные, фактические отношения, политического характера, им свойственен особый субъективный состав.\n\n**3. Особенности объектов**\n\n- выходят за пределы материальных благ, типичных для гражданского права: территория государства, гражданство, суверенитет, государственная власть, свобода, достоинство человека, жизнь, целостность государства;\n- объектом часто выступает само политико-правовое состояние (статус, устройство, полномочие), а не вещь или конкретное действие.\n\n**4. Общая специфика отношений**\n\n- значительное разнообразие, создающее многослойные юридические связи между субъектами;\n- большой удельный вес общих (общерегулятивных) отношений — многие нормы вообще не имеют конкретного второго субъекта (например, «гражданин РФ обладает всей полнотой прав»), в отличие от классических двусторонних обязательств гражданского права.\n\n**5. Влияние политики**\n\n- конституционное право регулирует прежде всего политическую деятельность и взаимоотношения ее участников, упорядочивает политическую борьбу через правила (выборы, полномочия, сроки);\n- обратный эффект — само конституционное право чувствительнее к смене политического курса, чем «технические» отрасли (гражданское, трудовое), поскольку напрямую фиксирует расстановку власти;\n- показательный пример — поправки к Конституции 2020 г., изменившие статус Госсовета и соотношение полномочий Президента, Правительства и парламента.\n\n---\n\n### Вопрос 4. Конституционное право как наука.\n\n**Ответ:**\n\n**1. Понятие**  \nНаука конституционного права — совокупность, система взглядов, принципов, идей, представлений, научных знаний о конституционном праве как отрасли права и регулируемых её нормами общественных отношениях. Предмет науки шире предмета отрасли — включает и практику применения норм, и историю развития, и доктринальные споры.\n\n**2. Функции науки:**\n\n- теоретико-познавательная — разработка понятийного аппарата, изучение закономерностей развития конституционных отношений;\n- методологическая — влияние на смежные отраслевые науки;\n- духовно-идеологическая (воспитательная) — формирование конституционного мировоззрения и правосознания;\n- практико-организационная — научные выводы определяют развитие отраслевого законодательства и правоприменительной практики;\n- прогностическая — прогнозирование последствий тех или иных конституционных установлений.\n\n**3. Источники науки** (не путать с источниками отрасли) — труды отечественных и зарубежных конституционалистов, а также смежные исследования политологов, социологов, историков.\n\n---\n\n### Вопрос 5. Конституционное право как учебная дисциплина.\n\n**Ответ:**\n\n- учебная дисциплина — способ передачи знаний, добытых наукой, студентам; по содержанию вторична по отношению к науке — система дисциплины практически идентична системе науки и выражается в учебной программе;\n- отличия от науки: дисциплина не включает дискуссионные, окончательно не устоявшиеся положения в той же мере, что и наука; её задача — не открытие нового знания, а систематизированная передача уже полученного;\n- тесно связана с общетеоретическими (теория государства и права, история государства и права) и отраслевыми дисциплинами (административное, муниципальное, уголовное право), что позволяет комплексно осваивать материал.\n\n---\n\n### Практическое задание 1. Найдите статьи, детально регулирующие конституционно-правовые отношения, и статьи общего регулирования, получающие развитие в других отраслях. Имеют ли статьи-принципы и статьи-дефиниции нормативную природу?\n\n**Ответ:**\n\n**Детально регулирующие конкретное отношение:**\n\n- ст. 65 (закрытый перечень и состав субъектов РФ);\n- ст. 111 (порядок и сроки представления кандидатуры Председателя Правительства);\n- ст. 117 (процедура выражения недоверия Правительству);\n- ст. 66 (порядок изменения статуса субъекта РФ).\n\n**Статьи общего регулирования, развиваемые в других отраслях:**\n\n- ст. 8 (свобода экономической деятельности → ГК РФ);\n- ст. 34–36 (право собственности → ГК РФ);\n- ст. 37 (свобода труда → ТК РФ);\n- ст. 43 (право на образование → ФЗ «Об образовании»);\n- ст. 57 (обязанность платить налоги → НК РФ).\n\n**Нормативная природа статей-принципов и дефиниций:** да, обладают нормативной природой. Ещё в советской теории права (С.А. Голунский) обосновывалось, что декларации обладают нормативным характером наряду с нормами-правилами поведения и в блоке с ними оказывают регулирующее воздействие на общественные отношения, а потому их следует рассматривать как органическую часть действующего права. Это подтверждается и текстом самой Конституции: согласно ч. 1 ст. 15, Конституция имеет высшую юридическую силу и прямое действие — а значит, и нормы-принципы, нормы-цели, нормы-дефиниции гл. 1 (например, «РФ — демократическое федеративное правовое государство», «человек, его права и свободы — высшая ценность») действуют напрямую. Разница лишь в способе реализации: они применяются не к конкретному спору напрямую, а через толкование Конституционным Судом при проверке иных норм и через конкретизацию в отраслевом законодательстве.\n\n---\n\n### Практическое задание 2. Найдите конституционно-правовые отношения, связанные с непосредственным волеизъявлением народа, формированием высших органов власти, защитой прав и свобод, государственным устройством РФ.\n\n**Ответ:**\n\n- **Непосредственное волеизъявление народа** — ст. 3 ч. 3 (референдум и свободные выборы — высшее непосредственное выражение власти народа); гл. 9 (порядок пересмотра Конституции и принятия поправок).\n- **Формирование высших органов государственной власти** — ст. 81–82 (выборы и вступление в должность Президента); ст. 95–97 (формирование Совета Федерации и Государственной Думы); ст. 111 (назначение Председателя Правительства).\n- **Защита основных прав и свобод** — ст. 45 (гарантии государственной защиты); ст. 46 (право на судебную защиту, включая обращение в межгосударственные органы); ст. 125 (жалобы граждан в Конституционный Суд).\n- **Государственное устройство РФ** — ст. 65 (состав субъектов); ст. 71–73 (разграничение предметов ведения); ст. 77 (система органов власти субъектов РФ).\n\n---\n\n### Практическое задание 3. Раскройте правовой смысл понятия «народ» как субъекта конституционных отношений.\n\n**Ответ:**\n\n- **Юридико-техническое значение** — с юридической точки зрения понятие «народ» отождествляется с понятием «граждане» и означает принадлежность совокупности людей, ассоциированных в рамках единого государства, к этому государству.\n- **Не тождественно «избирательному корпусу»** — понятие народа шире: несправедливо исключать из его состава лишённых избирательных прав по разным причинам, а также детей, не включённых в число избирателей по возрасту.\n- **Народ как носитель суверенитета** — согласно ст. 3 ч. 1 Конституции РФ, народ является носителем суверенитета и единственным источником власти в стране; как участник конституционных отношений народ не может обладать правовым статусом, как отдельные индивиды, — это самостоятельный, качественно иной субъект.\n- **Народ как участник конкретных правоотношений** — помимо абстрактного статуса источника власти, народ выступает участником конкретных процедур: формирования органов государственной и муниципальной власти, всенародного обсуждения, референдума.\n- **Структура конституционного статуса народа** — правосубъектность (право- и деликтоспособность), принципы правового статуса, права и обязанности, конституционная ответственность, гарантии правового статуса.\n\n**Вывод для дискуссии:** «народ» в конституционном праве одновременно (1) юридический синоним «граждан», (2) абстрактный источник учредительной власти и суверенитета, стоящий выше конкретного электорального состава, и (3) реальный коллективный участник отдельных процедур (референдум, выборы) — смешение этих трёх значений — типичная ошибка при анализе статей о «власти народа».\n"},{"id":"const-4","title":"Тема 2. Источники конституционного права РФ","short":"Источники","date":"","md":"## Семинарское занятие 1\n\n### Вопрос 1. Источники конституционного права: понятие и виды\n\n**Ответ:**\n\n**Понятие.** Источник конституционного права — внешняя форма, в которой закреплены нормы, регулирующие основы конституционного строя, права и свободы, федеративное устройство и организацию публичной власти. Решающее значение имеет содержание акта: нормативный акт становится источником этой отрасли, если содержит конституционно-правовые нормы (а не его название или уровень).\n\n**Виды источников:**\n\n- **Конституция РФ** — основной источник.\n- **Законы** — федеральные конституционные законы, федеральные законы, законы РФ о поправках к Конституции; конституции республик, уставы и законы субъектов РФ.\n- **Иные нормативные правовые акты** — акты Президента, палат Федерального Собрания, Правительства, субъектов РФ и органов местного самоуправления, если они регулируют конституционные отношения.\n- **Общепризнанные принципы и нормы международного права и международные договоры РФ** — Конституция включает их в правовую систему страны.\n- **Решения Конституционного Суда РФ** — обязательны на всей территории России для органов власти, организаций, должностных лиц и граждан; в науке их правовые позиции рассматривают как особый источник права, точная квалификация обсуждается.\n- **Постановления Пленума Верховного Суда РФ** — дают разъяснения по вопросам судебной практики; самостоятельный статус как источника права также оценивают по-разному.\n- **Учебники и научные статьи** — помогают изучать и толковать право, но сами по себе не являются общеобязательными нормативными актами.\n\n---\n\n### Вопрос 2. Конституция РФ — основной источник российского конституционного права\n\n**Ответ:**\n\n**Центральное место в системе источников:** ч. 1 ст. 15 устанавливает: «Конституция Российской Федерации имеет высшую юридическую силу, прямое действие». Законы и иные правовые акты не должны ей противоречить.\n\n**Значение Конституции:**\n\n- закрепляет основы государственного устройства и федерализма;\n- устанавливает права и свободы человека, принципы организации государственных органов и местного самоуправления;\n- определяет полномочия публичной власти и рамки, в которых принимаются остальные нормативные акты;\n- действует непосредственно — её нормы применяются, а не только служат ориентиром для законодателя.\n\n**Место международных норм:** ч. 4 ст. 15 включает общепризнанные принципы, нормы международного права и международные договоры РФ в правовую систему страны и предусматривает применение договорных правил, если они отличаются от правил закона.\n\n---\n\n### Вопрос 3. Место и роль законов. Виды федеральных законов\n\n**Ответ:**\n\n- Законы конкретизируют положения Конституции: устанавливают порядок реализации прав, регулируют выборы и референдумы, организацию органов власти, федеративные отношения и гарантии прав граждан; должны соответствовать Конституции и приниматься в пределах установленной ею компетенции.\n- Ст. 76 различает федеральные конституционные законы и федеральные законы; «Федеральные законы не могут противоречить федеральным конституционным законам». В вопросах ведения России и совместного ведения федеральное законодательство действует по всей стране; в вопросах исключительного ведения субъекта РФ Конституция допускает приоритет его нормативного акта при противоречии с федеральным законом.\n- **Закон РФ о поправке к Конституции** имеет особый статус — это не обычный ФЗ и не ФКЗ. Поправки к главам 3–8 принимаются в порядке, предусмотренном для ФКЗ, и вступают в силу после одобрения законодательными органами не менее ⅔ субъектов РФ. Конституционный Суд в Постановлении от 31 октября 1995 года № 12-П подтвердил, что для таких поправок требуется отдельная форма правового акта — закон РФ о поправке к Конституции.\n\n**Краткий вывод:** Конституция задаёт основу и пределы правового регулирования; федеральные законы развивают её нормы; ФКЗ и ФЗ различаются по предмету и процедуре принятия, а акты иного уровня должны соответствовать установленному Конституцией разграничению полномочий.\n\n---\n\n### Вопрос 4. Подзаконные нормативные правовые акты как источники конституционного права\n\n**Ответ:**\n\n- Подзаконный акт становится источником конституционного права, если содержит общеобязательные нормы, регулирующие конституционные отношения. Индивидуальный акт (например, решение о назначении конкретного лица) источником права обычно не является.\n- К таким актам относятся указы Президента, постановления и распоряжения Правительства, нормативные акты федеральных органов исполнительной власти, субъектов РФ и органов местного самоуправления — они конкретизируют законодательное регулирование и принимаются в пределах компетенции соответствующего органа.\n\n**Пределы их действия:**\n\n- указы и распоряжения Президента обязательны на всей территории РФ, но «не должны противоречить Конституции Российской Федерации и федеральным законам»;\n- Правительство издаёт постановления и распоряжения «на основании и во исполнение» Конституции, федеральных законов и актов Президента; в случае противоречия они могут быть отменены Президентом.\n\n**Вывод:** подзаконные акты — производные источники: действуют ниже Конституции и законов и не могут изменять их содержание.\n\n---\n\n### Вопрос 5. Международно-правовые нормы и международная судебная практика\n\n**Ответ:**\n\n**Международные нормы и договоры:**\n\n- ч. 4 ст. 15 устанавливает, что общепризнанные принципы и нормы международного права и международные договоры РФ «являются составной частью ее правовой системы»; если договор устанавливает правила, отличающиеся от предусмотренных законом, применяются правила договора;\n- положения официально опубликованного договора применяются непосредственно, если для их реализации не требуется принять внутригосударственный акт; иные положения действуют через такой акт;\n- при этом Конституция сохраняет высшую юридическую силу: ст. 79 предусматривает, что решения межгосударственных органов, основанные на международном договоре в истолковании, противоречащем Конституции, не подлежат исполнению в России (вопрос может быть поставлен перед Конституционным Судом).\n\n**Международная судебная практика:**\n\n- решения международных судов могут разъяснять содержание договора и влиять на понимание конституционных прав, но их нельзя автоматически приравнять к закону или считать общеобязательным прецедентом для всех государств — юридическая сила решения зависит от договора и юрисдикции суда (например, по ст. 46 Европейской конвенции окончательное постановление ЕСПЧ обязательно для государства-участника дела);\n- показательный пример — Постановление КС РФ от 19 апреля 2016 года № 12-П по делу «Анчугов и Гладков против России»: КС признал невозможным исполнение постановления ЕСПЧ в части, требовавшей изменить российское законодательство, поскольку Конституция РФ устанавливала запрет на участие в выборах осуждённых, отбывающих наказание в местах лишения свободы;\n- КС РФ также указывал, что правовые позиции о практике ЕСПЧ нельзя автоматически переносить на решения любых других межгосударственных судов (в частности, Суда ЕАЭС) — значение каждого решения определяется отдельно, с учётом его полномочий, договора и российской Конституции.\n\n**Актуальная оговорка по ЕСПЧ:** Россия перестала быть участником Европейской конвенции 16 сентября 2022 года; ЕСПЧ сохраняет компетенцию рассматривать жалобы на действия и бездействие, имевшие место до этой даты. Вместе с тем российский закон устанавливает, что постановления ЕСПЧ, вступившие в силу после 15 марта 2022 года, в России не исполняются — это разные временные границы: первая касается юрисдикции ЕСПЧ, вторая — исполнения его решений в России.\n\n**Итог:** международные нормы могут быть частью российского конституционного права, а международная судебная практика имеет прежде всего толковательное значение; их применение в России ограничено Конституцией и специальным порядком проверки решений международных органов.\n\n---\n\n## Практические задания\n\n### Практическое задание 1. Законы о поправках и федеральные конституционные законы\n\n**Ответ:**\n\nСогласно Постановлению КС РФ от 31 октября 1995 года № 12-П, закон о поправке к Конституции — особый правовой акт, отличный от федерального закона и ФКЗ. Поэтому суффикс «-ФКЗ» в номере не означает, что такой акт является федеральным конституционным законом; КС РФ также указывал на особый статус закона о поправке, превышающий статус ФКЗ.\n\n**Законы РФ о поправке к Конституции (ст. 136):**\n\n- от 30 декабря 2008 года № 6-ФКЗ «Об изменении срока полномочий Президента Российской Федерации и Государственной Думы»;\n- от 30 декабря 2008 года № 7-ФКЗ «О контрольных полномочиях Государственной Думы в отношении Правительства Российской Федерации»;\n- от 5 февраля 2014 года № 2-ФКЗ «О Верховном Суде Российской Федерации и прокуратуре Российской Федерации»;\n- от 14 марта 2020 года № 1-ФКЗ «О совершенствовании регулирования отдельных вопросов организации и функционирования публичной власти».\n\n**Примеры федеральных конституционных законов:**\n\n- от 21 июля 1994 года № 1-ФКЗ «О Конституционном Суде Российской Федерации»;\n- от 31 декабря 1996 года № 1-ФКЗ «О судебной системе Российской Федерации»;\n- от 30 мая 2001 года № 3-ФКЗ «О чрезвычайном положении»;\n- от 28 июня 2004 года № 5-ФКЗ «О референдуме Российской Федерации»;\n- от 6 ноября 2020 года № 4-ФКЗ «О Правительстве Российской Федерации».\n\nНе стоит смешивать законы о поправках по статье 136 и ФКЗ, принятые в случаях, предусмотренных статьёй 137. Например, ФКЗ от 21 марта 2014 года № 6-ФКЗ изменил положения статьи 65 в связи с образованием новых субъектов. КС РФ разъяснил: принятие или образование нового субъекта оформляется ФКЗ, а изменение только наименования субъекта — указом Президента; процедура статьи 136 для переименования не требуется.\n\n### Практическое задание 2. Система федеральных источников конституционного права\n\n**Ответ:**\n\n- В обычной законодательной иерархии Конституция имеет высшую юридическую силу; ФКЗ не могут ей противоречить, а федеральные законы не могут противоречить ФКЗ. КС РФ в Постановлении от 29 июня 2004 года № 13-П пояснил, что Конституция употребляет выражение «федеральный закон» и в широком смысле (включая ФКЗ), и в узком (для обычных федеральных законов); законодатель может установить приоритет УПК в сфере уголовного судопроизводства — это не ставит кодекс выше Конституции или ФКЗ.\n- Закон о поправке к Конституции не следует помещать в эту «лестницу» как обычный закон — это самостоятельный конституционный акт, который после вступления в силу изменяет сам конституционный текст.\n- Решения Конституционного Суда также имеют особое положение: они обязательны, но не являются обычной ступенью законодательной иерархии.\n- Пределы подзаконных актов: указы Президента обязательны на всей территории РФ, но не должны противоречить Конституции и федеральным законам; акты Правительства издаются на основании и во исполнение Конституции, законов и актов Президента.\n\n**Особое место решений КС РФ** — в системе источников их лучше показывать отдельно от законодательной «лестницы»: они обязательны и могут устанавливать обязательное конституционное истолкование или лишать неконституционные нормы юридической силы. Примеры из задания:\n\n- Постановление от 31.10.1995 № 12-П — особая форма закона о поправке;\n- Постановление от 28.11.1995 № 15-П — порядок изменения наименования субъекта по статье 137;\n- Постановление от 30.04.1996 № 11-П — проверка президентского указа № 1969;\n- Постановление от 29.06.2004 № 13-П — соотношение ФКЗ и федерального закона.\n\n### Практическое задание 3. Примеры общепризнанных принципов и норм международного права\n\n**Ответ:**\n\n- Пленум Верховного Суда РФ называет среди общепризнанных принципов принцип всеобщего уважения прав человека и принцип добросовестного выполнения международных обязательств. Общепризнанная норма — правило поведения, которое международное сообщество государств в целом признаёт юридически обязательным.\n- Первые четыре принципа прямо перечислены в статье 2 Устава ООН, а Декларация 1970 года раскрывает, в частности, принципы невмешательства и самоопределения. Запреты пыток и рабства закреплены, например, в Международном пакте о гражданских и политических правах.\n- Термины «общепризнанный принцип» и jus cogens в научной литературе не всегда считают тождественными: Ануфриева отмечает, что соотношение этих понятий остаётся дискуссионным. Поэтому не следует автоматически называть каждую общепризнанную норму императивной.\n\n### Практическое задание 4. Приоритет международных договоров и Конституция РФ\n\n**Ответ:**\n\n**Краткий ответ:** часть 4 статьи 15 Конституции сама по себе не устанавливает приоритет международного договора над Конституцией. Статья 15 закрепляет, что Конституция имеет высшую юридическую силу, а правило о применении международного договора сформулировано применительно к расхождению с законом. Это подтверждают и другие положения: Конституционный Суд может проверить международный договор до его вступления в силу, а договор, не соответствующий Конституции, не подлежит введению в действие и применению; международный договор и основанное на нём толкование международного суда не отменяют верховенство Конституции во внутренней правовой системе.\n\n**Три научных подхода к соотношению:**\n\n1. **Широкое международно-правовое прочтение** — ч. 4 ст. 15 понимают как выражение примата международного права в национальной системе; в некоторых версиях приоритет распространяют и на нормы Конституции, особенно в сфере прав человека.\n2. **Конституционный приоритет** — международный договор имеет правоприменительный приоритет перед законами в пределах статьи 15(4), но не перед Конституцией (этот подход в итоге обосновывает Хлопов).\n3. **Согласование двух правопорядков** — сначала следует искать толкование, позволяющее исполнить договор без конфликта с Конституцией; при этом верховенство Конституции внутри страны не снимает международных обязательств государства (ст. 27 Венской конвенции о праве международных договоров запрещает ссылаться на внутреннее право как на оправдание неисполнения договора — но это вопрос международной ответственности, а не внутренней иерархии источников).\n\n**Кто разрешает коллизию закона и договора:**\n\n- в конкретном деле — суд, рассматривающий дело: по разъяснениям Пленума ВС РФ непосредственно применяется вступивший в силу, обязательный для России, официально опубликованный договор, если его положение не требует дополнительного внутригосударственного акта и способно порождать права и обязанности для участников дела;\n- договор, согласие на обязательность которого дано федеральным законом, имеет приоритет в применении перед законами; договор, по которому согласие дано в иной форме, — перед соответствующими подзаконными актами; выбор судом применимого правила сам по себе не отменяет закон;\n- Конституционный Суд решает другой вопрос — соответствует ли закон Конституции; отдельной процедуры проверки действующего договора на конституционность КС не проводит; отдельное полномочие Суда касается исполнения решений межгосударственных органов в предусмотренных Конституцией случаях.\n\n**Статья 79 (новая редакция)** регулирует не общую иерархию договоров и законов, а участие России в межгосударственных объединениях и исполнение решений межгосударственных органов: допускает передачу объединению части полномочий при условии, что это не ограничивает права и свободы и не противоречит основам конституционного строя; решения межгосударственных органов, основанные на договоре в толковании, противоречащем Конституции, не подлежат исполнению — вопрос разрешает КС РФ в порядке, установленном ФКЗ. То есть ст. 79 не отменяет правило ст. 15(4) о приоритете договора перед обычным законом, а устанавливает механизм для ситуации, когда Конституции противоречит именно толкование договора.\n\nПример — Постановление КС РФ от 19 апреля 2016 года № 12-П по делу «Анчугов и Гладков против России»: КС признал невозможным исполнение решения ЕСПЧ в части общих мер, требовавших изменить регулирование вопреки ч. 3 ст. 32 Конституции (о лишении избирательного права осуждённых, отбывающих наказание в местах лишения свободы) — это пример разрешения конкретного конституционного конфликта, а не признание общего приоритета российского закона над международным договором.\n\n---\n\n## Справочный блок (для ссылок в ответах)\n\n**Нормативные правовые акты:** Конституция РФ; Всеобщая декларация прав человека 1948 г.; Венская конвенция о праве международных договоров 1969 г.; ФКЗ от 21.07.1994 № 1-ФКЗ «О Конституционном Суде РФ»; ФКЗ от 06.11.2020 № 4-ФКЗ «О Правительстве РФ»; ФЗ от 14.06.1994 № 5-ФЗ «О порядке опубликования и вступления в силу...»; ФЗ от 15.07.1995 № 101-ФЗ «О международных договорах РФ»; Указ Президента РФ от 23.05.1996 № 763.\n\n**Решения КС РФ:** Постановления от 31.10.1995 № 12-П; от 28.11.1995 № 15-П; от 04.04.1996 № 9-П; от 30.04.1996 № 11-П; Определение от 07.10.1997 № 88-О; Постановление от 15.07.1999 № 11-П; от 29.06.2004 № 13-П; Определение от 24.02.2005 № 22-О; Постановление от 19.04.2016 № 12-П; Определение от 24.12.2020 № 2867-О-Р.\n\n**Постановления Пленума ВС РФ:** от 10.10.2003 № 5; от 09.07.2019 № 24.\n\n**Литература:** Авакьян С.А. (2014); Баглай М.В. (2019); Богдановская И.Ю. (2018); Виноградов В.А., Масленникова С.В., Мазаев В.Д. (2022); Витрук Н.В. (2016); Жеребцова Е.Е. (2010); Кутафин О.Е. (2002).\n\n**Доп. литература:** Ануфриева Л.П. (2018); Лебедева Н.В. (2017); Лозовская С.В. (2022); Малахов В.П., Лановая Г.М. (2017); Митин Г.Н. (2022); Панкова О.В. (2020); Переплеснина Е.М. (2019); Пресняков М.В. (2017); Тарабан Н.А. (2020); Уваров А.А. (2021).уц\n"},{"id":"const-5","title":"Тема 3. Конституционно-правовая ответственность","short":"Ответственность","date":"13 окт","md":"*Семинар по теме 3 (конституционно-правовая ответственность): 5 вопросов, 3 практических задания, 4 задачи. Нормы Конституции даны по тексту в редакции с поправками 2020 г.; реквизиты постановлений КС и положения ФЗ, которые не удалось сверить по первоисточнику, помечены «(сверить)».*\n\n## Вопросы для обсуждения\n\n### Вопрос 1. Конституционно-правовая ответственность как вид юридической ответственности, её место в системе институтов конституционного права\n\n**Ответ:**\n\n**1. Понятие.** Вид юридической ответственности: применение уполномоченными органами к субъектам конституционных правоотношений мер государственного принуждения (санкций) за конституционное правонарушение в особом порядке. Цель — охрана Конституции и восстановление конституционной законности, а не «наказание» в уголовно-правовом смысле. Правовая основа обязанности — ч. 2 ст. 15 Конституции: органы власти, должностные лица, граждане и объединения обязаны соблюдать Конституцию и законы.\n\n**2. Признаки (чем отличается от других видов ответственности):**\n\n- субъекты — преимущественно публичные: органы власти, должностные лица, депутаты, избирательные комиссии, общественные объединения (партии); граждане — ограниченно;\n- основание — нарушение норм конституционного права (конституционный деликт);\n- санкции специфические: отрешение, роспуск органа, досрочное прекращение полномочий, отзыв, лишение мандата, признание акта неконституционным, запрет и ликвидация объединения;\n- особая процедура: участие суда (КС, ВС), палат парламента, Президента, нередко квалифицированное большинство;\n- источники — Конституция, ФКЗ, ФЗ, конституции и уставы субъектов, а не КоАП и УК.\n\n**3. Спор в науке.** Сторонники самостоятельного вида (Н.М. Колосова, С.А. Авакьян, В.А. Виноградов): у неё свои основания, субъекты, санкции и процедуры. Сомнения: часть мер не связана с правонарушением (недоверие Правительству, отставка), нет единого закона, санкции разнородны. Отсюда деление: ответственность за деликт (юридическая) и политическая (по доверию), граница между ними размыта.\n\n**4. Место в системе.** Институт конституционного права и элемент механизма охраны Конституции (наряду с конституционным контролем, надзором, гарантиями) — Виноградов, Шульженко. Связана с принципами разделения властей, федерализма, подотчётности власти. От уголовной, административной, дисциплинарной отличается основанием, субъектами и органами; они могут применяться одновременно.\n\n---\n\n### Вопрос 2. Основания конституционно-правовой ответственности\n\n**Ответ:**\n\n**1. Три группы оснований:**\n\n- нормативное — норма Конституции или закона, предусматривающая санкцию (без неё ответственность невозможна, принцип законности);\n- фактическое — конституционное правонарушение: издание акта, противоречащего Конституции или закону, неисполнение решения суда или КС, нарушение запретов и ограничений, бездействие;\n- процессуальное — акт компетентного органа (решение суда, постановление палаты, указ Президента).\n\n**2. Не только деликт.** Иногда фактическое основание — не правонарушение, а обстоятельство: утрата доверия, невозможность сформировать орган (троекратное отклонение кандидатуры Председателя Правительства, ч. 4 ст. 111), выражение недоверия. Здесь ответственность граничит с политической.\n\n**3. Вина.** В литературе вина понимается шире, чем в уголовном праве (Виноградов), применительно к коллегиальным органам — отношение органа к решению. КС исходит из того, что санкции (в частности, роспуск и отрешение) допустимы лишь за виновное и существенное нарушение, после того как нарушителю дан срок для устранения (Постановление КС № 8-П от 04.04.2002, сверить формулировку).\n\n**4. Примеры оснований:** Президент — государственная измена или иное тяжкое преступление (ст. 93); Дума — три отклонения кандидатур на должность Председателя Правительства; Правительство — недоверие; высшее должностное лицо или законодательный орган субъекта — нарушение Конституции и законов, подтверждённое судом, и неисполнение решения суда; депутат — нарушение запретов и ограничений; судья — поступок, порочащий честь и достоинство; общественное объединение — экстремистская деятельность.\n\n---\n\n### Вопрос 3. Субъекты конституционно-правовой ответственности\n\n**Ответ:**\n\n**1. Классификация субъектов:**\n\n- федеральные органы и должности: Президент РФ (ст. 93), Государственная Дума (роспуск: ст. 84, 109, 111, 117), Правительство (отставка, ст. 117);\n- депутаты Госдумы и члены Совета Федерации (досрочное прекращение полномочий по ФЗ «О статусе…»);\n- судьи: особый режим для судей по ст. 102 Конституции и общий для остальных;\n- органы государственной власти субъектов РФ: законодательный (роспуск) и высшее должностное лицо (отрешение);\n- органы и должностные лица местного самоуправления: отзыв депутата и выборного должностного лица, удаление главы муниципального образования в отставку;\n- избирательные комиссии, кандидаты (отмена регистрации);\n- общественные объединения, партии, СМИ (предупреждение, приостановление, ликвидация, запрет);\n- граждане — ограниченно (Трофимова); дискуссионна ответственность самого государства и субъектов РФ как коллективных субъектов.\n\n**2. Особенности.** Субъект ответственности должен быть носителем власти или публичного статуса. Для одних субъектов предусмотрены иммунитеты (см. вопрос 5). Ответственность может быть индивидуальной (должностное лицо) и коллективной (орган, роспуск).\n\n---\n\n### Вопрос 4. Конституционно-правовые санкции\n\n**Ответ:**\n\n**1. Понятие.** Меры государственного принуждения, предусмотренные нормами конституционного права, которые применяются к нарушителю: либо лишают его правового статуса, либо восстанавливают конституционный порядок.\n\n**2. Виды:**\n\n- правовосстановительные: признание акта неконституционным (утрата силы, ч. 6 ст. 125), приостановление действия акта (ч. 2 ст. 85, Президент приостанавливает акты органов исполнительной власти субъектов до решения суда), обязание привести акт в соответствие;\n- личные (в отношении лица): отрешение, досрочное прекращение полномочий, отзыв, лишение мандата, объявление недоверия;\n- организационные (в отношении органа): роспуск, отставка Правительства;\n- в отношении объединений: предупреждение, приостановление деятельности, запрет (ч. 5 ст. 13), ликвидация.\n\n**3. Требования к санкциям:** предусмотрены законом; применяются компетентным органом в предусмотренной процедуре; соразмерны нарушению; допускают судебную защиту. Крайние меры (роспуск, отрешение) — исключительные.\n\n---\n\n### Вопрос 5. Процедуры осуществления ответственности. Конституционно-правовые иммунитеты\n\n**Ответ:**\n\n**1. Общая схема процедуры:** инициатива → проверка и заключение (часто судебное) → решение компетентного органа (палата, Президент, суд) → возможность обжалования. Для высших лиц — квалифицированное большинство и сроки.\n\n**2. Основные процедуры:**\n\n- Отрешение Президента (ст. 93): обвинение выдвигает Государственная Дума (не менее 1/3 депутатов, заключение специальной комиссии, 2/3 голосов), необходимы заключение Верховного Суда о наличии признаков состава преступления и заключение Конституционного Суда о соблюдении порядка выдвижения. Отрешает Совет Федерации 2/3 голосов не позднее чем через три месяца после обвинения, иначе обвинение считается отклонённым.\n- Недоверие Правительству (ч. 3 ст. 117): большинство голосов от общего числа депутатов; Президент вправе объявить об отставке или не согласиться; повторное недоверие в течение трёх месяцев — отставка или роспуск Думы. Вопрос о доверии (ч. 4 ст. 117): отказ — Президент в семидневный срок решает об отставке или о роспуске Думы.\n- Роспуск Государственной Думы: ст. 84, 109, 111 (ч. 4), 117. Ограничения роспуска (ч. 3 ст. 109): нельзя в течение года после выборов, с момента обвинения Президента, при военном или чрезвычайном положении, за шесть месяцев до окончания срока полномочий Президента (сверить).\n- Отрешение высшего должностного лица и роспуск законодательного органа субъекта: по федеральному закону об общих принципах организации публичной власти в субъектах РФ. Основание — нарушение Конституции и законов, подтверждённое судебным решением, и неисполнение его в срок; решение принимает Президент. Условия сформулированы КС в Постановлении № 8-П от 04.04.2002 (сверить с действующей редакцией ФЗ).\n- Прекращение полномочий судей: для судей по ст. 102 — Совет Федерации по представлению Президента (ст. 83, 102); для остальных — квалификационная коллегия судей, решение можно обжаловать в суд (Определение КС № 59-О от 02.03.2006, сверить).\n- Лишение мандата депутата Госдумы: решение палаты по ФЗ «О статусе…» (Постановление КС № 34-П от 27.12.2012).\n- Отзыв депутата и выборного лица МСУ: голосование избирателей по основаниям, установленным законом (Постановление КС № 7-П от 02.04.2002).\n- Ликвидация и запрет объединений: по решению суда.\n\n**3. Иммунитеты.** Особая правовая защита, меняющая порядок привлечения к ответственности, а не освобождающая от неё (Виноградов). Виды: индивидуальные и функциональные.\n\n- Президент: неприкосновенность (ст. 91), после прекращения полномочий сохраняется (ст. 92, 93: лишение — по обвинению в тяжком преступлении, процедура через Думу и Совет Федерации, сверить).\n- Члены Совета Федерации и депутаты Госдумы: неприкосновенность на срок полномочий; вопрос о лишении решает соответствующая палата по представлению Генерального прокурора (ст. 98). Также индемнитет за голосование и высказывания.\n- Судьи: неприкосновенность, привлечение к уголовной ответственности только в особом порядке (ст. 122).\n- Значение: гарантия независимости. Иммунитеты не защищают от конституционно-правовых санкций (отрешения, лишения мандата).\n\n---\n\n## Практические задания\n\n### Задание 1. Санкции в тексте Конституции и реальные примеры\n\n**Ответ:**\n\n**В Конституции:**\n\n- ст. 93: отрешение Президента от должности;\n- ст. 84 (п. «б»), 109, 111 (ч. 4), 117: роспуск Государственной Думы;\n- ст. 117: отставка Правительства, недоверие, вопрос о доверии;\n- ст. 83 и 102: прекращение полномочий судей КС, ВС, председателей, заместителей и судей кассационных и апелляционных судов Советом Федерации по представлению Президента (поправки 2020 г.);\n- ч. 2 ст. 85: приостановление Президентом актов органов исполнительной власти субъектов РФ;\n- ч. 5 ст. 13: запрет объединений, цели или действия которых направлены на насильственное изменение основ конституционного строя и т. д.;\n- ч. 6 ст. 125: акты, признанные неконституционными, утрачивают силу.\n\n**Примеры применения (из того, что известно, сверить даты):**\n\n- 1995 г.: Государственная Дума выразила недоверие Правительству Черномырдина (после событий в Будённовске), повторное голосование в июле необходимого числа голосов не набрало;\n- 1999 г.: попытка отрешить Президента Ельцина, ни один из пяти пунктов обвинения не получил 300 голосов;\n- 1998 г.: Дума отклонила кандидатуры Кириенко (дважды) и Черномырдина (дважды); до третьего отклонения не дошло;\n- 2012 г.: досрочное прекращение полномочий депутата Госдумы Г. Гудкова (Постановление КС № 34-П от 27.12.2012);\n- 2016 г.: отрешение главы Кировской области Н. Белых «в связи с утратой доверия» (после задержания);\n- 2021 г.: решение суда о признании экстремистской и ликвидации организации (Фонд борьбы с коррупцией).\n\n---\n\n### Задание 2. Могут ли санкции применяться одновременно с иными видами ответственности?\n\n**Ответ:**\n\n- Да. У видов ответственности разные основания, цели и органы, поэтому одно деяние может влечь несколько: конституционно-правовую (прекращение полномочий, отрешение, лишение мандата) и уголовную, административную, дисциплинарную, гражданско-правовую. Принцип недопустимости повторной ответственности (non bis in idem, ст. 50 Конституции) относится к ответственности одного вида за одно деяние.\n- Примеры: Президент отрешается именно за уголовно наказуемое деяние (ст. 93); депутат теряет мандат и может быть привлечён к уголовной ответственности; судья лишается полномочий и привлекается к уголовной ответственности; губернатор отрешается и преследуется по уголовному делу; партия ликвидируется, а её руководители привлекаются к административной ответственности.\n- Условие: меры должны быть соразмерны, а процедуры — самостоятельны. Решение по одному виду ответственности не заменяет другого.\n\n---\n\n### Задание 3. Принципы для законодателя по решениям КС\n\n**Ответ.** Основа — Постановление КС № 8-П от 04.04.2002 (отрешение высших должностных лиц и роспуск законодательных органов субъектов), развитое с Постановлениями № 2-П от 18.01.1996, № 10-П от 07.06.2000, № 7-П от 02.04.2002, № 34-П от 27.12.2012 (формулировки сверить с текстами).\n\n- Законность: основания, санкции и порядок — только в законе соответствующего уровня, нельзя произвольное расширение.\n- Вина: ответственность лишь за конкретное, виновное нарушение.\n- Соразмерность: тяжесть санкции соответствует тяжести нарушения, роспуск и отрешение — крайние меры.\n- Справедливость и равенство: одинаковые нарушения — одинаковые санкции.\n- Определённость: основания должны быть ясными и недвусмысленными, не оценочными («утрата доверия» без конкретизации — проблема).\n- Судебный контроль: нарушение подтверждается судебным решением, есть право обжалования санкции.\n- Возможность устранить нарушение: нарушителю даётся разумный срок на исправление, санкция применяется при неисполнении.\n- Недопустимость обратной силы закона, устанавливающего ответственность (ч. 1 ст. 54 Конституции); презумпция невиновности.\n- Защита конституционного строя и баланса властей: ответственность не должна разрушать разделение властей и самостоятельность субъектов.\n\n**О чём решения из списка (кратко):** № 11-П/2001 и № 472-О/2005 — акты об амнистии; № 28-П/1998 — толкование ч. 4 ст. 111 (роспуск Думы при троекратном отклонении кандидатуры Председателя Правительства); № 2-П/1996 — Устав Алтайского края; № 10-П/2000 и № 8-П/2002 — федеральный закон об общих принципах организации органов власти субъектов, республиканские конституции, меры ответственности органов субъектов; № 65-О и № 249-О/2001 — разъяснение определения по конституциям республик; № 1-П и № 10-П/2002 — избирательное законодательство, отмена регистрации кандидата; № 7-П/2002 — отзыв депутатов МСУ; № 34-П/2012 — прекращение полномочий депутата Госдумы; № 59-О/2006 — квалификационные коллегии судей.\n\n---\n\n## Задачи\n\n### Задача 1. Законодательное Собрание республики N приняло Гражданский кодекс Республики N\n\n**Ответ:**\n\n- Гражданское законодательство относится к ведению РФ (п. «о» ст. 71 Конституции). Республика N вышла за пределы компетенции, закон противоречит Конституции (ст. 71, 76); в случае противоречия действует федеральный закон (ст. 76).\n- Применимые санкции:\n    - правовосстановительная: признание закона неконституционным Конституционным Судом по запросу уполномоченных субъектов (п. «б» ч. 2 ст. 125), закон утрачивает силу (ч. 6 ст. 125); возможна и судебная проверка соответствия федеральному закону;\n    - организационная (крайняя): если судебное решение о несоответствии не исполнено в установленный срок — роспуск законодательного органа республики по федеральному закону об общих принципах организации публичной власти в субъектах РФ (порядок и сроки сверить);\n    - в отношении высшего должностного лица республики, подписавшего и обнародовавшего закон, — отрешение при тех же условиях (судебное решение, неисполнение в срок).\n- Субъекты: законодательный (представительный) орган республики N; при подписании закона — высшее должностное лицо.\n- Принципы по КС (8-П/2002): сначала судебное решение и разумный срок на устранение нарушения, крайние меры — лишь при его неисполнении, соразмерность.\n\n**Решение:** главная санкция — признание Гражданского кодекса республики неконституционным и утрата им силы. Роспуск Собрания или отрешение главы возможны только при неисполнении судебного решения.\n\n---\n\n### Задача 2. Губернатор освободил от должности заместителя Правительства области\n\n**Ответ:**\n\n- Само по себе освобождение — кадровое решение. Конституционно-правовой санкцией оно становится только при одновременном соблюдении условий:\n    1. основание — нарушение этим лицом норм конституционного права (Конституции, устава, закона при осуществлении властных полномочий, неисполнение решения суда);\n    2. мера предусмотрена нормой конституционного (уставного) права как санкция за такое нарушение, а не как произвольное усмотрение губернатора;\n    3. применена в установленной процедуре, нарушение подтверждено, есть возможность обжалования.\n- Если же освобождение — по собственному желанию, по соглашению, в связи с реорганизацией, увольнение за дисциплинарный проступок по законодательству о госслужбе или потеря доверия губернатора (политический мотив без нарушения), то это не конституционно-правовая санкция.\n- Отдельный случай: отставка всего правительства области после недоверия законодательного органа — политическая ответственность; она ближе к конституционной, когда недоверие связано с нарушением закона.\n\n**Решение:** освобождение будет конституционно-правовой санкцией, если оно применено в ответ на конституционное правонарушение этого должностного лица, на основании нормы, предусматривающей такую меру, и в особом порядке. В остальных случаях это кадровое или дисциплинарное решение.\n\n---\n\n### Задача 3. Отрешение высшего должностного лица субъекта «в связи с утратой доверия Президента»\n\n**Ответ:**\n\n- Позиции КС (8-П/2002, 2-П/1996, 10-П/2000): ответственность высших должностных лиц и органов субъектов допустима лишь за конкретные нарушения Конституции и законов, установленные судом, при соблюдении принципов вины, соразмерности, определённости, судебного контроля и возможности устранить нарушение. Отрешение и роспуск — крайние меры.\n- «Утрата доверия» как основание: оценочное, не связанное с конкретным правонарушением, не требует вины и судебной проверки. По этим признакам не соответствует правовым позициям КС (принцип определённости, вины, судебного контроля). Это скорее политическая ответственность перед Президентом, при том что высшее должностное лицо избирается населением (нарушается баланс народного мандата и ответственности).\n- Аргументы в защиту закона:\n    - «утрата доверия» — устоявшееся в российском праве основание, связанное с антикоррупционными требованиями (нарушение запретов, непредставление сведений, конфликт интересов) — если понимать её только так, основание конкретно;\n    - Президент — гарант Конституции и обеспечивает согласованное функционирование органов единой системы публичной власти (ст. 80, 77 в ред. 2020 г.), поэтому возможна ответственность перед ним;\n    - при мотивированном указе и судебном обжаловании требования КС соблюдены.\n- Вывод: положение соответствует позициям КС лишь при условии, что «утрата доверия» применяется как последствие конкретных, названных в законе и доказанных нарушений, с мотивировкой и возможностью судебного обжалования. В виде произвольного политического основания оно противоречит принципам определённости, вины и соразмерности, выработанным КС.\n\n**Решение:** формулировка как самостоятельное оценочное основание не соответствует позициям КС; конституционное прочтение допускает её только при привязке к конкретным нарушениям.\n\n---\n\n### Задача 4. Ответственность судей по ст. 102 и других федеральных судей после поправок 2020 г.\n\n**Ответ:**\n\n**Чем отличается:**\n\n**Судьи по ст. 102** (судьи Конституционного и Верховного судов, председатели, заместители председателей и судьи кассационных и апелляционных судов):\n\n- орган, прекращающий полномочия: Совет Федерации по представлению Президента (ст. 83, 102);\n- основания: поступок, порочащий честь и достоинство судьи, и иные случаи по ФКЗ, свидетельствующие о невозможности осуществлять полномочия;\n- природа: конституционно-правовая ответственность (политические органы, закреплена в Конституции).\n\n**Иные федеральные судьи** (первой инстанции и остальных звеньев):\n\n- орган, прекращающий полномочия: квалификационная коллегия судей;\n- основания: по Закону о статусе судей (дисциплинарная ответственность, нарушение закона и этики);\n- природа: дисциплинарная ответственность в системе судейского сообщества.\n\n**Смысл изменения процедуры (конституционно-правовой):**\n\n- Параллелизм процедур: тот, кто назначает высших судей (Президент и Совет Федерации), решает и о прекращении полномочий. До 2020 г. прекращение решали органы судейского сообщества.\n- Усиление подотчётности высшего звена судебной власти и единой системы публичной власти; Президент как гарант Конституции получает инструмент реагирования.\n- Критика (Акчурина, литература): риск для независимости и несменяемости судей (ст. 120, 121), так как политические органы получают право решать вопрос о полномочиях судей. Сдерживающий фактор — узкие основания (порочащий проступок) и необходимость мотивировать представление.\n\n**Решение:** для судей по ст. 102 действует конституционно-правовая ответственность через политические органы (Президент и Совет Федерации), для остальных — дисциплинарная, в системе судейского сообщества. Смысл изменения — синхронизировать назначение и прекращение полномочий высших судей и усилить их подотчётность, с риском для судейской независимости.\n"}]},{"id":"crim","name":"Уголовное право","hue":28,"notes":[{"id":"crim-1","title":"Понятие и место в системе права","short":"Понятие","date":"1 сен","md":"«Уголовное» — от «отвечать головой». Два подхода к пониманию отрасли:\n\n- **Приоритет:** нормы УК применяются в первую очередь при конкуренции с нормами других отраслей (расширение сферы уголовного права).\n- **Ultima ratio:** уголовное право — самая карательная отрасль, применяется в последнюю очередь, если деяние не охватывается другими отраслями.\n\nСвязь с уголовно-исполнительным правом: общая задача — борьба с преступностью. УК определяет понятия, основания, цели и виды ответственности; УИК — восстановление социальной справедливости, исправление осуждённого, предупреждение новых преступлений.\n\n## Налоговые преступления (ст. 198, 199, 199.1 УК)\n\nОбщее правило для всех трёх статей: лицо, впервые совершившее преступление, освобождается от уголовной ответственности при полной уплате недоимки, пеней и штрафа в порядке НК РФ.\n\n**Ст. 198 — уклонение физического лица.** Деяние: непредставление декларации (расчёта) или иных обязательных документов либо включение в них заведомо ложных сведений. Крупный размер — свыше 2 700 000 ₽ за три финансовых года подряд, особо крупный — свыше 13 500 000 ₽. Наказание по ч. 1: штраф 100–300 тыс. ₽ (или доход за 1–2 года), принудительные работы до 1 года, арест до 6 месяцев, лишение свободы до 1 года. По ч. 2 (особо крупный размер): штраф 200–500 тыс. ₽ (или доход за 18 месяцев — 3 года), принудительные работы или лишение свободы до 3 лет.\n\n**Ст. 199 — уклонение организации.** Деяние то же, применительно к организации. Крупный размер — свыше 18 750 000 ₽, особо крупный — свыше 56 250 000 ₽. По ч. 1: штраф 100–300 тыс. ₽, принудительные работы до 2 лет, арест до 6 месяцев, лишение свободы до 2 лет — с лишением права занимать определённые должности до 3 лет или без такового. Часть 2 — два квалифицирующих признака: группа лиц по предварительному сговору либо особо крупный размер; наказание до 5 лет лишения свободы или принудительных работ, штраф 200–500 тыс. ₽.\n\n**Ст. 199.1 — неисполнение обязанностей налогового агента.** Ключевой признак — совершение **в личных интересах**; деяние состоит в неисполнении обязанностей по исчислению, удержанию или перечислению налогов и сборов. Пороги те же, что в ст. 199: крупный — свыше 18 750 000 ₽, особо крупный — свыше 56 250 000 ₽. Наказание по ч. 1 — до 2 лет лишения свободы, по ч. 2 (особо крупный размер) — до 5 лет, в обоих случаях возможен запрет занимать определённые должности до 3 лет.\n\n## Предмет уголовного права\n\nОбщественные отношения, возникающие в связи с совершением общественно опасного деяния. Три группы:\n\n1. **Охранительные** — возникают по поводу совершения преступления. Спор о моменте возникновения: с вступления обвинительного приговора в силу либо с возбуждения уголовного дела (Брайнин). Отправная точка — совершение общественно опасного деяния; единственное основание ответственности — наличие всех признаков состава преступления. Характер императивный, в последнее время появляются диспозитивные элементы (например, клевета).\n2. **Общепредупредительные** — удержание лиц от совершения преступлений угрозой применения мер уголовно-правового воздействия.\n3. **Регулятивные** — содеянное формально подпадает под признаки преступления, но таковым не считается в силу закона (например, необходимая оборона).\n\n## Методы\n\n- наложение запрета на совершение общественно опасных деяний для неопределённого круга лиц;\n- установление уголовной ответственности конкретного лица за преступление;\n- определение пределов дозволенного причинения вреда, внешне подпадающего под признаки преступления.\n\n## Задачи и функции\n\n**Задачи (ч. 1 ст. 2 УК):** охрана прав и свобод человека и гражданина, собственности, общественного порядка и безопасности, окружающей среды, конституционного строя от преступных посягательств; обеспечение мира и безопасности человечества; предупреждение преступлений.\n\n**Функции:**\n\n- охранительная — защита общественных институтов и отношений;\n- регулятивная — совокупность запретов, ограничений и правил поведения;\n- воспитательная — формирование социально одобряемых взглядов;\n- предупредительная.\n\nОтдельно — задача уголовной репрессии: применение принудительных мер государственного воздействия к преступнику. Помимо запретов, в УК есть дозволительные и поощрительные нормы.\n\n## Система УК РФ\n\nОбщая часть (6 разделов) и Особенная часть.\n"},{"id":"crim-2","title":"Тема 2. Уголовный закон","short":"Уголовный закон","date":"21 сен","md":"## I. Теория (подробно)\n\n### 1. Понятие уголовного законодательства\n\n- Уголовное законодательство РФ **состоит исключительно из УК РФ** (ч. 1 ст. 1) — это принцип полной кодификации: в отличие, например, от административного права, где помимо КоАП действуют законы субъектов РФ, в уголовном праве никаких «параллельных» уголовных законов нет и быть не может\n- Новые законы, устанавливающие или изменяющие уголовную ответственность, **не действуют сами по себе** — они обязательно включаются текстом в УК РФ (типичная формула любого такого ФЗ: «внести в Уголовный кодекс РФ следующие изменения…»)\n- УК РФ основывается на **Конституции РФ** и на **общепризнанных принципах и нормах международного права** (ч. 2 ст. 1) — это не значит, что международные нормы сами по себе создают составы преступлений (это запрещено принципом законности), но они определяют направление и содержание уголовной политики\n- Разграничение понятий: **«уголовное право»** — отрасль права (наука + система норм в широком смысле, включая теорию, историю, сравнительное правоведение), **«уголовное законодательство»** — конкретная форма выражения этих норм, то есть текст УК РФ\n- Задачи УК РФ (ст. 2): охрана прав и свобод человека, собственности, общественного порядка и безопасности, окружающей среды, конституционного строя, мира и безопасности человечества + предупреждение преступлений\n- Основание уголовной ответственности (ст. 8) — совершение деяния, содержащего все признаки состава преступления, предусмотренного УК РФ (и только УК РФ)\n\n### 2. Общая характеристика действующего УК РФ 1996 г.\n\n- **Хронология:** принят Государственной Думой 24.05.1996, одобрен Советом Федерации 05.06.1996, подписан Президентом РФ 13.06.1996 (ФЗ № 63-ФЗ), вступил в силу с **1 января 1997 г.**, заменив УК РСФСР 1960 г.\n- **Структура:** Общая часть (6 разделов, 15 глав) + Особенная часть (6 разделов, 19 глав)\n- **Общая часть** впервые в истории российского законодательства закрепила принципы уголовного права как самостоятельные статьи (ст. 3–7): законность, равенство граждан перед законом, вина, справедливость, гуманизм — раньше это были лишь доктринальные категории. Также сюда входят: основание ответственности (ст. 8), действие закона во времени и пространстве (гл. 2), понятие и категории преступлений (гл. 3), лица, подлежащие ответственности (гл. 4), вина (гл. 5), неоконченное преступление (гл. 6), соучастие (гл. 7), обстоятельства, исключающие преступность деяния (гл. 8), система наказаний и порядок их назначения (разд. III), освобождение от ответственности и наказания (разд. IV), ответственность несовершеннолетних (разд. V), принудительные меры медицинского характера и конфискация имущества (разд. VI)\n- **Особенная часть** построена по принципу приоритета охраняемых ценностей — впервые на первое место поставлены **преступления против личности** (разд. VII), а не против государства, как в советских кодексах (УК РСФСР начинал с государственных преступлений) — это отражает конституционный принцип приоритета прав человека (ст. 2 Конституции РФ)\n- **Идеи, воплощённые в Кодексе:** гуманизация ответственности при одновременной дифференциации (более точные составы, больше квалифицирующих признаков), отказ от применения уголовного закона по аналогии (в отличие от УК РСФСР 1926 г., где аналогия допускалась), ориентация на международные стандарты прав человека\n- **Динамика изменений:** Кодекс — один из самых часто изменяемых законов РФ (сотни федеральных законов о внесении изменений). Ключевые вехи: 2003 г. (ФЗ № 162-ФЗ) — исключение конфискации имущества из системы наказаний (ст. 44) и смягчение ряда санкций; 2006 г. — возврат конфискации уже не как наказания, а как «иной меры уголовно-правового характера» (гл. 15.1); 2012 г. — дифференциация мошенничества (ст. 159.1–159.6); 2014 г. — признание ст. 159.4 неконституционной и реформа мошенничества 2016 г.\n\n### 3. Структура уголовно-правовой нормы и статьи уголовного закона\n\n- Классическая теория права выделяет в норме три элемента: **гипотезу, диспозицию и санкцию**. Применительно к нормам Особенной части УК РФ гипотеза отдельно не формулируется в каждой статье — её роль выполняют общие условия уголовной ответственности (вменяемость, достижение возраста), закреплённые один раз в Общей части (ст. 19–23). Поэтому нормы Особенной части на практике описывают как состоящие из **двух элементов: диспозиции и санкции**\n\n**Виды диспозиций (с примерами):**\n\n- **простая** — называет деяние, не раскрывая признаков (напр., ст. 126 в первоначальной редакции — «похищение человека»)\n- **описательная** — подробно описывает признаки состава (напр., ст. 158 — раскрывает понятие кражи через тайное хищение чужого имущества)\n- **ссылочная** — отсылает к другой статье (части статьи) УК РФ, чтобы не повторять уже названные признаки (напр., ст. 112 отсылает к перечню отягчающих обстоятельств, аналогичному ст. 111)\n- **бланкетная** — отсылает к нормам других отраслей права (напр., ст. 264 — нарушение ПДД, ст. 143 — нарушение правил охраны труда, ст. 171 — незаконное предпринимательство отсылает к гражданскому и предпринимательскому законодательству)\n\n**Виды санкций (с примерами):**\n\n- **относительно-определённая** — указан низший и/или высший предел наказания (напр., «лишение свободы на срок от трёх до пяти лет»)\n- **альтернативная** — суд выбирает из нескольких видов наказания (напр., ч. 1 ст. 158 — штраф, либо обязательные работы, либо исправительные работы, либо арест, либо лишение свободы)\n- **кумулятивная** — сочетает обязательное основное и дополнительное наказание (напр., некоторые составы взяточничества предусматривают обязательный штраф вместе с лишением свободы)\n- абсолютно-определённых санкций (когда указан только один-единственный вид и размер наказания без вариантов) в действующем УК РФ практически нет — это признак архаичных систем права\n\n**Соотношение статьи и нормы (важный тонкий момент):**\n\n- Статья — это формально-текстовая единица закона, норма — содержательная логическая единица; они **не всегда совпадают**:\n- одна статья (её части, пункты) может содержать несколько самостоятельных норм — например, ч. 1 и ч. 2–4 ст. 158 УК РФ фактически описывают основной и разные квалифицированные составы кражи, а это разные нормы с разными санкциями\n- одна норма может «собираться» из положений нескольких статей — например, ответственность за покушение на убийство определяется одновременно статьёй Особенной части (ст. 105) и ст. 30 Общей части («неоконченное преступление»); ответственность пособника — статьёй Особенной части + ст. 33 («виды соучастников»)\n- некоторые нормы Общей части (о соучастии, о смягчающих/отягчающих обстоятельствах, о давности) применяются «сквозным образом» вместе с любой статьёй Особенной части\n\n### 4. Источники уголовного права\n\n- **Единственный формальный источник** — Уголовный кодекс РФ. Это прямо следует из принципа законности (ст. 3): преступность деяния, его наказуемость и иные уголовно-правовые последствия определяются **только** УК РФ; применение уголовного закона по аналогии не допускается\n- **Конституция РФ** — обладает высшей юридической силой и прямым действием (ст. 15 Конституции), поэтому фактически определяет содержание уголовного закона «сверху»: например, запрет обратной силы закона, ухудшающего положение лица (ст. 54 Конституции), лёг в основу ст. 9–10 УК РФ; запрет выдачи граждан РФ (ст. 61 Конституции) — в основу ст. 13 УК РФ\n- **Международные договоры РФ и общепризнанные принципы/нормы международного права** (ч. 2 ст. 1 УК РФ, ч. 4 ст. 15 Конституции) — определяют содержание отдельных институтов (напр., универсальный принцип действия закона в пространстве, ст. 12 ч. 3, прямо основан на международных обязательствах России по борьбе с терроризмом, наркотрафиком и т.п.), но сами по себе международные договоры не могут устанавливать состав преступления или назначать наказание — это было бы нарушением принципа законности\n- **Подзаконные акты** (правила дорожного движения, инструкции по охране труда и т.п.) — не являются источниками уголовного права сами по себе, но **наполняют содержанием бланкетные диспозиции** (напр., чтобы применить ст. 264, нужно установить, какое именно правило ПДД нарушено)\n- **Постановления Конституционного Суда РФ** — формально не создают новых норм, но постановление о признании нормы УК РФ не соответствующей Конституции **влечёт утрату этой нормой юридической силы** — то есть КС РФ выступает как «негативный законодатель»\n- **Постановления Пленума Верховного Суда РФ** — обязательны для нижестоящих судов при применении закона (обеспечивают единообразие практики, например, Постановление Пленума ВС РФ от 27.12.2002 № 29 о краже, грабеже и разбое), но формально новых норм не устанавливают — это акты толкования, а не правотворчества\n- **Судебный прецедент** в его классическом англо-саксонском смысле (обязательность решения по конкретному делу для последующих аналогичных дел) источником российского уголовного права **не является** — Россия относится к романо-германской правовой семье\n- **Доктрина (научные труды)** — не имеет обязательной юридической силы, но активно используется судами и законодателем при толковании и совершенствовании закона\n\n### 5. Действие уголовного закона во времени, в пространстве и по кругу лиц\n\n**Во времени (ст. 9–10 УК РФ):**\n\n- Общее правило: применяется закон, **действовавший во время совершения деяния** (ст. 9 ч. 1)\n- Временем совершения преступления признаётся время **самого действия или бездействия**, а не время наступления последствий (ст. 9 ч. 2) — это важно для т.н. «разрыва во времени» между деянием и его результатом (см. Задачу 1 ниже)\n- Исключение — **обратная сила уголовного закона** (ст. 10): закон, который устраняет преступность деяния, смягчает наказание либо иным образом улучшает положение лица (например, убирает обязательное дополнительное наказание, снижает нижний предел санкции, расширяет основания освобождения от ответственности), имеет обратную силу — распространяется на лиц, совершивших деяние **до** его вступления в силу, включая тех, кто уже отбывает или отбыл наказание, но имеет судимость\n- Закон, который устанавливает преступность деяния, усиливает наказание или иным образом ухудшает положение лица, обратной силы **никогда** не имеет (это прямо запрещено и ст. 54 Конституции РФ)\n- Отдельное правило (ч. 2 ст. 10): если новый закон смягчает наказание, которое уже отбывается лицом, — это наказание подлежит **сокращению** в пределах, установленных новым законом (механизм реализуется через ст. 397 УПК РФ по ходатайству осуждённого)\n\n**В пространстве (ст. 11 УК РФ):**\n\n- **Территориальный принцип** — лицо, совершившее преступление на территории РФ, отвечает по УК РФ независимо от гражданства. Территория РФ для этих целей включает: сухопутную территорию, территориальное море (12 морских миль), воздушное пространство над ними, а также — в силу прямого указания закона — континентальный шельф и исключительную экономическую зону (в пределах, установленных для охраны их ресурсов)\n- **Принцип флага** — лицо, совершившее преступление на судне, приписанном к порту РФ и находящемся в открытом водном или воздушном пространстве вне пределов РФ, отвечает по УК РФ, если иное не предусмотрено международным договором РФ; на военном корабле или военном воздушном судне РФ — отвечает по УК РФ **независимо от места нахождения** (даже если корабль стоит в иностранном порту)\n- **Иммунитет** (ч. 4 ст. 11) — вопрос об ответственности дипломатических представителей и иных лиц, пользующихся иммунитетом, решается в соответствии с нормами международного права (как правило — через отказ аккредитующего государства от иммунитета своего представителя либо объявление его персоной нон грата и высылку, а не через привлечение к уголовной ответственности в судах страны пребывания)\n\n**По кругу лиц — действие вне пределов РФ (ст. 12 УК РФ):**\n\n- **Принцип гражданства** (ч. 1–2): граждане РФ и постоянно проживающие в РФ лица без гражданства отвечают по УК РФ за преступления против охраняемых им интересов, совершённые вне РФ, — но **только если** в отношении них по этому преступлению нет решения суда иностранного государства (иначе — нарушение принципа недопустимости двойной ответственности, ч. 2 ст. 6 УК РФ). Военнослужащие воинских частей РФ за границей отвечают по УК РФ, если иное не предусмотрено международным договором\n- **Реальный принцип** (ч. 3, первая часть): иностранные граждане и апатриды, не проживающие постоянно в РФ, отвечают по УК РФ за преступления вне РФ, если деяние направлено против интересов РФ, её гражданина либо постоянно проживающего в РФ апатрида\n- **Универсальный принцип** (ч. 3, вторая часть): те же лица отвечают по УК РФ в случаях, предусмотренных международным договором РФ или иным международным документом, содержащим признаваемые РФ обязательства (например, конвенции о борьбе с терроризмом, захватом заложников, незаконным оборотом наркотиков)\n- И для реального, и для универсального принципа обязательное условие — лицо **не было осуждено за это же деяние в иностранном государстве**\n\n**Выдача лиц, совершивших преступление (ст. 13 УК РФ):**\n\n- Граждане РФ **не подлежат выдаче** иностранному государству ни при каких обстоятельствах (абсолютный запрет, основанный также на ст. 61 Конституции РФ)\n- Иностранные граждане и апатриды, совершившие преступление вне пределов РФ и находящиеся на её территории, **могут быть выданы** иностранному государству
