name: Обновить расписание
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_schedule.py
      - name: Сохранить, если изменилось
        run: |
          if [ -n "$(git status --porcelain schedule.json)" ]; then
            git config user.name "schedule-bot"
            git config user.email "schedule-bot@users.noreply.github.com"
            git add schedule.json
            git commit -m "Расписание обновлено"
            git push
          fi
