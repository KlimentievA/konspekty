name: Обновить рынки
on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_markets.py
      - name: Сохранить
        run: |
          if [ -n "$(git status --porcelain markets.json)" ]; then
            git config user.name "markets-bot"
            git config user.email "markets-bot@users.noreply.github.com"
            git add markets.json
            git commit -m "Рынки обновлены"
            git pull --rebase origin main || true
            git push
          fi
