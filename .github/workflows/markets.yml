name: Обновить рынки
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['update_markets.py', '.github/workflows/markets.yml']
concurrency: markets
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_markets.py
      - name: Сохранить
        run: |
          if [ -n "$(git status --porcelain markets.json news.json)" ]; then
            git config user.name "markets-bot"
            git config user.email "markets-bot@users.noreply.github.com"
            git add markets.json news.json
            git commit -m "Рынки обновлены"
            git pull --rebase origin main || true
            git push
          fi
