name: Обновить рынки
# Разовое обновление данных — сразу после изменения скриптов или вручную. Регулярные обновления делает «Автообновление данных».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['update_markets.py', 'update_news.py', 'update_history.py', 'update_enews.py', 'newsutil.py', 'scripts/update_all.sh', '.github/workflows/markets.yml']
concurrency: markets
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q trafilatura || true
      - name: Обновить
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update_all.sh
