name: Обновить рынки
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['update_markets.py', 'update_history.py', '.github/workflows/markets.yml']
concurrency: markets
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_markets.py
      - name: Сохранить
        run: |
          if [ -n "$(git status --porcelain markets.json news.json)" ]; then
            git config user.name "markets-bot"
            git config user.email "markets-bot@users.noreply.github.com"
            git add markets.json news.json
            git commit -m "Рынки обновлены"
            git pull --rebase origin main || true
            git push
          fi
      - name: История цен (ветка data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 -b data "https://github.com/${GITHUB_REPOSITORY}.git" hist 2>/dev/null || mkdir -p hist
          python3 update_history.py hist
          if [ "$(cat hist/.changed)" != "0" ]; then
            cd hist && rm -rf .git .changed && git init -q && git checkout -q -b data
            git config user.name "markets-bot"; git config user.email "markets-bot@users.noreply.github.com"
            git add -A && git commit -qm "Данные истории цен"
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          fi
