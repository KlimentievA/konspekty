name: Танкеры (AIS)
# Раз в ~20 минут снимает положение танкеров из aisstream.io и обновляет tankers.json.
# Нужен секрет AISSTREAM_KEY (Settings → Secrets and variables → Actions). Без него шаг просто пропускается.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
concurrency: tankers
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q websockets
      - name: Снимок AIS
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: python3 src/energy/ais_snapshot.py 240
      - name: Сохранить
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add tankers.json data/ais_static.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "tankers: AIS snapshot"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
