name: Приложение Android (APK)
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Сборка
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk Hub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hub-apk
          path: Hub.apk
      - name: Выпуск (страница Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "app-v1.${{ github.run_number }}" Hub.apk --title "Hub 1.${{ github.run_number }}" --latest --notes-file android/RELEASE_NOTES.md
