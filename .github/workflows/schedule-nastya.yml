name: Расписание Насти
on:
  schedule:
    - cron: '27 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_schedule_nastya.py
      - name: Сохранить, если изменилось
        run: |
          if [ -n "$(git status --porcelain schedule_nastya.json schedule_nastya_debug.txt)" ]; then
            git config user.name "schedule-bot"; git config user.email "schedule-bot@users.noreply.github.com"
            git add schedule_nastya.json schedule_nastya_debug.txt
            git commit -m "Расписание Насти обновлено"
            for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
          fi
